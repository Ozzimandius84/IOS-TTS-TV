<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>float probe — web (roads a and c)</title>
<style>
 :root{color-scheme:light dark}
 body{margin:0;font:13px/1.45 ui-monospace,Menlo,monospace;padding:10px env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
 h1{font:600 15px/1.3 system-ui;margin:0 0 6px}
 button{font:600 15px system-ui;padding:10px 12px;margin:0 6px 6px 0;border-radius:8px;border:1px solid #8888}
 #word{font:700 clamp(28px,12vw,64px)/1 system-ui;margin:8px 0;letter-spacing:-.02em}
 pre{white-space:pre-wrap;word-break:break-word;margin:8px 0;font-size:12px}
 canvas{width:160px;height:90px;border:1px solid #8884;background:#000}
 video{width:160px;height:90px;background:#111}
 .row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
</style>
<h1>float probe — web: (a) canvas→captureStream→&lt;video&gt;→PiP, (c) Now Playing</h1>
<div id="word">—</div>
<div>
 <button id="go">1 · start audio + clocks</button>
 <button id="pip">2 · enter PiP</button>
 <button id="ms">3 · Now Playing per word</button>
 <button id="dump">4 · print the answer</button>
</div>
<div class="row"><canvas id="c" width="320" height="180"></canvas>
 <video id="v" playsinline muted autoplay></video></div>
<pre id="log"></pre>
<script src="wordclock.js"></script>
<script>
/* ---------------------------------------------------------------- the log */
var L = document.getElementById("log"), lines = [];
function say(s){ lines.push(s); L.textContent = lines.join("\n"); console.log("[float] " + s); }

/* -------------------------------------------------- 0 · what even exists.
   This table alone answers most of road (a) and it costs nothing to read. */
var v = document.getElementById("v"), cv = document.getElementById("c"), ctx = cv.getContext("2d");
var FEAT = {
  ua: navigator.userAgent,
  standalone: !!navigator.standalone,                    /* PWA from the home screen */
  inTauri: !!window.__TAURI__ || !!window.TTSTVHost,      /* WKWebView inside Frank   */
  canvas_captureStream: typeof cv.captureStream === "function",
  video_srcObject: "srcObject" in v,
  pictureInPictureEnabled: !!document.pictureInPictureEnabled,
  requestPictureInPicture: typeof v.requestPictureInPicture === "function",
  webkitSupportsPresentationMode: typeof v.webkitSupportsPresentationMode === "function",
  webkitSupports_pip: (typeof v.webkitSupportsPresentationMode === "function")
                      ? v.webkitSupportsPresentationMode("picture-in-picture") : null,
  webkitSetPresentationMode: typeof v.webkitSetPresentationMode === "function",
  disablePictureInPicture: v.disablePictureInPicture,
  mediaSession: !!navigator.mediaSession,
  mediaSession_metadata: !!(navigator.mediaSession && "metadata" in navigator.mediaSession),
  mediaSession_setPositionState: !!(navigator.mediaSession && navigator.mediaSession.setPositionState),
  audioSession: !!navigator.audioSession,                /* WebKit's own, iOS 16.4+   */
  audioSessionType: navigator.audioSession ? navigator.audioSession.type : null,
  wakeLock: !!navigator.wakeLock
};
say("FEATURES " + JSON.stringify(FEAT, null, 1));

/* --------------------------------------------------------- 1 · the audio.
   A REAL HTMLAudioElement with real samples -- iOS treats a silent or
   WebAudio-only source differently, and the whole question is whether audio
   keeps running, so the probe must actually make sound. 12 s, looping,
   quiet 220 Hz so it can be heard but not hated. */
function toneWav(sec, hz, rate){
  var n = sec * rate, buf = new ArrayBuffer(44 + n * 2), d = new DataView(buf), i;
  function s(o, t){ for (i = 0; i < t.length; i++) d.setUint8(o + i, t.charCodeAt(i)); }
  s(0,"RIFF"); d.setUint32(4, 36 + n*2, true); s(8,"WAVEfmt "); d.setUint32(16,16,true);
  d.setUint16(20,1,true); d.setUint16(22,1,true); d.setUint32(24,rate,true);
  d.setUint32(28,rate*2,true); d.setUint16(32,2,true); d.setUint16(34,16,true);
  s(36,"data"); d.setUint32(40, n*2, true);
  for (i = 0; i < n; i++) d.setInt16(44 + i*2, Math.sin(2*Math.PI*hz*i/rate) * 6000, true);
  var b = new Uint8Array(buf), str = ""; for (i = 0; i < b.length; i++) str += String.fromCharCode(b[i]);
  return "data:audio/wav;base64," + btoa(str);
}
var audio = document.createElement("audio");
audio.loop = true; audio.preload = "auto"; audio.setAttribute("playsinline","");
audio.src = toneWav(12, 220, 8000);
document.body.appendChild(audio);

/* -------------------------------------------------------- 2 · the clocks.
   THREE counters, deliberately. The question the float turns on is not "does
   a window appear" but "does the WORD keep changing when Frank is not the
   front app", and each of these three is a different bet on that:
     rAF   -- suspended when the page is not visible (expected to freeze)
     timer -- throttled hard in the background (expected to crawl)
     audio -- audio.currentTime keeps running iff the audio keeps playing
   Every painter reads WordClock.indexAt(audio.currentTime); the counters say
   only how OFTEN each was asked. */
var TL = null, clock = null;
var count = { raf: 0, timer: 0, timeupdate: 0, paint: 0 };
var marks = [];
function stamp(tag){
  var m = { tag: tag, wall: Date.now(), audio: +audio.currentTime.toFixed(3),
            paused: audio.paused, hidden: document.hidden,
            pipMode: (v.webkitPresentationMode || (document.pictureInPictureElement ? "picture-in-picture" : "inline")),
            raf: count.raf, timer: count.timer, timeupdate: count.timeupdate, paint: count.paint };
  marks.push(m); say("MARK " + JSON.stringify(m)); return m;
}
var lastIdx = -2;
function paint(){
  if (!clock) return;
  var i = clock.indexAt(audio.currentTime), w = i < 0 ? "" : TL[i].w;
  count.paint++;
  ctx.fillStyle = "#000"; ctx.fillRect(0,0,320,180);
  ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "700 " + Math.min(64, 520 / Math.max(4, w.length)) + "px -apple-system,system-ui,sans-serif";
  ctx.fillText(w || "—", 160, 90);
  ctx.font = "12px ui-monospace,monospace"; ctx.textAlign = "left";
  ctx.fillText(count.paint + "  t=" + audio.currentTime.toFixed(2), 6, 170);
  if (i !== lastIdx) { lastIdx = i; document.getElementById("word").textContent = w || "—"; onWord(w, i); }
}
function loopRAF(){ count.raf++; paint(); requestAnimationFrame(loopRAF); }

document.getElementById("go").onclick = function(){
  fetch("timeline.json").then(function(r){ return r.json(); }).then(function(doc){
    TL = doc.timeline; clock = WordClock.make(TL);
    say("TIMELINE " + doc.words + " words, " + doc.span + "s, " + (doc.words/doc.span).toFixed(3) + " w/s");
    audio.play().then(function(){ say("audio.play() ok"); }, function(e){ say("audio.play() REFUSED " + e); });
    requestAnimationFrame(loopRAF);
    setInterval(function(){ count.timer++; paint(); }, 1000/30);
    audio.addEventListener("timeupdate", function(){ count.timeupdate++; paint(); });
    /* the stream is opened here, before PiP is asked for: on iOS the refusal
       can come from captureStream itself and not from the PiP call. */
    try {
      var st = cv.captureStream(30);
      say("captureStream ok: " + st.getVideoTracks().length + " video track(s), " +
          st.getAudioTracks().length + " audio track(s)");
      v.srcObject = st;
      v.play().then(function(){ say("video.play() ok  readyState=" + v.readyState +
        " size=" + v.videoWidth + "x" + v.videoHeight); },
        function(e){ say("video.play() REFUSED " + e); });
    } catch (e) { say("captureStream THREW " + e); }
    stamp("start");
  }, function(e){ say("timeline.json fetch failed " + e); });
};

/* ------------------------------------------------------------ 3 · road (a) */
document.getElementById("pip").onclick = function(){
  say("pip: readyState=" + v.readyState + " videoWidth=" + v.videoWidth +
      " paused=" + v.paused + " srcObject=" + !!v.srcObject);
  if (typeof v.webkitSetPresentationMode === "function") {
    try { v.webkitSetPresentationMode("picture-in-picture");
          say("webkitSetPresentationMode called -> " + v.webkitPresentationMode); }
    catch (e) { say("webkitSetPresentationMode THREW " + e); }
  }
  if (typeof v.requestPictureInPicture === "function") {
    v.requestPictureInPicture().then(function(w){
      say("requestPictureInPicture RESOLVED " + w.width + "x" + w.height); },
      function(e){ say("requestPictureInPicture REJECTED " + e.name + ": " + e.message); });
  }
  if (typeof v.webkitSetPresentationMode !== "function" && typeof v.requestPictureInPicture !== "function")
    say("no PiP entry point exists on this video element -- road (a) is closed here");
  setTimeout(function(){ stamp("after-pip-request"); }, 1200);
};
v.addEventListener("webkitpresentationmodechanged", function(){ say("EVENT webkitpresentationmodechanged -> " + v.webkitPresentationMode); });
v.addEventListener("enterpictureinpicture", function(){ say("EVENT enterpictureinpicture"); });
v.addEventListener("leavepictureinpicture", function(){ say("EVENT leavepictureinpicture"); });

/* ------------------------------------------------------------ 4 · road (c) */
var msOn = false, msWrites = 0, msCost = 0;
function onWord(w, i){
  if (!msOn || !navigator.mediaSession) return;
  var t0 = performance.now();
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: w, artist: "Gerontion", album: "Frank" });
    msWrites++;
  } catch (e) { say("mediaSession write THREW " + e); msOn = false; }
  msCost += performance.now() - t0;
}
document.getElementById("ms").onclick = function(){
  if (!navigator.mediaSession) return say("no navigator.mediaSession -- road (c) has no web half here");
  msOn = true;
  try { navigator.mediaSession.playbackState = "playing"; } catch (e) { say("playbackState THREW " + e); }
  ["play","pause","nexttrack","previoustrack"].forEach(function(a){
    try { navigator.mediaSession.setActionHandler(a, function(){ say("mediaSession action " + a); }); }
    catch (e) { say("setActionHandler(" + a + ") unsupported"); } });
  say("Now Playing per word: ON. Lock the phone / swipe up and look at the lock screen.");
};

/* ------------------------------------------- 5 · the background survival test */
document.addEventListener("visibilitychange", function(){ stamp(document.hidden ? "hidden" : "visible"); });
window.addEventListener("pagehide", function(){ stamp("pagehide"); });
window.addEventListener("pageshow", function(){ stamp("pageshow"); });

document.getElementById("dump").onclick = function(){
  var hid = null, vis = null;
  for (var i = 0; i < marks.length; i++) {
    if (marks[i].tag === "hidden") hid = marks[i];
    if (marks[i].tag === "visible" && hid && !vis) vis = marks[i];
  }
  var away = hid && vis ? {
    seconds_away:      +((vis.wall - hid.wall) / 1000).toFixed(2),
    audio_advanced_by: +(vis.audio - hid.audio).toFixed(3),
    audio_kept_playing: (vis.audio - hid.audio) > (vis.wall - hid.wall) / 1000 * 0.8,
    raf_frames_while_away:       vis.raf - hid.raf,
    timer_ticks_while_away:      vis.timer - hid.timer,
    timeupdates_while_away:      vis.timeupdate - hid.timeupdate,
    paints_while_away:           vis.paint - hid.paint,
    pip_mode_on_return:          vis.pipMode
  } : "not measured -- send Frank to the background and come back, then press 4";
  var out = { probe: "float road (a) + (c), web", when: new Date().toISOString(),
              features: FEAT, marks: marks, away: away,
              nowPlaying: { writes: msWrites, mean_ms_per_write: msWrites ? +(msCost/msWrites).toFixed(3) : null },
              counters: count };
  say("=== ANSWER ===\n" + JSON.stringify(out, null, 1));
};
</script>
