<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#832f2b">
<!-- BEFORE THE FIRST PAINT, and that is the whole reason it is up here.
     settings.js owns the theme for the entire application (one stored value,
     one owner, every surface subscribing) and applies it at load: a window
     opened after someone chose dark opens dark, rather than opening light and
     correcting itself once the body exists. A <head> script is synchronous,
     so nothing has been painted when the attribute lands. It also carries the
     reading font, which flashed for the same reason. -->
<!-- TYPING IS NOT A HOTKEY. First, before anything binds a key: the
     guard attaches to whichever field has the caret, so bare keys stop
     there instead of reaching document. See reader/keys.js. -->
<script src="keys.js"></script>
<script src="settings.js"></script>
<!-- THE APPLICATION'S CHROME, one file for every surface: the scrollbar, and
     so far nothing else. reader.html, library.html, settings.html and
     studio/studio.html all link this one -- see reader/chrome.css. -->
<link rel="stylesheet" href="chrome.css">
<link rel="stylesheet" href="askbar.css">
<link rel="stylesheet" href="../library/library.css">
</head>
<body>
<!-- No <h1>. The picture (PROMPTS/mock/library.html) has no title on the page:
     in the app the tab strip IS the title bar and says "Library", and in a
     plain browser the tab says it. A banner that repeats the tab was the one
     thing on this page nothing pointed at. The header stays for the two
     controls the strip does not carry in a browser. -->
<header>
  <button id="sourcesToggle" aria-label="Sources" title="Sources" aria-expanded="false">&#9776;</button>
  <span class="headerspace"></span>
  <!-- THE DESIGN BENCH. reader/design/*.html are self-contained pages served
       from this same origin, so they open in a tab of this app with the real
       title bar and the real traffic lights behind them -- which is the one
       thing a browser cannot show. Reachable only from here on purpose: it is
       a bench, not a feature, and it carries no book of its own. -->
  <a id="designLink" class="headerLink" href="design/collection-page.html"
     title="Design bench" aria-label="Design bench">&#9673;</a>
  <button id="themeBtn"></button>
</header>
<div id="note" aria-live="polite"></div>
<!-- A RE-PARSE HAS TO SPEAK, and it has nowhere else to speak from: the
     book it rewrites is already on the shelf, so there is no loading row
     for it the way an ingest has one, and its per-chapter verdicts are
     several lines rather than the one `#note` holds. Its own region,
     under the note, hidden until there is a re-parse to report. -->
<div id="reparse" class="panel" aria-live="polite" hidden></div>
<!-- The parses of one book, live and kept, opened from the shelf menu and
     closed by hand. Its own element rather than the re-parse's, so a running
     re-parse's poll cannot repaint a list somebody is reading. -->
<div id="parses" class="panel" hidden></div>
<div class="searchbar" id="searchBar" hidden>
  <input type="text" id="searchTitle" placeholder="Title, e.g. Hamlet">
  <input type="text" id="searchAuthor" class="author" placeholder="Author (optional)">
  <button type="button" id="searchGo">Search</button>
  <div class="searchresults" id="searchResults" hidden></div>
</div>
<div class="shell">
  <div id="sourcesScrim" aria-hidden="true"></div>
  <aside class="srcbar" id="sources" aria-label="Sources"></aside>
  <main class="rail" id="shelf" aria-label="Shelf"></main>
  <aside class="phonebar" id="phoneShelf" aria-label="Phone shelf" hidden></aside>
</div>
<div id="menu" class="menu" role="menu" hidden></div>
<input id="importFile" type="file" accept=".zip,application/zip,application/x-zip-compressed" hidden>
<!-- the ⌄ on the Sources card, where the app has no native picker of its own.
     `webkitdirectory` is the only way a browser opens a FOLDER, and it answers
     with the files in it rather than with its path -- see takeLocalFolder(). -->
<input id="srcFolderInput" type="file" webkitdirectory directory multiple hidden>

<!-- the zip reader and the bundle importer: two page scripts, no CDN, so
     the shell stays installable and works with no network at all. -->
<script src="../library/unzip.js"></script>
<script src="../library/import.js"></script>
<script src="context.js"></script>
<script src="popover.js"></script>
<!-- THE BAR'S ANSWERS. The field is the shell's, in the title-bar strip; this
     is what answers it, out of this page's own shelf, find and /search. It
     merges into `window.TTSTVPage`, so its position relative to this page's own
     `TTSTVPage.tool` does not matter. -->
<script src="askbar.js"></script>
<!-- settings.js is in the <head>, before the first paint (see the note there) -->
<script>
"use strict";

// The Library (READER_FIRST.md "Library -- sidebar = sources, main page = the
// shelf"). Sidebar: every file under TTS_DATA/sources/, grey until ingested,
// a spinner while studio parses it, filled when its book has text and
// look-ups; double-click or drag onto the shelf = POST /ingest. Shelf:
// ingested books (the library rail, shared with studio's right sidebar);
// click = a new Reader tab, cmd-click = a new window; right-click, in
// Osca's order: Open · Open in New Window · Open in Studio · Delete.
//
// Studio's routes (studio/serve.py + PROMPTS/rf-studio.md step 1), all
// origin-relative because studio serves the repo root:
//   GET  /state             books[] (+ chapters[].state cells), job, sources[], ssd.root
//   GET  /sources           {sources: [{source, name, kind, mb, ingested, ingesting}]} (studio/serve.py
//                           today; `source` = the path under TTS_DATA/sources/ that /ingest takes) --
//                           or the older bare array [{name, kind, mb, parsed_as}]; normaliseSources()
//                           takes either. Falls back to /state.sources.
//   POST /ingest {source}   parse then dict for the whole book, in the one job slot; the job in
//                           /state.job is {mode:"ingest", source, name, slug|null, step:"parse"|"dict",
//                           phase, started, ended, ok, err}
//   GET  /log?ingest=<name> {text}: scratch/logs/ingest/<name>.log's tail -- the ingest's own log
//   POST /remove {slug}     deletes core.paths.produced_for(slug); 409 while a job runs.
//                           With {dry_run: true} it deletes NOTHING and answers
//                           {goes, stays, sentence, would_remove} -- the words the real call
//                           acts on, which is what the confirmation asks with
//   POST /reparse {slug,lang?}  re-reads the source this book already has and replaces its
//                           structure, KEEPING the audio and re-aligning it -> {slug, job, kept};
//                           409 while any job for it runs, 503 without the depot, 404 with no
//                           book.json. The job is /state.job with mode:"reparse" and
//                           step: "parse"|"attrib"|"align", and job.report.summary is one line
//                           per chapter when it ends (studio/README.md, "three verbs for a bad
//                           parse", §6)
//   GET  /log?reparse=<slug>  {text}: the re-parse's own log, ?ingest='s shape exactly
//   GET  /parses?slug=<slug>  {slug, live, kept: [...], keeps} -- the readings of this book still
//                           on disk. `live` is returned APART from `kept` and is drawn apart:
//                           nothing may make the book itself look like one of its own copies
//   POST /upload?name=&kind= a dropped file into TTS_DATA/sources/<kind>s/ (exists today)
//
// The host (the desktop app, PROMPTS/rf-desktop.md) is one small object:
//   window.TTSTVHost = { openReader(slug), openWindow(slug), openStudio(slug, units?), reveal(path) }
// Absent in a plain browser, where each falls back to a browser tab / window.open.

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}
const IS_MAC = /Mac|iPhone|iPad|iPod/.test(navigator.platform || "");
function isCmd(ev) { return IS_MAC ? !!ev.metaKey : !!ev.ctrlKey; }

// ---------------------------------------------------------------- URLs
function readerUrl(slug, bookmarkId) {
  const q = { book: "books/" + slug };
  // The reader resolves a bookmark id to its chapter and its word
  // (margOpenAt); the Library passes the id and decides nothing.
  if (bookmarkId) q.bm = bookmarkId;
  return `reader.html?${new URLSearchParams(q)}`;
}
function studioUrl(slug, units) {
  const q = { slug };
  if (units && units.length) q.units = units.join(",");
  return `/?${new URLSearchParams(q)}`;
}
function api(path) {
  return /^https?:$/.test(location.protocol) ? location.origin + path : null;
}

// ---------------------------------------------------------------- data
// Two sources, same shape as reader.html's old rail: [{slug, title, author,
// lang, chapters, has_audio, has_timings}] (+ voiced, the count on the
// shelf). Served by studio, /state is live (books[] from disk); anywhere
// else (a bundle, a static host) library.json is the exported inventory.
// Neither answering is an empty shelf, not an error.
let libraryBooks = null;      // the shelf rows
let stateBooks = {};          // slug -> /state SHELF ROW (counters, no chapter rows)
let sources = [];             // the sidebar rows
let job = null;               // /state.job
// THE PARSE LANES (serve.py's `importing` and `reparsing`, both `[]` and
// never absent). Five books parse at once -- imports and re-parses through
// the same five lanes -- and `/state.job` carries only the OLDEST of them,
// so a page that asks "is a parse running for this book" has to read these
// lists or it can only ever see one of five. See `laneJobs`.
// (`importing` is taken on this page -- it is the device bundle reader --
// so the lanes carry `lane` in their names and cannot be confused with it.)
let laneImports = [];         // /state.importing, running imports, oldest first
let laneReparses = [];        // /state.reparsing, running re-parses, oldest first
let ssdRoot = null;           // /state.ssd.root, for Reveal
const ingesting = new Set();  // source names POSTed to /ingest, until their book has text + dict
let selectedSource = null;
let studioLive = false;       // /state answered at least once (false on a static host / bundle)
// The shelf's loading entries: one per source whose ingest is running or
// has failed (PROMPTS/reader-ingest-progress.md). name -> {name, source,
// kind, title, started, slug, failed: {line} | null}. Fed by a local
// /ingest POST and by /state.job (so a reload mid-ingest shows it too).
const pending = new Map();
let ingestLog = "";           // /log?ingest=<name> text for the running ingest, refreshed each poll
let ingestLogFor = null;

// /sources answers as an object today ({sources: [...]}, each row with
// `source` = the key POST /ingest wants and `ingested` = the slug) and as a
// bare array in the older documented shape ({name, kind, mb, parsed_as}).
// Either way the page works on rows of {name, kind, mb, parsed_as, source}.
function normaliseSources(payload, fallback) {
  const list = Array.isArray(payload) ? payload
    : (payload && Array.isArray(payload.sources)) ? payload.sources
    : (Array.isArray(fallback) ? fallback : []);
  return list.map(s => ({
    ...s,
    parsed_as: s.parsed_as !== undefined ? s.parsed_as : (s.ingested || null),
    source: s.source || s.name,
  }));
}
function sourceKey(src) { return src.source || src.name; }
function sourceTitle(name) { return String(name || "").replace(/\.[a-z0-9]+$/i, "").replace(/[_-]+/g, " "); }

// THE SHELF ROW IS THE PAYLOAD NOW, so this reads counters instead of walking
// chapters that are no longer sent (studio/bookinfo.py: shelf_of). The note
// further down this file -- "93 KB of per-chapter cells the shelf does not
// draw" -- is what that change answers; /state is ~8 KB for this library.
function booksFromState(st) {
  return (st.books || []).map(b => ({
    slug: b.slug, title: b.title, author: b.author, lang: b.lang,
    chapters: b.chapters_n,
    has_audio: b.voiced > 0,
    has_timings: b.aligned > 0,
    voiced: b.voiced,
  }));
}

// text = every chapter parsed; dict = the book's dictionary export exists
// (core/README.md "Unit states": dict is one file, the same value on every
// chapter). A book is "ingested" for the sidebar when both hold.
function bookIngested(stateBook) {
  if (!stateBook || !stateBook.chapters_n) return false;
  return stateBook.parsed === stateBook.chapters_n && stateBook.dict_ok;
}

// ---------------------------------------------------------- progress
// How far an ingest has come, as one fraction 0..1 across its two steps
// (studio/tasks.py: ingest = `parse` then `dict`): parse owns 0 -> 0.6,
// dict 0.6 -> 1.0. Inside a step the only *real* progress is a
// `[n/m] <step>` line in the ingest log (or job.chunk/chunks, if studio
// ever parses one for ingest jobs the way _log_progress does for speak);
// today neither the parser nor the dictionary prints one -- both print a
// summary when they finish, and studio writes the parser's stdout to the
// log only after the subprocess exits (studio/add.py captures it). So
// until those lines exist the bar moves on time alone: 1 - e^(-t/tau)
// within the step, never past 92 % of it, and the label says "parsing…"
// with no percentage -- an estimate is drawn, a number is never claimed.
// `known` tells the caller which of the two it is. Pure; proven by
// reader/tests/test_ingest_progress.py against recorded /state + /log.
const INGEST_STEPS = {
  parse: { base: 0.0, span: 0.6, tau: 25, label: "parsing", verb: "parsing" },
  dict:  { base: 0.6, span: 0.4, tau: 40, label: "dictionary", verb: "look-ups" },
};
const INGEST_LINE_RE = /\[\s*(\d+)\s*\/\s*(\d+)\s*\]\s*(parse|dict)\b/g;
function lastLogLine(text) {
  const lines = String(text || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  return lines.length ? lines[lines.length - 1] : "";
}
function ingestProgress(job, logText, now) {
  now = now == null ? Date.now() / 1000 : now;
  const out = { state: "running", step: null, fraction: 0, known: false, label: "", lastLine: lastLogLine(logText), elapsed: 0 };
  if (!job) return out;
  const started = Number(job.started) || now;
  out.elapsed = Math.max(0, (job.phase === "running" ? now : (Number(job.ended) || now)) - started);
  if (job.phase === "done") { out.state = "done"; out.fraction = 1; out.known = true; out.label = "ready"; return out; }
  if (job.phase === "failed") {
    out.state = "failed"; out.step = job.step || null;
    out.label = "failed" + (job.step ? " while " + (INGEST_STEPS[job.step] || {}).verb : "");
    out.lastLine = (job.err && String(job.err).trim()) || out.lastLine;
    return out;
  }
  const step = INGEST_STEPS[job.step] ? job.step : "parse";
  const def = INGEST_STEPS[step];
  out.step = step;
  // real progress: studio's chunk/chunks for this step, or the last [n/m] <step> line
  let n = null, m = null;
  if (job.chunks > 0 && job.chunk != null) { n = Number(job.chunk); m = Number(job.chunks); }
  else {
    let match; INGEST_LINE_RE.lastIndex = 0;
    while ((match = INGEST_LINE_RE.exec(String(logText || ""))) !== null) {
      if (match[3] === step) { n = Number(match[1]); m = Number(match[2]); }
    }
  }
  if (m > 0 && n != null) {
    out.known = true;
    out.fraction = def.base + def.span * Math.min(1, n / m);
    out.label = `${def.verb} ${n.toLocaleString()} of ${m.toLocaleString()}`;
  } else {
    // time only: asymptotic inside the step, capped short of its end
    const t = Math.max(0, out.elapsed);
    out.fraction = def.base + def.span * Math.min(0.92, 1 - Math.exp(-t / def.tau));
    out.label = def.verb + "…" + (t >= 5 ? ` ${Math.round(t)} s` : "");
  }
  return out;
}

// core/schema.py slugify(), the same four lines: the slug the parser would
// have made from this text. Only ever used on a file name, and only as the
// fallback below -- JS `\w` is ASCII where Python's is unicode, so a
// non-ASCII file name slugs differently here (reader/README.md, known gaps).
function slugify(s) {
  s = String(s == null ? "" : s).toLowerCase().replace(/[^\w\s-]/g, "").trim();
  return s.replace(/[\s_-]+/g, "-").slice(0, 48).replace(/^-+|-+$/g, "") || "book";
}

// The slug this source is on the shelf as, or null. The shelf paints every
// book in /state.books, so that -- not a per-step grid -- is the truth the
// sidebar has to agree with (PROMPTS/reader-app-fixes.md step 2: six books on
// the shelf and every box empty). Matched first on the source path book.json
// recorded, which studio hands back as `ingested` keyed on the path below
// sources/ (bookinfo._parsed_as), and, for a book that never recorded one, on
// the slug the file name would make.
function shelfSlugFor(src, booksBySlug) {
  booksBySlug = booksBySlug || {};
  const named = src.parsed_as || null;
  if (named && booksBySlug[named]) return named;
  const guess = slugify(sourceTitle(src.name));
  if (guess && booksBySlug[guess]) return guess;
  return null;
}

// grey (not on the shelf) / busy (studio is ingesting it) / filled (its book
// is on the shelf). Deliberately *not* "text on every chapter and a fresh
// dictionary": that grid answers a different question -- whether every step
// is up to date -- and it goes grey the moment anything rewrites book.json
// after dictionary.json, which is why Osca's shelf had six books above a
// sidebar of empty boxes. A stale look-up table is a reason to re-run dict,
// not a reason to say the book was never ingested.
function sourceState(src, booksBySlug, job, localIngesting) {
  const slug = shelfSlugFor(src, booksBySlug);
  const running = job && job.phase === "running";
  if (running && (job.source === src.name || job.name === src.name || (src.source && job.source === src.source)
      || (job.slug && (slug || src.parsed_as) && job.slug === (slug || src.parsed_as)
      && ["parse", "dict"].includes(job.mode === "single" ? job.step : job.current_step)))) return "busy";
  if (slug) return "filled";
  if (localIngesting && localIngesting.has(src.name)) return "busy";
  return "grey";
}

function sourcePath(src) {
  if (src.path) return src.path;
  if (!ssdRoot) return null;
  return `${ssdRoot}/sources/${src.kind}s/${src.name}`;
}

async function getJSON(path) {
  const url = api(path);
  if (!url) return null;
  try {
    const res = await fetch(url, { cache: "no-store" });
    return res.ok ? await res.json() : null;
  } catch (e) { return null; }
}

async function postJSON(path, body) {
  const url = api(path);
  if (!url) return { ok: false, status: 0, body: { error: "no studio behind this origin" } };
  try {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, body: data };
  } catch (e) { return { ok: false, status: 0, body: { error: String(e.message || e) } }; }
}

async function refresh() {
  // TOGETHER, NOT ONE AFTER THE OTHER. `/sources` does not read `/state`'s
  // answer -- `normaliseSources` takes both, and takes them at the end -- so
  // asking for the second only once the first has landed cost the sidebar the
  // whole of `/state`'s latency for nothing. Measured at 250 ms of a 1,025 ms
  // cold open (reader/tests/browser/library_open.py).
  // `?folder=` is the §6 request to studio: read THIS folder rather than
  // TTS_DATA/sources/. A studio that does not know the parameter ignores it
  // and answers with its own folder -- which is why the card names the folder
  // it is showing rather than leaving it to be assumed.
  const localFolder = !!(sourcesFolder && sourcesFolder.local);
  const srcsPath = sourcesFolder && !localFolder
    ? "/sources?" + new URLSearchParams({ folder: sourcesFolder.path })
    : "/sources";
  const [st, srcs] = await Promise.all([getJSON("/state"), localFolder ? null : getJSON(srcsPath)]);
  if (st) {
    studioLive = true;
    if (window.TTSTVContext) TTSTVContext.observe({ studioLive: true });
    stateBooks = Object.fromEntries((st.books || []).map(b => [b.slug, b]));
    libraryBooks = booksFromState(st);
    shelfCacheWrite(libraryBooks);
    job = st.job || null;
    laneImports = st.importing || [];
    laneReparses = st.reparsing || [];
    ssdRoot = (st.ssd && st.ssd.root) || ssdRoot;
    // a folder the browser handed us is the list; studio cannot see it
    if (!localFolder) sources = normaliseSources(srcs, st.sources);
    for (const name of Array.from(ingesting)) {
      const src = sources.find(x => x.name === name);
      if (src && src.parsed_as && bookIngested(stateBooks[src.parsed_as])) ingesting.delete(name);
    }
    await syncPending();
    await syncReparse();
  } else if (libraryBooks === null) {
    try {
      const res = await fetch("library.json");
      if (res.ok) libraryBooks = await res.json();
    } catch (e) { /* none written for this instance */ }
    if (libraryBooks === null) libraryBooks = [];
  }
  if (!st && window.TTSTVContext) TTSTVContext.observe({ studioLive: studioLive });
  paintContext();
  if (typeof libMirrorOnce === "function") libMirrorOnce();
  renderSources();
  renderShelf();
  renderReparse();
  renderPhoneShelf();
  // The covers' four facts, AFTER the paint: the shelf is already on screen
  // set from the title alone, and a book whose `first_words` and `form` land
  // a moment later simply gets a fuller cover on the next paint. Nothing on
  // this page ever waits for book.json.
  loadCoverFacts((libraryBooks || []).map(b => b.slug)).then(got => {
    if (got) { renderShelf(); renderPhoneShelf(); }
  });
  return !!st;
}

// The loading entries against /state.job: the running ingest is on the
// shelf whether this page started it or not; a finished one leaves when
// its book has text + look-ups; a failed one stays, with its last line,
// until Retry starts a new job for it (or that source is ingested by
// someone else). The ingest log is fetched while the job runs and once
// more when it fails, for the last line.
function ingestJob() { return job && job.mode === "ingest" ? job : null; }
async function syncPending() {
  let j = ingestJob();
  if (j && j.name) {
    const prior = pending.get(j.name);
    // a Retry just POSTed and /state still shows the job it is replacing: not this entry's failure
    if (j.phase !== "running" && prior && ingesting.has(j.name) && Number(j.started) + 1 < prior.started) j = null;
  }
  if (j && j.name) {
    const src = sources.find(x => x.name === j.name) || {};
    const entry = pending.get(j.name) || { name: j.name, source: j.source || sourceKey(src), kind: src.kind || "", title: sourceTitle(j.name), failed: null };
    entry.started = Number(j.started) || entry.started || Date.now() / 1000;
    entry.slug = j.slug || entry.slug || src.parsed_as || null;
    entry.job = j;
    if (j.phase === "running") entry.failed = null;
    pending.set(j.name, entry);
    if (j.phase === "running" || (j.phase === "failed" && ingestLogFor !== j.name)) {
      const lg = await getJSON(`/log?ingest=${encodeURIComponent(j.name)}`);
      if (lg && typeof lg.text === "string") { ingestLog = lg.text; ingestLogFor = j.name; }
    }
    if (j.phase === "failed" && !entry.failed) {
      const p = ingestProgress(j, ingestLogFor === j.name ? ingestLog : "", Date.now() / 1000);
      entry.failed = { line: p.lastLine || "no log line", label: p.label };
      ingesting.delete(j.name);
    }
  }
  for (const [name, entry] of Array.from(pending)) {
    const src = sources.find(x => x.name === name);
    const slug = (src && src.parsed_as) || entry.slug;
    const ownJob = j && j.name === name;
    if (slug && bookIngested(stateBooks[slug]) && !(ownJob && j.phase === "running")) { pending.delete(name); ingesting.delete(name); continue; }
    // kept only while its job owns the slot, while the local POST is in
    // flight, or once failed (until Retry); otherwise the slot moved on
    if (!ownJob && !entry.failed && !ingesting.has(name)) pending.delete(name);
  }
}

// ------------------------------------------------------------- re-parse
//
// THE VERB FOR A BAD PARSE THAT KEEPS THE AUDIO (studio/README.md's newest
// entry, "three verbs for a bad parse", §6; Osca, 4 Sep: *"I parse a book, I
// want to be able to delete that book AND parse it again, or JUST reparse.
// NOT DELETE the source file."*). `POST /reparse {slug, lang?}` re-reads the
// source this book already records, keeps the parse it replaces, and re-aligns
// every chapter whose words did not change against the master it already has.
// Nothing is uploaded and `TTS_DATA/sources/` is never opened for writing --
// which is the whole difference from Delete-and-re-import, the route that
// emptied three epubs on 3 Sep (`0c7dc01`).
//
// THE BAR IS INDETERMINATE, AND THE PAGE SAYS SO RATHER THAN DRAWING A
// FRACTION NOBODY COUNTED. `studio/progress.py::job_reading` has no branch
// for `mode: "reparse"` -- an owed line in studio's own §6, and studio's file
// rather than this one -- so there is no `chunk`/`chunks` and no per-step
// arithmetic to read. What there IS is `job.step`, one of three named steps,
// so the panel says which of the three it is on and pulses; it never puts a
// number on how far through that step it is.
//
// The one thing that must not be lost is the per-chapter verdict. When the
// job ends, `job.report.summary` is one line per chapter IN THE SERVER'S OWN
// WORDS, and they are drawn verbatim -- nothing here re-words them, because
// the whole point of the verb is that a person reads them and decides.
const REPARSE_STEPS = ["parse", "attrib", "align"];
const REPARSE_WORDS = {
  parse: "re-reading the source",
  attrib: "reading who speaks",
  align: "re-aligning the audio to the new text",
};

// Pure: the job (and its log tail) as the panel needs to say it. `known` is
// FALSE for the whole run and that is the honest answer, not a placeholder --
// see the note above.
function reparseReading(job, logText) {
  const out = { state: "none", slug: null, step: null, n: 0, of: REPARSE_STEPS.length,
                label: "", lastLine: "", known: false };
  if (!job || job.mode !== "reparse") return out;
  out.slug = job.slug || null;
  const lines = String(logText || "").split("\n").map(l => l.trim()).filter(Boolean);
  out.lastLine = lines.length ? lines[lines.length - 1] : "";
  if (job.phase === "failed") {
    out.state = "failed";
    out.step = job.step || null;
    out.label = "failed" + (REPARSE_WORDS[job.step] ? " while " + REPARSE_WORDS[job.step] : "");
    out.lastLine = (job.err && String(job.err).trim()) || out.lastLine;
    return out;
  }
  if (job.phase === "done") { out.state = "done"; out.step = "align"; out.n = out.of; out.label = "done"; return out; }
  out.state = "running";
  out.step = REPARSE_WORDS[job.step] ? job.step : "parse";
  out.n = REPARSE_STEPS.indexOf(out.step) + 1;
  out.label = `step ${out.n} of ${out.of} — ${REPARSE_WORDS[out.step]}`;
  return out;
}

// Pure: the whole panel, so what it says is unit-testable without a DOM.
function reparsePanelHTML(job, logText, title) {
  const r = reparseReading(job, logText);
  if (r.state === "none") return "";
  const name = title || r.slug || "this book";
  const shut = `<button type="button" class="pnl-x" data-panel="reparse" aria-label="Dismiss">&times;</button>`;
  const line = r.lastLine ? `<p class="pnl-line" title="${esc(r.lastLine)}">${esc(r.lastLine)}</p>` : "";

  if (r.state === "running") {
    return `<div class="pnl-head"><b>${esc(name)}</b>` +
      `<span class="pnl-sub">${esc(r.label)}</span>${shut}</div>` +
      `<div class="pnl-bar pulse" role="progressbar" aria-valuetext="${esc(r.label)}"></div>` +
      `<p class="pnl-why">Re-parsing. The source file is not touched and the audio is kept — ` +
      `every chapter whose words come back the same is re-aligned to the recording it already has. ` +
      `There is no percentage: studio does not count a re-parse's steps yet, so the bar only says it is running.</p>` +
      line;
  }
  if (r.state === "failed") {
    return `<div class="pnl-head bad"><b>${esc(name)}</b>` +
      `<span class="pnl-sub">${esc(r.label)}</span>${shut}</div>` +
      `<p class="pnl-why">Nothing was deleted: the parse this was replacing is kept, and the audio ` +
      `and the old timings are where they were.</p>` + line;
  }

  // done -- the server's own lines, one per chapter, verbatim
  const rep = job.report || {};
  const rows = rep.summary || [];
  const bad = (rep.aligned || []).filter(x => x.verdict === "mismatch").length;
  const facts = [];
  if (rep.chapters_before != null && rep.chapters_after != null) {
    facts.push(rep.chapters_before === rep.chapters_after
      ? `${rep.chapters_after} chapters`
      : `${rep.chapters_before} chapters before, ${rep.chapters_after} after`);
  }
  if (rep.masters != null) facts.push(`${rep.masters} chapter master(s) kept`);
  if (rep.chunks && rep.chunks.total != null) {
    facts.push(`${rep.chunks.orphaned} of ${rep.chunks.total} cached chunk(s) no longer match`);
  }
  const summary = rows.length
    ? `<ul class="pnl-sum">${rows.map(l => `<li>${esc(l)}</li>`).join("")}</ul>`
    : `<p class="pnl-why">No chapter of this book has a master, so there was nothing to re-align.</p>`;
  return `<div class="pnl-head${bad ? " warn" : ""}"><b>${esc(name)}</b>` +
    `<span class="pnl-sub">re-parsed${bad ? ` — ${bad} chapter(s) no longer match their audio` : ""}</span>${shut}</div>` +
    `<p class="pnl-why">The source file was not touched.${facts.length ? " " + esc(facts.join(" · ")) + "." : ""}` +
    (rep.kept && rep.kept.stamp ? ` The parse it replaced is kept as ${esc(rep.kept.stamp)}.` : "") + `</p>` +
    summary;
}

let reparseLog = "";
let reparseLogFor = null;
let reparseDismissed = null;          // the job key the reader has waved away
function reparseJob() { return job && job.mode === "reparse" ? job : null; }
function reparseKey(j) { return j ? `${j.slug}:${j.started}` : null; }
// The log's key carries the PHASE as well as the job, which is what makes
// "and once more when it stops" happen at all: keyed on the job alone, the
// running fetch has already claimed the key and the stopping one is skipped.
function reparseLogKey(j) { return j ? `${reparseKey(j)}:${j.phase === "running" ? "run" : "end"}` : null; }
function reparseLogFrom(j) {
  const key = reparseKey(j);
  return key && reparseLogFor && reparseLogFor.indexOf(key + ":") === 0 ? reparseLog : "";
}

// The log while it runs, and ONCE MORE WHEN IT STOPS -- `syncPending`'s rule
// for the ingest log, for its reason: the last line of a failed run is the
// only place its message is, and it is written after the last running poll
// has already been answered.
async function syncReparse() {
  const j = reparseJob();
  if (!j || !j.slug) return null;
  const key = reparseLogKey(j);
  if (j.phase === "running" || reparseLogFor !== key) {
    const lg = await getJSON(`/log?reparse=${encodeURIComponent(j.slug)}`);
    if (lg && typeof lg.text === "string") { reparseLog = lg.text; reparseLogFor = key; }
  }
  return reparseLogFrom(j);
}

function renderReparse() {
  const el = document.getElementById("reparse");
  if (!el) return null;
  const j = reparseJob();
  const key = reparseKey(j);
  if (!j || reparseDismissed === key) { el.innerHTML = ""; el.hidden = true; return null; }
  const book = (libraryBooks || []).find(b => b.slug === j.slug);
  el.innerHTML = reparsePanelHTML(j, reparseLogFrom(j), book && book.title);
  el.hidden = !el.innerHTML;
  return el.innerHTML;
}

// Every running parse, whichever door it came through, and never just the
// one `/state.job` names. An older studio sends no lists and its running
// lane job is in `job` alone, so that is the fallback -- not the rule.
function laneJobs() {
  const out = (laneImports || []).concat(laneReparses || []);
  if (job && job.phase === "running" && (job.mode === "ingest" || job.mode === "reparse")
      && !out.some(j => j.mode === job.mode && j.slug === job.slug && j.started === job.started))
    out.push(job);
  return out;
}

// Why this book's Re-parse row is disabled, or null.
//
// A PARSE RUNNING IS NOT A REASON (Osca, 4 Sep, on the second press: *"I
// can't parse ANYTHING else whilst I reparse... I should be able to reparse
// two say and parse three new ones at the same time"*). studio has run five
// parses at once since `5cd8041` -- imports and re-parses share the lanes --
// and `/reparse` refuses exactly one thing: a book with a job of its own
// already running (`busy_with(slug)`, a 409). Reading `/state.job` here made
// one re-parse disable every OTHER book's row, because `snapshot()` answers
// the oldest lane job when nothing holds the single slot.
//
// The single slot is still a reason, and still says so: a render, a queue, a
// pairing or an alignment holds it, and `start_reparse` queues behind it
// rather than taking a lane. That is the sentence this page has always
// shown; only the lane modes have left it.
function reparseBusyReason(slug) {
  const mine = slug ? laneJobs().find(j => j.slug === slug) : null;
  if (mine) return mine.mode === "reparse"
    ? "a re-parse for this book is running"
    : "an ingest for this book is running";
  if (!job || job.phase !== "running") return null;
  if (job.mode === "ingest" || job.mode === "reparse") return null;
  const what = { single: "a step", queue: "a queue", push: "a push", pair: "a pairing",
                 realign: "a re-alignment", sample: "a sample" }[job.mode] || "a job";
  return job.slug && slug && job.slug === slug
    ? `${what} for this book is running`
    : `studio is busy — ${what} is running`;
}

// The press. `lang` is this book's own, exactly as studio's Re-parse button
// sends it; a book with none simply does not carry the key and the parser
// takes the language it detects.
//
// The POST's `kept` is NOT named in the note, though it is in the answer:
// `start_reparse` spawns the job and the handler reads `kept_parses(slug)`
// straight afterwards, so the list can still be the one from BEFORE this
// run's own copy landed. The stamp a person can act on is the finished
// report's `kept.stamp`, which the panel draws.
async function reparseBook(slug) {
  if (!slug) return null;
  const book = (libraryBooks || []).find(b => b.slug === slug);
  const name = (book && book.title) || slug;
  const body = { slug };
  if (book && book.lang) body.lang = book.lang;
  const r = await postJSON("/reparse", body);
  if (!r.ok) {
    const err = (r.body && r.body.error) || ("HTTP " + r.status);
    note(`Didn't re-parse ${name}: ${err}`);
    return r;
  }
  reparseDismissed = null;
  reparseLog = ""; reparseLogFor = null;
  if (r.body && r.body.job) job = r.body.job;
  note(`Re-parsing ${name}. The source file stays where it is, the audio is kept, and the parse this replaces is kept beside it.`);
  renderReparse();
  renderShelf();
  if (!pollTimer) poll(); else { clearTimeout(pollTimer); pollTimer = setTimeout(poll, 800); }
  return r;
}

// -------------------------------------------------------- the parses
//
// `GET /parses?slug=` → `{slug, live, kept, keeps}` (studio/README.md §6).
// Osca, 4 Sep: *"Or keep the old parse — the parser is failing in different
// ways for different books, so it's constantly tested."* A re-parse copies
// the parse it replaces to `books/<slug>/parses/<stamp>/`, so this is the
// list of readings of one book that are still on disk, newest first.
//
// LIVE IS NOT IN THE SAME LIST AS KEPT, and that is the server's rule as
// much as this page's: `/parses` returns them as two fields for exactly this
// reason, so *"drop the third one"* can never land on the book itself. Two
// headed sections, never one list of three rows.
//
// NOTHING HERE DELETES A KEPT PARSE. There is no route that does — pruning
// is automatic at `keeps` (2) when the next re-parse makes a copy — so a
// control would be a promise the bench cannot keep. The panel says what the
// rule is instead.
function parsesPanelHTML(data, title) {
  if (!data) return "";
  const name = title || (data.live && data.live.title) || data.slug || "this book";
  const shut = `<button type="button" class="pnl-x" data-panel="parses" aria-label="Close">&times;</button>`;
  const kept = data.kept || [];
  const keeps = data.keeps == null ? null : Number(data.keeps);
  const when = row => {
    const at = Date.parse(row && (row.kept_at || row.made));
    return Number.isFinite(at) ? fmtWhen(at) : "";
  };
  const facts = row => {
    const bits = [];
    if (row.chapters != null) bits.push(`${row.chapters} chapters`);
    if (row.words) bits.push(`${row.words} words`);
    if (row.bytes != null) bits.push(fmtBytes(row.bytes));
    if (row.lang) bits.push(row.lang);
    return bits.join(" · ");
  };
  const rowHTML = (row, label) =>
    `<li><span class="prs-when">${esc(label || when(row) || row.stamp)}</span>` +
    `<span class="prs-facts">${esc(facts(row))}</span>` +
    `<code class="prs-stamp">${esc(row.stamp)}</code></li>`;

  const liveList = data.live
    ? `<div class="prs-head">On the shelf now</div><ul class="pnl-sum prs prs-live">` +
      rowHTML(data.live, when(data.live) ? `${when(data.live)} — this is the book` : "this is the book") +
      `</ul>`
    : "";
  const keptList = kept.length
    ? `<div class="prs-head">Kept, newest first</div><ul class="pnl-sum prs prs-kept">${kept.map(r => rowHTML(r)).join("")}</ul>`
    : `<p class="pnl-why">No earlier parse is kept — a copy is made the first time this book is re-parsed.</p>`;
  const rule = keeps
    ? `<p class="pnl-why">studio keeps the last ${keeps}; the next copy past that drops the oldest. ` +
      `Nothing on this page deletes one — there is no route that does — and Delete on the book takes every kept parse with it.</p>`
    : "";
  return `<div class="pnl-head"><b>${esc(name)}</b><span class="pnl-sub">parses on disk</span>${shut}</div>` +
    liveList + keptList + rule;
}

async function openParses(slug) {
  if (!slug) return null;
  const el = document.getElementById("parses");
  if (!el) return null;
  const data = await getJSON(`/parses?slug=${encodeURIComponent(slug)}`);
  if (!data) {
    el.hidden = true; el.innerHTML = "";
    note(`Couldn't read the parses of ${entryTitle(slug)} — studio didn't answer.`);
    return null;
  }
  const book = (libraryBooks || []).find(b => b.slug === slug);
  el.innerHTML = parsesPanelHTML(data, book && book.title);
  el.hidden = !el.innerHTML;
  return data;
}

function closeParses() {
  const el = document.getElementById("parses");
  if (!el) return null;
  el.innerHTML = ""; el.hidden = true;
  return true;
}

// Poll while something is in flight (an ingest, a job), slowly otherwise.
let pollTimer = null;
async function poll() {
  const live = await refresh();
  if (!live) return;                                   // no studio: no loop
  const busy = ingesting.size > 0 || (job && job.phase === "running");
  pollTimer = setTimeout(poll, busy ? 2500 : 10000);
}
// Between polls the time-based estimate still moves: repaint the loading
// entries once a second without rebuilding the shelf (so the veil's CSS
// transition carries it smoothly from one value to the next).
function paintProgress(now) {
  now = now == null ? Date.now() / 1000 : now;
  let running = 0;
  for (const row of document.querySelectorAll("#shelf .railrow.loading")) {
    const entry = pending.get(row.dataset.source);
    if (!entry || entry.failed) continue;
    const p = ingestProgress(entry.job || { phase: "running", step: "parse", started: entry.started }, ingestLogFor === entry.name ? ingestLog : "", now);
    row.style.setProperty("--ingest", (p.fraction * 100).toFixed(1) + "%");
    row.dataset.fraction = p.fraction.toFixed(3);
    row.dataset.known = p.known ? "true" : "false";
    const step = row.querySelector(".ingest-step");
    if (step && step.textContent !== p.label) step.textContent = p.label;
    const veil = row.querySelector(".ingest-veil");
    if (veil) veil.classList.toggle("pulse", !p.known);
    running++;
  }
  /* The last tick of an ingest is the one that must reach the strip: when this
   * returns 0 `ensurePainting()` clears the interval, so if the `null` were not
   * pushed here the 2 px line would stay under the tab forever (§6). */
  pushHostContext(now);
  return running;
}
let paintTimer = null;
function ensurePainting() {
  if (paintTimer) return;
  paintTimer = setInterval(() => { if (!paintProgress()) { clearInterval(paintTimer); paintTimer = null; } }, 1000);
}

// ------------------------------------------------------------ sources
//
// **Why this list is never rebuilt for a change it can paint in place.**
// A double-click is two clicks *on the same node*: the browser dispatches
// `dblclick` only when both clicks share a target, and every one of these
// rows was a node the old renderSources() replaced wholesale on the first
// click (it set `selectedSource` and re-ran `el.innerHTML = ...`). The
// second click therefore landed on a *replacement* row and no `dblclick`
// was ever dispatched -- the reason double-click did nothing in the app
// while a drag, which is one gesture with no re-render inside it, always
// worked. Bisected in a real browser (reader/tests/browser/library_fixes.py):
// the run is mousedown/mouseup/click detail 1, mousedown/mouseup/click
// detail 2, and no dblclick after it; suppress this one handler, change
// nothing else, and the dblclick fires and the /ingest POST goes out. So:
//   * selection is painted onto the existing rows (paintSourceSelection),
//   * a poll that finds the same files updates their attributes in place,
//   * and nodes are only ever replaced when the file list itself changes --
//     a source appearing, disappearing, or being reordered.
let sourcesKey = null;        // the file list the rows currently stand for
let sourcesFolderKey = "";    // the folder the card at the top last painted

function sourceRowsKey(list) { return list.map(s => s.name).join(" "); }

// The picture draws a file as its name and a dot -- nothing else. The kind
// and the size are still on the row's `title`, where a pointer can ask for
// them without the list having to carry two more columns.
function sourceRowHTML(src, state, slug) {
  const meta = [src.kind, src.mb ? src.mb + " MB" : null].filter(Boolean).join(" \u00b7 ");
  return `<div class="src" role="option" draggable="true" tabindex="0" data-name="${esc(src.name)}" data-kind="${esc(src.kind)}"` +
    ` data-state="${state}" data-slug="${esc(slug || "")}"` +
    ` title="${esc(src.name)}${meta ? " — " + esc(meta) : ""}${slug ? " — " + esc(slug) : ""}">` +
    `<span class="src-name">${esc(src.name)}</span>` +
    `<span class="src-dot" aria-hidden="true"></span></div>`;
}

// ------------------------------------------------- the folder you opened
// PROMPTS/reader-library-mock.md §3. The sidebar's top is a card naming the
// folder these files came from, and its ⌄ opens another one. The default is
// TTS_DATA/sources/ -- studio's own folder, the one it has always read -- and
// nothing about that changes until somebody presses the ⌄.
//
// **Two ways to open a folder, and which one you get is which one exists.**
//  * `TTSTVHost.pickFolder()` -- the app's native picker. It answers with a
//    PATH, studio can see that path, and the list is read the way it always
//    is: `GET /sources?folder=<path>`. (That query does not exist yet; the
//    request to studio is reader/README.md §6, exact.) Until it does, studio
//    ignores the parameter and answers with its own folder, which is why the
//    card says which folder it is showing rather than assuming.
//  * `<input webkitdirectory>` -- a plain browser. It answers with FILES, not
//    a path: the browser will not tell a page where on the disk they are, and
//    studio therefore cannot read them. So that list is drawn from the input
//    itself and a file opened from it is UPLOADED (`uploadFile`, the same
//    route a Finder drop already takes), never `POST /ingest`d by path.
// The difference is real and the page never pretends otherwise: `folder.local`
// is the second case.
let sourcesFolder = null;      // null = the default, TTS_DATA/sources/
let localFiles = new Map();    // name -> File, for the webkitdirectory case

function folderName(path) {
  const parts = String(path || "").split("/").filter(Boolean);
  return parts.length ? parts[parts.length - 1] : "sources";
}

// The line under the name: where the folder is, in the picture's own shorthand
// -- the last few folders above it, separated by "·", not a filesystem path.
// A path is not what a person recognises a folder by; its neighbours are.
function folderWhere(path, depth) {
  const parts = String(path || "").split("/").filter(Boolean);
  parts.pop();
  return parts.slice(-(depth || 3)).join(" \u00b7 ");
}

function sourcesFolderCard() {
  const path = sourcesFolder ? sourcesFolder.path : (ssdRoot ? ssdRoot + "/sources" : "TTS_DATA/sources");
  const name = sourcesFolder ? sourcesFolder.name : folderName(path);
  const where = folderWhere(path);
  return `<button type="button" class="srcfolder" id="srcFolder" data-path="${esc(path)}"` +
    ` aria-label="Sources folder: ${esc(name)} — open another">` +
    `<span class="ic" aria-hidden="true"></span>` +
    `<span class="nm"><b>${esc(name)}</b><small>${esc(where)}</small></span>` +
    `<span class="ch" aria-hidden="true">\u2304</span></button>`;
}

// The ⌄. The host's picker if it has one; otherwise the file input, which is
// in the page already (`#srcFolderInput`) because a picker cannot be opened
// from anything but a user gesture.
async function pickSourcesFolder() {
  const h = host();
  if (h && typeof h.pickFolder === "function") {
    const path = await h.pickFolder();
    if (!path) return null;
    sourcesFolder = { name: folderName(path), path: path, local: false };
    localFiles = new Map();
    note(`Sources: ${sourcesFolder.name}.`);
    await refresh();
    return sourcesFolder;
  }
  const input = document.getElementById("srcFolderInput");
  if (!input) return null;
  input.click();
  return null;
}

// What the browser handed back: the epubs and pdfs in the folder somebody
// picked, in name order, and no path -- see the note above.
function takeLocalFolder(files) {
  const list = Array.from(files || []).filter(f => /\.(epub|pdf)$/i.test(f.name || ""));
  const rel = (list[0] && list[0].webkitRelativePath) || "";
  const name = rel.split("/")[0] || "sources";
  localFiles = new Map(list.map(f => [f.name, f]));
  sourcesFolder = { name: name, path: name, local: true };
  sources = list
    .map(f => ({ name: f.name, kind: /\.pdf$/i.test(f.name) ? "pdf" : "epub",
                 mb: Math.round((f.size || 0) / 1048576 * 10) / 10 || null,
                 parsed_as: null, source: f.name }))
    .sort((a, b) => a.name.localeCompare(b.name));
  note(list.length
    ? `Sources: ${name} — ${list.length} book${list.length === 1 ? "" : "s"}. Double-click one to bring it in.`
    : `${name} has no .epub or .pdf in it.`);
  renderSources();
  return sources;
}

// The source stays highlighted for the whole job (selected state), not just
// until the next click elsewhere. An attribute, so it never costs a node.
function paintSourceSelection() {
  for (const row of document.querySelectorAll("#sources .src")) {
    const name = row.dataset.name;
    const selected = name === selectedSource || (row.dataset.state === "busy" && pending.has(name));
    row.setAttribute("aria-selected", selected ? "true" : "false");
  }
}

function selectSource(name) { selectedSource = name; paintSourceSelection(); }

function renderSources() {
  const el = document.getElementById("sources");
  const key = sourceRowsKey(sources);
  const rows = sources.map(src => {
    const slug = shelfSlugFor(src, stateBooks);
    return { src, slug, state: sourceState(src, stateBooks, job, ingesting) };
  });
  const painted = el.querySelectorAll(".src");
  const folder = sourcesFolder ? sourcesFolder.path : "";
  if (key !== sourcesKey || folder !== sourcesFolderKey || painted.length !== rows.length) {
    const here = sourcesFolder ? sourcesFolder.name : "TTS_DATA/sources/";
    el.innerHTML = `<h2>Sources</h2>` + sourcesFolderCard() +
      `${rows.map(r => sourceRowHTML(r.src, r.state, r.slug)).join("") ||
      '<div class="src-empty">' +
      (api("/state") || (sourcesFolder && sourcesFolder.local)
        ? `No .epub or .pdf in ${esc(here)}` + (sourcesFolder ? "." : " — or the SSD is unplugged.")
        : "Sources need studio (127.0.0.1).") + "</div>"}` +
      `<div class="src-note">Double-click a file, or drop it on the shelf.</div>`;
    sourcesKey = key;
    sourcesFolderKey = folder;
  } else {
    // the same files: touch only what changed, so the row under the pointer
    // is still the node it was a moment ago
    rows.forEach((r, i) => {
      const row = painted[i];
      if (row.dataset.state !== r.state) row.dataset.state = r.state;
      const slug = r.slug || "";
      if (row.dataset.slug !== slug) row.dataset.slug = slug;
      const title = r.src.name + (slug ? " — " + slug : "");
      if (row.getAttribute("title") !== title) row.setAttribute("title", title);
    });
  }
  paintSourceSelection();
}

function sourceByName(name) { return sources.find(s => s.name === name) || null; }

// `opts.force` runs the job even when the source already has a book on the
// shelf. Retry on a failed card and the context menu's own Ingest pass it:
// both are a person asking for this ingest, now, with the answer in front of
// them -- and since reader-app-fixes step 2 a half-ingested book (parsed,
// dictionary failed) reads `filled`, so without this its Retry did nothing.
// A double-click and a drag do not force: there the guard is the whole point.
async function ingest(name, opts) {
  if (!libraryContext().bench) { note("Ingesting needs studio on the Mac."); return null; }
  // A file from the browser's own folder picker has no path studio can read,
  // so it goes up the way a Finder drop does -- /upload lands it under
  // TTS_DATA/sources/ and /ingest follows on the copy that is now studio's.
  if (localFiles.has(name)) return uploadFile(localFiles.get(name));
  const src = sourceByName(name);
  if (!src) return null;
  if (!(opts && opts.force) && sourceState(src, stateBooks, job, ingesting) === "filled") {
    note(`${name} is already ingested.`); return null;
  }
  ingesting.add(name);
  selectedSource = name;
  // on the shelf at once, greyed, the bar at 0 (READER_FIRST.md "Library")
  pending.set(name, { name, source: sourceKey(src), kind: src.kind || "", title: sourceTitle(name),
                      started: Date.now() / 1000, slug: src.parsed_as || null, failed: null, job: null });
  renderSources();
  renderShelf();
  const r = await postJSON("/ingest", { source: sourceKey(src) });
  if (!r.ok) {
    ingesting.delete(name);
    const err = (r.body && r.body.error) || ("HTTP " + r.status);
    if (r.status === 409) {
      // studio's one slot is taken: not this book's failure -- say so and take it off the shelf
      pending.delete(name);
      note(`Studio is busy — try again when the current job finishes.`);
    } else {
      const entry = pending.get(name);
      if (entry) entry.failed = { line: err, label: "failed before it started" };
      note(`Couldn't ingest ${name}: ${err}`);
    }
    renderSources();
    renderShelf();
    return r;
  }
  if (r.body && r.body.job) { job = r.body.job; await syncPending(); }
  note(`Ingesting ${name} — the shelf entry fills in as the text and look-ups arrive.`);
  renderSources();
  renderShelf();
  if (!pollTimer) poll(); else { clearTimeout(pollTimer); pollTimer = setTimeout(poll, 800); }
  return r;
}

// A file from the Finder (a plain browser drop): /upload lands it under
// TTS_DATA/sources/<kind>s/ and parses it (studio/serve.py's existing
// route), then /ingest runs the dict step so it fills in like any other.
async function uploadFile(file) {
  const kind = /\.epub$/i.test(file.name) ? "epub" : /\.pdf$/i.test(file.name) ? "pdf" : null;
  if (!kind) { note(`${file.name}: only .epub and .pdf can be dropped here.`); return null; }
  const url = api(`/upload?${new URLSearchParams({ name: file.name, kind })}`);
  if (!url) { note("Dropping files needs studio (127.0.0.1)."); return null; }
  note(`Uploading ${file.name}…`);
  try {
    const res = await fetch(url, { method: "POST", body: file });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { note(`Upload failed: ${body.error || ("HTTP " + res.status)}`); return null; }
    await refresh();
    return ingest(file.name);
  } catch (e) { note(`Upload failed: ${e.message || e}`); return null; }
}

// ----------------------------------------------------------------- shelf
// THE SHELF DRAWS TILES; `railRows()` below is studio's half of a contract.
// PROMPTS/mock/library.html (1 Sep) makes the shelf a grid of covers, so this
// page no longer paints the base row -- but `reader/tests/test_library_rail.py`
// holds `railRows()`'s `const base` template byte-identical with
// studio/studio.html's, and studio is another module's file. So the function
// stays exactly as it was, unpainted, until studio's own shelf is redrawn from
// the same picture; §6 asks Osca which way that contract should go. Nothing
// below it reads `railRows()`.
//
// A tile is still a `.railrow` with a `data-slug`: that is the whole reason
// selection, Enter, double-click, drag between shelves, the ⋯ menu and the
// ingest veil keep working with no handler re-keyed. What changed is the
// inside -- a cover, the title, and ONE grey line (author · lang · audio),
// which is what the picture draws.
function tileLine(b) {
  const bits = [b.author || "unknown"];
  if (b.lang) bits.push(b.lang);
  if (b.has_audio) bits.push("audio");
  return bits.join(" \u00b7 ");
}

// ------------------------------------------------------------ THE COVER
// **The typeset cover IS the cover, always** (Osca, 1 Sep: "I much prefer the
// plan -- rather than importing the front page every time, look how it's
// turned out"). Every tile on the shelf, every row in the phone column and
// every other place a cover is drawn gets the same box: the book, set. Its
// title, its author, its own first words, on one of six paper/ink pairings
// chosen by the title.
//
// **`books/<slug>/cover.jpg` is never drawn** -- not stacked under, not laid
// over, not asked for, whether or not the file exists on disk. The `<img>`,
// its `onerror`, the `.covimg` rule and the `coverUrl()` that built the src
// are all gone. This is a change of intent, not a fallback rule: a shelf of
// imported jackets is seven publishers' marketing side by side, and a shelf
// of typeset covers is one library. (parser-cover still WRITES cover.jpg
// beside book.json and the phone bundle still carries it; this page simply
// does not paint it. §6 asks whether the parser should stop.)
//
// **A gradient is never the answer.** A book parsed before `form` and
// `first_words` existed gets title, author and initial -- the paper and the
// ink still come from its title, so an old book is a plainer cover, not a
// grey box.
const COVER_PAIRINGS = 20;
const COVER_LAYOUTS = 5;

// FNV-1a over the code units: no library, and it cannot drift between two
// implementations of it. Everything below is this hash over a different
// string.
function coverHash(s) {
  let h = 0x811c9dc5;
  const t = String(s == null ? "" : s);
  for (let i = 0; i < t.length; i++) {
    h ^= t.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  return h;
}

// WHICH PAPER: one of twenty, from the TITLE. Same book, same paper, on the
// Mac, on the phone and after a re-parse -- except where the shelf steps it
// past a neighbour's, which is `assignPairings()` below and is the one rule
// here that is not a function of the book alone.
function coverPairing(title) {
  return (coverHash(title) % COVER_PAIRINGS) + 1;
}

// WHICH LAYOUT: one of five, from AUTHOR + TITLE. A second hash over a
// different string, so two books that land on the same paper are unlikely to
// also land on the same arrangement -- twenty by five is a hundred covers and
// the two dials turn independently. It is NOT the book's `form`: verse and
// prose used to choose between centred and ranged-left, and Osca's "4-5
// different layouts so books look different, as they are" is a different
// idea -- the variety is the shelf's, not a fact about the text.
function coverLayout(author, title) {
  return (coverHash(String(author == null ? "" : author) + String(title == null ? "" : title))
          % COVER_LAYOUTS) + 1;
}

// "A tile never takes the pairing of the tile before it on the same shelf
// (step to the next)." A render-order rule, so it cannot live in
// `coverPairing()`: it is about what is beside a book, not about the book.
// The answers are kept per slug for the life of this paint so that every
// surface -- the shelf, the phone column, the ⋯ menu's preview -- draws one
// book one colour; without the map the phone would re-hash and a book could
// be green on the shelf and blue six inches to the right.
const coverPairings = new Map();          // slug -> 1..20, this screen's answer
function assignPairings(entries) {
  let prev = 0;
  for (const b of (entries || [])) {
    let n = coverPairing(b.title || b.slug || "");
    if (n === prev) n = (n % COVER_PAIRINGS) + 1;   // step to the next
    if (b.slug) coverPairings.set(b.slug, n);
    prev = n;
  }
}
function pairingFor(b) {
  const slug = b && b.slug;
  if (slug && coverPairings.has(slug)) return coverPairings.get(slug);
  return coverPairing((b && b.title) || slug || "");
}

// The initial the fallback sets large and faint: the title's first LETTER,
// past "The "/"A "/"An " and past any punctuation, because "“" is not a
// letter and neither is the article.
function coverInitial(title) {
  const t = String(title == null ? "" : title).replace(/^\s*(the|a|an)\s+/i, "");
  const m = t.match(/\p{L}/u) || String(title || "").match(/\p{L}/u);
  return m ? m[0].toUpperCase() : "";
}

// The four facts, from book.json (parser-cover §2 writes `first_words` and
// `form` for every book; `title` and `author` were always there). A book
// parsed before that prompt landed simply has neither, and the fallback
// leaves those two lines out rather than inventing them.
const coverFacts = new Map();      // slug -> {form, first_words}

// `bookForm(slug)` stood here and is gone with the `.verse` class: the layout
// is `coverLayout(author, title)`'s now, not the book's form (Osca, 1 Sep:
// "4-5 different layouts so books look different, as they are"). `form` is
// still read off book.json below because it costs nothing inside a fetch that
// has to happen for `first_words` anyway, and the moment anything on this
// page wants it again it is already there.
function bookFirstWords(slug) {
  const f = coverFacts.get(slug);
  return (f && typeof f.first_words === "string" && f.first_words.trim()) || null;
}

/* TWO STRINGS, NOT THE WHOLE BOOK. This asked for `form` and `first_words`
 * by downloading every book.json in the library, in full, in parallel, with
 * cache:"no-store" -- 289 MB across 21 books here, of which Shakespeare's
 * complete works alone is 96.6 MB, re-read on EVERY load of the page and
 * then JSON.parse'd on the main thread. That is why the library was slow.
 *
 * It reads the TAIL instead. Top-level key order in book.json is
 *   id, title, author, lang, source, meta, chapters, first_words, form, ...
 * so both fields come AFTER the chapters and sit at the end of the file: a
 * Range request for the last stretch reaches them without the book. Measured:
 * within the last 64 KB for every book here except Shakespeare, which needs
 * 1 MB. So it asks for 128 KB, widens once to 2 MB, and only then falls back
 * to the whole file -- which is now CACHEABLE, so even that is paid once.
 *
 * The regexes take the LAST match in the window on purpose. "form" can also
 * occur inside chapter data; the top-level one is the one after the chapters,
 * which is the last one in the file.
 *
 * PARSER-NOTES.md carries the real fix: these two belong BEFORE `chapters`,
 * where a 4 KB head read would find them, or in a sidecar. Field order in
 * book.json is a performance contract, which is not obvious until it costs
 * a hundred megabytes a page load. */
function coverFactsFromTail(text) {
  const last = (re) => { let m, out = null; while ((m = re.exec(text))) out = m; return out; };
  const fw = last(/"first_words"\s*:\s*"((?:[^"\\]|\\.)*)"/g);
  const fm = last(/"form"\s*:\s*"((?:[^"\\]|\\.)*)"/g);
  if (!fw && !fm) return null;
  const un = (x) => { try { return JSON.parse('"' + x + '"'); } catch (e) { return null; } };
  return { form: fm ? un(fm[1]) : null, first_words: fw ? un(fw[1]) : null };
}

/* FOUR RUNGS, and the first that answers wins. Each is strictly worse than
 * the one above, so nothing has to know which books have a sidecar or which
 * have been re-parsed, and a half-built library needs no flag.
 *
 *   cover.json     ~200 B   the shelf's own facts, beside the book
 *   4 KB head       4 KB    a book whose fields sit before `chapters`
 *   128 KB / 2 MB tail      a book whose fields sit after them (all of them,
 *                           today) -- Shakespeare needs the 2 MB window
 *   the whole file          a host with no Range support. Cacheable.
 *
 * The sidecar is written by `python3 -m reader.tools.build_covers` and is
 * DERIVED: delete every one of them and the shelf still draws, one rung
 * slower. Nothing in the app requires it to exist. */
async function coverFactsFromSidecar(url) {
  try {
    const res = await fetch(url.replace(/book\.json$/, "cover.json"));
    if (!res.ok) return null;
    const c = await res.json();
    if (!c || (!c.form && !c.first_words)) return null;
    return { form: c.form || null, first_words: c.first_words || null };
  } catch (e) { return null; }
}

async function coverFactsFor(url) {
  const side = await coverFactsFromSidecar(url);
  if (side) return side;
  /* the head, which is empty of these two today and holds them the moment
     core/schema.py's Book declares them before `chapters` */
  try {
    const res = await fetch(url, { headers: { Range: "bytes=0-4095" } });
    if (res.ok) {
      const facts = coverFactsFromTail(await res.text());
      if (facts && (facts.form || facts.first_words)) return facts;
    }
  } catch (e) { /* fall to the tail */ }
  for (const bytes of [131072, 2097152]) {
    try {
      const res = await fetch(url, { headers: { Range: "bytes=-" + bytes } });
      if (!res.ok) continue;
      const facts = coverFactsFromTail(await res.text());
      if (facts) return facts;
      /* 200 rather than 206 means the host ignored the Range and sent the
         whole file: the fields are simply not there, so stop asking. */
      if (res.status === 200) return null;
    } catch (e) { /* try the next window, then the whole file */ }
  }
  try {
    const res = await fetch(url);          // cacheable: paid once, not per load
    if (!res.ok) return null;
    const book = await res.json();
    return { form: book.form || null, first_words: book.first_words || null };
  } catch (e) { return null; }
}

// One fetch per book, once, after the shelf has already painted -- the cover
// is drawn from the title alone until they land, so nothing waits on this.
async function loadCoverFacts(slugs) {
  const want = (slugs || []).filter(s => s && !coverFacts.has(s));
  if (!want.length) return false;
  let got = false;
  await Promise.all(want.map(async slug => {
    coverFacts.set(slug, {});       // asked: never ask twice, even if it 404s
    try {
      const facts = await coverFactsFor("../books/" + encodeURIComponent(slug) + "/book.json");
      if (facts && (facts.form || facts.first_words)) { coverFacts.set(slug, facts); got = true; }
    } catch (e) { /* a static host with no books/: the plain fallback stands */ }
  }));
  return got;
}

function tileCoverHTML(b) {
  const slug = b.slug || "";
  const title = b.title || slug;
  const author = b.author || "";
  const first = bookFirstWords(slug);
  const cls = ["tilecov", "p" + pairingFor(b), "l" + coverLayout(author, title)];
  // No <img>. `slug` is still read for the two facts below it (form and
  // first words) and for nothing else.
  return `<span class="${cls.join(" ")}" aria-hidden="true">` +
    `<span class="ini">${esc(coverInitial(title))}</span>` +
    `<span class="t">${esc(title)}</span>` +
    (author ? `<span class="a">${esc(author)}</span>` : "") +
    (first ? `<span class="fw">${esc(first)}</span>` : "") +
    `</span>`;
}

function tileHTML(b) {
  const m = b.merge || null;
  const stale = m ? mergeStale(m) : [];
  const title = m
    ? `${bookTitle(m.members[0].slug)} above ${bookTitle(m.members[1].slug)} \u2014 always opens both`
      + (stale.length ? ` \u00b7 one of these has changed since the pair was made` : "")
    : (b.voiced != null ? b.voiced + " of " + b.chapters + " voiced" : "");
  return `<button class="railrow tile${m ? " merged" : ""}${stale.length ? " stale" : ""}" data-slug="${esc(b.slug)}"${
    m ? ' data-merge="1"' : ""} aria-selected="false" title="${esc(title)}">` +
    tileCoverHTML(b) +
    `<span class="railrow-title">${esc(b.title)}</span>` +
    `<span class="railrow-by">${esc(tileLine(b))}</span></button>`;
}

// The grid the tiles sit in. `entries` is a named shelf's books, or
// (undefined) every finished book plus the merged entries that stand for a
// pair -- the same argument `railRows()` took.
function tileRows(entries, extra) {
  const loadingSlugs = new Set(Array.from(pending.values()).map(e => e.slug).filter(Boolean));
  const books = entries || shelfEntries().filter(b => !loadingSlugs.has(b.slug));
  // in shelf order, before anything is drawn: the neighbour rule needs to
  // know what came before, and a tile cannot ask its own markup
  assignPairings(books);
  const body = books.map(tileHTML).join("") + (extra || "");
  return body ? `<div class="shelfgrid">${body}</div>` : "";
}

function railRows(entries) {
  // BASE ROW -- shared verbatim with studio/studio.html's railRows()
  // (PROMPTS/library-sidebar.md); reader/tests/test_library_rail.py asserts
  // this `base` template stays byte-identical between the two files. The
  // bench appends .railmore after it; this page appends nothing to a
  // finished book's row (a loading one gets .ingest-* from loadingRows()).
  const loadingSlugs = new Set(Array.from(pending.values()).map(e => e.slug).filter(Boolean));
  // `entries` is the list to draw -- a named shelf's books, or (undefined)
  // every finished book plus the merged entries that stand for a pair.
  const books = entries || shelfEntries().filter(b => !loadingSlugs.has(b.slug));
  return books.map(b => {
    const total = b.chapters;
    const spoken = b.has_audio;
    const timed = b.has_timings;
    const base = `<span class="railrow-title">${esc(b.title)}</span>
      <span class="railrow-by">${esc(b.author || "unknown")} \u00b7 ${esc(b.lang)}</span>
      <span class="railrow-status">${total} ch${spoken ? " \u00b7 <b>audio</b>" : ""}${
        timed ? " \u00b7 <b>timed</b>" : ""}</span>`;
    // The wrapper, and only the wrapper: `base` above is byte-shared with
    // studio/studio.html (test_library_rail.py) and nothing here may reach it.
    const m = b.merge || null;
    const stale = m ? mergeStale(m) : [];
    const title = m
      ? `${bookTitle(m.members[0].slug)} above ${bookTitle(m.members[1].slug)} — always opens both`
        + (stale.length ? ` · one of these has changed since the pair was made` : "")
      : (b.voiced != null ? b.voiced + " of " + total + " voiced" : "");
    return `<button class="railrow${m ? " merged" : ""}${stale.length ? " stale" : ""}" data-slug="${esc(b.slug)}"${
      m ? ' data-merge="1"' : ""} aria-selected="false" title="${esc(title)}">${base}</button>`;
  }).join("");
}

// The entries still loading (or failed), after the finished books. Before
// the parser has named the book the card carries the source's name; once
// /state lists the slug it is the real base row under the same veil.
function loadingRows(now) {
  now = now == null ? Date.now() / 1000 : now;
  return Array.from(pending.values()).map(entry => {
    const b = entry.slug ? (libraryBooks || []).find(x => x.slug === entry.slug) : null;
    const p = entry.failed ? null
      : ingestProgress(entry.job || { phase: "running", step: "parse", started: entry.started }, ingestLogFor === entry.name ? ingestLog : "", now);
    // the picture's parsing tile: the cover faded, the title, and the grey
    // line reading `<author> · parsing…` -- the step label IS that line, so
    // there is no second one under it (`.tile .ingest-step` is display:none).
    const label = entry.failed ? (entry.failed.label || "failed") : p.label;
    const title = b ? b.title : entry.title;
    const inner = tileCoverHTML(b || { slug: entry.slug || "", title: title, author: null }) +
      (b
      ? `<span class="railrow-title">${esc(b.title)}</span>
      <span class="railrow-by">${esc(b.author || "unknown")} · ${esc(label)}</span>`
      : `<span class="railrow-title">${esc(entry.title)}</span>
      <span class="railrow-by">${esc(entry.kind || "source")} · ${esc(label)}</span>`);
    const step = entry.failed
      ? `<span class="ingest-step">${esc(entry.failed.label || "failed")}</span>`
      : `<span class="ingest-step">${esc(p.label)}</span>`;
    const veilStep = step;
    const veil = entry.failed
      ? `<span class="ingest-veil failed"><span class="ingest-fail-title">${esc(title)} — ${esc(entry.failed.label || "failed")}</span>` +
        `<span class="ingest-fail-line" title="${esc(entry.failed.line)}">${esc(entry.failed.line)}</span>` +
        `<button type="button" class="ingest-retry" data-retry="${esc(entry.name)}">Retry</button></span>`
      : `<span class="ingest-veil${p.known ? "" : " pulse"}"></span>`;
    const pct = entry.failed ? 0 : p.fraction * 100;
    // a <div role=button>, not a <button>: the failed veil holds the Retry
    // <button>, and a button inside a button is not HTML (Chrome hoists it out)
    return `<div class="railrow tile loading${entry.failed ? " failed" : ""}" role="button" tabindex="0" data-slug="${esc(entry.slug || "")}" data-source="${esc(entry.name)}"` +
      ` data-step="${esc(entry.failed ? "failed" : p.step)}" data-fraction="${entry.failed ? "0" : p.fraction.toFixed(3)}"` +
      ` data-known="${entry.failed ? "false" : p.known}" aria-selected="false" aria-busy="${entry.failed ? "false" : "true"}"` +
      ` style="--ingest: ${pct.toFixed(1)}%" title="${esc(entry.failed ? entry.failed.line : p.label)}">${inner}${veilStep}${veil}</div>`;
  }).join("");
}

// ------------------------------------------------------------ the context
// The bug Osca saw (READER_FIRST.md "Osca's app decisions -- 30 Aug"): this
// one file is loaded by the desktop app *and* by the installed shell on the
// phone, and the phone's "On this device" panel was showing on the Mac --
// "0 books · 19.2 GB free" against the Mac's own disk, beside a shelf of nine
// books that live on the SSD. The rule is one helper, `reader/context.js`,
// shared with reader.html so the two pages can never disagree:
//   bench   the desktop app injects window.TTSTVHost, or /state answered ->
//           the Sources rail, ingest, drops and the phone shelf;
//   device  neither of those, and this page could really keep a book (Cache
//           + crypto.subtle + import.js) -> the "On this device" panel.
// Neither is a screen width: a narrow window on the Mac is not a phone.
function libraryContext() {
  if (window.TTSTVContext) return TTSTVContext.read();
  // a shell published before context.js existed: the old rule, unchanged
  const bench = !!window.TTSTVHost || studioLive;
  return { app: !!window.TTSTVHost, bench, device: CAN_IMPORT && !window.TTSTVHost && !studioLive,
           kind: "static", benchReason: bench ? null : "no studio behind this page" };
}

// Everything that needs studio, shown or hidden in one place: the Sources
// rail, its phone sheet toggle and its scrim. Called after every poll, since
// `studioLive` turns true on the first answer.
function paintContext() {
  const ctx = libraryContext();
  const root = document.documentElement;
  if (root && root.setAttribute) root.setAttribute("data-ttstv-context", ctx.kind);
  const bench = ctx.bench;
  for (const id of ["sources", "sourcesToggle", "sourcesScrim"]) {
    const el = document.getElementById(id);
    if (el) el.hidden = !bench;
  }
  if (!bench && SHEET_OPEN) setSheet(false);
  pushHostContext();   // the Sources tool goes dark with the rail
  return ctx;
}

// ------------------------------------------------------- on this device
// PROMPTS/phone-book-import.md. A bundle .zip -- AirDropped into Files and
// picked with the button, or shared straight into the app (manifest
// share_target) -- is unzipped in the page by library/unzip.js, validated and
// stored one Cache per book by library/import.js, and answered offline by
// reader/sw.js at the same books/<slug>/... URLs the reader already asks for.
// This section is the visible half: the button, the rows, the sizes, remove,
// and how much room is left.
//
// Shown only where it can actually work: the Cache API and a secure-context
// crypto.subtle (the book hash is sha256 of the word ids -- core/provenance.py's
// own rule). Over file:// there is neither, and the section stays away rather
// than offering a button that would fail on the first click.
const CAN_IMPORT = typeof caches !== "undefined"
  && typeof crypto !== "undefined" && !!(crypto && crypto.subtle)
  && typeof TTSTVBundle !== "undefined";
let deviceBooks = [];     // TTSTVBundle.listInstalled(): one row per installed book
let storage = null;       // navigator.storage.estimate(), or null where it is not offered
let importing = null;     // {name, label, fraction} while a zip is being read
let importError = null;   // {name, lines} until the next import replaces it

async function refreshDevice() {
  if (!CAN_IMPORT) return deviceBooks;
  try {
    deviceBooks = await TTSTVBundle.listInstalled();
    storage = await TTSTVBundle.estimate();
  } catch (e) { note("Couldn't read what's on this device: " + (e.message || e)); }
  return deviceBooks;
}

function deviceStatus(b) {
  const bits = [b.chapters + " ch", TTSTVBundle.fmtBytes(b.bytes)];
  if (b.has_audio) bits.push("<b>audio</b>");
  else if (b.has_timings) bits.push("timed");
  return bits.join(" · ");
}

function deviceRowHTML(b) {
  return `<button class="railrow device" data-slug="${esc(b.slug)}" data-device="1" data-hash="${esc(b.hash || "")}"` +
    ` aria-selected="false" title="${esc(b.title)} — ${esc(b.slug)} @ ${esc(b.hash || "?")}">` +
    `<span class="railrow-title">${esc(b.title || b.slug)}</span>` +
    `<span class="railrow-by">${esc(b.author || "unknown")} · ${esc(b.lang || "")}</span>` +
    `<span class="railrow-status">${deviceStatus(b)}</span>` +
    `<span class="rmbook" role="button" tabindex="0" data-remove="${esc(b.slug)}"` +
    ` aria-label="Remove ${esc(b.title || b.slug)} from this device" title="Remove from this device">✕</span></button>`;
}

// The importing row: the same greyed entry + bar the bench uses for an
// ingest (.railrow.loading + .ingest-veil, --ingest is the fraction), because
// it is the same event from the reader's side -- a book arriving.
function importingRowHTML() {
  const p = importing;
  const pct = Math.max(0, Math.min(1, p.fraction || 0)) * 100;
  return `<div class="railrow loading" role="button" tabindex="-1" data-importing="1"` +
    ` style="--ingest: ${pct.toFixed(1)}%" title="${esc(p.label || "")}">` +
    `<span class="railrow-title">${esc(p.name)}</span>` +
    `<span class="railrow-by">bundle · importing</span>` +
    `<span class="railrow-status">${esc(TTSTVBundle.fmtBytes(p.bytes || 0))}</span>` +
    `<span class="ingest-step">${esc(p.label || "reading")}</span>` +
    `<span class="ingest-veil${p.fraction ? "" : " pulse"}"></span></div>`;
}

function storageLine() {
  const n = deviceBooks.length;
  const used = deviceBooks.reduce((t, b) => t + (b.bytes || 0), 0);
  const bits = [n === 1 ? "1 book" : n + " books"];
  if (n) bits.push(TTSTVBundle.fmtBytes(used) + " of books");
  if (storage && storage.quota) {
    bits.push(TTSTVBundle.fmtBytes(Math.max(0, storage.quota - (storage.usage || 0))) + " free of "
      + TTSTVBundle.fmtBytes(storage.quota));
  } else {
    bits.push("this browser doesn't say how much room is left");
  }
  return `<div class="storageline">${esc(bits.join(" · "))}</div>`;
}

function importErrorHTML() {
  if (!importError) return "";
  return `<div class="importerr" role="alert"><b>${esc(importError.name)} was not imported</b>` +
    `<ul>${importError.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul></div>`;
}

function deviceSection() {
  // CAN_IMPORT says this page *could* keep a book; libraryContext().device
  // says it is the kind of machine that does. On the Mac -- the app, or a
  // browser with studio behind it -- the books are on the SSD and this panel
  // was measuring the wrong disk (READER_FIRST.md, 30 Aug).
  if (!CAN_IMPORT || !libraryContext().device) return "";
  const rows = (importing ? importingRowHTML() : "") + deviceBooks.map(deviceRowHTML).join("");
  const head = `<div class="devicehead"><h2>On this device</h2>` +
    `<button id="importBtn" type="button"${importing ? " disabled" : ""}>` +
    `${importing ? "Importing…" : "Import bundle…"}</button></div>`;
  const body = rows || `<div class="empty">No books here yet. AirDrop a bundle .zip to this phone, then Import bundle… and pick it out of Files.</div>`;
  return head + importErrorHTML() + body + storageLine();
}

// One import, start to finish. Everything that can go wrong says which file
// and why, in the row, and leaves whatever was already on the device alone.
async function runImport(file) {
  if (!CAN_IMPORT || importing) return null;
  importError = null;
  importing = { name: file.name || "bundle.zip", label: "reading the zip", fraction: 0, bytes: file.size || 0 };
  renderShelf();
  let result = null;
  try {
    const buf = await file.arrayBuffer();
    result = await TTSTVBundle.importZip(buf, {
      onProgress: (p) => {
        importing.label = p.label;
        importing.fraction = p.total ? p.done / p.total : 0;
        paintImport();
      },
    });
  } catch (e) {
    importError = { name: importing.name, lines: [String(e.message || e)] };
    importing = null;
    await refreshDevice();
    renderShelf();
    note(`${importError.name}: ${importError.lines[0]}`);
    return null;
  }
  importing = null;
  const bad = result.books.filter(b => !b.ok);
  const good = result.books.filter(b => b.ok);
  if (bad.length) importError = {
    name: file.name || "bundle.zip",
    lines: bad.flatMap(b => b.errors.map(e => (b.slug ? b.slug + ": " : "") + e)),
  };
  await refreshDevice();
  renderShelf();
  if (good.length) {
    note(good.map(b => `${b.title} · ${b.chapters} ch · ${TTSTVBundle.fmtBytes(b.bytes)}`
