      ? { id: "collapseall", label: "Collapse all shelves" }
      : { id: "collapseall", label: "Collapse all shelves", disabled: "every shelf is already closed" });
    items.push(anyShut
      ? { id: "expandall", label: "Expand all shelves" }
      : { id: "expandall", label: "Expand all shelves", disabled: "every shelf is already open" });
  }
  items.push({ id: "sep" });
  items.push(opts.bench
    ? { id: "opensource", label: "Open a source…" }
    : { id: "opensource", label: "Open a source…", disabled: "there is no bench behind this page" });
  return items;
}

function shelfPickerItems() {
  return [{ id: "sep", head: "Add to shelf…" }].concat(
    library.shelves.map(s => ({ id: "shelf:" + s.id, label: `${s.name} (${s.books.length})` })),
    [{ id: "sep" }, { id: "newshelf", label: "New shelf…" }]);
}

function shelfActionItems(id) {
  const s = library.shelves.find(x => x.id === id);
  if (!s) return [];
  const i = library.shelves.indexOf(s);
  return [
    { id: "sh:rename", label: "Rename…" },
    i > 0 ? { id: "sh:up", label: "Move up" } : { id: "sh:up", label: "Move up", disabled: "already the first shelf" },
    i < library.shelves.length - 1 ? { id: "sh:down", label: "Move down" } : { id: "sh:down", label: "Move down", disabled: "already the last shelf" },
    { id: "sep" },
    { id: "sh:delete", label: "Delete shelf", danger: true },
  ];
}

// ------------------------------------------------------- opening, in words
// Every disabled row says why, right there, because a grey row with no reason
// is the app refusing without speaking.
function menuRowHTML(it) {
  if (it.id === "sep") return it.head ? `<div class="menuhead">${esc(it.head)}</div>` : "<hr>";
  const cls = [it.danger ? "danger" : "", it.disabled ? "off" : ""].filter(Boolean).join(" ");
  const why = it.disabled ? `<span class="menuwhy">${esc(it.disabled)}</span>` : "";
  return `<button role="menuitem" data-act="${esc(it.id)}"${cls ? ` class="${cls}"` : ""}` +
    `${it.disabled ? " disabled aria-disabled=\"true\"" : ""}>` +
    `<span class="menulabel">${esc(it.label)}</span>${why}</button>`;
}


let menuTarget = null;
let menuAt = { x: 0, y: 0 };
function showMenu(x, y, kind, target, items) {
  const el = document.getElementById("menu");
  items = items || menuItems(kind, target.state, { slug: target.slug });
  el.innerHTML = items.map(menuRowHTML).join("");
  menuTarget = { kind, ...target };
  menuAt = { x, y };
  el.hidden = false;
  // on the phone the menu is a bottom sheet (CSS); the pointer position is irrelevant
  if (isPhone()) { el.style.left = ""; el.style.top = ""; }
  else { el.style.left = x + "px"; el.style.top = y + "px"; }
  // not `button:not([disabled])`: the node harness's selector engine is a
  // subset, and a selector it cannot parse throws rather than missing.
  const buttons = Array.from(el.querySelectorAll("button"));
  const first = buttons.find(b => !b.disabled && b.getAttribute("aria-disabled") !== "true") || buttons[0];
  if (first) first.focus();
}

// ------------------------------------------------------------- the phone
// PROMPTS/reader-mobile.md step 3. The same breakpoint as reader.html:
// narrow or short, so a phone in landscape is a phone here too.
const PHONE_QUERY = "(max-width: 640px), (max-height: 500px)";
function isPhone() {
  return !!(window.matchMedia && window.matchMedia(PHONE_QUERY).matches);
}

let SHEET_OPEN = false;
function setSheet(open) {
  SHEET_OPEN = !!open;
  document.getElementById("sources").classList.toggle("sheet-open", SHEET_OPEN);
  document.getElementById("sourcesScrim").classList.toggle("on", SHEET_OPEN);
  document.getElementById("sourcesToggle").setAttribute("aria-expanded", SHEET_OPEN ? "true" : "false");
  pushHostContext();
}

// A long-press stands in for the right-click on a touch screen: one finger
// held still for `holdMs` on a row opens the same menu, and the click that
// follows the release is swallowed so a held press never also opens the
// book. Movement past `slop` px, a second finger or lifting early cancels.
// The pointer handlers below feed this; it is pure so the node harness can
// prove the timing (reader/tests/test_library_page.py).
function makeLongPress(opts) {
  opts = Object.assign({ holdMs: 500, slop: 10 }, opts || {});
  const st = { timer: null, x: 0, y: 0, fired: false, target: null };
  return {
    down(x, y, target, fire, setTimer) {
      this.cancel();
      st.x = x; st.y = y; st.fired = false; st.target = target;
      st.timer = (setTimer || setTimeout)(() => { st.timer = null; st.fired = true; fire(target, x, y); }, opts.holdMs);
    },
    move(x, y) {
      if (st.timer != null && (Math.abs(x - st.x) > opts.slop || Math.abs(y - st.y) > opts.slop)) this.cancel();
    },
    cancel() { if (st.timer != null) { clearTimeout(st.timer); st.timer = null; } },
    // called on the click that follows a release: true = swallow it
    consumeClick() { const f = st.fired; st.fired = false; return f; },
    get pending() { return st.timer != null; },
    get fired() { return st.fired; },
  };
}

const longPress = makeLongPress();
function wireLongPress(container, rowSelector, onHold) {
  container.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "touch" || !e.isPrimary) return;
    const row = e.target.closest(rowSelector);
    if (!row) return;
    longPress.down(e.clientX, e.clientY, row, (target, x, y) => onHold(target, x, y));
  });
  container.addEventListener("pointermove", (e) => { if (e.pointerType === "touch") longPress.move(e.clientX, e.clientY); });
  for (const t of ["pointerup", "pointercancel", "pointerleave"]) container.addEventListener(t, () => longPress.cancel());
  container.addEventListener("click", (e) => {
    if (longPress.consumeClick()) { e.stopPropagation(); e.preventDefault(); }   // capture phase on the container: nothing below hears it
  }, { capture: true });
  container.addEventListener("contextmenu", (e) => {
    // iOS Safari fires this for a held link/image but not for our rows; when
    // a browser does fire it for a touch, the long-press already opened the
    // menu -- don't open it twice.
    if (longPress.fired) e.preventDefault();
  }, { capture: true });
}
function hideMenu() { document.getElementById("menu").hidden = true; menuTarget = null; }

// `pending` here is the menu's own two-step: "Open with…" and "Merge with…"
// with one book selected re-draw the same popover as a list of the others,
// and the row that is then clicked comes back through `pick:<slug>`.
let menuPick = null;          // {slug, kind: "open" | "merge"} while picking

function menuAct(act) {
  const t = menuTarget;
  const at = menuAt;
  hideMenu();
  if (!t) return null;
  const slug = t.slug;
  const book = slug ? (libraryBooks || []).find(b => b.slug === slug) : null;

  // the second step of the bookmark picker
  if (act && act.indexOf("bm:") === 0) {
    const id = act.slice(3);
    const p = menuPick; menuPick = null;
    const target = (p && p.slug) || slug;
    if (!target) return null;
    rememberBook(target);
    // No host call: `openReader(slug)` in desktop/src/host.js takes a slug and
    // nothing else, so a bookmark cannot travel through it. window.open is a
    // real tab beside this one in the app (tabs.rs `on_new_window`) and a tab
    // in a browser -- the same route "Open with…" already uses for a pair.
    // A native `openReaderAt(slug, bm)` is a §6 request, not a blocker.
    window.open(readerUrl(target, id), "_blank");
    return "bookmark";
  }

  // the second step of a picker
  if (act && act.indexOf("pick:") === 0) {
    const other = act.slice(5);
    const p = menuPick; menuPick = null;
    if (!p) return null;
    if (p.kind === "merge") return mergeCreate(p.slug, other);
    return openPair(p.slug, other, false);
  }
  if (act && act.indexOf("shelf:") === 0) {
    const id = act.slice(6);
    const which = (SEL.length && SEL.indexOf(slug) >= 0) ? SEL : [slug];
    return shelfAdd(id, which);
  }
  if (act && act.indexOf("sh:") === 0) return shelfAct(act.slice(3), t.shelfId);

  const pair = SEL.length === 2 && SEL.indexOf(slug) >= 0 ? SEL : null;
  switch (act) {
    case "open": return openEntry(slug, false);
    case "window": return openEntry(slug, true);
    case "openwith":
      if (pair) return openPair(pair[0], pair[1], false);
      menuPick = { slug, kind: "open" };
      return showMenu(at.x, at.y, "pick", { slug }, pickerItems(slug, "open"));
    case "mergewith":
      if (pair) return mergeCreate(pair[0], pair[1]);
      menuPick = { slug, kind: "merge" };
      return showMenu(at.x, at.y, "pick", { slug }, pickerItems(slug, "merge"));
    case "bookmarks":
      menuPick = { slug, kind: "bookmark" };
      return showMenu(at.x, at.y, "pick", { slug }, bookmarkPickerItems(slug));
    case "collapseall":
    case "expandall": {
      const shut = act === "collapseall";
      libPatch(d => {
        d.mainCollapsed = shut;
        for (const sh of d.shelves) sh.collapsed = shut;
      });
      renderShelf();
      return shut;
    }
    case "opensource": {
      // the same door the header's Import button opens -- one picker, not two
      const inp = document.getElementById("importFile");
      if (inp && inp.click) inp.click();
      return true;
    }
    case "swap": return mergeSwapOrder(slug);
    case "unmerge": return mergeDelete(slug);
    case "shelve": return showMenu(at.x, at.y, "pick", { slug }, shelfPickerItems());
    case "newshelf": {
      const name = ask("Name the shelf — Latin, Poems, Philosophy…", "");
      const id = shelfCreate(name);
      if (id && slug) shelfAdd(id, (SEL.length && SEL.indexOf(slug) >= 0) ? SEL : [slug]);
      return id;
    }
    case "unshelve": {
      for (const s of shelvesFor(slug)) shelfRemove(s.id, slug);
      note(`${entryTitle(slug)} is unshelved. It is still in the library.`);
      return true;
    }
    case "studio": return openStudio(slug);
    case "reparse": return reparseBook(slug);
    case "parses": return openParses(slug);
    case "delete": return removeBook(slug, book && book.title);
    case "forget": return forgetBook(slug);
    case "ingest": return ingest(t.name, { force: true });
    case "reveal": return reveal(sourceByName(t.name) || {});
  }
  return null;
}

function shelfAct(what, id) {
  const s = library.shelves.find(x => x.id === id);
  if (!s) return null;
  const i = library.shelves.indexOf(s);
  switch (what) {
    case "rename": return shelfRename(id, ask("Rename the shelf", s.name));
    case "up":
    case "down": {
      const j = what === "up" ? i - 1 : i + 1;
      if (j < 0 || j >= library.shelves.length) return null;
      libPatch(d => {
        const list = d.shelves;
        const k = list.findIndex(x => x.id === id);
        if (k < 0) return;
        const [moved] = list.splice(k, 1);
        list.splice(what === "up" ? k - 1 : k + 1, 0, moved);
        list.forEach((x, n) => { x.order = n; });
      });
      renderShelf();
      return true;
    }
    case "delete": return shelfDelete(id);
  }
  return null;
}

function note(text) { document.getElementById("note").textContent = text || ""; }

// --------------------------------------------------------------- wiring
const shelfEl = document.getElementById("shelf");
const sourcesEl = document.getElementById("sources");

shelfEl.addEventListener("click", (e) => {
  const retry = e.target.closest(".ingest-retry");
  if (retry) { e.preventDefault(); e.stopPropagation(); ingest(retry.dataset.retry, { force: true }); return; }
  const rm = e.target.closest("[data-remove]");
  if (rm) { e.preventDefault(); e.stopPropagation(); forgetBook(rm.dataset.remove); return; }
  // a shelf heading: collapse/expand, and its ⋯
  const sm = e.target.closest("[data-shelfmenu]");
  if (sm) {
    e.preventDefault(); e.stopPropagation();
    const id = sm.dataset.shelfmenu;
    showMenu(e.clientX || 0, e.clientY || 0, "shelfhead", { shelfId: id }, shelfActionItems(id));
    return;
  }
  const st = e.target.closest(".shelftoggle");
  if (st) { e.preventDefault(); shelfToggle(st.dataset.shelf); return; }

  const row = e.target.closest(".railrow");
  // "Clicking the shelf background clears it" (§1) -- the one gesture that
  // says "never mind" without reaching for a key.
  if (!row) { if (SEL.length) selClear(); return; }
  e.preventDefault();
  if (row.dataset.importing) { note(`${importing ? importing.label : "importing"}…`); return; }
  if (row.dataset.device) { openReader(row.dataset.slug, isCmd(e)); return; }
  if (row.classList.contains("loading")) {
    // not openable until the text and look-ups are there
    const entry = pending.get(row.dataset.source);
    note(entry && entry.failed ? `${entry.title}: ${entry.failed.line}` : `${row.querySelector(".railrow-title").textContent} is still being ingested.`);
    return;
  }
  // ON A PHONE A TAP OPENS. §1's click-selects is a pointer-and-keyboard
  // gesture: it is only worth anything because Enter follows it, and a phone
  // has no Enter. There the shelf is what it has always been -- a list you
  // tap to read -- and the second book arrives through the long-press menu's
  // "Open with…" (§5), which is why that item is NOT bench-only.
  if (isPhone()) { openEntry(row.dataset.slug, false); return; }
  const slug = row.dataset.slug;
  if (e.shiftKey) selExtend(slug);
  else if (isCmd(e)) selToggle(slug);
  else selSet(slug);
});

// Double-click opens, whatever is selected -- the gesture that means "just
// open this one", and the reason a single click is free to mean something
// else at last.
shelfEl.addEventListener("dblclick", (e) => {
  const row = e.target.closest(".railrow");
  if (!row || row.classList.contains("loading") || row.dataset.importing) return;
  e.preventDefault();
  selSet(row.dataset.slug);
  openEntry(row.dataset.slug, false);
});
shelfEl.addEventListener("contextmenu", (e) => {
  const row = e.target.closest(".railrow");
  if (!row) {
    // empty space: OUR menu, never WebKit's
    e.preventDefault();
    selClear();
    showMenu(e.clientX, e.clientY, "empty", { slug: null },
      shelfEmptyMenuItems({ shelves: library.shelves, mainCollapsed: library.mainCollapsed,
                            bench: libraryContext().bench }));
    return;
  }
  e.preventDefault();
  if (row.classList.contains("loading")) {
    const entry = pending.get(row.dataset.source);
    showMenu(e.clientX, e.clientY, "source", { name: row.dataset.source, slug: (entry && entry.slug) || null, state: entry && entry.failed ? "grey" : "busy" });
    return;
  }
  // Right-clicking a row that is not in the selection selects it first, so
  // "Merge with X & Y" can only ever appear over one of the two it names.
  if (!row.dataset.device && !isPhone() && SEL.indexOf(row.dataset.slug) < 0) selSet(row.dataset.slug);
  showMenu(e.clientX, e.clientY, row.dataset.device ? "device" : "shelf", { slug: row.dataset.slug, state: "filled" });
});

// A row for an event, even when the event's own target is the container:
// elementFromPoint answers for whatever is under the pointer now. Belt and
// braces beside renderSources()'s in-place update -- between them, nothing
// a poll does can lose a double-click.
function srcRowFor(e) {
  const direct = e.target && e.target.closest ? e.target.closest(".src") : null;
  if (direct) return direct;
  const at = document.elementFromPoint(e.clientX, e.clientY);
  return at && at.closest ? at.closest(".src") : null;
}

sourcesEl.addEventListener("click", (e) => {
  if (e.target.closest("#srcFolder")) { e.preventDefault(); pickSourcesFolder(); return; }
  const row = e.target.closest(".src");
  if (!row) return;
  selectSource(row.dataset.name);   // never a re-render: see renderSources()
});
const srcFolderInput = document.getElementById("srcFolderInput");
if (srcFolderInput) {
  srcFolderInput.addEventListener("change", () => {
    const files = srcFolderInput.files;
    if (files && files.length) takeLocalFolder(files);
    srcFolderInput.value = "";   // the same folder can be picked again
  });
}
sourcesEl.addEventListener("dblclick", (e) => {
  const row = srcRowFor(e);
  if (!row) return;
  e.preventDefault();
  if (row.dataset.state === "filled") openStudio(row.dataset.slug);
  else if (row.dataset.state === "grey") ingest(row.dataset.name);
});
sourcesEl.addEventListener("keydown", (e) => {
  const row = e.target.closest(".src");
  if (!row || e.key !== "Enter") return;
  e.preventDefault();
  if (row.dataset.state === "filled") openStudio(row.dataset.slug); else ingest(row.dataset.name);
});
sourcesEl.addEventListener("contextmenu", (e) => {
  const row = e.target.closest(".src");
  if (!row) return;
  e.preventDefault();
  showMenu(e.clientX, e.clientY, "source", { name: row.dataset.name, slug: row.dataset.slug || null, state: row.dataset.state });
});
sourcesEl.addEventListener("dragstart", (e) => {
  const row = e.target.closest(".src");
  if (!row || !e.dataTransfer) return;
  e.dataTransfer.setData("text/x-ttstv-source", row.dataset.name);
  e.dataTransfer.effectAllowed = "copy";
});

// Drag a source (or a Finder file) onto the shelf = the same as double-click.
for (const type of ["dragenter", "dragover"]) {
  shelfEl.addEventListener(type, (e) => { e.preventDefault(); shelfEl.classList.add("dropping"); if (e.dataTransfer) e.dataTransfer.dropEffect = "copy"; });
}
shelfEl.addEventListener("dragleave", () => shelfEl.classList.remove("dropping"));
// A book dragged onto a NAMED shelf is filed there. It is a label, so this
// copies nothing and takes the book off nothing -- the row stays where it is
// and gains a second home.
for (const type of ["dragenter", "dragover"]) {
  shelfEl.addEventListener(type, (e) => {
    const grp = e.target.closest && e.target.closest(".shelfgrp");
    for (const g of shelfEl.querySelectorAll(".shelfgrp.dropping")) if (g !== grp) g.classList.remove("dropping");
    if (grp) grp.classList.add("dropping");
  });
}
shelfEl.addEventListener("drop", (e) => {
  const grp = e.target.closest && e.target.closest(".shelfgrp");
  if (!grp) return;
  const dt = e.dataTransfer;
  const slug = dt && dt.getData && dt.getData("text/x-ttstv-book");
  if (!slug) return;
  e.preventDefault(); e.stopPropagation();
  grp.classList.remove("dropping");
  shelfEl.classList.remove("dropping");
  shelfAdd(grp.dataset.shelf, SEL.indexOf(slug) >= 0 ? SEL : [slug]);
}, { capture: true });
shelfEl.addEventListener("drop", (e) => {
  e.preventDefault();
  shelfEl.classList.remove("dropping");
  const dt = e.dataTransfer;
  if (!dt) return;
  const name = dt.getData && dt.getData("text/x-ttstv-source");
  if (name) { ingest(name); return; }
  const files = dt.files ? Array.from(dt.files) : [];
  for (const f of files) {
    if (CAN_IMPORT && libraryContext().device && /\.zip$/i.test(f.name || "")) runImport(f);  // a bundle for this device
    else if (libraryContext().bench) uploadFile(f);                                          // a source for the bench
    else note(`Nothing here can take ${f.name || "that file"}.`);
  }
});

// long-press = right-click on the phone (the menu is a bottom sheet there)
wireLongPress(shelfEl, ".railrow", (row, x, y) => {
  if (row.dataset.device) { showMenu(x, y, "device", { slug: row.dataset.slug, state: "filled" }); return; }
  if (row.classList.contains("loading")) {
    const entry = pending.get(row.dataset.source);
    showMenu(x, y, "source", { name: row.dataset.source, slug: (entry && entry.slug) || null, state: entry && entry.failed ? "grey" : "busy" });
  } else showMenu(x, y, "shelf", { slug: row.dataset.slug, state: "filled" });
});
wireLongPress(sourcesEl, ".src", (row, x, y) =>
  showMenu(x, y, "source", { name: row.dataset.name, slug: row.dataset.slug || null, state: row.dataset.state }));

// No "< Reader" button in the header (Osca, 30 Aug). The Library is a place
// you arrive at and leave by opening a book, not a modal you back out of --
// and the browser's own back button already does the one thing that button
// did. `backToReader()` stays: the shelf opens a book through it.

// the sources sheet (phone only; the button is display:none on desktop)
/* The Sources rail, whatever shape it is in (Osca, 30 Aug: `,` opens and
 * closes the side panels, in the reader and here). On a phone it is a sheet
 * and `setSheet` owns it; on a desktop it is a column, and collapsing it is
 * a class plus one remembered bit. Nothing happens when studio is not behind
 * this page -- there is no rail to collapse and the key should not pretend
 * otherwise. */
const NARROW = "(max-width: 640px), (max-height: 500px)";
function toggleSources() {
  const bar = document.getElementById("sources");
  if (!bar || bar.hidden) return;
  if (window.matchMedia && window.matchMedia(NARROW).matches) { setSheet(!SHEET_OPEN); return; }
  const now = bar.classList.toggle("srcCollapsed");
  try { localStorage.setItem("librarySourcesCollapsed", now ? "1" : "0"); } catch (e) { /* ignore */ }
  pushHostContext();
}
try {
  if (localStorage.getItem("librarySourcesCollapsed") === "1") {
    document.getElementById("sources").classList.add("srcCollapsed");
  }
} catch (e) { /* private browsing */ }

/* ================================================= INLINE SEARCH (Osca, 3
 * Sep: "in the frank app itself... just placement of the search bar and
 * the drop down... just need it to HAVE/SHOW results"). Same /search
 * tools/search/serve.py already answers for search.html and pipeline.html,
 * called cross-origin -- a different process, a different port, so
 * serve.py now sends Access-Control-Allow-Origin: * for exactly this.
 * Picking a result is the "push": it hands the same title/author to
 * pipeline.html, which reads them off its own URL and re-runs the search
 * there, so the fuller table picks up where this dropdown left off rather
 * than starting over. The bar is a sibling of `.shell`, not inside `#shelf`
 * -- this page rewrites that wholesale on every ingest/shelf change, which
 * would blow away whatever was typed (studio's own `#shelf` taught this
 * lesson first, same day). */
// Search, Peek, Fetch and Parse are all served by studio itself now --
// the same already-running process Frank auto-launches for everything
// else -- so this is same-origin via `api()`, exactly like every other
// route on this page (§ postJSON/getJSON above). No separate server to
// start by hand any more (Osca, 4 Sep: "search should just be live in
// the app"). The one piece that still needs the standalone
// `tools/search/.venv` process is Attach (forced alignment, needs
// torch) inside pipeline.html -- studio's own venv is bare pytest by
// design, so that one route answers a clean error there instead.
let librarySearchToken = 0; // an older in-flight search must not clobber a newer one's dropdown
let lastSearchCandidates = []; // raw candidate dicts from the last /search, for "Parse" (stage_for_ingest wants the whole thing)

function searchOpenNow() {
  const bar = document.getElementById("searchBar");
  return !!(bar && !bar.hidden);
}

function toggleSearchBar() {
  const bar = document.getElementById("searchBar");
  if (!bar) return;
  bar.hidden = !bar.hidden;
  if (bar.hidden) {
    const r = document.getElementById("searchResults");
    if (r) { r.hidden = true; r.innerHTML = ""; }
  } else {
    const t = document.getElementById("searchTitle");
    if (t) t.focus();
  }
  pushHostContext();
}

function escapeHtmlSearch(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
}

/* What the source itself said about heft, on the row -- so "which of these
 * nine Pensees is the actual book" is answerable by looking (Osca, 4 Sep:
 * "the size of the file"). A stub is called one here rather than left to be
 * discovered after a download. Sources that state no size say nothing,
 * which is honest: unknown is not the same as small. */
function sizeNote(c) {
  if (!c || !c.size_bytes) return "";
  const label = fileSizeLabel(c.size_bytes);
  if (!label) return "";
  return ' \u00b7 ' + label + (c.size_bytes < 20000 ? " (looks like a stub)" : "");
}

/* Why a source is missing from these results (Osca, 4 Sep: "I'm getting no
 * gutenberg results"). The server has always returned this -- run_search_
 * with_report's per-adapter {count, error}, built precisely so "found
 * nothing" and "failed" could be told apart -- and this page threw it away,
 * so a source that was simply DOWN looked exactly like a source with
 * nothing to offer. Both are now said out loud, and a source whose hits
 * were all filtered out is a third, different line. */
function adapterNote(adapters, kept, droppedCount) {
  if (!adapters) return "";
  const keptBySource = {};
  (kept || []).forEach(c => { keptBySource[c.source] = (keptBySource[c.source] || 0) + 1; });
  const failed = [], filtered = [];
  Object.keys(adapters).forEach(name => {
    const a = adapters[name] || {};
    if (a.error) { failed.push(name + " \u2014 " + shortErr(a.error)); return; }
    if (a.count > 0 && !keptBySource[name]) filtered.push(name + " (" + a.count + ")");
  });
  let out = "";
  if (failed.length) {
    out += '<div class="snote serror">Couldn\'t reach: ' + escapeHtmlSearch(failed.join("; "))
        + '. Those sources are missing from these results \u2014 it\'s them, not you.</div>';
  }
  if (filtered.length) {
    out += '<div class="snote">Set aside as not this book: '
        + escapeHtmlSearch(filtered.join(", ")) + '.</div>';
  }
  return out;
}

/* Server-side error strings are exception reprs ("HTTPError: HTTP Error 503:
 * Service Unavailable"); a row of the dropdown has room for the gist. */
function shortErr(e) {
  const s = String(e).replace(/^[A-Za-z]+Error:\s*/, "");
  return s.length > 70 ? s.slice(0, 68) + "\u2026" : s;
}

async function runLibrarySearch() {
  const titleEl = document.getElementById("searchTitle");
  const authorEl = document.getElementById("searchAuthor");
  const results = document.getElementById("searchResults");
  if (!titleEl || !results) return;
  const title = titleEl.value.trim();
  const author = (authorEl && authorEl.value || "").trim();
  if (!title) { results.hidden = false; results.innerHTML = '<div class="sempty">Type a title first.</div>'; return; }
  const myToken = ++librarySearchToken;
  results.hidden = false;
  results.innerHTML = '<div class="sempty">Searching…</div>';
  const q = new URLSearchParams({ title });
  if (author) q.set("author", author);
  let data;
  const searchUrl = api("/search?" + q.toString());
  if (!searchUrl) {
    if (myToken !== librarySearchToken) return;
    results.innerHTML = '<div class="serror">Search needs studio behind this page -- open the Library from the app, not as a static file.</div>';
    return;
  }
  try {
    const res = await fetch(searchUrl);
    data = await res.json();
  } catch (e) {
    if (myToken !== librarySearchToken) return;
    results.innerHTML = '<div class="serror">Couldn\'t reach the search -- try again in a moment.</div>';
    return;
  }
  if (myToken !== librarySearchToken) return;
  if (data && data.error) { results.innerHTML = '<div class="serror">' + escapeHtmlSearch(data.error) + '</div>'; return; }
  const candidates = data.candidates || [];
  if (!candidates.length) { results.innerHTML = '<div class="sempty">Nothing found.</div>'; return; }
  lastSearchCandidates = candidates;
  results.innerHTML = candidates.map((c, i) => (
    '<div class="srow">'
    + '<button type="button" class="srowmain" data-i="' + i + '">'
    + '<span class="stitle">' + escapeHtmlSearch(c.title) + '</span>'
    + '<span class="smeta">' + escapeHtmlSearch(c.source) + ' \u00b7 ' + escapeHtmlSearch(c.kind)
    + (c.author ? ' \u00b7 ' + escapeHtmlSearch(c.author) : '')
    + ' \u00b7 ' + escapeHtmlSearch(c.license_status)
    + sizeNote(c) + '</span>'
    + '</button>'
    + '</div>'
  )).join("") + adapterNote(data.adapters, candidates, (data.dropped || []).length);
  // "when I find a book, I just want to parse it straight away... using
  // the same parser" (Osca, 4 Sep, then again, more plainly, 4 Sep: "when
  // I click on one, a text file, I want it to download the source into my
  // repo, THEN parse the source into my library, do both") -- one click on
  // a text result now IS both steps (parseSearchResult: stage_for_ingest,
  // then the same ingest() a manual Sources drop uses), no separate button
  // to find first. Audio has no parser step to hand off to, so it still
  // opens pipeline.html -- the fuller "Attach" tool, one click away, still
  // reachable from a text result too (parseSearchResult's own "choose"
  // branch, when a source ships more than one file).
  results.querySelectorAll(".srowmain").forEach(btn => {
    const c = candidates[Number(btn.dataset.i)];
    if (c && c.kind === "text") {
      btn.addEventListener("click", () => parseSearchResult(Number(btn.dataset.i), btn));
    } else {
      btn.addEventListener("click", () => openInPipeline(title, author));
    }
  });
}

/* ============================== THE BAR'S DOOR INTO THIS PAGE (4 Sep)
 *
 * The title-bar field (`desktop/src/tabs.html`, answered by
 * `reader/askbar.js`) can offer a book from Gutenberg or archive.org from any
 * tab -- but staging it, parsing it and putting it on the shelf is THIS page's
 * and only this page's (`parseSearchResult` below, and the `ingest()` a manual
 * Sources drop uses). So the bar hands the pick over rather than repeating any
 * of it: one path onto the shelf, not two.
 *
 * `take` runs the page's own search for the same words and then presses the
 * row the person chose -- by its source and title, never by an index, because
 * the two searches are two requests and a row's position is not a promise.
 * Nothing matched is not an error: the bar is left open with the results in
 * it, which is exactly where the person would have got to by hand.
 */
window.TTSTVLibrary = {
  async take(pick) {
    if (!pick || !pick.title) return;
    const bar = document.getElementById("searchBar");
    const t = document.getElementById("searchTitle");
    const a = document.getElementById("searchAuthor");
    if (!bar || !t) return;
    if (bar.hidden) toggleSearchBar();
    t.value = pick.title;
    if (a) a.value = pick.author || "";
    await runLibrarySearch();
    if (!pick.ctitle) return;
    const i = lastSearchCandidates.findIndex(c =>
      c && c.title === pick.ctitle && (!pick.source || c.source === pick.source));
    if (i < 0) return;
    const btn = document.querySelector('#searchResults .srowmain[data-i="' + i + '"]');
    if (!btn) return;
    const c = lastSearchCandidates[i];
    if (c.kind === "text") parseSearchResult(i, btn);
    else openInPipeline(t.value.trim(), (a && a.value || "").trim());
  },
};

/* ...and the same door from ANOTHER tab, which cannot call into this page:
 * the pick is written to one localStorage key there and read once here. One
 * shot -- it is removed before it is acted on, so a reload can never repeat a
 * parse -- and ignored if it has been sitting for more than a minute, which
 * means it belongs to a press nobody is waiting on any more. */
(function readAskHandoff() {
  const KEY = "ttstv.ask.handoff";
  let pick = null;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { localStorage.removeItem(KEY); pick = JSON.parse(raw); }
  } catch (e) { return; }
  if (!pick || !pick.at || Date.now() - pick.at > 60000) return;
  addEventListener("load", () => window.TTSTVLibrary.take(pick));
})();

function openInPipeline(title, author) {
  const q = new URLSearchParams({ title });
  if (author) q.set("author", author);
  // Same origin, served statically by studio (paths.RUNNER is the repo
  // root) -- so this works with zero separate process, same as /search
  // above. Attach specifically (inside pipeline.html) still wants the
  // standalone tools/search server for its torch dependency; it answers
  // a clean error here otherwise.
  const url = api("/tools/search/pipeline.html?" + q.toString());
  location.href = url || ("tools/search/pipeline.html?" + q.toString());
}

// "I just want to parse it straight away... using the same parser" (Osca,
// 4 Sep): fetches the candidate, copies it into TTS_DATA/sources/search/
// (tools/search/serve.py's new /stage_for_ingest), then hands it to the
// SAME POST /ingest studio/serve.py already runs for a book dropped into
// Sources by hand -- reader/library.html's own `ingest()`, unmodified, so
// this book gets every bit of that: the real parser, the grey placeholder
// on the shelf, the progress bar, the poll loop that clears it. A
// `refresh()` first is what makes `sourceByName()` inside `ingest()` able
// to find a file that did not exist a moment ago.
/* The suffixes `tools/search/serve.py`'s own STAGE_SUFFIXES will actually
 * stage. Its `_resolve_ia_files` offers a WIDER list (TEXT_EXTS, which also
 * has .htm/.html), so a picker showing everything it offers would let a
 * person choose a file that is refused a moment later, by a second round
 * trip, for a reason the list never hinted at. The Library shows only what
 * the parser reads. Kept deliberately in step with STAGE_SUFFIXES, the same
 * way that constant is kept in step with `studio/bookinfo.py`. */
const PARSEABLE_SUFFIX = /\.(epub|txt|pdf)$/i;

/* Best-first, so the top of the list is the right default and a person who
 * does not care can just press Parse. An .epub carries real chapter
 * structure the parser can use; a plain .txt is next; a `_djvu.txt` is the
 * OCR layer of a scan, the same text but noisier, so it ranks below its
 * cleaner sibling when an item has both; a .pdf is last -- readable, but
 * the most work to get structure out of. */
function searchFileRank(name) {
  const n = String(name).toLowerCase();
  if (n.endsWith(".epub")) return 0;
  if (n.endsWith(".txt")) return n.includes("_djvu") ? 2 : 1;
  if (n.endsWith(".pdf")) return 3;
  return 4;
}

/* One row owns at most one note. Without this every click stacked another
 * line under the same result (Osca's own screenshots, 4 Sep: four identical
 * "More than one file" notes in one dropdown) -- the page grew, and none of
 * the four said anything the first had not. */
function clearRowNote(row) {
  while (row && row.nextElementSibling && row.nextElementSibling.classList.contains("snote")) {
    row.nextElementSibling.remove();
  }
}

function noteAfterRow(row, html, cls) {
  if (!row) return null;
  clearRowNote(row);
  row.insertAdjacentHTML("afterend", '<div class="snote' + (cls ? " " + cls : "") + '">' + html + '</div>');
  return row.nextElementSibling;
}

/* The rule, apart from the drawing of it: which of the files an item offers
 * can actually become a book here, best first. Pure over its argument, so
 * the harness can hold a real archive.org file list against it. */
/* The shelf's own convention is MB to one decimal (`normaliseSources`),
 * which reads "0 MB" for the plain-text files this picker mostly lists --
 * a real 193 KB book shown as nothing at all. Under a megabyte, say KB. */
function fileSizeLabel(bytes) {
  const b = Number(bytes);
  if (!isFinite(b) || b <= 0) return "";
  if (b < 1048576) return Math.max(1, Math.round(b / 1024)) + " KB";
  return (Math.round(b / 1048576 * 10) / 10) + " MB";
}

function parseableFiles(files) {
  return (files || [])
    .filter(f => PARSEABLE_SUFFIX.test((f && f.name) || ""))
    .sort((a, b) => searchFileRank(a.name) - searchFileRank(b.name));
}

/* "I want to search and just add to library (parse it) without the audio"
 * (Osca, 4 Sep). An archive.org item is usually several files, and until
 * now that answer -- `{"status": "choose"}` -- was a dead end here: the
 * Library could only point at pipeline.html, a different page, to pick one.
 * Since the staging call already takes a `file_url`/`file_name` for exactly
 * this second pass, the pick belongs where the person already is. */
function renderChoosePicker(row, i, files) {
  const usable = parseableFiles(files);
  if (!usable.length) {
    const el = noteAfterRow(row,
      'Nothing in this item the parser reads directly (.epub, .txt or .pdf) -- '
      + '<a href="#" class="pipeline-link">Search \u2192 Library</a> handles the other shapes.');
    const link = el && el.querySelector(".pipeline-link");
    if (link) link.addEventListener("click", e => {
      e.preventDefault();
      openInPipeline(document.getElementById("searchTitle").value.trim(),
                      (document.getElementById("searchAuthor").value || "").trim());
    });
    return;
  }
  const opts = usable.map((f, idx) =>
    '<option value="' + idx + '">' + escapeHtmlSearch(f.name)
    + (f.size ? " (" + fileSizeLabel(f.size) + ")" : "")
    + '</option>').join("");
  const el = noteAfterRow(row,
    '<span class="schooselabel">' + usable.length + ' files here \u2014 pick one:</span>'
    + '<select class="schoosesel">' + opts + '</select>'
    + '<button type="button" class="schoosego">Parse</button>', "schoose");
  if (!el) return;
  const sel = el.querySelector(".schoosesel");
  const go = el.querySelector(".schoosego");
  go.addEventListener("click", () => {
    const f = usable[Number(sel.value)];
    if (!f) return;
    go.disabled = true; sel.disabled = true; go.textContent = "Parsing\u2026";
    parseSearchResult(i, row.querySelector(".srowmain"), { url: f.url, name: f.name });
  });
}

/* `pick` is the second pass: the file a person chose out of a `choose`
 * answer, handed straight back to the same staging call, which resolves
 * that one file instead of re-listing them all. Absent on the first call. */
async function parseSearchResult(i, btn, pick) {
  const candidate = lastSearchCandidates[i];
  if (!candidate) return;
  const row = btn.closest(".srow");
  // `innerHTML`, not `textContent`: when `btn` is `.srowmain` (the whole
  // row, since 4 Sep) its markup is the title/meta spans, not plain text --
  // `textContent` would flatten them on read and lose them for good on
  // restore. A plain `.sparse`-style button has no markup either way, so
  // this is safe for both callers.
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = "Parsing\u2026";
  let data;
  const stageUrl = api("/stage_for_ingest");
  if (!stageUrl) {
    btn.disabled = false; btn.innerHTML = original;
    noteAfterRow(row, "Parse needs studio behind this page -- open the Library from the app, not as a static file.", "serror");
    return;
  }
  const body = pick ? { candidate, file_url: pick.url, file_name: pick.name } : { candidate };
  try {
    const res = await fetch(stageUrl, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    data = await res.json();
  } catch (e) {
    btn.disabled = false; btn.innerHTML = original;
    noteAfterRow(row, "Couldn't reach the parser -- try again in a moment.", "serror");
    return;
  }
  if (data && data.error) {
    btn.disabled = false; btn.innerHTML = original;
    noteAfterRow(row, escapeHtmlSearch(data.error), "serror");
    return;
  }
  if (data && data.status === "choose") {
    btn.disabled = false; btn.innerHTML = original;
    // A pick that comes BACK as "choose" would loop the picker forever;
    // the staging call resolves a given `file_url` directly, so this only
    // happens if that contract changes. Say so, rather than spin.
    if (pick) {
      noteAfterRow(row, "That file couldn't be resolved -- try another one.", "serror");
      return;
    }
    renderChoosePicker(row, i, data.files);
    return;
  }
  // staged (data.name is a Sources-relative file `ingest()`'s own
  // `sourceByName()` can look up, once `refresh()` has seen it on disk)
  clearRowNote(row);
  await refresh();
  await ingest(data.name);
  toggleSearchBar();
  note('Parsing "' + candidate.title + '" \u2014 it will appear on the shelf shortly.');
}

if (document.getElementById("searchGo")) {
  document.getElementById("searchGo").addEventListener("click", runLibrarySearch);
}
["searchTitle", "searchAuthor"].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener("keydown", e => { if (e.key === "Enter") runLibrarySearch(); });
});

/* ============================================ THE STRIP IS THIS PAGE'S HEADER
 * `desktop/README.md`'s `## Status` -> desktop-headless-chrome entry §6, word
 * for word. In the app the tab strip is the title bar, so this page has no
 * header of its own and pushes what would have been in it.
 *
 * **The guard is on the METHOD, never the object.** `window.TTSTVHost` has
 * existed since long before it could take a context, so an older shell has the
 * object without the call -- and a page that dropped its header on the object
 * alone would be a Library with no chrome at all in that shell. In a plain
 * browser and on the phone `TTSTVHost` does not exist, none of this runs, and
 * the header is exactly what it always was: the test that matters.
 *
 * Note this is a DIFFERENT context from `libraryContext()` / `paintContext()`
 * above, which answer "what machine is this page on". Nothing here decides
 * anything; it only says what the strip should paint. */
function hostTakesContext() {
  return !!(window.TTSTVHost && typeof window.TTSTVHost.setContext === "function");
}

/* Whether the Sources rail is showing, in whichever shape it is in -- the same
 * three cases `toggleSources()` itself resolves, and `false` when there is no
 * bench and the rail is `hidden` (a tool that cannot be lit because there is
 * nothing to light). */
function sourcesOpenNow() {
  const bar = document.getElementById("sources");
  if (!bar || bar.hidden) return false;
  if (window.matchMedia && window.matchMedia(NARROW).matches) return SHEET_OPEN;
  return !bar.classList.contains("srcCollapsed");
}

/* THE 2 PX LINE UNDER THE LIBRARY'S OWN TAB, and only while an ingest is
 * actually running. `pending` holds one entry per ingest; an entry is deleted
 * the moment its book is on the shelf and carries `failed` when it stopped, so
 * "no running entries" is exactly §6's "the moment it ends, stops or fails"
 * and the answer there is `null`, never a zero bar. Several at once average,
 * because the strip has one line and there is one Library tab.
 * `text` is not read by anything -- `null` (§6). */
function ingestProgressNow(now) {
  const rows = Array.from(pending.values()).filter(e => !e.failed);
  if (!rows.length) return null;
  let sum = 0;
  for (const e of rows) {
    const p = ingestProgress(e.job || { phase: "running", step: "parse", started: e.started },
                             ingestLogFor === e.name ? ingestLog : "", now);
    sum += p.fraction;
  }
  return { fraction: sum / rows.length, text: null };
}

/* Pure over this page's own state, so the node tests can drive it with no
 * host: what the strip is told, as an object. */
function hostContextModel(now) {
  return {
    // NO INFO IN THE BAR OUTSIDE TABS AND BUTTONS (Osca, 31 Aug evening) --
    // the Library tab already says Library and the shelf is on the page.
    // `null` is §6's own "nothing here", so no strip, old or new, needs a
    // line changed for this. `shelfCountWord`, which existed only to write
    // the subtitle "· 9 books", goes with it: nothing else read it.
    title: null,
    subtitle: null,
    tools: [
      { id: "sources", glyph: "☰", label: "sources", on: sourcesOpenNow() },
      // Search across Gutenberg, LibriVox, Internet Archive and YouTube
      // (tools/search) -- the strip is the one place that is on-screen no
      // matter which tab is open, and this is where a person looking at the
      // Library actually looks for it (Osca, 3 Sep: "there's not even an
      // icon"). Opens as its own tab, same as the design bench below.
      { id: "search",  glyph: "\u2315", label: "search sources", on: searchOpenNow() },
      // the same bench, from the shelf. See reader.html's note: this page's
      // <header> is hidden in the app too, so the tool is the only way in.
      { id: "design",  glyph: "\u25c9", label: "design bench" },
    ],
    progress: ingestProgressNow(now),
  };
}

/* At load, whenever the shelf count changes (`renderShelf`), and on every step
 * of an ingest (`paintProgress`, once a second while one runs) -- plus the two
 * things that move the Sources tool's lit state, `setSheet` and
 * `toggleSources`, and `paintContext`, which is what takes the rail away when
 * there is no studio behind this page. */
function pushHostContext(now) {
  if (!hostTakesContext()) return null;
  const ctx = hostContextModel(now);
  try { TTSTVHost.setContext(ctx); } catch (e) { /* an older host, or a closed tab */ }
  return ctx;
}

/* The strip evaluates `window.TTSTVPage && TTSTVPage.tool(id)` in this page
 * when one of the icons it was given is clicked, and knows nothing else about
 * them (§6). One id here, and it is this page's own existing verb. */
window.TTSTVPage = Object.assign(window.TTSTVPage || {}, { tool(id) {
  if (id === "sources") return toggleSources();
  if (id === "search")  return toggleSearchBar();
  if (id === "design")  { location.href = "design/collection-page.html"; return; }
} });

/* AND THE HEADER GOES. Hidden, not removed: `#sourcesToggle` and `#themeBtn`
 * are still the elements their handlers were bound to, `paintContext()` still
 * finds `#sourcesToggle` by id to hide it with the rail, and nothing else in
 * this file has to know. */
if (hostTakesContext()) {
  const _hdr = document.querySelector("header");
  if (_hdr) _hdr.hidden = true;
}

document.getElementById("sourcesToggle").addEventListener("click", () => setSheet(!SHEET_OPEN));
document.getElementById("sourcesScrim").addEventListener("click", () => setSheet(false));
/* Every key on this page asks settings.js which ACTION a press is, exactly as
 * `reader.html` does (31 Aug, the Hotkeys tab): the tab lists these bindings,
 * so this page must not decide them itself, and a remap has to work here on
 * the next keystroke with no reload. `libHk` is the same alias reader.html
 * uses; `TTSTVSettings` is in the <head> of this page too, so it is always
 * there -- the guard is for the node harness that loads the page bare. */
const libHk = (e, id) => !!(window.TTSTVSettings && TTSTVSettings.hotkeyIs(e, id));

document.addEventListener("keydown", (e) => {
  if (libHk(e, "close") && SHEET_OPEN) { setSheet(false); return; }
  // Not while something is being typed into, and not while a modifier is
  // down -- Cmd+, is the app's Settings and must reach the menu bar.
  const t = e.target;
  const typing = t && (t.isContentEditable
    || /^(input|textarea|select)$/i.test(t.tagName || ""));
  if (!typing && TTSTVSettings && TTSTVSettings.hotkeyWhich(e, "sidebar") === 0) {
    e.preventDefault(); toggleSources();
  }
});

document.getElementById("menu").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]");
  // A disabled row is there to SAY something, not to do it. Real browsers
  // swallow the click; the node harness does not, so the guard is here.
  if (b && (b.disabled || b.getAttribute("aria-disabled") === "true")) { e.preventDefault(); return; }
  if (b) menuAct(b.dataset.act);
});
document.addEventListener("click", (e) => {
  if (!document.getElementById("menu").hidden && !e.target.closest("#menu")) hideMenu();
});
document.addEventListener("keydown", (e) => { if (libHk(e, "close")) hideMenu(); });

// ENTER OPENS THE SELECTION; ESC CLEARS IT. Below the menu's own Escape
// (a menu is over the shelf, so it takes the key first), and never while
// something is being typed into.
document.addEventListener("keydown", (e) => {
  const el = e.target;
  const typing = el && (el.isContentEditable || /^(input|textarea|select)$/i.test(el.tagName || ""));
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (libHk(e, "openBook") && SEL.length) { e.preventDefault(); openSelection(); return; }
  if (libHk(e, "close") && SEL.length && document.getElementById("menu").hidden) {
    e.preventDefault(); selClear();
  }
});

/* The moon/sun toggle -- settings.js's, not this page's. The theme is one
 * stored value for the whole application now (settings.js, "the theme, in
 * public"), so the Library, every Reader tab and the Settings window all
 * paint the same choice, and changing it here reaches them without a reload.
 * What this page keeps is the button. */
const themeBtnEl = document.getElementById("themeBtn");
if (window.TTSTVSettings) TTSTVSettings.mountThemeButton(themeBtnEl);

// The Library registers the worker too, not only reader.html. Two reasons:
// share_target lands a POST on THIS page, and it is the worker that turns
// that POST into an import -- an app whose worker had never registered would
// answer a share with a 405 from the static host. And a phone launched
// straight into the Library (a home-screen link, a shared sheet) must still
// be able to read a book offline afterwards. Registering the same "sw.js"
// twice is a no-op: the browser keeps one registration per scope.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js")
      .catch((e) => console.warn("[sw] registration failed:", e));
  });
}

// ---- import: the button, the file input, and a bundle shared into the app
const importInput = document.getElementById("importFile");
shelfEl.addEventListener("click", (e) => {
  if (e.target.closest("#importBtn")) { e.preventDefault(); importInput.click(); }
});
if (importInput) importInput.addEventListener("change", () => {
  const f = importInput.files && importInput.files[0];
  importInput.value = "";                 // so the same file can be picked twice
  if (f) runImport(f);
});


// ---- the context gate, the Settings popover, and the phone shelf (30 Aug)
paintContext();
phoneShelfLoad();
renderPhoneShelf();
if (libraryContext().bench) phoneShelfFetchMirror();

// The shelf's own record: merges, shelves and where he left off. Loaded
// before the first paint (localStorage is synchronous, so the shelf is never
// drawn without its pairs) and reconciled with the SSD's copy after, if there
// is a bench to ask.
libLoad();
// THE SHELF BEFORE THE NETWORK. `shelfCacheRead` is synchronous, so the rows
// are on screen in the same frame the page paints in rather than a second
// later, and `/state` replaces them whole when it answers (SHELF_CACHE_KEY
// above). `libraryBooks` stays null when there is no cache, which is exactly
// what this page did before -- a first-ever open is unchanged.
if (libraryBooks === null) {
  const cached = shelfCacheRead();
  if (cached) libraryBooks = cached;
}
renderShelf();
// Asked once, and only once a bench has actually answered -- at this point in
// the boot `/state` has not, so `bench` is still false in a plain browser and
// the guard here would refuse forever. `refresh()` calls it on the first poll
// that turns `studioLive` true.
let libMirrorAsked = false;
function libMirrorOnce() {
  if (libMirrorAsked || !libraryContext().bench) return null;
  libMirrorAsked = true;
  return libFetchMirror();
}
libMirrorOnce();

/* SETTINGS IS A WINDOW (Osca, 30 Aug evening: "Settings -- hotkey 'Command +
 * ,' should OPEN IN A NEW WINDOW"), which supersedes the popover this page
 * carried for a day. The door is settings.js's `openWindow`, shared with
 * reader.html and with the Mac's own Settings… item, so all three open the
 * SAME window -- and a second ⌘, focuses it rather than opening another,
 * which is the whole reason the window has a name.
 *
 * The gear left the header on 30 Aug; this still binds where an older shell
 * puts a button on the page. */
const settingsBtnEl = document.getElementById("settingsBtn");
if (settingsBtnEl) settingsBtnEl.addEventListener("click", () => {
  if (window.TTSTVSettings) TTSTVSettings.openWindow(); else location.href = "settings.html";
});
document.addEventListener("keydown", (e) => {
  if (libHk(e, "settings")) {
    e.preventDefault();
    if (window.TTSTVSettings) TTSTVSettings.openWindow();
    return;
  }
  // ⌘⇧L -- the same one theme the moon button and the Settings window write.
  // The Library binds it because the Library is where the app opens.
  if (libHk(e, "theme")) {
    e.preventDefault();
    if (window.TTSTVSettings) TTSTVSettings.toggleTheme();
  }
});

// Drag a book from the shelf into the phone shelf to queue it. The payload is
// its own MIME type, so a source row dragged onto the shelf (which is an
// ingest) and a book dragged onto the phone shelf can never be confused.
shelfEl.addEventListener("dragstart", (e) => {
  const row = e.target.closest(".railrow");
  if (!row || !e.dataTransfer || row.classList.contains("loading") || !row.dataset.slug) return;
  e.dataTransfer.setData("text/x-ttstv-book", row.dataset.slug);
  e.dataTransfer.effectAllowed = "copy";
});
const phoneEl = document.getElementById("phoneShelf");
for (const type of ["dragenter", "dragover"]) {
  phoneEl.addEventListener(type, (e) => {
    e.preventDefault();
    phoneEl.classList.add("dropping");
    if (e.dataTransfer) e.dataTransfer.dropEffect = "copy";
  });
}
phoneEl.addEventListener("dragleave", () => phoneEl.classList.remove("dropping"));
phoneEl.addEventListener("drop", (e) => {
  e.preventDefault();
  phoneEl.classList.remove("dropping");
  const slug = e.dataTransfer && e.dataTransfer.getData && e.dataTransfer.getData("text/x-ttstv-book");
  if (!slug) { note("Drag a book from the shelf here to queue it for the phone."); return; }
  if (phoneQueue(slug)) note(`${phoneTitle(slug)} is queued for the phone. Sync sends everything queued.`);
  else note(`${phoneTitle(slug)} is already queued.`);
});
phoneEl.addEventListener("click", (e) => {
  const sync = e.target.closest("#syncPhone");
  if (sync) { e.preventDefault(); phoneSync(); return; }
  const un = e.target.closest("[data-unqueue]");
  if (un) { e.preventDefault(); phoneUnqueue(un.dataset.unqueue); return; }
  const rv = e.target.closest("[data-reveal]");
  if (rv) { e.preventDefault(); phoneReveal(rv.dataset.reveal); return; }
  const fg = e.target.closest("[data-forget]");
  if (fg) { e.preventDefault(); phoneForget(fg.dataset.forget); return; }
});

/* The panel's own ×. It is not inside #shelf, so it needs its own listener;
 * dismissal is keyed on the job, so the next re-parse draws again. */
const parsesEl = document.getElementById("parses");
if (parsesEl) parsesEl.addEventListener("click", (e) => {
  const x = e.target.closest('[data-panel="parses"]');
  if (!x) return;
  e.preventDefault();
  closeParses();
});

const reparseEl = document.getElementById("reparse");
if (reparseEl) reparseEl.addEventListener("click", (e) => {
  const x = e.target.closest('[data-panel="reparse"]');
  if (!x) return;
  e.preventDefault();
  reparseDismissed = reparseKey(reparseJob());
  renderReparse();
});

poll();
if (CAN_IMPORT) refreshDevice().then(() => { renderShelf(); return takeSharedBundle(); });
/* ONCE AT LOAD (§6): `renderShelf()` above has already pushed, but only if it
 * ran -- an empty Library that never renders a shelf must still name itself. */
pushHostContext();

// Internal debug hook for the load harness (not a documented API).
window.__LIBRARY_DEBUG__ = {
  get sources() { return sources; }, get books() { return libraryBooks; }, get job() { return job; },
  ingesting, refresh, ingest, menuAct, get menuTarget() { return menuTarget; },
  renderSources, selectSource, sourceState, shelfSlugFor, slugify, srcRowFor,
  // sources is the folder you opened (PROMPTS/reader-library-mock.md §3)
  get sourcesFolder() { return sourcesFolder; }, get localFiles() { return localFiles; },
  pickSourcesFolder, takeLocalFolder, sourcesFolderCard, folderName, folderWhere,
  backToReader, readerTargetSlug, cameFromReader, lastBook, rememberBook,
  pending, ingestProgress, paintProgress, get ingestLog() { return ingestLog; },
  // the re-parse: studio/README.md "three verbs for a bad parse" §6
  reparseReading, reparsePanelHTML, reparseBook, reparseJob, reparseBusyReason, laneJobs,
  renderReparse, syncReparse, get reparseLog() { return reparseLog; },
  parsesPanelHTML, openParses, closeParses,
  CAN_IMPORT, refreshDevice, runImport, forgetBook, takeSharedBundle, deviceSection,
  get deviceBooks() { return deviceBooks; }, get storage() { return storage; },
  get importing() { return importing; }, get importError() { return importError; },
  libraryContext, paintContext, get studioLive() { return studioLive; },
  // the strip is the header (desktop-headless-chrome §6)
  hostTakesContext, hostContextModel, pushHostContext, sourcesOpenNow,
  ingestProgressNow, toggleSources,
  get phoneShelf() { return phoneShelf; }, phoneQueue, phoneUnqueue, phoneForget, phoneSend,
  phoneSync, phoneReveal, renderPhoneShelf, phoneShelfLoad, phoneShelfFetchMirror,
  fmtBytes, fmtWhen, fmtDay, phoneRowMeta, PHONE_IS_A_RECORD,
  // the shelf as cover tiles, and the cover (PROMPTS/reader-library-mock.md)
  tileHTML, tileRows, tileLine, tileCoverHTML, coverPairing, coverLayout, coverHash,
  assignPairings, pairingFor, coverPairings, COVER_PAIRINGS, COVER_LAYOUTS, coverInitial,
  coverFacts, loadCoverFacts, bookFirstWords,
  // the shelf: selection, merges, shelves, memory (PROMPTS/library-shelf.md)
  get library() { return library; }, get selection() { return SEL; },
  get libraryWhy() { return libraryWhy; },
  libLoad, libRead, libPatch, libNormalise, libFetchMirror, libWordIds, libHash, bookHashFor,
  shelfEntries, entryTitle, mergeFor, mergeCreate, mergeDelete, mergeSwapOrder, mergeStale,
  shelfCreate, shelfRename, shelfDelete, shelfToggle, shelfAdd, shelfRemove, shelvesFor,
  selSet, selToggle, selExtend, selClear, openSelection, openEntry, readerPairUrl,
  shelfMenuItems, shelfEmptyMenuItems, pickerItems, shelfPickerItems, shelfActionItems, menuItems, renderShelf,
  margReadRec, margKey, margNormalise, margMerge, margLive, margPrune, margOrder, margSpanIds,
  margColourAt, margStale, margEmpty, margId, margColour, bookmarksFor, bookmarkLabel,
  bookmarkPickerItems, readerUrl,
};
</script>
</body>
