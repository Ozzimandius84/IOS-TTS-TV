    try { host.studioToggle(); } catch (err) { /* the host's problem, not the page's */ }
    return;
  }
  /* N -- A NOTE AT THE HIGHLIGHT (Osca, 1 Sep: "starts a note AT THE
   * HIGHLIGHT (the spoken word, or the arrow-moved word), never at the
   * cursor"). The distinction is the whole item: `lookup`'s D takes the word
   * under the POINTER, because looking a word up is something you do with
   * the mouse near it; writing a note is something you do about the place you
   * have READ TO, and the hand may be nowhere near the screen. So this asks
   * `highlightedWord()` -- the lit word, whether the clock lit it or an arrow
   * did -- and never `lookUpPointerWord`'s answer.
   *
   * The editor itself is the marginalia one, unchanged: it opens in the
   * margin beside the word, ⏎ saves and esc throws it away. */
  if (hk(e, "note")) {
    const wEl = highlightedWord(pane);
    if (!wEl || !wEl.dataset || !wEl.dataset.id) return;   // nothing lit: nothing to note
    e.preventDefault();
    const id = wEl.dataset.id;
    margOpenNoteEditor(pane, { from: id, to: id, word: wEl.dataset.text || "" }, null);
    return;
  }
  if (OW.on) {
    if (hk(e, "play")) { e.preventDefault(); owToggle(); return; }
    // ← → step ONE WORD on the stage, which is what one frame already was;
    // ↑ ↓ used to be the speed and are not bound here any more (Osca, 1 Sep:
    // one-word "loses its speed bindings from the arrows"). The stage has no
    // lines, so `line` has nothing to do in here and is left alone rather
    // than given a meaning it does not have.
    const step = hkWhich(e, "word");
    if (step >= 0) { e.preventDefault(); owNudge(step === 0 ? 1 : -1); return; }
  }
  if (hk(e, "play")) {
    e.preventDefault();
    if (pane.clock.paused) pane.clock.play(); else pane.clock.pause();
  } else if (hkWhich(e, "word") >= 0) {
    // ← → : the highlight, one word. Not the audio and not a sentence --
    // moving the lit word is what the note key, the look-up and the eye all
    // hang off, and stepping the clock instead moved four of them at once.
    e.preventDefault(); moveHighlight(pane, hkWhich(e, "word") === 0 ? 1 : -1, 0);
  } else if (hkWhich(e, "line") >= 0) {
    // ↑ ↓ : the highlight, one LINE -- the line the browser laid out, not a
    // sentence and not a paragraph (see `wordLines`).
    e.preventDefault(); moveHighlight(pane, 0, hkWhich(e, "line") === 0 ? 1 : -1);
  } else if (hk(e, "close")) {
    // One Escape, one thing, top sheet first: the dictionary panel is over
    // the text, the find bar is beside it. With a panel open in each column
    // it closes the focused pane's -- the one whose word you last tapped --
    // and leaves the other, so two Escapes close two panels in the order you
    // opened them rather than both at once.
    //
    // AND THE PICKS ARE THE BOTTOM OF THAT SHEET (studio-sidebar Part 2.1,
    // "Esc clears"). Last, because a panel and a find bar are both over the
    // text and the picks are in the margin; and only when nothing above it
    // took the key, which is what "one Escape, one thing" means. The phone's
    // sheet has its own listener further down and Esc closes it there, so
    // the picks stand back while it is open rather than both going at once.
    // `clearSelection` emits `select`, so the host is told by the same path a
    // click uses -- there is no second publisher of a target.
    const open = openLookupPanes();
    if (open.length) closePopup(open.indexOf(pane) !== -1 ? pane : open[0]);
    else if (find.open) findClose();
    else if (!SHEET_OPEN) {
      const sp = selectedPane() || pane;
      const sbp = sidebars[(sp && sp.side) || "left"] || sidebars.left;
      if (sbp && sbp.getSelection().length) sbp.clearSelection();
    }
  }
});

// --------------------------------------------------------------------- boot
function showFatalError(pane, e) {
  pane.els.status.innerHTML = `<div class="err">Couldn't load <code>${pane.bookPath}</code>: ${e.message}</div>`;
  console.error(e);
}

function updateUrl() {
  const params = {};
  if (panes.length === 2) {
    params.left = panes[0].bookPath;
    params.right = panes[1].bookPath;
  } else {
    params[panes[0].urlParam] = panes[0].bookPath;
  }
  if (panes[0].currentChapterId) params.ch = panes[0].currentChapterId;
  // The layout flag survives the rewrite: a chapter turn must not silently
  // hand a reader judging the A/B back to the old layout on the next reload.
  if (LAYOUT2) params.layout = "2";
  history.replaceState(null, "", `?${new URLSearchParams(params)}`);
}

// The Library's "\u2039 Reader" button needs a book to come back to, and the
// reader is the only place that knows one was actually opened -- a deep link,
// a host tab or a reload never goes through library.html. One key, wrapped:
// file:// and private browsing can throw on the mere access.
function rememberBook(bookPath) {
  const slug = String(bookPath || "").split("/").filter(Boolean).pop();
  if (!slug) return null;
  try { localStorage.setItem("ttstvLastBook", slug); } catch (e) { /* ignore */ }
  return slug;
}

async function initPane(pane) {
  pane.book = await readJSON(pane, "book.json");
  if (pane === panes[0]) rememberBook(pane.bookPath);
  applySync();   // the voice chip names a LANGUAGE, which only exists now
  pane.els.bookTitle.textContent = `${pane.book.title} — ${pane.book.author}`;
  paintBookBar();   // the title exists now
  renderChapterList(pane);
  // Where this book was left, when the URL does not say. The hash decides
  // only what is SAID, never where it lands: a re-parsed book still opens at
  // the chapter it was left in -- a chapter id survives a re-parse just as a
  // word id does -- and the status line owns up that the position predates
  // the current text rather than pretending it does not.
  const slug = paneSlug(pane);
  /* ONE GUARD, and it is the General row (`TTSTVSettings.DEFAULTS.resume`,
   * reader-sweep §4). `resume: false` means open at the start of the book,
   * so the remembered chapter and word are simply not offered to
   * `margOpenAt` -- a URL that names a chapter, and a bookmark, still win,
   * because those are what the reader was ASKED for. The record itself is
   * still written: turning the row back on finds the place it left. */
  const wantResume = settingsNow().resume !== false;
  const mem = (slug && wantResume) ? rememberedPosition(slug) : null;
  const remembered = (mem && pane.book.chapters.some(c => c.id === mem.chapter)) ? mem : null;
  // The marginalia record before the first chapter is drawn, so highlights
  // land with the words rather than a moment after them. localStorage is
  // synchronous; the mirror it also asks for is not, and repaints when it
  // answers.
  margLoad(pane);
  margWirePane(pane);
  // "Open at bookmark..." from the Library (?bm=<id>). The bookmark decides
  // the chapter AND the word; everything else is unchanged.
  const wantBm = (pane === panes[0]) ? requestedBookmark : null;
  const bm = wantBm ? margLive(pane.marg, "bookmarks").find(b => b.id === wantBm) : null;
  const bmChapter = bm ? margChapterOfWord(pane.book, bm.wordId) : null;
  const opening = margOpenAt({
    bookmarkChapter: (bmChapter && pane.book.chapters.some(c => c.id === bmChapter)) ? bmChapter : null,
    bookmarkWordId: bm ? bm.wordId : null,
    requestedChapter: (requestedChapter && pane.book.chapters.some(c => c.id === requestedChapter)) ? requestedChapter : null,
    rememberedChapter: remembered ? remembered.chapter : null,
    firstChapter: pane.book.chapters[0].id,
  });
  const startChapter = opening.chapter;
  renderChapter(pane, startChapter);
  if (opening.why === "bookmark" && opening.wordId) {
    // after the paint, so the word has a box to scroll to
    setTimeout(() => margScrollToWord(pane, opening.wordId), 0);
  }
  const hashing = ensureBookHash(pane);
  if (!requestedChapter && remembered && hashing) {
    hashing.then((h) => {
      if (!h || !h.hash || !remembered.hash) return;
      if (h.hash !== remembered.hash || h.kind !== remembered.hashKind) {
        setStatus(pane, "memory", "this position is from an older version of the book");
      }
    });
  }
  // The witness comparison cannot be made until the hash exists, and it is
  // what decides whether a mark is drawn as "made against an older parse".
  if (hashing) hashing.then(() => margPaint(pane));
}

function bootPane(pane) {
  pane.ready = new Promise(resolve => { pane._resolveReady = resolve; });
  initPane(pane)
    .then(() => pane._resolveReady())
    .catch((e) => {
      // file:// is the one place a failed first read means "blocked": offer
      // the folder picker. Anywhere else it means there is no book here.
      if (pane.fileMap) showFatalError(pane, e);
      else if (location.protocol === "file:") showFolderPicker(pane);
      else showNoBook(pane, e);
    });
  return pane.ready;
}

// ------------------------------------------------------------- the sidebar
// This book's chapters (panes[0]'s book), via reader/sidebar.js -- the same
// component studio embeds by URL. The library rail that lived here moved to
// library.html. A plain click on a row opens that unit here; the mic and the
// selection feed the push path (step 3). Nothing in this block fetches.
const IS_MAC = /Mac|iPhone|iPad|iPod/.test(navigator.platform || "");

/* TWO LISTS OR ONE, for the same reason there are two bars or one (Osca,
 * 30 Aug: "when I have two books, I need two side bars, one for each book,
 * when it's unsynced ... If it's synced I only need one sidebar, and both
 * should follow, when I click on a chapter").
 *
 * Keyed by pane side, so nothing here has to know which is which. The right
 * list is hidden rather than destroyed when the books are joined: it is the
 * same book's chapters either way, and rebuilding a list to say the same
 * thing is work for no one. */
const sidebars = { left: null, right: null };
const SB_KEY = { left: "readerSidebarHidden", right: "readerSidebarHiddenRight" };
/* THE INITIAL STATE IS THE SETTING; THIS DEVICE'S ANSWER OVERRIDES IT.
 * `TTSTVSettings.DEFAULTS.sidebar` (reader-sweep §4) says how the chapter
 * list should START -- a preference, and it travels with the settings store.
 * `SB_KEY` says how it was left ON THIS DEVICE, per side, and that is not a
 * preference; the moment anyone toggles it here, the key exists and wins.
 * So: read the setting first, then let a stored answer replace it. Absent
 * storage, or a device that has never been told, gets the setting. */
const sidebarHidden = { left: false, right: false };
for (const side of ["left", "right"]) {
  sidebarHidden[side] = settingsNow().sidebar === "hidden";
  try {
    const stored = localStorage.getItem(SB_KEY[side]);
    if (stored !== null) sidebarHidden[side] = stored === "1";
  } catch (e) { /* file:// or storage disabled -- the setting stands */ }
}
function sidebarEl(side) {
  return document.getElementById(side === "right" ? "sidebarRight" : "sidebar");
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}

/* A row was clicked. SYNCED, one list turns BOTH books -- that is what
 * synced means, and a chapter the other book does not have is simply not
 * turned rather than an error. Split, a list turns its own book only. */
function openChapterFrom(pane, id) {
  const targets = (SYNCED && panes.length === 2) ? panes : [pane];
  for (const p of targets) {
    if (!p.book || p.currentChapterId === id) continue;
    if (!p.book.chapters.some((c) => c.id === id)) continue;
    renderChapter(p, id);
  }
  if (isPhone()) setSheet(false);   // a tap on a row on the phone: show the unit, drop the sheet
}

/* ONE list, for ONE pane, when THAT pane is ready -- not all of them when the
 * first is. Mounting both off `panes[0].ready` would either build the second
 * list against a book that has not loaded, or make the first wait for the
 * second; and mounting from `initPane` (which is where the book arrives)
 * started the /state poll before the chapter had been fetched, which is a
 * request-order change the load harness reads as a regression, correctly:
 * the reader should ask for what it is about to paint before it asks a
 * server what else exists. */
function mountSidebarFor(pane) {
  if (typeof TTSTVSidebar === "undefined") return;
  {
    const el = sidebarEl(pane.side);
    if (!el || !pane.book) return;
    if (sidebars[pane.side]) sidebars[pane.side].destroy();
    // `mic: false`: the Push button is gone from the reading pane (Osca,
    // 30 Aug -- "pushing is an action on a book, not a control in the reading
    // pane"). The push path itself is untouched and now hangs off the Actions
    // popover and ⌘⇧M; sidebar.js keeps the option because studio's pair
    // sidebar has always passed it.
    /* `picks: true` -- THIS LIST IS A PICK LIST (Osca, 1 Sep: "give me too
     * the option to ⇧-click chapters in the reader's left sidebar, and
     * studio treats those as selected for rendering";
     * PROMPTS/studio-sidebar.md Part 2.1). It buys two things and no third:
     * a plain click on a row clears the picks instead of leaving that row
     * picked -- so "no picks" is a state the reader can actually be in, and
     * studio's card can say the chapter being read -- and the container
     * carries `sb-picks`, which is what draws the picked row as the
     * picture's inset block. sidebar.js says why studio's own rail does not
     * pass it. */
    /* `current` IS PART OF THE GESTURE NOW and not only the bold row: with
     * nothing picked, a shift-click reaches back to the chapter being read
     * (OSCA-1SEP-LIST C3 -- what cmd-click used to be for). It is passed
     * here at mount and kept live by `setCurrent` on every navigation, which
     * is the same value `?chapter=` and the target publish already use.
     *
     * NO `mac` ANY MORE. It only ever chose between ⌘ and Ctrl for the
     * cmd-click, and there is no cmd-click: one modifier, the same key on
     * every machine, so the component has no opinion about the machine.
     * `IS_MAC` stays for the hotkeys, which really are different there. */
    sidebars[pane.side] = TTSTVSidebar.create(el, {
      book: pane.book, current: pane.currentChapterId, mic: false,
      picks: true,
    });
    sidebars[pane.side].on("open", (id) => openChapterFrom(pane, id));
    sidebars[pane.side].on("push", (units, mode) => pushUnits(units, mode));
    // THE PICKS, TO THE HOST. `select` fires only when the set actually
    // changed -- ⇧-click, the plain click that clears, Esc, and a `setBook`
    // that pruned a pick -- which makes it the one publisher of a pick and
    // this the one line that wires it.
    sidebars[pane.side].on("select", () => pushHostTarget());
    /* THE SEAM FRANK NEEDS, and the whole of it: the sidebar's container, and
     * a way to open a chapter by id from outside this closure. `panes`,
     * `openChapterFrom` and `sidebarEl` are all locals here, so without these
     * three lines the Column would have to reach into the renderer -- which
     * is the thing this port set out not to do. Nothing else is exposed and
     * the old sidebar goes on working when Frank is off. */
    pane.els.sidebarBox = el;
    pane.openChapter = (id) => openChapterFrom(pane, id);
    window.TTSTVPanes = panes;
  }
  applySidebars();
  // the list now exists, so the target can name its picks (none yet) beside
  // the chapter this pane opened at
  pushHostTarget();
  loadLocalStates(pane);   // the dots, from the book's own state.json
  // studio's poll belongs to the book the page is *about*, which is pane 0's
  if (pane === panes[0]) startStatePolling();
}

/* THE DOTS DO NOT NEED STUDIO (Osca, 1 Sep, off the live app with Poems
 * open: the contents list "shows nothing even for chapters with audio").
 *
 * Two things were wrong and this is the second of them. The first is in
 * `sidebar.js` -- `labelClass` still only knew the words `unit_label` used
 * BEFORE its 31 Aug rewrite, so every row studio labelled `rendered ·
 * aligned` came back `none`. The second is this: the only source of per-unit
 * state the reader ever had was `GET /state`, which exists only when studio
 * is the origin. Open the same book in the built app, in a bundle or on the
 * phone and there is no source at all, so there was no mark on any row --
 * including the four chapters of Poems with finished audio on disk.
 *
 * `books/<slug>/state.json` is the file studio builds `/state` out of, it
 * sits beside `book.json`, and the reader already reads that folder for
 * `timings/` and `audio/`. So it reads this too, once, through the same
 * `readJSON` (fetch, or the picked-folder `fileMap` -- a bundle carries it).
 * It is the SAME RULE as the shelf and studio's rail because it is the same
 * function over the same cells: `sidebar.js`'s `statesFromLocal`.
 *
 * /state still wins when it answers -- it is the same file plus the running
 * job -- so this never fights the poll; it fills the four seconds before the
 * first answer, and it is the whole answer everywhere else. A book with no
 * `state.json` beside it (never pushed to studio) says nothing, which is
 * what no dot already means. */
async function loadLocalStates(pane) {
  const sb = sidebars[pane.side];
  if (!sb || typeof TTSTVSidebar === "undefined" || !TTSTVSidebar.statesFromLocal) return null;
  let local = null;
  try { local = await readJSON(pane, "state.json"); } catch (e) { return null; }
  // a /state answer landed while this was in flight: that one is newer news
  if (pane === panes[0] && statePoll.book) return null;
  if (sidebars[pane.side] !== sb) return null;   // the list was rebuilt under us
  const states = TTSTVSidebar.statesFromLocal(local, paneSlug(pane));
  sb.setStates(states);
  return states;
}

/* Which lists exist on screen, and which of those are open.
 *
 * TWO BOOKS, TWO SIDEBARS, ONE PER EDGE (Osca, 1 Sep: "the LEFT pane's
 * contents sidebar opens on the LEFT edge, the RIGHT pane's on the RIGHT
 * edge -- never both on the left ... each pane's sidebar lists that pane's
 * book only"). The condition used to be `panes.length === 2 && !SYNCED`: a
 * synced pair had ONE list, the left one, on the reasoning that synced means
 * one book and a second copy would be a second answer. It is not a second
 * copy -- it is the OTHER BOOK's contents, and a pair of a poem and its
 * translation is exactly the case where you want both tables at once.
 * Turning is unchanged and is where "synced" still lives: `openChapterFrom`
 * turns both books from either list while they are joined. */
function applySidebars() {
  const showRight = panes.length === 2;
  const right = sidebarEl("right");
  if (right) {
    right.hidden = !showRight;
    right.classList.toggle("hidden", sidebarHidden.right);
  }
  sidebarEl("left").classList.toggle("hidden", sidebarHidden.left);
  paintSidebarBtn();
}

// ------------------------------------------------------- the phone frame
// PROMPTS/reader-mobile.md step 1. The same two conditions the CSS block
// uses, verbatim -- narrow *or* short, so a phone in landscape (844x390) is
// a phone here too. On a phone the sidebar is a sheet (open/closed per
// visit, never the desktop's remembered hidden flag), a pair shows one pane
// at a time with a header toggle, and a one-finger horizontal swipe on the
// text turns the unit (the trackpad's wheel swipe never fires on a touch
// screen). matchMedia takes the same comma-separated list as @media.
const PHONE_QUERY = "(max-width: 640px), (max-height: 500px)";
function isPhone() {
  return !!(window.matchMedia && window.matchMedia(PHONE_QUERY).matches);
}

let SHEET_OPEN = false;
function setSheet(open) {
  SHEET_OPEN = !!open;
  document.getElementById("sidebar").classList.toggle("sheet-open", SHEET_OPEN);
  document.getElementById("sidebarScrim").classList.toggle("on", SHEET_OPEN);
  paintSidebarBtn();
}

/* THE BUTTON SAYS WHAT THE SIDEBAR IS DOING -- both ways round. Osca, 30 Aug:
 * "The open sidebar button at the top left is not working anymore, only the
 * hotkey ','." The button and the key are ONE path and always were: both call
 * `toggleSidebar()`, so there is no second repair to make. What was missing is
 * this -- `aria-expanded` was written by `setSheet` and by nothing else, so on
 * a desktop the button claimed "false" forever however many times it had been
 * pressed, and any check of the button's own state (a test's, a screen
 * reader's) read a button that never moved. */
function paintSidebarBtn() {
  const btn = document.getElementById("sidebarToggle");
  if (!btn) return null;
  // WHICH LIST, asked of the DOM and not of `panes`. This runs once at the top
  // level, before `let panes` is initialised, and a `let` in its temporal dead
  // zone throws on any read -- `typeof` included, so there is no guard to
  // write. The right-hand list is shown exactly when there are two panes and
  // they are split, which is the same question, and `#sidebarRight` starts
  // `hidden` in the markup. (Caught by browser/pane_sync.py, whose profile
  // starts split: with `SYNCED` true the `||` short-circuited and nothing ever
  // read `panes`, so every other driver was green.)
  const right = document.getElementById("sidebarRight");
  // "is there a second list at all", asked of the DOM and not of `panes` --
  // this runs once at the top level before `let panes` is initialised, and a
  // `let` in its temporal dead zone throws on any read, `typeof` included.
  // `#sidebarRight` starts `hidden` in the markup and `applySidebars` is the
  // only thing that unhides it, so this is the same question one step later.
  const two = !!(right && !right.hidden);
  // `selectedPane()` rather than `focusedPane` -- the same answer, asked of
  // the one function the watermarks and the promoted column also ask, so
  // they cannot name different books
  const side = two ? (sidebarSide() || "left") : "left";
  const open = isPhone() ? SHEET_OPEN : !sidebarHidden[side];
  btn.setAttribute("aria-expanded", open ? "true" : "false");
  btn.title = (open ? "Hide chapters" : "Chapters") + " (,)";
  btn.setAttribute("aria-label", open ? "Hide chapters" : "Show chapters");
  pushHostContext();   // and the strip's contents tool lights with it
  paintWatermark();    // and the mark is there exactly when the list is not
  return open;
}

/* The same answer with no painting and no recursion -- `hostContextModel()`
 * asks this, where asking `paintSidebarBtn()` would have it push a context
 * while it was still building one. */
function paintSidebarBtnState(side) {
  if (side !== "left" && side !== "right") side = null;
  const right = document.getElementById("sidebarRight");
  const two = !!(right && !right.hidden);
  if (!side) side = two ? (sidebarSide() || "left") : "left";
  if (isPhone()) return SHEET_OPEN;
  // a list that is not on screen at all is not "open"
  if (side === "right" && !two) return false;
  return !sidebarHidden[side];
}

/* The selected pane's side, guarded: these two run at the top level before
 * `let panes` exists and a `let` in its temporal dead zone throws on any
 * read, `typeof` included. */
function sidebarSide() {
  try { const p = selectedPane(); return p ? p.side : null; } catch (e) { return null; }
}

/* `,` opens the list for the book you are IN -- and `\` is what decides
 * which that is. Synced there is only one list, so the question does not
 * arise and it is always the left one. On a phone it is the sheet, which is
 * the left list and the only list. */
function toggleSidebar(side) {
  if (isPhone()) { setSheet(!SHEET_OPEN); return; }
  if (side !== "left" && side !== "right") side = null;
  // THE SELECTED PANE'S OWN LIST, ON ITS OWN SIDE (Osca, 1 Sep). It used to
  // be forced to "left" whenever the pair was SYNCED, which is how a synced
  // pair ended up with one list on one edge and no way to reach the other
  // book's contents at all. Synced or split, the pane key chooses the pane
  // and this opens that pane's list against that pane's edge; both may be
  // open at once, which is the whole point of a pair.
  if (!side) side = panes.length === 2 ? (sidebarSide() || "left") : "left";
  if (side === "right" && panes.length !== 2) side = "left";
  sidebarHidden[side] = !sidebarHidden[side];
  try { localStorage.setItem(SB_KEY[side], sidebarHidden[side] ? "1" : "0"); } catch (e) { /* ignore */ }
  applySidebars();
}
sidebarEl("left").classList.toggle("hidden", sidebarHidden.left);
// ONE handler, both entry points: this and the `,` key above call the same
// function with no argument. Never `addEventListener("click", toggleSidebar)`
// -- that hands the click event in as `side`, which is the one shape that
// produces exactly the symptom Osca reported (the key works, the button does
// not); `toggleSidebar` also refuses anything that is not "left" or "right",
// so both halves of that trap are shut.
document.getElementById("sidebarToggle").addEventListener("click", () => toggleSidebar());
paintSidebarBtn();
document.getElementById("sidebarScrim").addEventListener("click", () => setSheet(false));

// the sidebar sheet's half of step 3: dragged anywhere on it, closed leftwards
(() => {
  const sb = document.getElementById("sidebar");
  makeSheetDrag({
    handle: sb, sheet: sb, axis: "x", sign: -1,
    extent: () => sb.getBoundingClientRect().width,
    canStart: () => SHEET_OPEN,
    close: () => setSheet(false),
  });
})();

// Which pane is on screen when the phone shows one. The label is the book's
// language once it has loaded (EN · LA), the side until then. Desktop never
// displays the switch (CSS), and `.active` has no effect there.
let activeSide = "left";
function paneLabel(pane) {
  return (pane.book && pane.book.lang) ? String(pane.book.lang).toUpperCase() : pane.side;
}

// Both labels at once, because what one says depends on the other. Languages
// while they differ -- EN / LA, which is the whole point of the switch. When
// they are the same (two English books: the poems pair) "EN / EN" names
// nothing on either button, so each takes its book's short title instead. Two
// books whose short titles are also the same -- the same book opened twice --
// fall back to the sides, which is what the switch says before anything has
// loaded. `kind` is for the CSS: a language is a two-letter code and wants
// uppercase, a title does not.
function paneLabels(all) {
  const labels = all.map(p => paneLabel(p));
  if (all.length !== 2) return { kind: "lang", labels };
  const langs = all.map(p => (p.book && p.book.lang) ? String(p.book.lang).toLowerCase() : null);
  if (!langs[0] || langs[0] !== langs[1]) return { kind: "lang", labels };
  const titles = all.map(p => shortTitle(p.book, p.side));
  if (titles[0].toLowerCase() === titles[1].toLowerCase()) return { kind: "side", labels: all.map(p => p.side) };
  return { kind: "title", labels: titles };
}
function setActivePane(side) {
  if (!panes.some(p => p.side === side)) return;
  activeSide = side;
  for (const p of panes) p.els.root.classList.toggle("active", p.side === side);
  for (const b of document.querySelectorAll("#paneSwitch button")) {
    b.setAttribute("aria-pressed", b.dataset.side === side ? "true" : "false");
  }
  // Switching columns CLOSES NEITHER PANEL -- it only decides which is
  // painted. The column you come back to still has the word you left on it.
  repositionPopups();
}
function renderPaneSwitch() {
  const el = document.getElementById("paneSwitch");
  el.innerHTML = "";
  el.dataset.count = String(panes.length);
  if (panes.length < 2) { delete el.dataset.labels; delete document.querySelector("header").dataset.paneLabels; return; }
  const { kind, labels } = paneLabels(panes);
  el.dataset.labels = kind;
  document.querySelector("header").dataset.paneLabels = kind;   // the phone's h1 reads this
  panes.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.side = p.side;
    b.textContent = labels[i];
    b.setAttribute("aria-label", "Show the " + p.side + " book");
    if (p.book && p.book.title) b.setAttribute("title", p.book.title);
    b.addEventListener("click", () => setActivePane(p.side));
    el.appendChild(b);
  });
  setActivePane(activeSide);
}

// One-finger horizontal swipe on the text = previous / next unit, the same
// numbers as the trackpad gesture (makeSwipe: 80 px, twice as far sideways
// as up or down). Measured at touchend so a vertical scroll never counts.
function makeTouchSwipe(swipeLogic) {
  let start = null;
  return {
    start(x, y, t) { start = { x, y, t }; },
    end(x, y, t) {
      if (!start) return null;
      const dx = x - start.x, dy = y - start.y;
      start = null;
      // macOS reports a leftward trackpad swipe as +deltaX; a finger moving
      // left is a negative dx, so flip to keep "left = forward = next".
      return swipeLogic.feed(-dx, dy, t);
    },
  };
}

// In the app the host owns the Library tab (READER_FIRST.md: "the only tab
// that can't close"); in a plain browser the link just navigates. The header
// link itself is gone (30 Aug), so this only binds where something else --
// a bundle, an older shell -- still puts one on the page.
const libraryLinkEl = document.getElementById("libraryLink");
if (libraryLinkEl) libraryLinkEl.addEventListener("click", (e) => {
  const host = window.TTSTVHost;
  if (host && typeof host.openLibrary === "function") { e.preventDefault(); host.openLibrary(); }
});

// ------------------------------------------------------- unit navigation
// The unit order is the book's chapter order (core/README.md "Reader-first":
// a unit is a chapter id; sections group for display only).
function unitNeighbour(order, current, delta) {
  if (!order.length) return null;
  const i = order.indexOf(current);
  if (i < 0) return order[0];
  return order[Math.max(0, Math.min(order.length - 1, i + delta))];
}

function gotoUnit(delta) {
  const pane = panes[0];
  if (!pane.book) return;
  const next = unitNeighbour(pane.book.chapters.map(c => c.id), pane.currentChapterId, delta);
  if (next && next !== pane.currentChapterId) renderChapter(pane, next);
}

// The two-finger horizontal swipe (READER_FIRST.md "Move": Safari's
// direction and threshold). A trackpad swipe arrives as a run of wheel
// events; **one gesture turns exactly one unit, back or forward, never
// more** -- Safari's own rule for its back/forward swipe, and the thing
// this did not do before (PROMPTS/reader-app-fixes.md step 4: a single
// flick could turn several poems, because it behaved like a scroll).
//
// The mechanism is a *latch*, not a timer. The old code unlocked again
// `lockMs` (400 ms) after a turn while the same gesture was still arriving,
// and macOS's momentum phase outlives that by a second or more -- every
// momentum event both refreshed `last` (so the gesture never ended) and
// re-accumulated `dx` (so the threshold was crossed again). Now the first
// crossing latches, and only the *end of the gesture* unlatches: a gap of
// `gapMs` with no wheel event at all. Momentum events keep arriving into a
// latched gesture and are counted for nothing, exactly as they should be.
//
// The numbers, all tunable from the call site:
//   gapMs 150   -- wheel events closer than this belong to one gesture, so
//                  a gesture has ended once 150 ms pass with none (the
//                  quiet after the last momentum event)
//   threshold 80 -- cumulative |deltaX| in CSS px before it counts (Safari's
//                  own back/forward swipe needs roughly a third of the
//                  viewport; 80 px is enough to be deliberate and small
//                  enough to feel like Safari's first response)
//   dominance 2  -- |sum dx| must exceed 2 x |sum dy| so a diagonal scroll
//                  never turns a page
// Direction: on macOS a leftward two-finger swipe reports positive deltaX
// (content moves left), which in Safari means "forward" -> next unit.
function makeSwipe(opts) {
  opts = Object.assign({ gapMs: 150, threshold: 80, dominance: 2 }, opts || {});
  const st = { dx: 0, dy: 0, last: -Infinity, latched: false };
  return {
    feed(dx, dy, t) {
      if (t - st.last > opts.gapMs) { st.dx = 0; st.dy = 0; st.latched = false; }  // a new gesture
      st.last = t;
      if (st.latched) return null;              // this gesture has had its turn
      st.dx += dx; st.dy += dy;
      if (Math.abs(st.dx) < opts.threshold) return null;
      if (Math.abs(st.dx) < opts.dominance * Math.abs(st.dy)) return null;
      const dir = st.dx > 0 ? "next" : "prev";
      st.dx = 0; st.dy = 0; st.latched = true;
      return dir;
    },
    // A finger on the glass is its own gesture boundary -- touchstart says so
    // outright rather than waiting for the wheel stream's quiet.
    begin(t) { st.dx = 0; st.dy = 0; st.latched = false; st.last = t; },
    latched() { return st.latched; },
    horizontal(dx, dy) { return Math.abs(dx) > Math.abs(dy); },
  };
}

const swipe = makeSwipe();
document.getElementById("panes").addEventListener("wheel", (e) => {
  // passive:false so a clearly horizontal run can be claimed here rather
  // than becoming Safari's own history swipe on a page with nothing to
  // scroll sideways.
  const dx = e.deltaMode === 0 ? e.deltaX : e.deltaX * 40;
  const dy = e.deltaMode === 0 ? e.deltaY : e.deltaY * 40;
  if (swipe.horizontal(dx, dy)) e.preventDefault();
  const dir = swipe.feed(dx, dy, performance.now());
  if (dir === "next") gotoUnit(1);
  else if (dir === "prev") gotoUnit(-1);
}, { passive: false });

const touchSwipe = makeTouchSwipe(swipe);
document.getElementById("panes").addEventListener("touchstart", (e) => {
  if (e.touches.length !== 1) return;
  swipe.begin(performance.now());   // a finger down ends whatever came before
  touchSwipe.start(e.touches[0].clientX, e.touches[0].clientY, performance.now());
}, { passive: true });
document.getElementById("panes").addEventListener("touchend", (e) => {
  if (e.changedTouches.length !== 1) return;
  const dir = touchSwipe.end(e.changedTouches[0].clientX, e.changedTouches[0].clientY, performance.now());
  if (dir === "next") gotoUnit(1);
  else if (dir === "prev") gotoUnit(-1);
}, { passive: true });

// ------------------------------------------------------- /state polling
// Served by studio (127.0.0.1) the reader asks GET /state every few seconds
// for this book: the sidebar's per-unit labels, and the audio swap-in --
// when the unit on screen turns voiced + aligned, its timings and audio load
// in place, no reload (READER_FIRST.md: "its audio appears in every reader
// tab showing it"). Inside a bundle or over file:// there is no /state; the
// first failed fetch stops the loop so the reader keeps working there.
const STATE_POLL_MS = 4000;
let statePoll = { timer: null, stopped: false, book: null, job: null };
const pushedUnits = new Set();   // locally pushed, until /state shows them moving

function stateUrl(path) {
  // studio serves the repo root, so /state is origin-relative; only http(s)
  // origins can have one at all.
  if (!/^https?:$/.test(location.protocol)) return null;
  return location.origin + path;
}

function unitStatesFor(stateBook, job) {
  const pane = panes[0];
  return TTSTVSidebar.statesFrom(stateBook, job, pushedUnits, {
    needsVoice: !bookHasVoice(stateBook),
  });
}

function bookHasVoice(stateBook) {
  return !!(stateBook && stateBook.voice);
}

// True when a unit's /state row now proves finished audio and real timings
// (core/README.md: voiced = masters/<slug>/<cid>.wav; aligned = timings/<cid>.json)
// and this pane is still on a placeholder (a VirtualClock, or no timings).
function needsSwapIn(pane, row) {
  if (!row || !row.state) return false;
  if (row.state.speak !== "ok" || row.state.align !== "ok") return false;
  if (pane._swappedFor === row.id) return false;   // one attempt per unit per visit, never a 4 s reload loop
  return (pane.clock instanceof VirtualClock) || !pane.currentTimings || !pane.currentTimings.sentences.length;
}

async function swapIn(pane) {
  const chapter = pane.book.chapters.find(c => c.id === pane.currentChapterId);
  if (!chapter) return;
  pane._swappedFor = chapter.id;
  const wasPlaying = !pane.clock.paused;
  const t = pane.clock.currentTime;
  pane.clock.pause();
  await Promise.all([loadTimings(pane, chapter.id), loadAudio(pane, chapter)]);
  pane.clock.currentTime = t;
  tick(pane);
  if (wasPlaying) pane.clock.play();
  setStatus(pane, "swap", "audio arrived");
  setTimeout(() => setStatus(pane, "swap", null), 4000);
}

// TWO ROUTES, BECAUSE THIS PANE WANTS ONE BOOK. `/state` used to carry every
// chapter of every book on the shelf and the reader threw all but one away --
// four seconds apart, for ever. `GET /book?slug=` is that one book's rows
// (studio/bookinfo.py: shelf_of names the split); `/state` is still asked for
// `job`, which is the whole library's and not this book's.
async function pollState() {
  const url = stateUrl("/state");
  const pane = panes[0];
  if (!url || !pane.book || statePoll.stopped) return;
  try {
    const bookUrl = stateUrl("/book?slug=" + encodeURIComponent(pane.book.id));
    const [res, bres] = await Promise.all([
      fetch(url, { cache: "no-store" }),
      bookUrl ? fetch(bookUrl, { cache: "no-store" }) : Promise.resolve(null),
    ]);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const st = await res.json();
    // A 404 here is a book studio does not have, not a studio that is not
    // there -- one missing book must never stop the poll.
    const stateBook = bres && bres.ok ? await bres.json() : null;
    statePoll.book = stateBook; statePoll.job = st.job || null;
    const sb = sidebars[pane.side];    // this pane's own list, not "the" list
    if (stateBook && sb) {
      // a pushed unit that /state now shows running or done is no longer "queued" locally
      for (const row of stateBook.chapters || []) {
        if (pushedUnits.has(row.id) && (row.state.speak === "ok" || Object.values(row.state).includes("running"))) pushedUnits.delete(row.id);
      }
      sb.setStates(unitStatesFor(stateBook, statePoll.job));
      const row = (stateBook.chapters || []).find(r => r.id === pane.currentChapterId);
      if (needsSwapIn(pane, row) && !pane._swapping) {
        pane._swapping = true;
        swapIn(pane).finally(() => { pane._swapping = false; });
      }
    }
    if (window.TTSTVContext) TTSTVContext.observe({ studioLive: true });
    statePoll.timer = setTimeout(pollState, STATE_POLL_MS);
  } catch (e) {
    // no studio behind this origin (a bundle, file://, a static host): stop
    // quietly -- the reader is complete without /state.
    statePoll.stopped = true;
    if (window.TTSTVContext) TTSTVContext.observe({ studioLive: false });
  }
}

function startStatePolling() {
  if (statePoll.timer || statePoll.stopped) return;
  pollState();
}

// ------------------------------------------------------------------ the mic
// READER_FIRST.md "The microphone": click = push the selection to studio's
// queue with this book's settings (mode "auto"); alt-click or cmd-shift-M =
// the bench (mode "manual": a Studio tab for this book with the selection
// preloaded). The first push for any book is always the bench, whichever
// was pressed -- "has a voice" is render.json's `voice` key
// (core/README.md "render.json is the book's settings"), read from /state's
// book entry when studio is behind this origin, else from the book's own
// render.json. Studio's routes (PROMPTS/rf-studio.md step 1): POST /push
// {slug, units[], mode} -> auto queues; manual answers {url} for the bench;
// auto without a voice answers "needs a voice" and is treated as manual.

function studioUrl(slug, units) {
  return `/?${new URLSearchParams({ slug, units: units.join(",") })}`;
}

// The mode asked for vs the mode taken. `forced` is the one line the
// sidebar shows when a first push turns into the bench.
function decidePush(mode, hasVoice) {
  if (mode === "manual") return { mode: "manual", forced: false };
  return hasVoice ? { mode: "auto", forced: false } : { mode: "manual", forced: true };
}

async function readerHasVoice(pane) {
  if (statePoll.book) return bookHasVoice(statePoll.book);
  try { return !!(await readJSON(pane, "render.json")).voice; }
  catch (e) { return false; }
}

function openStudio(slug, units, url) {
  const host = window.TTSTVHost;
  if (host && typeof host.openStudio === "function") { host.openStudio(slug, units); return "host"; }
  window.open(url || studioUrl(slug, units), "_blank");
  return "tab";
}

/* Which chapter list a push reports back to: the focused book's, the same one
 * `actionFacts` asked for the selection. Resolved at call time rather than
 * captured, because `\` may have moved between the two. */
function pushSidebar() {
  return sidebars[(focusedPane && focusedPane.side) || "left"] || sidebars.left
    || { setStates() {}, note() {} };
}

async function pushUnits(units, mode) {
  const pane = panes[0];
  if (!pane.book || !units.length) return null;
  const slug = pane.book.id;
  const decision = decidePush(mode, await readerHasVoice(pane));
  if (decision.forced) {
    pushSidebar().note("First push for this book goes to the bench: pick the voice there once, and later pushes are automatic.");
  }
  const url = stateUrl("/push");
  let reply = null;
  if (url) {
    try {
      const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                                     body: JSON.stringify({ slug, units, mode: decision.mode }) });
      const body = await res.json().catch(() => ({}));
      reply = res.ok ? body : { error: body.error || ("HTTP " + res.status), status: res.status };
    } catch (e) {
      reply = { error: "no studio behind this origin" };
    }
  } else {
    reply = { error: "no studio behind this origin" };
  }

  let taken = decision.mode;
  if (taken === "auto") {
    if (reply && !reply.error) {
      for (const u of units) pushedUnits.add(u);
      if (statePoll.book) pushSidebar().setStates(unitStatesFor(statePoll.book, statePoll.job));
      else pushSidebar().setStates(Object.fromEntries(units.map(u => [u, { label: "queued", cls: "queued" }])));
      pushSidebar().note(`Pushed ${units.length} unit${units.length === 1 ? "" : "s"} to studio.`);
    } else if (reply && (reply.needs_voice || /needs a voice/i.test(String(reply.error || "")))) {
      taken = "manual";
      pushSidebar().note("Studio has no voice for this book yet: taking you to the bench.");
    } else {
      pushSidebar().note(`Studio didn't take the push: ${reply && reply.error ? reply.error : "unknown error"}.`);
    }
  }
  let opened = null;
  if (taken === "manual") opened = openStudio(slug, units, reply && (reply.url || reply.studio_url));
  return { slug, units, asked: mode, mode: taken, forced: decision.forced, reply, opened };
}

// ------------------------------------------------- Actions & Settings (⌘. ⌘,)
// Osca, 30 Aug (READER_FIRST.md "Osca's app decisions"): "Neither Actions nor
// Settings opens a tab. Both are a popover: a small floating panel, rounded
// corners, no window chrome, the way a Mac app behaves." Settings used to open
// reader/settings.html as a tab (f6cd316); it does not any more. Both toggle:
// ⌘. and ⌘, close what they opened, as do Esc and a click outside
// (reader/popover.js owns those three).
//
// **Actions is where pushing lives.** The sidebar's Push button is gone --
// "pushing is an action on a book, not a control in the reading pane" -- and
// the three things you can do to the book in this tab are here instead. Each
// is disabled *with a reason*, never silently: a grey row that does not say
// why is a bug report waiting to be filed.
//
//   Open in Studio  the bench for this book (the host's tab in the app, a
//                   new tab in a browser).
//   Push to Studio  what the microphone did: the selection, or the unit on
//                   screen, into studio's queue (POST /push, decidePush's
//                   own auto/manual rule unchanged).
//   Push to Phone   studio zips this book's exported bundle into the folder
//                   Osca AirDrops from (POST /phone-send). **No book ever
//                   goes into the IOS-TTS-TV clone** -- that repo is public,
//                   which is what makes Pages free, and publish_shell.py
//                   refuses a book.json for the same reason. The Library's
//                   phone shelf is the same action with a record kept.
//
// The doors the app's menu bar opens (a request to desktop/, reader/README.md
// §6): window.TTSTVActions.toggle(), the same shape window.TTSTVFind already
// uses. `.open()` is there too and opens; the menu wants the toggle, because
// Osca's rule is that the key closes it.
//
// **Settings is no longer among them.** It was a popover here for one day; on
// the evening of 30 August it became a window (PROMPTS/app-ui-fixes-2.md item
// 2), and its door -- `TTSTVSettings.openWindow()`, aliased as `open` and
// `toggle` so the Mac menu item keeps working -- lives in settings.js, which
// every page loads. There is nothing left for this page to mount.
let actionsPop = null;

function readerContext() {
  if (window.TTSTVContext) return TTSTVContext.read();
  // a bundle exported before context.js existed: the app injects a host, and
  // a live /state is the only other bench there has ever been
  const bench = !!window.TTSTVHost || !!statePoll.book;
  return { app: !!window.TTSTVHost, bench, device: false, kind: "static",
           benchReason: bench ? null : "no studio behind this page" };
}

// Pure enough to test: the three rows and, for each, the one sentence that
// says why it cannot act. Order is Osca's.
function actionItems(facts) {
  const noBook = facts.book ? null : "no book open in this tab";
  const noBench = facts.bench ? null : (facts.benchReason || "no studio behind this page");
  return [
    { id: "studio", label: "Open in Studio", why: noBook || noBench },
    { id: "push", label: "Push to Studio",
      why: noBook || noBench || (facts.units ? null : "nothing selected, and no unit on screen") },
    { id: "phone", label: "Push to Phone", why: noBook || noBench },
  ];
}

function actionFacts() {
  const pane = panes && panes[0];
  const ctx = readerContext();
  // The Actions panel pushes UNITS, and units are a selection made in a
  // chapter list -- of which there may now be two. It is the focused book's
  // list that means anything here (split), and there is only one to ask
  // (synced), which `toggleSidebar` resolves the same way.
  const sb = sidebars[(focusedPane && focusedPane.side) || "left"] || sidebars.left;
  const units = sb ? sb.units() : [];
  return {
    book: !!(pane && pane.book), bench: ctx.bench, benchReason: ctx.benchReason,
    units: units.length, slug: pane && pane.book ? pane.book.id : null,
    title: pane && pane.book ? pane.book.title : null, unitIds: units,
  };
}

function actionsNote(el, text, bad) {
  el.textContent = text || "";
  el.classList.toggle("bad", !!bad);
}

async function runAction(id) {
  const f = actionFacts();
  const row = actionItems(f).find(i => i.id === id);
  if (!row) return null;
  if (row.why) { actionsNote(actionsPop.noteEl, row.why); return { id, refused: row.why }; }
  if (id === "studio") { actionsPop.close(); return { id, opened: openStudio(f.slug, f.unitIds) }; }
  if (id === "push") { actionsPop.close(); return { id, pushed: await pushUnits(f.unitIds, "auto") }; }
  // Push to Phone: studio's own zip-and-copy, said back in its own words
  const url = stateUrl("/phone-send");
  if (!url) { actionsNote(actionsPop.noteEl, "no studio behind this page", true); return { id, refused: "no origin" }; }
  actionsNote(actionsPop.noteEl, "Zipping the bundle…");
  try {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                                   body: JSON.stringify({ slug: f.slug }) });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { actionsNote(actionsPop.noteEl, body.error || ("HTTP " + res.status), true); return { id, error: body.error }; }
    actionsNote(actionsPop.noteEl, body.copied_to
      ? "Sent — the .zip is in " + body.copied_to + ", ready to AirDrop."
      : "Zipped to " + body.zip + ". No synced folder is configured yet, so nothing was copied.");
    return { id, sent: body };
  } catch (e) {
    actionsNote(actionsPop.noteEl, String((e && e.message) || e), true);
    return { id, error: String((e && e.message) || e) };
  }
}

function buildActions(pop) {
  const f = actionFacts();
  pop.body.innerHTML = "";
  for (const spec of actionItems(f)) pop.body.appendChild(TTSTVPopover.item(document, spec));
  for (const spec of actionItems(f)) {
    if (!spec.why) continue;
    const why = document.createElement("div");
    why.className = "ttstv-pop-why";
    why.textContent = spec.why;
    const btn = pop.body.querySelector(`[data-act="${spec.id}"]`);
    if (btn && btn.parentNode) btn.parentNode.insertBefore(why, btn.nextSibling);
  }
  pop.noteEl = document.createElement("div");
  pop.noteEl.className = "ttstv-pop-note";
  pop.noteEl.setAttribute("role", "status");
  pop.body.appendChild(pop.noteEl);
  actionsNote(pop.noteEl, f.title
    ? `${f.title} — ${f.units} unit${f.units === 1 ? "" : "s"} selected`
    : "No book in this tab.");
}

/* TEXT SIZE -- the `a` tool §6 gives the strip, and the size it changes is the
 * one Settings > Reading has always changed (`TTSTVSettings` `size`, the
 * `--read-scale` custom property). NOT a new setting: the reader gained a tool
 * in the strip, so the value needs a door that is not a whole window, and both
 * doors write the same field through `TTSTVSettings.patch`, which is what makes
 * a change made in either land on the other with nothing reloaded. */
function buildSizePanel(pop) {
  const S = window.TTSTVSettings;
  if (!S) { pop.body.textContent = "No settings on this page."; return; }
  const now = S.read().size;
  pop.body.innerHTML = "";
  const row = document.createElement("div");
  row.className = "sizeRow";
  for (const n of S.SIZES) {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.size = String(n);
    b.textContent = n + "%";
    b.setAttribute("aria-pressed", n === now ? "true" : "false");
    b.setAttribute("aria-label", "Text size " + n + " per cent");
    row.appendChild(b);
  }
  pop.body.appendChild(row);
}

function mountPopovers() {
  if (typeof TTSTVPopover === "undefined") return;   // a bundle older than popover.js
  sizePop = TTSTVPopover.create({
    id: "sizePop", title: "Text size", label: "Text size",
    /* In the app the header is hidden, so this anchor has no box and
     * popover.js places the panel in the top-right corner -- under the strip's
     * own `a`, which is where the click came from. In a plain browser the
     * header is there and the panel hangs off it. */
    anchor: () => document.querySelector("header"),
    onOpen: (pop) => { buildSizePanel(pop); pushHostContext(); },
    onClose: () => { pushHostContext(); },
  });
  sizePop.body.addEventListener("click", (e) => {
    const b = e.target.closest("[data-size]");
    if (!b || !window.TTSTVSettings) return;
    TTSTVSettings.patch({ size: Number(b.dataset.size) });
    buildSizePanel(sizePop);
  });

  actionsPop = TTSTVPopover.create({
    id: "actionsPop", title: "Actions", label: "Actions",
    anchor: () => document.getElementById("actionsBtn") || document.querySelector("header"),
    // one panel at a time: two floating boxes over the text is not what a Mac
    // app does, and ⌘. with Settings open should read as "show me Actions"
    onOpen: (pop) => buildActions(pop),
  });
  actionsPop.body.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (b && !b.disabled) runAction(b.dataset.act);
  });

  const btnActions = document.getElementById("actionsBtn");
  if (btnActions) btnActions.addEventListener("click", () => actionsPop.toggle());

  window.TTSTVActions = {
    open: () => { actionsPop.open(); return true; },
    close: () => { actionsPop.close(); return true; },
    toggle: () => { actionsPop.toggle(); return actionsPop.isOpen(); },
    isOpen: () => actionsPop.isOpen(),
    items: () => actionItems(actionFacts()),
    run: runAction,
  };
}
