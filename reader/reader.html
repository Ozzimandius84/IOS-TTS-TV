<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TTSTV Reader</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#832f2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // Injected, not a static <link>, so file:// (opaque "null" origin) never
  // fires a CORS-blocked fetch for it -- installability only matters at
  // http(s), and this keeps the file:// fallback path free of a console
  // error the manifest link would otherwise add (see verify step 5,
  // PROMPTS/reader-pwa.md).
  if (location.protocol !== "file:") {
    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = "manifest.webmanifest";
    document.head.appendChild(link);
  }
</script>
<!-- BEFORE THE FIRST PAINT, and that is the whole reason it is up here.
     settings.js owns the theme for the entire application (one stored value,
     one owner, every surface subscribing) and applies it at load: a window
     opened after someone chose dark opens dark, rather than opening light and
     correcting itself once the body exists. A <head> script is synchronous,
     so nothing has been painted when the attribute lands. It also carries the
     reading font, which flashed for the same reason. -->
<!-- TYPING IS NOT A HOTKEY. First, before anything binds a key: the
     guard attaches to whichever field has the caret, so bare keys stop
     there instead of reaching document. See reader/keys.js. -->
<script src="keys.js"></script>
<script src="settings.js"></script>
<!-- THE APPLICATION'S CHROME, one file for every surface: the scrollbar, and
     so far nothing else. reader.html, library.html, settings.html and
     studio/studio.html all link this one -- see reader/chrome.css. -->
<link rel="stylesheet" href="chrome.css">
<link rel="stylesheet" href="askbar.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="reader.css">
<!-- FRANK: the reader's face. Scoped under html[data-frank] and loaded after
     reader.css so it wins on the cascade rather than on !important. It
     changes no markup -- see the head of reader/frank.css for why that is
     the whole reason it is safe. -->
<link rel="stylesheet" href="frank.css">
<link rel="stylesheet" href="design/wheel.css">
</head>
<body>
<header>
  <button id="sidebarToggle" aria-label="Toggle chapters" title="Chapters (⌘⇧S)" aria-expanded="false">&#9776;</button>
  <!-- THE BAR SAYS THE BOOK (Osca, 30 August: "Rather than saying 'TTS TV
       Reader' it should say the title of the book, and the current chapter.
       If multiple books, the same. If unsynced, title and chapter both
       sides."). The app's own name is the one fact the reader already knows;
       the bar is the only chrome always on screen and it should spend itself
       on where you are. Two halves, because the case the item exists for is
       the split one: each half is laid out OVER the pane it describes. -->
  <h1 id="bookBar" class="bookBar" data-layout="one">
    <span class="bb-side" data-side="left">
      <span class="bb-titles"></span><span class="bb-chapter"></span>
    </span>
    <span class="bb-side" data-side="right" hidden>
      <span class="bb-titles"></span><span class="bb-chapter"></span>
    </span>
  </h1>
  <div id="paneSwitch" class="paneSwitch" role="group" aria-label="Language on screen" data-count="1"></div>
  <!-- TWO BUTTONS (Osca, 30 Aug: "I just want light/dark view and one word
       reader"). The Library link, the diagnostics link, Actions and Settings
       are gone from the bar; ⌘. and ⌘, still open their panels, which now
       hang off the header itself rather than off a button that is not there.
       Both of these draw their own icon from the state they read, so neither
       can show a moon while the page is dark. -->
  <button id="syncToggle" aria-pressed="true"></button>
  <button id="viewToggle" aria-pressed="false"></button>
  <!-- THE DESIGN BENCH, in the reader's header as well as the library's, so
       it is reachable from wherever you already are rather than only from the
       shelf. reader/design/*.html are self-contained pages on this same
       origin; opening one here puts it in a tab of the real app, behind the
       real title bar. reader.css already styles .headerLink to match these
       buttons exactly. A bench, not a feature -- it carries no book. -->
  <a id="designLink" class="headerLink" href="design/collection-page.html"
     title="Design bench" aria-label="Design bench">&#9673;</a>
  <button id="themeBtn"></button>
</header>
<div id="installBar"></div>

<div id="findBar" hidden>
  <input id="findInput" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off"
         autocorrect="off" spellcheck="false" placeholder="Find in this chapter" aria-label="Find in the text">
  <span id="findCount" class="findCount" role="status" aria-live="polite"></span>
  <button id="findPrev" type="button" aria-label="Previous match" title="Previous match (&#8679;&#9166;)">&#8593;</button>
  <button id="findNext" type="button" aria-label="Next match" title="Next match (&#9166;)">&#8595;</button>
  <label class="findScope" for="findWholeBook"><input type="checkbox" id="findWholeBook"> Whole book</label>
  <button id="findClose" type="button" aria-label="Close find" title="Close (Esc)">&times;</button>
</div>

<!-- THE CONTEXT MENU. One menu for the reader, `#menu`, the same element and
     the same class names as reader/library.html's shelf menu, so the two
     pages open the same object. Outside `.main` because it is position:fixed
     and a scroller must never be able to clip it. -->
<div id="menu" class="menu" role="menu" hidden></div>
<div class="shell">
  <div id="sidebarScrim" aria-hidden="true"></div>
  <aside id="sidebar" aria-label="Chapters"></aside>
  <div class="main">
    <!-- NOTHING ABOVE THE PANES (Osca, 1 Sep, the fourth time -- and this time
         it is these two). `#dropNote` and `#margWhy` stood here, above the
         text, on the reasoning that they are empty and out of the layout
         except in the second after something happened; the rule turns out to
         be about the SPACE, not about how often it is used, so the two lines
         are now the LAST children of `.main` and the first thing under the
         window is the page. Both are unchanged in every other way -- same
         ids, same `role="status"`, same two writers, same collapse-when-empty
         -- so nothing that says anything had to learn a new place to say it.
         The watermarks stay, because they are what Osca left above the panes:
         "no element, no words, nothing above or between the panes but the
         watermarks", and they are neither -- they are ink over the text.

         THE WATERMARK. Outside `#panes` and outside every scroller: it is a
         child of `.main`, which is the reading area's box and never scrolls,
         so "I don't want it to move at all as you scroll, it floats" is a
         fact of the tree rather than a scroll handler that has to keep up.
         One element, not one per pane: split, it names the side you are in
         (`paintSidebarBtnState`'s side, the same one the strip's contents
         tool answers for), the way the bar's half over that pane used to. -->
    <div id="watermark" class="watermark" aria-hidden="true" hidden>
      <div class="wm-title"></div><div class="wm-chapter"></div>
    </div>
    <!-- AND THE RIGHT PAGE'S OWN (Osca, 1 Sep: "with two panes and the
         sidebars closed ... the RIGHT pane gets its own, mirrored top-right
         -- so with both sidebars closed you always know where you are on
         both pages"). Same element, same two lines, ranged right against the
         right edge of the reading area. It exists only while there are two
         columns side by side; with one book, or one column promoted over the
         other, there is one mark and it is the left one. -->
    <div id="watermarkRight" class="watermark right" aria-hidden="true" hidden>
      <div class="wm-title"></div><div class="wm-chapter"></div>
    </div>
    <div id="panes"></div>
    <!-- One-word mode's stage. Not a page and not a route: a setting
         (reader/settings.js `view`), so it lives beside #panes in the same
         document, with the same sidebar, the same find bar, the same dictionary
         popup and the same audio elements playing behind it. `hidden` until the
         setting says otherwise, and every rule that draws it is keyed on
         `html[data-read-view="oneword"]`, so with the setting off this markup
         costs one empty div. -->
    <div id="oneword" hidden>
      <!-- THE LINE ABOVE THE LEDGER (Osca, 1 Sep): "enter/exeunt/speaker etc
           should all be OUTSIDE the one-word view -- like the floating
           watermark; just above the ledger, show the stuff that isn't main
           body." One line, the book's own serif, grey. It is INK, not a
           control: no pointer events, nothing to tap, and `hidden` (out of
           the layout, not merely empty) for a book with no apparatus, so
           prose does not pay a blank strip for a feature it does not use. -->
      <div id="owAside" aria-hidden="true" hidden></div>
      <div id="owStage">
        <div id="owFrame">
          <div class="ow-rule" id="owRuleTop"></div>
          <div class="ow-tick" id="owTickTop"></div>

          <div class="ow-tag" id="owTagA"></div>
          <div class="ow-word" id="owA" aria-live="off"></div>
          <div class="ow-beat" id="owBeat"></div>

          <div class="ow-tag" id="owTagB"></div>
          <div class="ow-word" id="owB"></div>

          <div id="owLower">
            <div class="ow-tick" id="owTickBot"></div>
            <div class="ow-rule" id="owRuleBot"></div>
            <div id="owGrip">drag</div>
          </div>
        </div>
      </div>
      <div id="owContext"></div>
      <div id="owBar">
        <div id="owProg"><i id="owProgFill"></i></div>
        <div class="ow-row">
          <button id="owPlay" type="button">Play</button>
          <button id="owBack" type="button" title="Back ten words">&#8592; 10</button>
          <button id="owSlower" type="button" aria-label="Slower">Slower</button>
          <span class="ow-rate" id="owRate">300 wpm</span>
          <button id="owFaster" type="button" aria-label="Faster">Faster</button>
          <button id="owCtx" type="button">Context</button>
        </div>
        <!-- THE VOICE, ON ITS OWN (Osca, 1 Sep): "Play conflates the
             word-stepping and the audio -- play both or neither -- and there's
             no volume." So the chapter's voice gets its own play/pause and its
             own level here, beside the stepping controls and not inside them.
             Present only when this chapter has a master; absent, not disabled,
             like every other control on this page that cannot do anything. -->
        <div class="ow-row ow-voice" id="owVoice">
          <button id="owVoicePlay" type="button" aria-label="Play the voice">Voice</button>
          <button id="owVoiceMute" type="button" aria-label="Mute"></button>
          <input id="owVoiceVol" class="ow-vol" type="range" min="0" max="100" step="1"
                 value="100" aria-label="Voice volume">
        </div>
      </div>
    </div>

    <!-- ONE BAR FOR TWO BOOKS (Osca, 30 Aug: "One person listens right,
         viewing one screen, so I'm not sure we need a double playback bar").
         Two bars is two of everything a single listener has one of -- one
         pair of ears, one volume, one place in the poem -- so while the panes
         are SYNCED this replaces them both. It carries the same controls in
         the same order, and it drives whichever pane currently has the voice;
         the other follows by sentence, which is machinery the reader already
         had (`syncFollower`).

         Split the panes and it hides, and each pane gets its own bar back.
         Nothing here is a second source of truth: every control reaches
         through to a real pane, and `frame()` paints the play icon and the
         clock from that pane every tick, so the bar cannot go stale. -->
    <div id="masterControls" class="paneControls" hidden>
      <div class="pcLeft">
        <button class="muteBtn" aria-label="Mute"></button>
        <input class="volume" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
      </div>
      <div class="pcMid">
        <button class="prevBtn" aria-label="Previous chapter" title="Start of chapter / previous chapter"></button>
        <button class="playBtn" aria-label="Play"></button>
        <button class="nextBtn" aria-label="Next chapter" title="Next chapter"></button>
      </div>
      <div class="pcRight">
        <button id="voiceSideBtn" class="voiceSide" title="Which book is being read aloud"></button>
        <span class="timeLabel">0:00</span>
      </div>
    </div>
    <!-- AND THE TWO LINES, HERE, AT THE FOOT (see the top of `.main`). One
         line for the one thing that happens to this page from OUTSIDE it -- a
         tab dropped on this tab -- and one for when a note, a highlight or a
         bookmark could not reach the SSD, which is the phone-shelf panel's
         sentence for its reason: a person who has just written something is
         owed the fact that it is on this Mac only. Both are empty and out of
         the layout until there is something to say, so the foot of the
         reading area is the page's own last line and not a strip. -->
    <div id="dropNote" role="status"></div>
    <div id="margWhy" role="status" hidden></div>
  </div>
  <!-- The RIGHT book's own chapter list, and it is the LAST child of
       `.shell`, which is what puts it against the right edge of the window
       with the reading area between the two lists. It exists whenever there
       are two books -- synced or split (Osca, 1 Sep: "never both on the
       left"). Hidden, not absent, so its instance survives a toggle and does
       not have to be rebuilt. -->
  <aside id="sidebarRight" aria-label="Chapters, right book" hidden></aside>
</div>

<!-- One dictionary panel per pane, built by makePane() into here. Two panes
     means two panels, each with its own open state and its own current word,
     and both may be open at once -- comparing the Latin word with the English
     one beside it is the entire reason the parallel view exists, and a single
     shared panel threw one of them away. They live outside .shell because
     one-word mode hides #panes; see the .popup rules in the stylesheet. -->
<div id="popups"></div>

<script src="sidebar.js"></script>
<!-- settings.js is in the <head>, before the first paint (see the note there) -->
<script src="context.js"></script>
<script src="popover.js"></script>
<script>
"use strict";

// The reading font, live. TTSTVSettings.live() paints what is stored and
// keeps painting whatever it becomes -- a Settings page in another tab, or
// another Reader tab, reaches this one without a reload (settings.js says
// by which three routes, and why it needs all three). Guarded: an exported
// bundle made before this file existed does not ship settings.js, and the
// reader must still read there.
// One subscription, several listeners. `live()` polls localStorage once a
// second (settings.js says by which three routes and why it needs all
// three); one-word mode needs the same settings object and must not open a
// second poll of its own to get it, so it pushes onto this list instead.
// The callback runs before the rest of this script has been evaluated, so
// it can only record -- everything that reacts is a listener.
const settingsListeners = [];
let readingSettings = null;
if (window.TTSTVSettings) {
  readingSettings = window.TTSTVSettings.live(null, function (s) {
    readingSettings = s;
    for (const fn of settingsListeners) fn(s);
  });
}

/* The settings object, whatever exists. `readingSettings` is the live one and
 * is what everything below should read; `TTSTVSettings.DEFAULTS` is what a
 * bundle made before settings.js shipped falls back to, and `{}` after that,
 * so a caller can always ask for a field and get either the value or
 * `undefined` -- never a throw. Two General rows read through this
 * (`resume`, `sidebar`) and both treat `undefined` as the default. */
function settingsNow() {
  if (readingSettings) return readingSettings;
  if (window.TTSTVSettings) {
    try { return window.TTSTVSettings.read(); } catch (e) { /* fall through */ }
    return window.TTSTVSettings.DEFAULTS || {};
  }
  return {};
}

// ---------------------------------------------------------------- helpers
function qs(name, fallback) {
  const v = new URLSearchParams(location.search).get(name);
  return v === null ? fallback : v;
}

// reader.html lives at reader/reader.html; books/ is a sibling of reader/ at
// the repo root. Docs (PLAN.md, PROMPTS/reader.md) write book locations as
// the repo-root-relative shorthand "books/<slug>" -- normalize that to the
// actual "../books/<slug>" reader.html needs, while still passing through
// anything already relative/absolute/remote unchanged.
function normalizeBookPath(p) {
  if (/^(\.|\/|https?:)/.test(p)) return p;
  return "../" + p;
}

function fmtTime(s) {
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m + ":" + String(sec).padStart(2, "0");
}

function findIndex(items, t) {
  // items sorted ascending by .start; returns index of the last item whose
  // start <= t (0 if none / before the first item).
  if (!items.length) return -1;
  let lo = 0, hi = items.length - 1, ans = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (items[mid].start <= t) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return ans;
}

// Nearest-index mapping used only until align.json exists for a pair: maps
// a sentence's position within its chapter (0-based, out of fromCount) onto
// the nearest position within a chapter of toCount sentences. Proportional,
// not 1:1 -- the two books' sentence counts per chapter are not equal.
function nearestIndex(idx, fromCount, toCount) {
  if (!toCount) return 0;
  if (fromCount <= 1) return 0;
  const mapped = Math.round((idx * (toCount - 1)) / (fromCount - 1));
  return Math.max(0, Math.min(toCount - 1, mapped));
}

function joinPath(base, rel) {
  return base.replace(/\/+$/, "") + "/" + rel.replace(/^\/+/, "");
}

// ------------------------------------------------------- virtual clock
// Stands in for <audio> when no chapter audio exists yet (voice/ hasn't
// run), so playback + highlighting can be built and tested before it does.
// currentTime is a computed getter (wall-clock elapsed since play()), so no
// internal timer/rAF loop of its own is needed.
class VirtualClock extends EventTarget {
  constructor() {
    super();
    this._base = 0; this._playing = false; this._playStart = 0;
    this._rate = 1; this.duration = Infinity; this.muted = false;
    // Nothing here makes a sound, but the bar is designed against a book that
    // WILL (Osca, 30 Aug: "I do want to treat one AS IF it did so we can work
    // on the playback bar"). Carrying the field means the volume control is
    // wired to the same property on both clocks and needs no branch.
    this.volume = 1;
  }
  get currentTime() {
    if (!this._playing) return this._base;
    return this._base + ((performance.now() - this._playStart) / 1000) * this._rate;
  }
  set currentTime(v) {
    this._base = Math.max(0, v);
    if (this._playing) this._playStart = performance.now();
  }
  get paused() { return !this._playing; }
  get playbackRate() { return this._rate; }
  set playbackRate(v) {
    this._base = this.currentTime;
    this._rate = v;
    if (this._playing) this._playStart = performance.now();
  }
  play() {
    if (!this._playing) {
      this._playing = true; this._playStart = performance.now();
      this.dispatchEvent(new Event("play"));
    }
    return Promise.resolve();
  }
  pause() {
    if (this._playing) {
      this._base = this.currentTime; this._playing = false;
      this.dispatchEvent(new Event("pause"));
    }
  }
}

/* The playback bar's icons. Same rule as the header's: inline SVG on
 * `currentColor`, never a glyph. The old speaker was U+1F50A, an EMOJI --
 * colour the page cannot set, a different drawing on every OS, and on macOS a
 * cartoon in the middle of a typographic app (Osca, 30 Aug: "THAT speaker
 * icon, the one we have is VERY ugly"). */
const BAR = {
  play: '<svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">'
    + '<path d="M8 5.4v13.2l10.5-6.6z" fill="currentColor"/></svg>',
  pause: '<svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">'
    + '<path d="M9 5.2h2.6v13.6H9zM12.4 5.2H15v13.6h-2.6z" fill="currentColor"/></svg>',
  // |<  and  >|  -- a bar and a triangle, the transport shape everything from
  // a tape deck to a phone uses, so it needs no label to be read as a chapter
  prev: '<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">'
    + '<path d="M7.4 5.6h1.9v12.8H7.4z" fill="currentColor"/>'
    + '<path d="M18.4 5.9v12.2L10 12z" fill="currentColor"/></svg>',
  next: '<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">'
    + '<path d="M14.7 5.6h1.9v12.8h-1.9z" fill="currentColor"/>'
    + '<path d="M5.6 5.9v12.2L14 12z" fill="currentColor"/></svg>',
  // the cone is one path so it scales as one shape; the two arcs are the
  // sound, and they are what the mute takes away
  speaker: '<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">'
    + '<path d="M4 9.4h3.1L11.6 5.6a.6.6 0 0 1 1 .47v11.86a.6.6 0 0 1-1 .47L7.1 14.6H4'
    + ' a.6.6 0 0 1-.6-.6v-4a.6.6 0 0 1 .6-.6z" fill="currentColor"/>'
    + '<path d="M16.1 9.2a4 4 0 0 1 0 5.6M18.6 6.8a7.5 7.5 0 0 1 0 10.4"'
    + ' stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>',
  muted: '<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">'
    + '<path d="M4 9.4h3.1L11.6 5.6a.6.6 0 0 1 1 .47v11.86a.6.6 0 0 1-1 .47L7.1 14.6H4'
    + ' a.6.6 0 0 1-.6-.6v-4a.6.6 0 0 1 .6-.6z" fill="currentColor"/>'
    + '<path d="M16.2 9.6l5 4.8M21.2 9.6l-5 4.8" stroke="currentColor" stroke-width="1.5"'
    + ' stroke-linecap="round" fill="none"/></svg>',
};

// ---------------------------------------------------------------- panes
// One or two panes share this code. Two panes: ?left=books/A&right=books/B
// (each gets its own <audio>/mute/speed). One pane: legacy ?book=books/X,
// or a lone ?left=/?right=. Whichever pane's clock is currently playing is
// the master; the other follows it by sentence -- see syncFollower().
const AUDIO_EXTS = ["mp3", "wav", "m4a", "opus", "ogg"];
const LANG_OUT = "en"; // see loadDictionaryLinks() below for why this is hardcoded

function paneMarkup() {
  return `
    <!-- THE HEADING BLOCK IS GONE (Osca, 30 Aug evening, on the new bar:
         title, author and chapter repeated under it is "just noise, takes up
         text space"). The bar says all three now, so the text starts at the
         text. The two elements stay, unpainted: they are the pane's own
         record of what it is showing, written by renderChapter and initPane
         and read by the tests, and deleting them would scatter that record
         across new lookups to save two hidden nodes. The hidden ATTRIBUTE,
         not a display:none in a stylesheet, so there is nowhere for the rule
         to be overridden. (No backticks in here: this whole block is inside a
         template literal, and one would end it.) -->
    <div class="paneHeader" hidden>
      <div class="bookTitle"></div>
      <div class="chapterTitle"></div>
    </div>
    <div class="paneStatus"></div>
    <div class="paneReading" tabindex="-1"></div>
    <!-- THE PLAYBACK BAR (Osca, 30 Aug). Three groups, and the middle one
         is centred on the pane rather than packed after the left one, so the
         transport sits where the eye looks for it whatever is beside it:

           left    the speaker, and a volume bar. The speaker is the mute --
                   press the icon, the whole thing goes quiet.
           middle  |<  play/pause  >|  and nothing else. The chapter <select>
                   is gone: the sidebar is the chapter list, and two chapter
                   lists on one screen is one too many.
           right   the clock, and the slot the voice pill sits in.

         chapterSelect and speedSelect stay in the DOM, hidden. The first is
         the mirror renderChapter writes the current chapter into and several
         places still read; the second is the rate the clock still honours. Neither has a place in the bar -- they belong in Settings --
         but deleting the elements would be a JS change dressed up as a
         layout one. -->
    <div class="paneControls">
      <div class="pcLeft">
        <button class="muteBtn" aria-label="Mute"></button>
        <input class="volume" type="range" min="0" max="100" step="1" value="100"
               aria-label="Volume">
      </div>
      <div class="pcMid">
        <button class="prevBtn" aria-label="Previous chapter" title="Start of chapter / previous chapter"></button>
        <button class="playBtn" aria-label="Play"></button>
        <button class="nextBtn" aria-label="Next chapter" title="Next chapter"></button>
      </div>
      <div class="pcRight">
        <span class="timeLabel">0:00</span>
      </div>
      <select class="chapterSelect" aria-label="Chapter" hidden></select>
      <select class="speedSelect" aria-label="Playback speed" hidden>
        <option value="0.75">.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
    </div>
    <audio class="audioEl" preload="none"></audio>
  `;
}

// The dictionary panel's own markup, one copy per pane. Every part is
// addressed by class rather than by id, because there is now more than one of
// each on the page; the pane holds the references (pane.els.popup*) so no
// lookup ever has to guess which panel it means.
function popupMarkup() {
  return `
    <div class="popupHandle">
      <div class="grabber" aria-hidden="true"></div>
      <div class="row">
        <!-- THE TOP LINE (Osca, 31 Aug, on the word "sepulchre": "doesn't
             say it's a noun, anywhere"; and on "going": "I would like to see
             the word as is, then language, then kind of word, then exact
             grammar -- tense, form, declension, gender -- right there,
             across the top").  No backticks in this comment: the whole block
             is inside a template literal and one would end it.
             Word, language, part of speech, and the grammar of THIS
             occurrence, in that order, separated by a middle dot that is put
             in only between two things that are both there. The pronunciation
             left this row for the line under it: it is not one of the four
             things Osca listed, and with it in the middle the line no longer
             reads as the sentence he asked for. -->
        <!-- NO WHITESPACE between these four: the separators are put in by
             paintTopLine and the span's textContent IS the line as it reads,
             which is what makes "sepulchre - EN - noun" quotable in a test
             and in a report.  Newlines here would be text nodes in it. -->
        <span class="topline"><span class="word-text"></span><span class="lang-tag"></span><span class="pos-tag"></span><span class="gram-tag"></span></span>
        <button class="close" aria-label="Close">&times;</button>
      </div>
      <div class="phon"></div>
    </div>
    <div class="cast" hidden></div>
    <!-- The definitions and the etymology are one block with two layouts: a
         second COLUMN in a single-book view, where the panel is the width of
         the window and there is room; stacked in a parallel view, where each
         panel is half a window and a column would squeeze both. -->
    <div class="body">
      <div class="gloss"></div>
      <div class="etym" hidden></div>
    </div>
    <div class="context"></div>
    <div class="links"></div>
  `;
}

function makePane(side, bookPath, urlParam) {
  const root = document.createElement("div");
  root.className = "pane";
  root.id = "pane-" + side;
  root.innerHTML = paneMarkup();
  document.getElementById("panes").appendChild(root);

  const popup = document.createElement("div");
  popup.className = "popup";
  popup.id = "popup-" + side;
  popup.setAttribute("aria-hidden", "true");
  popup.innerHTML = popupMarkup();
  document.getElementById("popups").appendChild(popup);

  const pane = {
    side, bookPath, urlParam,
    book: null,
    fileMap: null,
    currentChapterId: null,
    currentTimings: null,       // { sentences:[{id,start,end,words}], duration }
    chapterSentenceOrder: [],   // sentence ids, document order, current chapter
    activeDocIdx: null,         // index into chapterSentenceOrder of the active sentence
    sentenceEls: new Map(),
    wordEls: new Map(),
    activeSentenceEl: null,
    activeWordEl: null,
    linksData: null, linksAttempted: false,
    dictData: null, dictAttempted: false,
    grammarData: null, grammarAttempted: false,
    muted: false, rate: 1,
    statusMsgs: {},
    els: {
      root,
      bookTitle: root.querySelector(".bookTitle"),
      chapterTitle: root.querySelector(".chapterTitle"),
      status: root.querySelector(".paneStatus"),
      reading: root.querySelector(".paneReading"),
      column: null,      // the run's one wrapper under ?layout=2 -- made by clearReading(), null without the flag
      runHead: null,     // the pane's own running head under ?layout=2 -- made by clearReading() before the column, null without the flag
      chapterSelect: root.querySelector(".chapterSelect"),
      playBtn: root.querySelector(".playBtn"),
      prevBtn: root.querySelector(".prevBtn"),
      nextBtn: root.querySelector(".nextBtn"),
      muteBtn: root.querySelector(".muteBtn"),
      volume: root.querySelector(".volume"),
      // held, not looked up again: paintPlayable takes this group OUT of the
      // document when the chapter has no audio, and a second querySelector
      // would then answer null and it could never come back
      pcLeft: root.querySelector(".pcLeft"),
      speedSelect: root.querySelector(".speedSelect"),
      timeLabel: root.querySelector(".timeLabel"),
      audioEl: root.querySelector(".audioEl"),
      popup,
      popupHandle: popup.querySelector(".popupHandle"),
      popupClose: popup.querySelector(".close"),
      popupWord: popup.querySelector(".word-text"),
      popupLang: popup.querySelector(".lang-tag"),
      popupPos: popup.querySelector(".pos-tag"),
      popupGram: popup.querySelector(".gram-tag"),
      popupTop: popup.querySelector(".topline"),
      popupPhon: popup.querySelector(".phon"),
      popupCast: popup.querySelector(".cast"),
      popupGloss: popup.querySelector(".gloss"),
      popupEtym: popup.querySelector(".etym"),
      popupContext: popup.querySelector(".context"),
      popupLinks: popup.querySelector(".links"),
    },
    // This pane's open look-up, or null. Was one module-level `currentLookup`
    // shared by both panes until 30 Aug; it is per-pane now, which is what
    // makes two panels open at once possible at all.
    lookup: null,
  };
  pane.clock = pane.els.audioEl;
  pane.els.popupClose.addEventListener("click", () => closePopup(pane));
  // The same drag-to-close gesture the single panel had, wired per panel.
  makeSheetDrag({
    handle: pane.els.popupHandle, sheet: popup, axis: "y", sign: 1,
    extent: () => popup.getBoundingClientRect().height,
    canStart: () => (popup.scrollTop || 0) <= 0,      // iOS: only from the top of the content
    close: () => closePopup(pane),
  });
  return pane;
}

// ---------------------------------------------------------- file access
// fetch() to file:// siblings is blocked by some browsers (notably Chrome);
// if the very first read fails we fall back to a manual folder picker
// (File/webkitdirectory), which needs no network and works everywhere.
async function readJSON(pane, relPath) {
  if (pane.fileMap) {
    const f = pane.fileMap.get(relPath);
    if (!f) throw new Error(`${relPath} not found in the selected folder`);
    return JSON.parse(await f.text());
  }
  const res = await fetch(joinPath(pane.bookPath, relPath));
  if (!res.ok) throw new Error(`HTTP ${res.status} loading ${relPath}`);
  return res.json();
}

function showFolderPicker(pane) {
  pane.els.status.innerHTML = "";
  const err = document.createElement("div");
  err.className = "err";
  err.innerHTML =
    "This browser won't load local files with JavaScript from a page opened via <code>file://</code> " +
    "(Chrome blocks it; Safari and Firefox usually don't). Pick this pane's book folder manually:";
  const btn = document.createElement("button");
  btn.className = "folderPickerBtn";
  btn.textContent = "Choose book folder…";
  const input = document.createElement("input");
  input.type = "file";
  input.webkitdirectory = true;
  input.directory = true;
  input.multiple = true;
  input.style.display = "none";
  btn.addEventListener("click", () => input.click());
  input.addEventListener("change", () => onFolderChosen(pane, input.files));
  err.appendChild(document.createElement("br"));
  err.appendChild(btn);
  err.appendChild(input);
  pane.els.status.appendChild(err);
}

// The no-book state on http(s) (PROMPTS/reader-mobile.md step 2). On a
// static host with no books/ (the published shell on the phone) the first
// read fails too, but the file:// text above would be a lie there: nothing is
// blocked, there is simply no book at this URL. Say what is true: "No book
// loaded"; when this host also serves library.html, offer it; otherwise the
// one line about the zip import phone-app.md adds. `explicit` is whether a
// book was actually asked for in the URL (then the error is worth showing).
function noBookMessage(explicit, bookPath, err) {
  return explicit
    ? `Couldn't load ${bookPath}${err && err.message ? ": " + err.message : ""}.`
    : "No book loaded.";
}

async function libraryOnThisHost() {
  try {
    const res = await fetch("library.html", { method: "HEAD", cache: "no-store" });
    return res.ok;
  } catch (e) { return false; }
}

/* THE RUN'S ONE WRAPPER (PROMPTS/reader-layout.md step 2, 2 Sep). Every
 * chapter render, and the no-book box, starts here: the scroller is emptied
 * and the element the run is appended to is returned. Under `?layout=2` that
 * element is one `.column` inside the scroller -- `.paneReading` stays the
 * scroller (`pane.els.reading`: focus, scrollTop, the margin layer as its own
 * direct child, `offsetTop` of every paragraph still measured from it, since
 * the column takes no `position`) and the column is `width: fit-content`, so
 * what centres is the text's real extent (the CSS says why). It is the WHOLE
 * run that is wrapped, on purpose: a per-paragraph wrap would centre every
 * verse line on its own. Without the flag the run goes straight into the
 * scroller, exactly as it always has -- the old page keeps its DOM as well as
 * its rules, so the switch is a true A/B and `pane.els.column` is null.
 *
 * AND THE PANE'S OWN RUNNING HEAD (step 3): under the flag the scroller's
 * first child, before the column, is one `.runHead` -- sticky, in flow, the
 * CSS says why -- rebuilt with the run it heads and worded here from the
 * pane's own book and chapter (renderChapter has set `currentChapterId` by
 * the time it clears). `pane.els.runHead` names it; null without the flag. */
function clearReading(pane) {
  const reading = pane.els.reading;
  reading.innerHTML = "";
  pane.els.column = null;
  pane.els.runHead = null;
  if (!LAYOUT2) return reading;
  const head = document.createElement("div");
  head.className = "runHead";
  head.setAttribute("aria-hidden", "true");   // ink: the list and the tab already say the book
  const t = document.createElement("span");
  t.className = "rh-title";
  const c = document.createElement("span");
  c.className = "rh-chapter";
  head.appendChild(t);
  head.appendChild(c);
  reading.appendChild(head);
  pane.els.runHead = head;
  paintRunHead(pane);
  const column = document.createElement("div");
  column.className = "column";
  reading.appendChild(column);
  pane.els.column = column;
  return column;
}

/* What a pane's head says: ITS OWN book's title, then ITS OWN chapter -- no
 * side to choose, no pair joined, and NOT the chapter list's stand-in. The
 * watermark appears only while the list is away, because a floating mark
 * beside an open list said the chapter twice; a head IN FLOW that came and
 * went with the list would move the text by its own height every time the
 * list opened, which is the jump the sticky head exists to remove -- and a
 * printed book's running head is on every page. The one state with no head
 * is no book. Pure, so the node tests can drive it. */
function runHeadModel(pane) {
  const title = (pane && pane.book && pane.book.title) ? String(pane.book.title) : "";
  let chapter = "";
  try { chapter = pane ? (chapterTitleOf(pane) || "") : ""; } catch (e) { chapter = ""; }
  return { shown: !!title, title, chapter };
}

function paintRunHead(pane) {
  const el = pane && pane.els && pane.els.runHead;
  if (!el) return null;
  const m = runHeadModel(pane);
  el.hidden = !m.shown;
  const t = el.querySelector(".rh-title");
  const c = el.querySelector(".rh-chapter");
  if (t) t.textContent = m.title;
  if (c) c.textContent = m.chapter;
  return m;
}

function showNoBook(pane, err) {
  pane.els.status.innerHTML = "";
  const run = clearReading(pane);
  const box = document.createElement("div");
  box.className = "noBook";
  const h = document.createElement("h2");
  h.textContent = "No book loaded";
  box.appendChild(h);
  if (bookRequested) {            // a book was asked for and is not here: say which, and why
    const p = document.createElement("p");
    p.textContent = noBookMessage(bookRequested, pane.bookPath, err);
    box.appendChild(p);
  }
  pane.els.root.classList.add("noBookPane");
  run.appendChild(box);
  libraryOnThisHost().then(has => {
    const line = document.createElement("p");
    if (has) {
      const a = document.createElement("a");
      a.setAttribute("href", "library.html");
      a.textContent = "Open the library";
      a.addEventListener("click", (e) => {
        const host = window.TTSTVHost;
        if (host && typeof host.openLibrary === "function") { e.preventDefault(); host.openLibrary(); }
      });
      line.appendChild(a);
    } else {
      line.textContent = "Books arrive as a bundle .zip from the bench — the import lands here next (PROMPTS/phone-app.md).";
    }
    box.appendChild(line);
  });
}

function onFolderChosen(pane, fileList) {
  const files = Array.from(fileList);
  const bookJsonEntry = files.find(f => f.webkitRelativePath.endsWith("/book.json") || f.webkitRelativePath === "book.json");
  if (!bookJsonEntry) {
    pane.els.status.querySelector(".err").insertAdjacentHTML("beforeend", "<br><strong>No book.json found in that folder.</strong>");
    return;
  }
  const prefix = bookJsonEntry.webkitRelativePath.slice(0, bookJsonEntry.webkitRelativePath.length - "book.json".length);
  pane.fileMap = new Map();
  for (const f of files) {
    const rel = f.webkitRelativePath.startsWith(prefix) ? f.webkitRelativePath.slice(prefix.length) : f.webkitRelativePath;
    pane.fileMap.set(rel, f);
  }
  pane.els.status.innerHTML = "";
  initPane(pane).then(() => pane._resolveReady()).catch(e => showFatalError(pane, e));
}

// -------------------------------------------------------------- rendering
function renderChapterList(pane) {
  pane.els.chapterSelect.innerHTML = "";
  for (const ch of pane.book.chapters) {
    const opt = document.createElement("option");
    opt.value = ch.id;
    opt.textContent = `${ch.id}  ${ch.title}`;
    pane.els.chapterSelect.appendChild(opt);
  }
}

function effectiveLang(chapter, sentence) {
  return sentence.lang || chapter.lang || "";
}

// ------------------------------------------------- drama and dialogue (role)
// core/README.md "Drama and dialogue": Paragraph.role says what part a
// paragraph plays in a turn of speech -- heading | speaker | speech |
// direction -- and Paragraph.speaker names who says a speech. ROLES is a
// closed set; core requires an unrecognised value to be read exactly as null,
// which is also what every book the parser found no drama in carries, so a
// prose or verse book never reaches any of the code below.
const ROLES = new Set(["heading", "speaker", "speech", "direction"]);
function paraRole(para) { return ROLES.has(para.role) ? para.role : null; }
function paraText(para) { return (para.sentences || []).map(s => s.text).join(" "); }

// One chapter's paragraphs -> a flat list, document order preserved:
//   {para}                  render it where it stands, as the reader always did
//   {cue, speaker, paras}   a turn -- the cue hangs in the margin, `paras`
//                           (speeches, and the directions that interrupt them)
//                           go in the speech column beside it
// A cue opens a turn; so does a speech whose `speaker` is not the open turn's
// (an edition that prefixes the name to the speech has no cue paragraph at
// all). A direction joins the open turn, but only *stays* in it when more
// speech follows: that is what lets the label survive the 104 directions
// inside Act 2 Scene 2 while "Exeunt" at the end of a scene is still a
// direction of its own and not a line tucked under the last speaker.
//
// **The gate is a cue paragraph, not a role** (TRIGGERS.md's reader line, step 4).
// `role: "speech"` is about to stop meaning "a line in a play": parser's
// prose-roles step 2 writes spans on prose and `paragraph_role_from_spans`
// (core/schema.py) shadows a speech-majority paragraph as `role: "speech"`
// with `speaker` set -- so every paragraph of Dickens in which somebody talks
// would arrive here looking exactly like a line of Hamlet, and every one
// would get a hanging speaker label in the margin. A play is not "a book
// with speech in it"; it is a book that PRINTS THE NAMES, and the printed
// name is the `role: "speaker"` cue paragraph. So: no cue paragraph in this
// text, no turns -- every paragraph renders where it stands, keeping its
// `data-role`/`data-speaker` for anything that wants them (the CSS, voiceui,
// a later prose layout), and the reading pane of a novel is a reading pane
// of a novel.
//
// `hasCues` is the book's answer, not the chapter's: an edition can print
// the names in one scene and prefix them in the next, and a chapter that
// happens to hold only prefixed speeches must not lose its labels while its
// neighbours keep theirs. renderChapter passes bookHasCues(pane.book); the
// default keeps this function callable with a paragraph list alone.
function hasCueParagraph(paragraphs) {
  for (const para of paragraphs || []) if (paraRole(para) === "speaker") return true;
  return false;
}

// Once per book, cached non-enumerably on the book object.
function bookHasCues(book) {
  if (!book) return false;
  if (typeof book.__hasCues !== "boolean") {
    Object.defineProperty(book, "__hasCues", {
      value: (book.chapters || []).some(ch => hasCueParagraph(ch.paragraphs)),
      writable: true, configurable: true,
    });
  }
  return book.__hasCues;
}

function groupTurns(paragraphs, hasCues) {
  const cues = hasCues === undefined ? hasCueParagraph(paragraphs) : !!hasCues;
  if (!cues) return (paragraphs || []).map(para => ({ para }));
  const items = [];
  let turn = null;
  function close() {
    if (!turn) return;
    const tail = [];
    while (turn.paras.length && paraRole(turn.paras[turn.paras.length - 1]) === "direction") {
      tail.unshift(turn.paras.pop());
    }
    if (turn.paras.length && (turn.cue || turn.speaker)) items.push(turn);
    else {
      if (turn.cue) items.push({ para: turn.cue });          // a cue with nothing after it
      for (const p of turn.paras) items.push({ para: p });   // speech nobody is named for
    }
    for (const p of tail) items.push({ para: p });
    turn = null;
  }
  for (const para of paragraphs || []) {
    const role = paraRole(para);
    if (role === "speaker") { close(); turn = { cue: para, speaker: null, paras: [] }; continue; }
    if (role === "speech") {
      const who = para.speaker == null ? null : String(para.speaker);
      if (turn && turn.speaker != null && who != null && who !== turn.speaker) close();
      if (!turn) turn = { cue: null, speaker: who, paras: [] };
      if (turn.speaker == null) turn.speaker = who;
      turn.paras.push(para);
      continue;
    }
    if (role === "direction" && turn) { turn.paras.push(para); continue; }
    close();
    items.push({ para });
  }
  close();
  return items;
}

/* --------------------------------------------------------- THE ARGUMENT
 * `kind: "argument"` (the parser is adding it, 31 Aug): a chapter's synopsis
 * -- McCarthy's dashed run under the chapter number, the eighteenth-century
 * "Argument" under a canto's title. It arrives as PARAGRAPHS, because that is
 * what the source's markup is, and it must not be SET as paragraphs: the
 * whole run is one block under the heading, smaller than the body, with the
 * author's dashes exactly as they were written.
 *
 * So this collapses a consecutive run of them into one item before anything
 * is drawn. It is a separate pass from `groupTurns` and runs after it,
 * because the two answer different questions and a play with an argument
 * would otherwise need one function that knew about both.
 *
 * A run is CONSECUTIVE and nothing else: two arguments with a paragraph of
 * body between them are two blocks, which is the honest reading of a book
 * that prints two of them.                                                */
function isArgument(para) { return !!para && para.kind === "argument"; }

function groupArguments(items) {
  const out = [];
  let run = null;
  for (const item of items || []) {
    if (item.para && isArgument(item.para)) {
      if (!run) { run = { argument: [] }; out.push(run); }
      run.argument.push(item.para);
      continue;
    }
    run = null;
    out.push(item);
  }
  return out;
}

// A scene chapter's first paragraph is its own role:"heading" repeating the
// scene number -- "Scene 1" opening the chapter titled "Act 1, Scene 1", whose
// title is already on screen twice (the pane header and the sidebar row).
// parser-plays step 2 SS6: show that or the chapter title, not both. Dropped
// only when the title already contains it, only for the chapter's first
// paragraph, and only in a book that carries roles at all.
function isTitleEcho(chapter, para) {
  if (paraRole(para) !== "heading") return false;
  if (!chapter.paragraphs || chapter.paragraphs[0] !== para) return false;
  const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const inside = norm(paraText(para));
  return !!inside && norm(chapter.title).includes(inside);
}

// The mirror of isTitleEcho at the other end of the chapter. The parser
// strands the *next* act's heading at the foot of the previous scene:
// `c004` (the front matter) ends with `ACT 1`, `c009` (Act 1, Scene 5) with
// `ACT 2`, and `c011` with `ACT 3` -- so the reader was printing "ACT 3"
// under the last line of Act 2 Scene 2, a heading for a chapter that is not
// on screen. **Dropped, not carried**: the act is already `Chapter.section`,
// which the sidebar prints as the group heading and the next chapter's own
// title repeats ("Act 3, Scene 1"), so moving it to the head of that chapter
// would be the third place the same two words appear -- the repetition
// isTitleEcho exists to remove. The parser half (put it at the head of the
// chapter it names, or nowhere) is a request, not a change made here.
//
// Guarded three ways, so it can only fire on exactly this shape: the
// chapter's *last* paragraph, a `role: heading`, and a text that names the
// *next* chapter's section or opens its title -- and never this chapter's
// own section, so a book that really does end a chapter on its own act
// heading keeps it.
function isNextChapterHeading(chapters, chapter, para) {
  if (paraRole(para) !== "heading") return false;
  const ps = chapter.paragraphs || [];
  if (!ps.length || ps[ps.length - 1] !== para) return false;
  const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const inside = norm(paraText(para));
  if (!inside || inside === norm(chapter.section)) return false;
  const i = (chapters || []).indexOf(chapter);
  const next = i >= 0 ? (chapters[i + 1] || null) : null;
  if (!next) return false;
  const title = norm(next.title);
  return norm(next.section) === inside || title === inside || title.startsWith(inside + " ");
}

/* ================================ THE PRINTED CONTENTS PAGE IS A DOOR
 * Osca, 31 Aug evening (READER_FIRST.md): *"When I open the contents page of
 * a book, I want to click on one of the contents and for it to take me to
 * that part of the book. Right now no such thing exists -- I can only do
 * dictionary lookup."*
 *
 * MATCHED, NEVER GUESSED. The only thing that makes a printed line a door is
 * that its text, normalised, IS a chapter's title -- the same normalisation
 * `isTitleEcho` and `isNextChapterHeading` already use for the same kind of
 * question (case, punctuation and runs of spaces gone; nothing else). A line
 * that matches nothing stays exactly what it was: plain text, tappable, with
 * its look-up. There is no fuzzy match, no prefix match and no "nearest
 * chapter", because a contents page that sends you to the wrong poem is
 * worse than one that sends you nowhere.
 *
 * `Book.source_toc` (core/README.md: the PDF's own publisher-authored
 * outline, `{level, title, page}`) is the second thing the parser knows, and
 * it is used the only way it honestly can be: as MORE SPELLINGS of titles
 * this book already has. An outline entry cannot name a chapter id and a page
 * number is not one, so an entry that matches no chapter is dropped rather
 * than resolved by counting -- it still counts as evidence that this chapter
 * is a contents page, which is all a title with no target can be.
 *
 * AND ONLY ON A CONTENTS CHAPTER. Every book has lines that repeat a chapter
 * title somewhere -- a running head, an epigraph, a scene named in a speech
 * -- and turning those into doors would make the text move under a finger
 * that meant to look a word up. So the doors are drawn only where the chapter
 * as a whole is a list of the book's own parts, which is two facts together:
 * at least three DISTINCT chapters named, and either the page says so
 * ("CONTENTS", "Table of contents", "Index" -- its title or a line of its
 * own) or at least half of its non-empty lines are titles. Hamlet, whose
 * front matter names no chapter at all, has no door anywhere in it; Poems,
 * whose c001 is the word CONTENTS over twenty-four poem titles, is all door.
 *
 * Pure over `book` and `chapter`, so every claim here is testable with no DOM
 * and no CSS -- `reader/tests/test_contents_door.py`. */
function tocNorm(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }

// The words a page uses to say it is a contents page, normalised.
const TOC_MARKERS = { "contents": 1, "table of contents": 1, "index": 1 };

/* Normalised title -> chapter id, from what the parser already knows. First
 * spelling wins: two chapters with the same title are one door, to the first,
 * which is the honest answer when the page itself cannot tell them apart. */
function tocTitleIndex(book) {
  const out = new Map();
  for (const c of (book && book.chapters) || []) {
    const n = tocNorm(c.title);
    if (n && !out.has(n)) out.set(n, c.id);
  }
  return out;
}

/* The outline's titles, normalised, as a plain set -- evidence only. See the
 * block above for why an entry that matches no chapter is not a target. */
function tocOutlineTitles(book) {
  const out = new Set();
  for (const t of (book && book.source_toc) || []) {
    const n = tocNorm(t && t.title);
    if (n) out.add(n);
  }
  return out;
}

function tocModel(book, chapter) {
  const index = tocTitleIndex(book);
  const outline = tocOutlineTitles(book);
  const lines = [];
  const targets = Object.create(null);
  let marker = TOC_MARKERS[tocNorm(chapter && chapter.title)] ? 1 : 0;
  let listed = 0;     // lines that name something the book's own front matter lists
  let bodyLines = 0;
  for (const para of (chapter && chapter.paragraphs) || []) {
    const n = tocNorm(paraText(para));
    if (!n) continue;
    if (TOC_MARKERS[n]) { marker = 1; continue; }   // the heading is not a line of the list
    bodyLines++;
    let to = index.get(n) || null;
    if (to === (chapter && chapter.id)) to = null;   // a page never opens itself
    if (to) { targets[to] = 1; lines.push({ id: para.id, to: to }); }
    if (to || outline.has(n)) listed++;
  }
  const named = Object.keys(targets).length;
  const contents = named >= 3 && (!!marker || listed * 2 >= bodyLines);
  return { contents: contents, marker: !!marker, named: named,
           lines: contents ? lines : [], listed: listed, bodyLines: bodyLines };
}

/* THE SAME `renderChapter` PATH THE SIDEBAR USES, so the sidebar follows:
 * `openChapterFrom` is the chapter list's own click, which means synced turns
 * BOTH books and split turns this one, and `renderChapter` ends in
 * `sidebars[side].setCurrent()`. Nothing new is written here. */
function tocOpen(pane, chapterId) {
  if (!pane || !chapterId) return null;
  focusedPane = pane;
  openChapterFrom(pane, chapterId);
  return chapterId;
}

/* THE EMPHASIS GOES AROUND THE WORD, NEVER IN PLACE OF IT
 * parser/README.md `## Status` -> the typography entry's §6, rule 1, word for
 * word: "The word element, its id and its highlight class must not move --
 * the emphasis goes around the word span, never in place of it, or word-level
 * highlighting and tap-to-look-up break."
 *
 * So this returns what should be APPENDED to the sentence, which is the
 * outermost wrapper (or the word itself when the book said nothing). `wEl` is
 * untouched: same element, same `dataset.id`, same `.word` class, still the
 * object `pane.wordEls` holds, still what `closest("p, h3, blockquote,
 * .argument")` walks up from, still what gets `.now` / `.hl-*` / `.find-hit`.
 * Only its parent changes.
 *
 * Composed in §6's own order -- `<em>` for `i`, `<strong>` for `b`,
 * small-caps for `sc` -- read outermost-first, so `bi` is
 * `<em><strong><span class="word">`. Nesting order has no visual consequence
 * (the three properties are independent); the order is fixed so the tree is
 * one shape and a test can name it. */
function styleWord(wEl, style) {
  const s = String(style || "");
  if (!s) return wEl;
  let node = wEl;
  const wrap = (tag, cls) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    n.appendChild(node);
    node = n;
  };
  if (s.indexOf("sc") >= 0) wrap("span", "sc");
  if (s.indexOf("b")  >= 0) wrap("strong");
  if (s.indexOf("i")  >= 0) wrap("em");
  return node;
}

// One paragraph, into `parent`. The tag and the class come from kind exactly
// as they always did, except that a role of "direction" names the class --
// role, not kind, is what a play is laid out on.
function renderParagraph(pane, chapter, para, parent, into) {
  const role = paraRole(para);
  const tag = para.kind === "heading" ? "h3" : para.kind === "quote" ? "blockquote" : "p";
  /* `into` is the argument block: the paragraph's SENTENCES go into an
   * element somebody else owns, and no element of its own is made. Everything
   * below -- the word ids, the sentence ids, `pane.wordEls`, the chapter's
   * sentence order -- is identical either way, which is the point: a run set
   * as one block is still exactly as tappable, as highlightable and as
   * findable as a run set as five paragraphs. */
  const el = into || document.createElement(tag);
  if (!into) {
    el.className = role === "direction" ? "direction" : para.kind === "verse" ? "verse-line" : para.kind;
  }
  // The structure one-word mode reads back off the page (owTokenise): a
  // verse LINE end and a STANZA end are different beats, and `.verse-line`
  // alone cannot tell them apart. `Paragraph.stanza` is core/schema.py's
  // (schema_version 3), verse only, numbered from 1 within the chapter.
  if (!into) {
    el.dataset.kind = para.kind || "body";
    /* WHOLE PARAGRAPHS (§6 rule 2): the same emphasis on the paragraph
     * element, and its words drawn plain. `Paragraph.style` and per-word
     * styles never both appear on one paragraph (core/README.md), so this is
     * an either/or and not a merge -- `styleWord` below simply finds nothing
     * to do. A block cannot be wrapped in `<em>`, so the carrier is the
     * attribute and the rules in the stylesheet. */
    if (para.style) el.dataset.style = String(para.style);
    if (para.stanza != null) el.dataset.stanza = String(para.stanza);
    if (role) el.dataset.role = role;
    if (role === "speech" && para.speaker) el.dataset.speaker = String(para.speaker);
    /* A LINE OF THE PRINTED CONTENTS THAT NAMES A CHAPTER. The words inside
     * are untouched -- same spans, same ids, same look-up -- and what is
     * added is on the PARAGRAPH: where it goes, and enough of a role for a
     * keyboard to find it. `role="link"` and `tabindex` rather than an <a>,
     * because the element is the book's own paragraph and an anchor would
     * bring a browser's colour, its underline and its middle-click with it. */
    const goesTo = pane.toc && pane.toc.get ? pane.toc.get(para.id) : null;
    if (goesTo) {
      const target = (pane.book.chapters || []).find(c => c.id === goesTo);
      el.classList.add("tocLine");
      el.dataset.para = para.id;
      el.dataset.goto = goesTo;
      el.setAttribute("role", "link");
      el.setAttribute("tabindex", "0");
      // setAttribute, not `el.title =`: the attribute is what a hover, a
      // screen reader and the node harness all read
      el.setAttribute("title", "Go to " + ((target && target.title) || goesTo));
    }
  }
  /* Where the sentences actually go. A paragraph folded into the argument
   * block has no element of its own (`into`), so §6 rule 2's emphasis needs
   * an inline carrier of its own -- one per folded paragraph, so a run whose
   * paragraphs differ keeps each one's. §6 rule 4: `.argument` is only
   * smaller and dimmer, and does not set `font-style`, so the italic all 22
   * of Blood Meridian's arguments carry arrives here for free. */
  let sink = el;
  if (into && para.style) {
    sink = document.createElement("span");
    sink.className = "paraStyle";
    sink.dataset.style = String(para.style);
    into.appendChild(sink);
  }
  for (const sent of para.sentences) {
    const sEl = document.createElement("span");
    sEl.className = "sentence";
    sEl.dataset.id = sent.id;
    sEl.dataset.text = sent.text;
    sEl.dataset.lang = effectiveLang(chapter, sent) || pane.book.lang;
    for (const w of sent.words) {
      const wEl = document.createElement("span");
      wEl.className = "word";
      wEl.dataset.id = w.id;
      wEl.dataset.text = w.text;
      if (w.phon) wEl.dataset.phon = w.phon;
      wEl.textContent = w.raw;
      // AROUND the word, never in place of it: `pane.wordEls` still holds the
      // word span itself, and what goes into the sentence is the wrapper.
      sEl.appendChild(styleWord(wEl, w.style));
      sEl.appendChild(document.createTextNode(" "));
      pane.wordEls.set(w.id, wEl);
    }
    sink.appendChild(sEl);
    pane.sentenceEls.set(sent.id, sEl);
    pane.chapterSentenceOrder.push(sent.id);
  }
  if (!into) parent.appendChild(el);
  return el;
}

/* THE CHAPTER'S BODY, PAINTED INTO A GIVEN ELEMENT. Lifted verbatim out of
 * renderChapter so that the same code can paint one chapter into the run, or
 * every chapter of the book into its own section for continuous reading --
 * the difference between the two must never be a second copy of this loop,
 * because every span shape in it is load-bearing (.word, .sentence and their
 * data-ids carry sync, find, marginalia, lookup and one-word). */
function paintChapterInto(pane, chapter, run) {
  for (const item of groupArguments(groupTurns(chapter.paragraphs, bookHasCues(pane.book)))) {
    if (item.argument) {
      // ONE element for the whole run, and the sentences of every paragraph
      // in it go straight in -- separated by a space, which is what a run of
      // clauses set as one line needs and what the dashes already punctuate.
      const argEl = document.createElement("div");
      argEl.className = "argument";
      argEl.dataset.kind = "argument";
      argEl.dataset.paragraphs = String(item.argument.length);
      for (const para of item.argument) renderParagraph(pane, chapter, para, null, argEl);
      run.appendChild(argEl);
      continue;
    }
    if (item.para) {
      if (isTitleEcho(chapter, item.para)) continue;
      if (isNextChapterHeading(pane.book.chapters, chapter, item.para)) continue;
      renderParagraph(pane, chapter, item.para, run);
      continue;
    }
    const turnEl = document.createElement("div");
    turnEl.className = "turn";
    if (item.speaker) turnEl.dataset.speaker = item.speaker;
    if (item.cue) {
      renderParagraph(pane, chapter, item.cue, turnEl);
    } else {
      // A NAME:-prefixed edition has no cue paragraph: the name lives only in
      // Paragraph.speaker, so the label is furniture, not the book's text --
      // no sentence, no word id, nothing to tap or highlight.
      const label = document.createElement("p");
      label.className = "speaker";
      label.dataset.role = "speaker";
      label.dataset.derived = "speaker";
      label.textContent = item.speaker;
      turnEl.appendChild(label);
    }
    const body = document.createElement("div");
    body.className = "turn-body";
    for (const para of item.paras) renderParagraph(pane, chapter, para, body);
    turnEl.appendChild(body);
    run.appendChild(turnEl);
  }
}

/* ================= THE BOOK, IN ONE SCROLL, WITH SLIDES ==================
 * The old reader painted ONE chapter and replaced it on every turn, so there
 * was nothing to scroll between and no divider to scroll past. Under Frank
 * the whole book is built once -- every chapter a section, each opening on a
 * full-screen slide carrying its title -- and turning a chapter becomes a
 * scroll rather than a repaint. pane.book.chapters already holds every
 * chapter's paragraphs, so nothing has to be fetched for this.
 *
 * IT USES THE SAME PAINTER. paintChapterInto is the loop the old path uses,
 * called once per chapter into its own section, so every .word and .sentence
 * is the shape the rest of the app expects -- and the maps it fills now span
 * the book rather than a chapter, which find and marginalia are better for.
 *
 * The snap markers are invisible one-pixel elements, never the content: a
 * slide halts a swipe (scroll-snap-stop:always), and so does the first line
 * of the text after it, so scrolling up from mid-chapter lands on the text
 * rather than back on the divider. */
function renderBookRun(pane, chapterId) {
  const book = pane.book;
  const run = clearReading(pane);
  const built = pane._fkBuiltFor === book;
  pane.currentChapterId = chapterId;
  pane._swappedFor = null;
  rememberPositionSoon();
  const chapter = book.chapters.find(c => c.id === chapterId) || book.chapters[0];
  if (pane.els.chapterSelect) pane.els.chapterSelect.value = chapterId;
  if (pane.els.chapterTitle) pane.els.chapterTitle.textContent = chapter ? chapter.title : "";
  paintBookBar();

  pane.sentenceEls = new Map();
  pane.wordEls = new Map();
  pane.activeSentenceEl = null; pane.activeWordEl = null;
  pane.chapterSentenceOrder = [];
  pane.activeDocIdx = null;
  pane.toc = new Map();

  /* the titular slide belongs to the BOOK, so the book provides it -- a book
     that opens on its first chapter looks like one somebody already started */
  if (book.title) {
    const tp = document.createElement("section");
    tp.className = "fkCh fkTitle";
    tp.innerHTML = '<div class="fkOpener"><fksnap></fksnap>' +
      '<h1 class="fkBookTitle">' + esc(book.title) + '</h1>' +
      (book.author ? '<p class="fkByline">' + esc(book.author) + '</p>' : '') + '</div>';
    run.appendChild(tp);
  }
  for (const ch of book.chapters) {
    const sec = document.createElement("section");
    sec.className = "fkCh"; sec.dataset.ch = ch.id;
    const op = document.createElement("div");
    op.className = "fkOpener";
    op.innerHTML = '<fksnap></fksnap><h1>' +
      (ch.number ? '<small>' + esc(String(ch.number)) + '</small>' : '') +
      esc(ch.title || "") + '</h1>';
    sec.appendChild(op);
    const holder = document.createElement("div");
    holder.className = "fkUnit";
    holder.innerHTML = '<fksnap></fksnap>';
    try {
      for (const line of tocModel(book, ch).lines) pane.toc.set(line.id, line.to);
    } catch (e) { /* a book with no contents page is not an error */ }
    paintChapterInto(pane, ch, holder);
    sec.appendChild(holder);
    run.appendChild(sec);
  }
  pane._fkBuiltFor = book;

  const target = run.querySelector('.fkCh[data-ch="' + String(chapterId).replace(/"/g, '\\"') + '"]');
  if (target) target.scrollIntoView({ behavior: built ? "smooth" : "auto", block: "start" });

  pane.chapterReady = Promise.all([loadTimings(pane, chapterId), loadAudio(pane, chapter)]);
  if (pane === panes[0]) updateUrl();
  if (sidebars[pane.side]) sidebars[pane.side].setCurrent(chapterId);
  pushHostTarget();
  findOnChapterChange(pane);
  owOnChapterChange(pane);
  return true;
}

function renderChapter(pane, chapterId) {
  /* UNDER FRANK THE BOOK IS ONE SCROLL. The old one-chapter path is still
     here and still correct; it is what runs with Frank off. */
  if (document.documentElement.hasAttribute("data-frank") &&
      pane.book && pane.book.chapters && pane.book.chapters.length) {
    try { if (renderBookRun(pane, chapterId)) return; }
    catch (e) { console.warn("frank: continuous run failed, falling back", e); }
  }
  const chapter = pane.book.chapters.find(c => c.id === chapterId);
  if (!chapter) return;
  pane.currentChapterId = chapterId;
  pane._swappedFor = null;
  rememberPositionSoon();
  pane.els.chapterSelect.value = chapterId;
  pane.els.chapterTitle.textContent = chapter.title;
  paintBookBar();   // one source: the chapter the pane is actually showing

  const run = clearReading(pane);
  pane.sentenceEls = new Map();
  pane.wordEls = new Map();
  pane.activeSentenceEl = null;
  pane.activeWordEl = null;
  pane.chapterSentenceOrder = [];
  pane.activeDocIdx = null;
  /* THE DOORS, decided once for the whole chapter and before a paragraph is
   * drawn -- `renderParagraph` only reads this map, so a paragraph can never
   * become a door on its own. Rebuilt on every chapter turn like `wordEls`,
   * for the same reason: it is about the chapter on screen. */
  pane.toc = new Map();
  try {
    for (const line of tocModel(pane.book, chapter).lines) pane.toc.set(line.id, line.to);
  } catch (e) { pane.toc = new Map(); }

  paintChapterInto(pane, chapter, run);

  // Awaited by ReaderControl.playAlignedSegment (voiceui/reader-bridge.js)
  // to know when a chapter switched on the follower pane has real timings
  // and a real clock, not just the DOM rebuilt above.
  pane.chapterReady = Promise.all([loadTimings(pane, chapterId), loadAudio(pane, chapter)]);

  if (pane === panes[0]) updateUrl();
  // Each list follows its OWN pane. Synced they are turned together anyway,
  // so this is the same statement made twice rather than a second rule.
  if (sidebars[pane.side]) sidebars[pane.side].setCurrent(chapterId);
  // NAVIGATION IS A CHANGE OF TARGET (Part 2.2, "on every change, navigation
  // included"): with nothing picked, the chapter you have just turned to IS
  // what studio would render. Deduped, so the joined pair's two calls are one.
  pushHostTarget();
  findOnChapterChange(pane);   // an open find bar follows the chapter (see findOnChapterChange)
  owOnChapterChange(pane);     // and so does the one-word stage, when it is on
  // The marks belong to the words this chapter just built; an anchor in
  // another chapter is not drawn and is not lost (margPaintMargin's last
  // line says how many there are).
  if (pane.marg) margPaint(pane);
}

async function loadTimings(pane, chapterId) {
  pane.currentTimings = null;
  try {
    const raw = await readJSON(pane, `timings/${chapterId}.json`);
    const sentences = Object.keys(raw).map(id => ({
      id, start: raw[id].start, end: raw[id].end,
      words: raw[id].words.slice().sort((a, b) => a.start - b.start),
    }));
    sentences.sort((a, b) => a.start - b.start);
    const duration = sentences.length ? sentences[sentences.length - 1].end : 0;
    pane.currentTimings = { sentences, duration };
    if (pane.clock instanceof VirtualClock) pane.clock.duration = duration || Infinity;
    setStatus(pane, "timings", null);
    tick(pane);
  } catch (e) {
    // NOTHING IS SAID (Osca, 30 Aug evening: "no timings for c009 yet (run
    // reader/tools/fake_timings.py)" is "a sentence for a session, not a
    // reader"). A chapter with no audio yet is the normal state of this app,
    // and naming a script in the reader's chrome is never right. The fact
    // still reaches the reader, in the only place it means anything: the play
    // button goes inert and says why on hover.
    setStatus(pane, "timings", null);
  }
  paintPlayable(pane);
  // whether this chapter has a clock to follow decides what one-word mode's
  // rate control even means, and the answer arrives here, after the mode
  // has already been switched on and drawn once
  owOnTimings(pane);
}

// ------------------------------------------------------------- audio / clock
// Returns a promise resolving once useClock() has run for this call -- every
// branch below ends in exactly one useClock() call, so wrapping each in
// `finish()` gives ReaderControl.playAlignedSegment (voiceui/reader-bridge.js)
// something to await instead of guessing when a chapter switch is done.
// Behavior is otherwise unchanged from before this was wrapped.
function loadAudio(pane, chapter) {
  const native = pane.els.audioEl;
  native.pause();
  native.removeAttribute("src");
  native.load();

  return new Promise((resolve) => {
    const finish = (clock) => { useClock(pane, clock); resolve(); };

    if (pane.fileMap) {
      for (const ext of AUDIO_EXTS) {
        const f = pane.fileMap.get(`audio/${chapter.id}.${ext}`);
        if (f) {
          native.src = URL.createObjectURL(f);
          native.load();
          finish(native);
          return;
        }
      }
      finish(new VirtualClock());
      return;
    }

    // fetch mode: try candidate extensions in turn; fall back to a virtual
    // clock if none exist (voice/ hasn't produced audio for this book yet).
    let i = 0;
    const tryNext = () => {
      if (i >= AUDIO_EXTS.length) {
        native.onerror = null;
        native.oncanplay = null;
        finish(new VirtualClock());
        return;
      }
      native.src = joinPath(pane.bookPath, `audio/${chapter.id}.${AUDIO_EXTS[i++]}`);
      native.load(); // preload="none" won't probe the src on its own; force it so onerror fires promptly
    };
    native.onerror = tryNext;
    native.oncanplay = () => { native.onerror = null; native.oncanplay = null; finish(native); };
    tryNext();
  });
}

function useClock(pane, newClock) {
  // Keyed on pane._listenersClock, not pane.clock: pane.clock is pre-seeded to the
  // native <audio> element at pane setup (before any chapter loads), so gating
  // attach/detach on `pane.clock !== newClock` would skip attaching listeners
  // entirely the first time a chapter's real audio reuses that same element.
  if (pane._listenersClock !== newClock) {
    if (pane._listenersClock) {
      pane._listenersClock.removeEventListener("play", pane._onPlay);
      pane._listenersClock.removeEventListener("pause", pane._onPause);
    }
    pane._onPlay = () => onClockPlay(pane);
    pane._onPause = () => onClockPause(pane);
    newClock.addEventListener("play", pane._onPlay);
    newClock.addEventListener("pause", pane._onPause);
    pane._listenersClock = newClock;
  }
  pane.clock = newClock;
  pane.clock.currentTime = 0;
  pane.clock.muted = pane.muted;
  pane.clock.playbackRate = pane.rate;
  pane.els.playBtn.innerHTML = BAR.play;
  paintPlayable(pane);
  owOnClockChanged(pane);   // and the one-word stage's voice control with it
  renderStatus(pane);
  tick(pane);
}

/* ================================================ PRESENT, OR NOT PRESENT
 * READER_FIRST.md, "Decided three times": **the page speaks to the reader,
 * never to the developer**, and a control that cannot do anything is not
 * shown. Osca's three chrome items (30 Aug, "Logged for later") all say the
 * same thing about three different controls, and all three say ABSENT rather
 * than hidden -- "it does not exist in the DOM, not merely hidden".
 *
 * That distinction is not pedantry. A `hidden` control is still focusable by
 * a screen reader that ignores the attribute, still counted by every test
 * that queries the page, and still one CSS rule away from coming back; and a
 * disabled play button on a book that will never have audio is the app
 * showing its own plumbing. So these three come out of the tree and go back
 * into the same slot when they mean something again.
 *
 * `slotOf` remembers the parent and the following sibling at the moment of
 * removal, so a control returns to the position it left rather than to the
 * end of its group -- the volume goes back BEFORE the transport, not after
 * it. `nextSibling` is not in the node harness's DOM, so the neighbour is
 * found through `childNodes`, which is. */
const DOM_SLOTS = new Map();
function slotOf(el) {
  const parent = el.parentNode;
  const kids = (parent && parent.childNodes) || [];
  const i = Array.prototype.indexOf.call(kids, el);
  return { parent, next: (i >= 0 && i + 1 < kids.length) ? kids[i + 1] : null };
}
function keepInDom(el, on) {
  if (!el) return null;
  if (on) {
    if (el.parentNode) return el;
    const slot = DOM_SLOTS.get(el);
    if (!slot || !slot.parent) return el;
    const next = (slot.next && slot.next.parentNode === slot.parent) ? slot.next : null;
    if (next) slot.parent.insertBefore(el, next); else slot.parent.appendChild(el);
    return el;
  }
  if (!el.parentNode) return el;
  DOM_SLOTS.set(el, slotOf(el));
  el.parentNode.removeChild(el);
  return el;
}

/* Can this chapter be played at all? THE QUESTION IS THE MASTER, AND ONLY
 * THE MASTER (Osca, 1 Sep, off the live app: "The Hippopotamus (no audio)
 * currently shows the full transport bar; that's the regression -- hide the
 * player and volume when there's no master for the chapter").
 *
 * It used to be `real || timed` -- real audio, OR timings with a VirtualClock
 * under them -- and `timed` is what let the bar through. Poems c009 has word
 * timings on disk and no `audio/c009.wav`, so it got a play button, a volume
 * and a clock for a silence, which is exactly the "no playback where no voice
 * exists" rule being broken by the one case the rule was written about. A
 * VirtualClock is nothing but the timings: pressing play on one plays
 * nothing, and a control that plays nothing is not shown.
 *
 * What that costs, said plainly: the silent timing preview can no longer be
 * started from the reading pane. It is not lost -- one-word view keeps its
 * own bar and the VirtualClock still drives the highlighter there, which is
 * the exception READER_FIRST.md already carves out ("the wpm clock IS the
 * playback"), and the moment a master lands the transport comes back with it
 * (`swapIn` repaints).
 *
 * **No playback where no voice exists** (Osca, 30 Aug): a chapter with no
 * rendered audio shows only the chapter-change buttons. The play button, the
 * clock and the whole left group -- mute and volume -- come out; `prevBtn`
 * and `nextBtn` stay, because changing chapter is a thing this page can still
 * do. There is no disabled-with-a-reason state any more: the reason was
 * "there is no audio", and a bar with no transport in it says that better
 * than a tooltip does.
 *
 * **Except the volume, when the microphone is on.** In chat (voiceui, the
 * hands-free layer) audio is coming back regardless of whether the chapter
 * has a rendered voice, so a reader who wants it quieter must be able to
 * make it quieter. `MIC_ON` is this page's own flag, set only through
 * `ReaderControl.setMicActive()` -- the one seam voiceui/ is allowed to
 * depend on. Nothing here reads a voiceui class or a voiceui element: the
 * reader does not know what a pill is.
 *
 * **And one-word view keeps its transport with no voice at all**, because
 * there the wpm clock IS the playback. That exception needs no code: the
 * one-word stage has its own bar (`#owBar`) and `#panes` is not on screen at
 * all while it runs. A test says so, so that it stays true. */
let MIC_ON = false;
function paintPlayable(pane) {
  // the master, and nothing else: a VirtualClock is silence with a clock on it
  const can = !(pane.clock instanceof VirtualClock);
  keepInDom(pane.els.playBtn, can);
  keepInDom(pane.els.pcLeft, can || MIC_ON);
  keepInDom(pane.els.timeLabel, can);
  return can;
}

/* The joined bar is the same bar for two panes, so it obeys the same rule --
 * against the pane that currently has the voice. */
/* Held once, and captured EAGERLY at the first ask, before anything can have
 * removed them. Three of the bar's parts come and go with the chapter's
 * audio, and a detached element cannot be found by a query. */
let masterEls = null;
function masterBarEls() {
  if (masterEls) return masterEls;
  const bar = document.getElementById("masterControls");
  if (!bar) return null;
  masterEls = {
    bar, play: bar.querySelector(".playBtn"), pcLeft: bar.querySelector(".pcLeft"),
    time: bar.querySelector(".timeLabel"),
  };
  return masterEls;
}
function paintMasterPlayable(can) {
  const m = masterBarEls();
  if (!m) return can;
  keepInDom(m.play, can);
  keepInDom(m.pcLeft, can || MIC_ON);
  keepInDom(m.time, can);
  return can;
}

/* Called by voiceui through ReaderControl when the mic layer arms or goes
 * quiet. It repaints every bar, because the volume's presence is the only
 * thing it decides. */
function setMicActive(on) {
  const next = !!on;
  if (next === MIC_ON) return MIC_ON;
  MIC_ON = next;
  for (const p of panes) paintPlayable(p);
  const v = voicePane();
  if (v) paintMasterPlayable(paintPlayable(v));
  return MIC_ON;
}

function otherPane(pane) {
  return panes.length === 2 ? panes.find(p => p !== pane) : null;
}

function onClockPlay(pane) {
  pane.els.playBtn.innerHTML = BAR.pause;
  if (panes.length === 2) masterSide = pane.side;
  if (OW.on && pane === OW.pane) owOnPaneClock(true);
}
function onClockPause(pane) {
  pane.els.playBtn.innerHTML = BAR.play;
  if (OW.on && pane === OW.pane) owOnPaneClock(false);
