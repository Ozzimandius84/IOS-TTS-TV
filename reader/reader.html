  if (panes.length === 2 && masterSide === pane.side) {
    const other = otherPane(pane);
    masterSide = (other && !other.clock.paused) ? other.side : null;
    if (!masterSide) setStatus(otherPane(pane) || pane, "sync", null);
  }
}

// Small per-key status line (audio-mode badge + any error), so an audio
// fallback badge and a timings error can both show without one clobbering
// the other -- each caller only ever touches its own key.
function setStatus(pane, key, msg) {
  if (msg) pane.statusMsgs[key] = msg; else delete pane.statusMsgs[key];
  renderStatus(pane);
}
function renderStatus(pane) {
  // No "no audio yet -- silent timing preview" badge (Osca, 30 Aug: "well
  // obviously, that's obvious"). A book with no rendered audio is the normal
  // state of this app for now, and a badge on every page that states the
  // normal state is furniture, not information. The real errors -- a timings
  // file that would not load, a book that would not -- still come through
  // `statusMsgs` and still show.
  const bits = [];
  for (const k of Object.keys(pane.statusMsgs)) bits.push(pane.statusMsgs[k]);
  pane.els.status.innerHTML = bits.map(b => `<span class="badge">${b}</span>`).join("");
}

// --------------------------------------------------------------- highlight
function setActiveSentence(pane, el) {
  if (pane.activeSentenceEl === el) return;
  if (pane.activeSentenceEl) pane.activeSentenceEl.classList.remove("now");
  pane.activeSentenceEl = el;
  if (pane.activeSentenceEl) {
    pane.activeSentenceEl.classList.add("now");
    pane.activeSentenceEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}

function setActiveWord(pane, el) {
  if (pane.activeWordEl === el) return;
  if (pane.activeWordEl) pane.activeWordEl.classList.remove("now");
  pane.activeWordEl = el;
  if (pane.activeWordEl) pane.activeWordEl.classList.add("now");
  // The furthest word actually reached, so a position survives the highlight
  // being cleared at the end of a chapter (§4c: a word id, never an offset).
  if (el && el.dataset && el.dataset.id) { pane.lastSeenWordId = el.dataset.id; rememberPositionSoon(); }
}

function tick(pane) {
  if (!pane.currentTimings || !pane.currentTimings.sentences.length) return;
  const t = pane.clock.currentTime;
  const sIdx = findIndex(pane.currentTimings.sentences, t);
  const sent = pane.currentTimings.sentences[sIdx];
  setActiveSentence(pane, pane.sentenceEls.get(sent.id) || null);
  pane.activeDocIdx = pane.chapterSentenceOrder.indexOf(sent.id);

  if (!pane.clock.paused && sent.words.length) {
    const wIdx = findIndex(sent.words, t);
    setActiveWord(pane, pane.wordEls.get(sent.words[wIdx].id) || null);
  } else {
    setActiveWord(pane, null);
  }
  pane.els.timeLabel.textContent = fmtTime(t);
}

function currentSentenceIndex(pane) {
  if (!pane.currentTimings || !pane.currentTimings.sentences.length) return -1;
  return findIndex(pane.currentTimings.sentences, pane.clock.currentTime);
}

function seekSentence(pane, delta) {
  if (!pane.currentTimings || !pane.currentTimings.sentences.length) return;
  const idx = Math.min(pane.currentTimings.sentences.length - 1, Math.max(0, currentSentenceIndex(pane) + delta));
  pane.clock.currentTime = pane.currentTimings.sentences[idx].start + 0.001;
  tick(pane);
}

/* The single bar, wired once. Every control reaches through to a real pane;
 * nothing is stored here, so the bar cannot disagree with the reader. */
function wireMasterBar() {
  const bar = document.getElementById("masterControls");
  if (!bar || bar.dataset.wired) return;
  bar.dataset.wired = "1";
  // wired ONCE, on the elements themselves, so a control that paintPlayable
  // later takes out of the document keeps its handler and works again the
  // moment it goes back in
  const q = (sel) => bar.querySelector(sel);
  // play and the time label come from `masterBarEls()`, not from a fresh
  // query: by the time this runs a chapter with no audio may already have
  // taken them out of the document, and `bar.querySelector` would answer
  // null for a button that exists and is about to be needed again.
  const m = masterBarEls();
  const play = m.play, prev = q(".prevBtn"), next = q(".nextBtn");
  const mute = q(".muteBtn") || (m.pcLeft && m.pcLeft.querySelector(".muteBtn"));
  const vol = q(".volume") || (m.pcLeft && m.pcLeft.querySelector(".volume"));
  prev.innerHTML = BAR.prev; next.innerHTML = BAR.next; play.innerHTML = BAR.play;
  mute.innerHTML = BAR.speaker;

  play.addEventListener("click", () => {
    const p = voicePane();
    if (!p) return;
    if (p.clock.paused) p.clock.play(); else p.clock.pause();
  });
  prev.addEventListener("click", () => {
    const p = voicePane();
    if (!p) return;
    const t = p.clock && typeof p.clock.currentTime === "number" ? p.clock.currentTime : 0;
    if (t > 3) { p.clock.currentTime = 0; return; }
    // Synced means both books turn the page, not just the one being spoken.
    for (const q2 of panes) chapterStep(q2, -1);
  });
  next.addEventListener("click", () => { for (const q2 of panes) chapterStep(q2, 1); });

  // ONE VOLUME. Two bars meant two of them, which is two of a thing a single
  // pair of ears has one of.
  mute.addEventListener("click", () => {
    const on = !(voicePane() && voicePane().muted);
    for (const p of panes) setMuted(p, on);
    mute.classList.toggle("active", on);
    mute.innerHTML = on ? BAR.muted : BAR.speaker;
    mute.setAttribute("aria-label", on ? "Unmute" : "Mute");
  });
  vol.addEventListener("input", () => {
    const v = Number(vol.value) / 100;
    for (const p of panes) {
      p.volume = v;
      if (p.clock) p.clock.volume = v;
      if (p.els.audioEl) p.els.audioEl.volume = v;
      if (v > 0 && p.muted) setMuted(p, false);
      if (p.els.volume) p.els.volume.value = String(Math.round(v * 100));
    }
    if (v > 0) { mute.classList.remove("active"); mute.innerHTML = BAR.speaker; }
  });

  const side = document.getElementById("voiceSideBtn");
  if (side) side.addEventListener("click", swapVoice);
}

/* `\`'s meaning while synced, and the voice chip's click. */
function swapVoice() {
  if (panes.length !== 2) return;
  const other = otherPane(voicePane());
  if (!other) return;
  // The voice moves; the place in the poem does not. Whichever pane was
  // speaking, the other is already sitting on the matching sentence because
  // syncFollower put it there -- so the swap is silent and instantaneous.
  const was = voicePane();
  if (was && !was.clock.paused) { was.clock.pause(); other.clock.currentTime = other.clock.currentTime; other.clock.play(); }
  setVoiceSide(other.side);
}

/* The bar reads its own state off the pane every frame rather than being
 * pushed at from six places -- the play icon, the clock, and the mute. */
function paintMasterBar() {
  const bar = document.getElementById("masterControls");
  if (!bar || bar.hidden) return;
  const p = voicePane();
  if (!p) return;
  // the joined bar drives the voice's pane, so it carries exactly what that
  // pane's own bar carries
  paintMasterPlayable(paintPlayable(p));
  const m = masterBarEls();
  const play = m && m.play && m.play.parentNode ? m.play : null;
  if (play) {
    const want = p.clock.paused ? BAR.play : BAR.pause;
    if (play.dataset.icon !== want) { play.innerHTML = want; play.dataset.icon = want; }
    play.setAttribute("aria-label", p.clock.paused ? "Play" : "Pause");
  }
  const t = m && m.time && m.time.parentNode ? m.time : null;
  if (t) {
    const now = fmtTime(p.clock.currentTime || 0);
    if (t.textContent !== now) t.textContent = now;
  }
}

// ------------------------------------------------------------ cross-pane sync
// The master is whichever pane's clock is currently playing (set in
// onClockPlay/onClockPause above). The other pane -- the follower -- is
// driven here: same chapter id (books share chapter numbering by design,
// core/schema.py), then the nearest sentence by position within the
// chapter. This is a stand-in for a real align.json (sentence_id ->
// sentence_id map), which doesn't exist for this pair yet -- see
// loadAlign(). Sentence-level only: the follower's own
// audio/timings are never touched, and its word highlight is always
// cleared, so word highlighting never crosses languages.
let masterSide = null;

function syncFollower(master, follower) {
  if (master.activeDocIdx == null || master.activeDocIdx < 0 || !master.currentChapterId) return;

  if (follower.currentChapterId !== master.currentChapterId) {
    if (!follower.book || !follower.book.chapters.some(c => c.id === master.currentChapterId)) {
      setStatus(follower, "sync", `no chapter ${master.currentChapterId} in this book`);
      return;
    }
    renderChapter(follower, master.currentChapterId);
  }

  const masterSentId = master.chapterSentenceOrder[master.activeDocIdx];
  let targetId = null;
  const alignTargets = alignMap && alignMap[masterSentId];
  if (alignTargets && alignTargets.length) {
    targetId = alignTargets.find(id => follower.sentenceEls.has(id)) || null;
  }
  if (!targetId) {
    const mCount = master.chapterSentenceOrder.length;
    const fCount = follower.chapterSentenceOrder.length;
    if (!mCount || !fCount) return;
    const fIdx = nearestIndex(master.activeDocIdx, mCount, fCount);
    targetId = follower.chapterSentenceOrder[fIdx];
  }
  setActiveSentence(follower, follower.sentenceEls.get(targetId) || null);
  setActiveWord(follower, null); // never word-level across languages
  // AND IT SAYS NOTHING (Osca, 1 Sep: "the sync banner AND the `following
  // left / following right` chip -- no element, no words, nothing above or
  // between the panes"). The follower moving IS the fact; a chip over it
  // repeating the fact in words was the last piece of sync state left on the
  // page. The strip's ⧉ is the only place sync is shown now.
}

// persistent render loop: drives both real <audio> (sparse timeupdate) and
// the virtual clock (no events of its own) at a smooth, uniform rate.
function frame() {
  if (!Array.isArray(panes)) { requestAnimationFrame(frame); return; }
  for (const pane of panes) {
    if (pane.clock && !pane.clock.paused) {
      tick(pane);
      if (pane.clock instanceof VirtualClock && pane.clock.currentTime >= pane.clock.duration) pane.clock.pause();
    }
  }
  if (panes.length === 2 && masterSide) {
    const master = panes.find(p => p.side === masterSide);
    const follower = otherPane(master);
    if (master && follower && follower.clock.paused) syncFollower(master, follower);
  }
  paintMasterBar();
  // The one-word stage rides the same loop, so the word on the stage and the
  // word lit in the text behind it are decided by one clock, once.
  if (typeof OW !== "undefined" && OW.on && owOnClock()) owFollowClock();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ------------------------------------------------------------------ align.json
// Per PLAN.md's v2/reader-ui spec, the follower should sync via align.json
// (sentence_id -> [sentence_id...]) when present, and by nearest position
// otherwise. reader/tools/align_books.py (a later, queued step) is what
// would produce it; until then this must say so, not pretend the
// proportional fallback above is a real alignment.
let alignMap = null;

async function loadAlign() {
  if (panes.length !== 2) return;
  try {
    const res = await fetch(joinPath(panes[0].bookPath, "align.json"));
    if (res.ok) alignMap = await res.json();
  } catch (e) { /* absent or unreadable (e.g. file:// fetch block) -- treated the same as "doesn't exist" */ }
  // and nothing is drawn about it. Whether this pair has an align.json is a
  // fact about the sync, and sync state is shown nowhere on this page.
}

// The shortest honest name for a book: the subtitle after a colon or a dash
// goes, a leading article goes, and a trailing "of/by <the author>" goes
// ("The Collected Poems of Wallace Stevens" -> "Collected Poems"). Nothing is
// invented and nothing is cut to a character count -- what is still too long
// is truncated by CSS, where the ellipsis can be measured against the space
// there actually is. A book with no title (or none loaded yet) keeps
// `fallback`, which is its side.
function shortTitle(book, fallback) {
  const raw = book && book.title ? String(book.title).trim() : "";
  if (!raw) return fallback;
  let t = raw.split(/\s[-\u2013\u2014]\s|[:;]/)[0].trim();
  t = t.replace(/^(?:the|a|an)\s+/i, "");
  const author = book && book.author ? String(book.author).trim() : "";
  const surname = author ? author.split(/\s+/).pop().toLowerCase() : "";
  if (surname && t.toLowerCase().endsWith(surname) && /\s(?:of|by)\s/i.test(t)) {
    const head = t.replace(/\s(?:of|by)\s[^,]*$/i, "").trim();
    if (head) t = head;
  }
  return t || fallback;
}

/* THE BANNER IS GONE (Osca, 1 Sep, third time: "REMOVE THAT BANNER
 * COMPLETELY"). `alignBannerText()` and `renderAlignBanner()` stood here:
 * one line on a pair -- the two books' short names and one of two verdicts
 * on their alignment -- drawn into `#globalStatus` above both panes, with a
 * longer sentence behind a tap. Both are deleted, `#globalStatus` with them,
 * and neither verdict's words are written anywhere in this file any more
 * (`reader/tests/test_pane_layout.py` holds that literally).
 *
 * WHERE SYNC STATE LIVES NOW: in the strip's `⧉` tool, which is on or off,
 * and nowhere else. Not above the panes, not between them, not as a chip in
 * a pane's own status line. `shortTitle()` above survives because the pane
 * switch (`paintPaneSwitch`) still needs it; nothing else here does. */

<script>
// ------------------------------------------------------ drag-to-close sheets
// PROMPTS/reader-owed-2.md step 3. Both sheets -- the chapter sidebar from the
// left, the dictionary from the bottom -- follow the finger and close when let
// go past the point iOS uses: a third of the sheet's own size, or a flick.
// The x is untouched; this is the gesture *as well as* the button, never
// instead of it.
//
// The numbers, all in one place:
//   slop 8      -- px before a touch is a drag at all (and before the axis is
//                  decided: a gesture that is more across than along is the
//                  list scrolling, and is handed back)
//   fraction 1/3 -- of the sheet's own width/height, the distance that closes it
//   far 96      -- the same rule where the sheet has no measurable size (the
//                  node harness has no layout), so the logic is still testable
//   flick 0.5   -- px/ms in the closing direction: a flick closes from anywhere
const SHEET_DRAG = { slop: 8, fraction: 1 / 3, far: 96, flick: 0.5 };

// Pure: distance travelled towards closed, the sheet's own extent (0 when
// unknown), and how long the drag took -> "close" or "snap".
function sheetDragVerdict(moved, extent, elapsedMs) {
  if (moved < SHEET_DRAG.slop) return "snap";
  if (extent > 0 ? moved >= extent * SHEET_DRAG.fraction : moved >= SHEET_DRAG.far) return "close";
  if (elapsedMs > 0 && moved / elapsedMs >= SHEET_DRAG.flick) return "close";
  return "snap";
}

// Wire one sheet. `handle` is what the finger may start on (the whole sidebar;
// the dictionary's grabber and header, so its gloss keeps scrolling), `sheet`
// is what moves, `sign` is which way closed lies (-1 = left, +1 = down).
// Phone only: on a desktop these are a drawer and a popup, and a mouse drag
// across them is a text selection.
function makeSheetDrag({ handle, sheet, axis, sign, extent, close, canStart }) {
  let id = null, x0 = 0, y0 = 0, t0 = 0, live = false, moved = 0, swallowClick = false;
  const time = (e) => (typeof e.timeStamp === "number" && e.timeStamp) ? e.timeStamp : performance.now();
  const put = (px) => { sheet.style.transform = axis === "x" ? `translateX(${px}px)` : `translateY(${px}px)`; };
  function letGo() {
    if (id !== null && sheet.releasePointerCapture) { try { sheet.releasePointerCapture(id); } catch (e) { /* not captured */ } }
    id = null; live = false;
    sheet.classList.remove("dragging");
    sheet.style.transform = "";
  }
  handle.addEventListener("pointerdown", (e) => {
    swallowClick = false;                                      // a fresh touch is never the tail of a drag
    if (!isPhone() || id !== null) return;
    if (e.pointerType === "mouse") return;                     // a mouse drag here is a selection
    if (e.target && e.target.closest && e.target.closest("button, a, select, input, textarea")) return;
    if (canStart && !canStart()) return;
    id = e.pointerId; x0 = e.clientX; y0 = e.clientY; t0 = time(e); live = false; moved = 0;
  });
  handle.addEventListener("pointermove", (e) => {
    if (id === null || e.pointerId !== id) return;
    const along = (axis === "x" ? e.clientX - x0 : e.clientY - y0) * sign;   // + = towards closed
    const across = Math.abs(axis === "x" ? e.clientY - y0 : e.clientX - x0);
    if (!live) {
      if (across > SHEET_DRAG.slop && across >= along) { id = null; return; }   // that is a scroll
      if (along < SHEET_DRAG.slop) return;
      live = true;
      sheet.classList.add("dragging");
      if (sheet.setPointerCapture) { try { sheet.setPointerCapture(id); } catch (err) { /* no capture here */ } }
    }
    moved = Math.max(0, along);
    put(sign * moved);
    if (e.cancelable) e.preventDefault();
  });
  const end = (e) => {
    if (id === null || e.pointerId !== id) return;
    const wasLive = live, dist = moved, ms = time(e) - t0;
    const verdict = wasLive ? sheetDragVerdict(dist, extent() || 0, ms) : "snap";
    if (verdict !== "close") { swallowClick = wasLive; letGo(); return; }
    // Closing: drop `.dragging` so the transition is back, but hold the inline
    // offset one frame longer -- clearing it first would spring the sheet to
    // wide open and only then slide it shut. One frame later it is gone, and
    // the sheet finishes from exactly where the finger left it.
    if (id !== null && sheet.releasePointerCapture) { try { sheet.releasePointerCapture(id); } catch (err) { /* not captured */ } }
    id = null; live = false;
    sheet.classList.remove("dragging");
    swallowClick = true;
    close();
    requestAnimationFrame(() => { sheet.style.transform = ""; });
  };
  handle.addEventListener("pointerup", end);
  handle.addEventListener("pointercancel", (e) => { if (id !== null && e.pointerId === id) letGo(); });
  // A drag that ends over a chapter row must not also open that chapter: the
  // one click a finished drag produces is swallowed. Not a time window -- the
  // flag is cleared by the next pointerdown, so the very next real tap, however
  // soon it comes, still goes through.
  handle.addEventListener("click", (e) => {
    if (!swallowClick) return;
    swallowClick = false;
    e.stopPropagation(); e.preventDefault();
  }, { capture: true });
  return { verdict: sheetDragVerdict };
}

// The dictionary sheet's drag is wired per pane, in makePane().

<script>
// ------------------------------------------------------------------ controls
let focusedPane = null;

/* One chapter along, clamped. The order is the book's own chapter order --
 * the same list the sidebar paints -- so the bar and the sidebar can never
 * disagree about what "next" means. */
function chapterStep(pane, delta) {
  const ids = ((pane.book && pane.book.chapters) || []).map((c) => c.id);
  const i = ids.indexOf(pane.currentChapterId);
  if (i < 0) return;
  const j = Math.max(0, Math.min(ids.length - 1, i + delta));
  if (j !== i) renderChapter(pane, ids[j]);
}

/* =====================================================================
 * SYNCED OR SPLIT  (Osca, 30 Aug)
 *
 * The parallel view was built as two independent readers side by side, and
 * that is one reader too many: "One person listens right, viewing one screen."
 * A single listener has one pair of ears, one volume and one place in the
 * poem, so SYNCED is the default and it means exactly three things:
 *
 *   1. ONE BAR (#masterControls) instead of two.
 *   2. The pages move together -- an arrow key steps the voice pane and the
 *      other follows by sentence (`syncFollower`, which already existed for
 *      playback), and a scroll in one carries the other proportionally.
 *   3. THE PANE KEY CHANGES THE VOICE, because it has nothing else left
 *      to change.
 *
 * SPLIT is the old behaviour, and there `\` means the other thing it could
 * mean: it selects a side -- that side's page and that side's bar -- and
 * deliberately does NOT touch the voice, which carries on where it was.
 *
 * The proportional scroll is the same stand-in `syncFollower` already uses
 * for a missing align.json: position within the chapter, not meaning. When a
 * real sentence map exists both should be re-cut against it together.
 * ===================================================================== */
let SYNCED = true;
try { SYNCED = localStorage.getItem("readerPanesSynced") !== "0"; } catch (e) { /* ignore */ }

/* ================================== `\` SELECTS, `z` PROMOTES
 * Osca, 31 Aug late (READER_FIRST.md): *"With two books open, <select> moves
 * the selection between the two panes (unchanged). <cycle> cycles the
 * selected pane's layout through three states -- equal -> promoted (the
 * selected book takes most of the width, the other becomes a narrow column)
 * -> exclusive (the other is hidden entirely) -> back to equal. The state is
 * locked to the layout, not the selection: with a book promoted or exclusive,
 * <select> still switches which book is selected/shown, and the layout stays.
 * One book open: neither key does anything."*
 *
 * THE TWO KEYS ARE `\` AND `z` SINCE 1 SEP, and were Tab and Shift-Tab
 * before it (Osca: *"`\` selects the other pane and `z` cycles its layout,
 * replacing the Tab/Shift-Tab pane keys; Tab is freed for the app nav"*).
 * NOTHING ELSE IN THIS SECTION MOVED -- the three facts, the lock and the
 * one-book no-op are what they were, and every branch below already went
 * through `TTSTVSettings.hotkeyIs`, so the rebind is two `defs` in
 * `settings.js` and prose here. **This page no longer answers to Tab in any
 * branch**, which is the whole point of the change: the tab strip is the
 * application's and a reader that ate Tab on every press left the nav with no
 * way in from the keyboard.
 *
 * THREE FACTS, AND THEY ARE INDEPENDENT. `SYNCED` is whether the two books
 * move together; `voiceSide`/`focusedPane` is which one the selection is on;
 * `PANE_LAYOUT` is how the width is shared. Locking the layout to the
 * selection -- resetting to equal on a `\` -- is the one thing the quote
 * forbids, so nothing below writes `PANE_LAYOUT` except `setPaneLayout`.
 *
 * WHY A SECOND WORD FOR "SELECTED". `focusedPane` is a SPLIT idea and always
 * was: synced, the two pages already move together and the only thing left to
 * choose is which book speaks, which is `voiceSide`. The layout needs one
 * answer in both modes, so `selectedPane()` is that one answer -- the voice's
 * pane synced, the focused pane split -- and the watermark and the strip's
 * tools ask it too, so the mark, the chapter list and the wide column can
 * never name three different books.
 *
 * It survives a reload like `SYNCED` does, and for the same reason: the shape
 * of the page is a decision, not a mode you fall out of. */
const PANE_LAYOUTS = ["equal", "promoted", "exclusive"];
let PANE_LAYOUT = "equal";
try {
  const stored = localStorage.getItem("readerPaneLayout");
  if (PANE_LAYOUTS.indexOf(stored) >= 0) PANE_LAYOUT = stored;
} catch (e) { /* ignore */ }

// Held once, because applySync() takes it OUT of the document and a second
// getElementById would then answer null forever.
const syncToggleEl = document.getElementById("syncToggle");
// One book until proved otherwise, so it starts out of the tree rather than
// starting `hidden` and being taken out on the first applySync().
keepInDom(syncToggleEl, false);

// Which pane is being read aloud while synced. Null until there are panes.
let voiceSide = null;

const SYNC_ICON = {
  // two sheets -- the Mac's "duplicate". Shown while SYNCED, because the icon
  // is the DESTINATION (the same rule as the theme button): press it and you
  // get two of them.
  split: '<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">'
    + '<rect x="8.4" y="3.4" width="11.2" height="14.2" rx="2.4" fill="none"'
    + ' stroke="currentColor" stroke-width="1.6"/>'
    + '<path d="M15.4 20.6H6.8a2.4 2.4 0 0 1-2.4-2.4V7.2" fill="none"'
    + ' stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  // one sheet -- the Mac's "copy". Shown while SPLIT: press it and they
  // become one again.
  merge: '<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">'
    + '<rect x="5.6" y="3.4" width="12.8" height="17.2" rx="2.6" fill="none"'
    + ' stroke="currentColor" stroke-width="1.6"/></svg>',
};

function voicePane() {
  return panes.find((p) => p.side === voiceSide) || panes[0] || null;
}

function paneTag(pane) {
  if (!pane) return "";
  const lang = pane.book && pane.book.lang;
  return String(lang || pane.side || "").slice(0, 3);
}

/* THE CAP AN ACTION'S KEY IS ENGRAVED WITH -- for the two strings on this
 * page that name a key in prose. Read off the store rather than typed,
 * because both pane keys are remappable: a hard-coded "Tab to swap" was true
 * on 31 Aug, false on 1 Sep, and false for anybody who rebinds it. A function
 * DECLARATION, not a `const`: `setVoiceSide` runs during boot, far above the
 * `hk` aliases, and a `const` there would still be in its dead zone.
 * Everything is guarded because `settings.js` is a separate file that a
 * harness may not have loaded -- the caller then gets "" and says nothing
 * rather than naming the wrong key. */
function keyCapOf(id, i) {
  try {
    const S = window.TTSTVSettings;
    const combo = (S.hotkeysNow()[id] || [])[i || 0];
    return combo ? S.keyCap(combo) : "";
  } catch (e) { return ""; }
}

function setVoiceSide(side) {
  if (!panes.some((p) => p.side === side)) return;
  voiceSide = side;
  const b = document.getElementById("voiceSideBtn");
  if (b) {
    const p = voicePane();
    b.textContent = paneTag(p);
    // recomputed on every voice change, so a remap is right by the next
    // press of the key it renamed
    const cap = keyCapOf("swap");
    const how = cap ? " " + cap + " to swap." : "";
    b.setAttribute("aria-label", "Reading aloud: the " + (p ? p.side : "") + " book." + how);
    b.title = "Which book is being read aloud" + (cap ? " (" + cap + ")" : "");
  }
  // SYNCED, THE VOICE IS THE SELECTION, so `\` here moves the promoted column
  // exactly as `\` split moves it through `setFocusedPane`. Guarded because
  // `applySync` calls this before the first paint of anything.
  if (typeof applyPaneLayout === "function") applyPaneLayout();
}

function setFocusedPane(pane) {
  if (!pane) return;
  focusedPane = pane;
  for (const p of panes) p.els.root.classList.toggle("focusedPane", p === pane);
  if (pane.els.reading && pane.els.reading.focus) pane.els.reading.focus({ preventScroll: true });
  // split, this is the only move that changes which side the mark names -- and
  // `applyPaneLayout` repaints the mark, so this is the same call it was plus
  // the `.selectedPane` class the promoted column is decided by
  applyPaneLayout();
  // ...and with two books this is also the move that changes which BOOK studio
  // is about (`selectedPane()` is the same question), so the target follows it.
  pushHostTarget();
}

/* WHICH BOOK THE CHROME IS ABOUT, asked in one place. Synced the selection is
 * the voice (`\` swaps it); split it is the focused pane (`\` moves it);
 * one book, it is that book. `panes` is a `let` far below and `paintSidebarBtn()`
 * runs at the top level above it, so every caller of this either guards or is
 * itself guarded -- see `watermarkModel`'s try. */
function selectedPane() {
  if (!panes || !panes.length) return null;
  if (panes.length !== 2) return panes[0];
  if (SYNCED) return voicePane();
  return focusedPane || panes[0];
}

/* The one writer of `PANE_LAYOUT`. With one book on screen the layout is not
 * a control that is temporarily unavailable, it is a control with no meaning
 * (the 31 Aug chrome rule the sync button already follows), so the key is
 * inert and the attribute reads `equal` -- the stored value is kept, so
 * opening a second book gives back the shape this reader was left in. */
function setPaneLayout(name) {
  if (PANE_LAYOUTS.indexOf(name) < 0) return PANE_LAYOUT;
  PANE_LAYOUT = name;
  try { localStorage.setItem("readerPaneLayout", PANE_LAYOUT); } catch (e) { /* ignore */ }
  applyPaneLayout();
  return PANE_LAYOUT;
}

/* `z`. Equal -> promoted -> exclusive -> equal, and NOTHING ELSE MOVES:
 * not the selection, not the sync, not the voice, not the scroll. */
function cyclePaneLayout() {
  if (!panes || panes.length !== 2) return PANE_LAYOUT;   // one book: the key means nothing
  const i = PANE_LAYOUTS.indexOf(PANE_LAYOUT);
  return setPaneLayout(PANE_LAYOUTS[(i + 1) % PANE_LAYOUTS.length]);
}

/* Draws it: the attribute the three CSS rules hang off, and the class that
 * says which column is the wide one. Called by `applySync` (the panes and the
 * mode), `setFocusedPane` (`\`, split) and `setVoiceSide` (`\`, synced) --
 * which is every move that can change either half of the answer. */
function applyPaneLayout() {
  const two = !!(panes && panes.length === 2);
  document.documentElement.dataset.paneLayout = two ? PANE_LAYOUT : "equal";
  const sel = two ? selectedPane() : null;
  if (panes) for (const p of panes) p.els.root.classList.toggle("selectedPane", !!sel && p === sel);
  paintWatermark();   // the mark names the selected book
  pushHostContext();  // and so do the strip's tools
  return PANE_LAYOUT;
}

/* Pure over the page's own state, so the node tests can drive all three
 * layouts with no CSS: what the shape IS, and which book it is about. */
function paneLayoutModel() {
  const two = !!(panes && panes.length === 2);
  const sel = two ? selectedPane() : (panes && panes[0]) || null;
  return {
    layout: two ? PANE_LAYOUT : "equal",
    stored: PANE_LAYOUT,
    two: two,
    selected: sel ? sel.side : null,
    // which columns are on screen, in pane order -- the one fact the three
    // states differ in that a reader would name
    shown: (panes || []).map(p => !(two && PANE_LAYOUT === "exclusive" && p !== sel)),
  };
}

/* One place decides what the whole page looks like in either mode, and it is
 * called on boot, on every toggle, and after the panes are built. */
function applySync() {
  const two = panes.length === 2;
  document.documentElement.dataset.panes = (SYNCED && two) ? "synced" : "split";
  const master = document.getElementById("masterControls");
  if (master) master.hidden = !(SYNCED && two);
  /* NO SYNC CONTROL WITH ONE PANE, and absent rather than hidden (Osca,
   * 30 Aug): joining or splitting is a statement about two things, and with
   * one book on screen it is not a control that is temporarily unavailable
   * -- it is a control that has no meaning. `syncToggleEl` is the page's
   * reference to it, because once it is out of the tree
   * `getElementById` can no longer find it. */
  const btn = syncToggleEl;
  keepInDom(btn, two);
  if (btn && two) {
    btn.innerHTML = SYNCED ? SYNC_ICON.split : SYNC_ICON.merge;
    btn.setAttribute("aria-pressed", SYNCED ? "true" : "false");
    btn.setAttribute("aria-label", SYNCED ? "Read the two books separately" : "Read the two books together");
    btn.title = SYNCED ? "Split the books (they move together now)" : "Join the books (they move apart now)";
  }
  if (two && !voiceSide) setVoiceSide(panes[0].side);
  else if (two) setVoiceSide(voiceSide);
  if (!SYNCED && two && !focusedPane) setFocusedPane(panes[0]);
  applyPaneLayout();   // one book, or a mode change: the shape is drawn here too
  if (typeof applySidebars === "function") applySidebars();
  paintBookBar();
}

/* ================================================== THE BAR SAYS THE BOOK
 * PROMPTS/app-ui-fixes-2.md item 4. Osca: "Rather than saying 'TTS TV Reader'
 * it should say the title of the book, and the current chapter. If multiple
 * books, the same. If unsynced, title and chapter both sides."
 *
 * **No second source of truth.** The chapter comes from `pane.currentChapterId`
 * resolved against `pane.book.chapters` -- the same pair every other part of
 * this page asks, and the pair `renderChapter` writes. So the bar cannot
 * disagree with the pane header, with the sidebar's current row or with the
 * URL's `?ch=`, and it updates on a scroll-driven turn and on an audio-driven
 * one for one reason: both go through `renderChapter`.
 *
 * `bookBarModel` is pure over the panes, which is what makes all three
 * layouts testable without a browser. */
function chapterTitleOf(pane) {
  if (!pane || !pane.book || !pane.currentChapterId) return "";
  const ch = pane.book.chapters.find(c => c.id === pane.currentChapterId);
  return ch ? String(ch.title || "") : "";
}

function bookBarModel() {
  const two = panes.length === 2;
  const layout = two ? (SYNCED ? "synced" : "split") : "one";
  const sides = panes.map(p => ({
    side: p.side,
    title: (p.book && p.book.title) ? String(p.book.title) : "",
    author: (p.book && p.book.author) ? String(p.book.author) : "",
    chapter: chapterTitleOf(p),
  }));
  // TITLE, AUTHOR, CHAPTER, in that order (Osca, 30 Aug evening, reading the
  // new bar in the live app): "A Minor Collection of Works · Jorge Luis
  // Borges · The Approach to Al-Mu'tasim". Split, that is every side's own
  // three, over the side they belong to.
  if (layout === "split") return { layout, sides };
  // One half. Synced, it carries BOTH titles and ONE chapter position --
  // they are on the same chapter, and saying it twice would say it is two
  // facts. The author comes after both titles and is said ONCE when the two
  // books share it, which the pair this app was built on always does (a book
  // and its translation): "Eclogues · The Eclogues · Virgil · POLLIO" rather
  // than Virgil twice. The chapter shown is the voice's pane when there is
  // one, because that is the book actually being read.
  const lead = (layout === "synced" && voicePane()) || panes[0] || null;
  const authors = [];
  for (const s of sides) if (s.author && authors.indexOf(s.author) < 0) authors.push(s.author);
  return {
    layout,
    sides: [{
      side: "left",
      title: sides.map(s => s.title).filter(Boolean).join(" · "),
      author: authors.join(" · "),
      chapter: lead ? chapterTitleOf(lead) : "",
    }],
  };
}

function paintBookBar() {
  const bar = document.getElementById("bookBar");
  if (!bar) return null;
  const m = bookBarModel();
  bar.dataset.layout = m.layout;
  const halves = bar.querySelectorAll(".bb-side");
  for (let i = 0; i < halves.length; i++) {
    const half = halves[i];
    const side = m.sides[i];
    half.hidden = !side;
    if (!side) continue;
    if (side.side) half.dataset.side = side.side;
    const t = half.querySelector(".bb-titles");
    const c = half.querySelector(".bb-chapter");
    // title and author are one run of text, because they truncate together:
    // losing half an author to an ellipsis is right, losing the chapter is not
    const said = [side.title, side.author].filter(Boolean).join(" · ");
    // the full text is on the element itself: an ellipsis hides words, a
    // tooltip is where they go
    t.textContent = said;
    t.title = said;
    c.textContent = side.chapter;
    half.classList.toggle("sep", !!(said && side.chapter));
  }
  pushHostContext();   // the strip says the same book and the same chapter
  paintWatermark();    // and so does the mark floating over the text
  return m;
}

/* ========================================= THE WATERMARK IS WHERE YOU ARE
 * Osca, 31 Aug evening: *"get rid of Hamlet · From the Director etc -- Hamlet
 * is already there in the [tab]. What I actually want is a watermark in the
 * top left of the page, which appears WHEN the sidebar is hidden -- the book,
 * and the chapter below. I don't want it to move at all as you scroll, it
 * floats. Then remove it from the main top bar -- no info there outside of
 * tabs and buttons."*
 *
 * So the two facts the bar carried are now carried by the page itself, in the
 * page's own ink, and only in the one state where the chapter list is not
 * already saying the second of them. The sidebar open IS the chapter told
 * plainly; the mark is what stands in for it when the list is away.
 *
 * THE TITLE ALONE, NOT TITLE · AUTHOR. The bar said both because it was the
 * only chrome on screen; the mock draws the title and the chapter and nothing
 * else, and the tab above already names the book. `bookBarModel()`'s side is
 * still the source, so synced still gives both titles joined by ` · ` -- that
 * is one book to the reader, and it is the sides' own rule, not a second one
 * written here.
 *
 * WHICH SIDE, SPLIT. `paintSidebarBtnState()` -- the same question the strip's
 * contents tool answers, the same `focusedPane`-else-left answer, so the mark
 * and the tool can never disagree about which book "the sidebar" means.
 *
 * Pure, so the node tests can drive every layout with no host and no CSS. */
function watermarkModel(side) {
  /* TWO COLUMNS, TWO MARKS (Osca, 1 Sep). Equal panes are two pages of a
   * book open side by side, so each gets its own running head: the left
   * column's against the left edge, the right column's ranged right against
   * the right edge, each naming ITS OWN book and ITS OWN chapter. That
   * replaces the single mark's old rule -- one mark that named "the side you
   * are in" and, synced, carried both titles joined by ` · `. Both of those
   * existed because there was one mark to say everything with; with two
   * there is nothing to choose between and nothing to join, and "you always
   * know where you are on both pages" is simply true.
   *
   * ONE COLUMN IS STILL ONE MARK. A single book, or a pair with one column
   * promoted or alone on screen, has one reading area and therefore one
   * running head -- the left one, naming the selected pane's book. That is
   * unchanged, and it is why this function still has a second half. */
  if (side !== "left" && side !== "right") side = null;
  var two = false;
  try { two = twoBooksOpen() && PANE_LAYOUT === "equal"; } catch (e) { two = false; }

  if (two) {
    var want = side || (sidebarSide() || "left");
    var pane = null;
    try {
      for (var k = 0; k < panes.length; k++) if (panes[k].side === want) pane = panes[k];
    } catch (e) { pane = null; }
    var pTitle = (pane && pane.book && pane.book.title) ? String(pane.book.title) : "";
    var pChapter = "";
    try { pChapter = pane ? (chapterTitleOf(pane) || "") : ""; } catch (e) { pChapter = ""; }
    /* ITS OWN LIST, NOT "THE" LIST. The mark stands in for the chapter list
     * when the list is away, so each mark answers for the list on its own
     * side -- close the left list and the left mark appears while the right
     * one stays away behind its own open list. */
    var pHidden = true;
    try { pHidden = !paintSidebarBtnState(want); } catch (e) { pHidden = true; }
    return { shown: !!(pHidden && pTitle), title: pTitle, chapter: pChapter,
             side: want, align: want === "right" ? "right" : "left" };
  }

  /* ---- one column: exactly what it has been since 31 Aug ---- */
  var m = null;
  try { m = bookBarModel(); } catch (e) { m = null; }
  var sides = (m && m.sides) || [];
  var one = sides[0] || null;
  if (m && m.layout === "split") {
    var wantF = null;
    try { wantF = focusedPane && focusedPane.side; } catch (e) { wantF = null; }
    for (var i = 0; i < sides.length; i++) if (sides[i].side === wantF) one = sides[i];
  }
  /* A promoted or exclusive pair is one wide column, and a mark over it has
   * to name THAT book -- built from the pane, never picked out of `sides`,
   * because synced `sides` is a single synthetic entry carrying both titles
   * joined and labelled `left`. */
  var sel = null;
  try { sel = selectedPane(); } catch (e) { sel = null; }
  var alone = false;
  try { alone = twoBooksOpen() && PANE_LAYOUT !== "equal"; } catch (e) { alone = false; }
  if (alone && sel) {
    one = { side: sel.side,
            title: (sel.book && sel.book.title) ? String(sel.book.title) : "",
            chapter: chapterTitleOf(sel) };
  }
  var hidden = true;
  try { hidden = !paintSidebarBtnState(); } catch (e) { hidden = true; }
  var title = one ? String(one.title || "") : "";
  var chapter = one ? String(one.chapter || "") : "";
  // NO BOOK, NO MARK. The bar said "Reader" with nothing open; a watermark of
  // the app's own name over an empty page is the one thing this item exists to
  // delete, so the mark simply is not there.
  return { shown: !!(hidden && title), title: title, chapter: chapter,
           side: one ? one.side : null, align: "left" };
}

/* Called wherever the two facts or the one state can change: `paintBookBar`
 * (the book and the chapter), `paintSidebarBtn` (either sidebar opening and
 * closing, by button, by key or by `applySidebars`), and `setFocusedPane`
 * (split -- the only thing that moves which side is "the side you are in"
 * without touching either of the other two).
 *
 * It paints BOTH marks and returns the left one's model, which is what every
 * existing caller and every existing test reads. `#watermarkRight` is hidden
 * outright whenever there is not a second column to put it over, so there is
 * no state in which a stale right-hand title can be left on screen. */
function paintWatermark() {
  var el = document.getElementById("watermark");
  if (!el) return null;
  var two = false;
  try { two = twoBooksOpen() && PANE_LAYOUT === "equal"; } catch (e) { two = false; }
  var m = watermarkModel(two ? "left" : null);
  paintOneWatermark(el, m);
  var right = document.getElementById("watermarkRight");
  if (right) paintOneWatermark(right, two ? watermarkModel("right") : { shown: false, title: "", chapter: "" });
  return m;
}

function paintOneWatermark(el, m) {
  el.hidden = !m.shown;
  var t = el.querySelector(".wm-title");
  var c = el.querySelector(".wm-chapter");
  if (t) t.textContent = m.title;
  if (c) c.textContent = m.chapter;
}

function setSynced(on) {
  SYNCED = !!on;
  try { localStorage.setItem("readerPanesSynced", SYNCED ? "1" : "0"); } catch (e) { /* ignore */ }
  applySync();
  // Joining them again should not leave the follower where it drifted to.
  if (SYNCED && panes.length === 2) {
    const m = voicePane();
    const f = otherPane(m);
    if (m && f) syncFollower(m, f);
  }
}

/* ============================================ THE STRIP IS THIS PAGE'S HEADER
 * The contract is `desktop/README.md`'s `## Status` -> desktop-headless-chrome
 * entry §6, word for word: the tab strip is the title bar now, so in the app
 * this page has no header of its own and pushes what would have been in it.
 *
 * **The guard is on the METHOD, never the object.** `window.TTSTVHost` has
 * existed since long before it could take a context (desktop/src/host.js), so
 * an older shell has the object and not the call -- and a page that dropped
 * its header on the object alone would be a reader with no chrome at all in
 * that shell. `typeof TTSTVHost.setContext === "function"` is the only test.
 *
 * In a plain browser and on the phone `TTSTVHost` does not exist, nothing
 * below runs, and the header is byte-for-byte the header it always was.
 * That is the test that matters (reader/tests/test_reader_context.py). */
function hostTakesContext() {
  return !!(window.TTSTVHost && typeof window.TTSTVHost.setContext === "function");
}

/* The text-size popover, declared HERE and not beside `actionsPop` where it is
 * built: `paintSidebarBtn()` runs at the top level far above `mountPopovers()`
 * and pushes a context, `sizePopoverOpen()` is part of that context, and a
 * `let` in its temporal dead zone throws on any read. `var`, one declaration,
 * null until it is mounted. */
var sizePop = null;
function sizePopoverOpen() { return !!(sizePop && sizePop.isOpen()); }

/* Two books open -- the only layout in which the sync tool means anything.
 * `panes` is a `let` at the bottom of this file and `hostContextModel()` runs
 * once above that line, so the same `try` the model uses for `bookBarModel()`
 * applies here: before the panes exist there is no book, let alone two. */
function twoBooksOpen() {
  try { return panes.length === 2; } catch (e) { return false; }
}

/* Pure over the page's own model, so the node tests can drive every layout
 * without a host: what the strip is told, as an object.
 *
 * **THE STRIP IS TOLD NO WORDS ANY MORE.** Osca, 31 Aug evening: *"remove it
 * from the main top bar -- no info there outside of tabs and buttons."* The
 * book is on the tab; the chapter is on the page, in the book's own face --
 * `watermarkModel()`. So `title` and `subtitle` are `null`, which is §6's own
 * "nothing here" and needs no change in any strip, old or new. `tools` and
 * `progress` are untouched.
 *
 * The split question -- *which* side -- did not disappear with the words; it
 * moved to the mark, which is the only thing that says a side now, and it is
 * answered there by the same `focusedPane`-else-first rule that used to be
 * written here. */
function hostContextModel() {
  var sbOpen = false;
  try { sbOpen = !!paintSidebarBtnState(); } catch (e) { sbOpen = false; }
  var view = "page";
  if (window.TTSTVSettings) { try { view = TTSTVSettings.read().view; } catch (e) { view = "page"; } }
  return {
    // NO INFO IN THE BAR OUTSIDE TABS AND BUTTONS (Osca, 31 Aug evening):
    // the book is on the tab, the chapter is on the page.
    title: null,
    subtitle: null,
    tools: [
      { id: "contents", glyph: "☰", label: "contents",  on: sbOpen },
      { id: "oneword",  glyph: "▭", label: "one word",  on: view === "oneword" },
      { id: "size",     glyph: "a",      label: "text size", on: sizePopoverOpen() },
      // THE DESIGN BENCH. The page's own <header> is hidden in the app -- the
      // strip IS the header -- so a link in that header is invisible here,
      // which is exactly what happened. A tool rides the list instead, and
      // the anchor stays for the plain browser and the installed shell, where
      // there is no strip to carry one.
      // FRANK, the reader's face. On by default; the tool is the way back
      // out, so a fault in the face can never make a book unreadable.
      { id: "design",   glyph: "\u25c9", label: "Frank",
        on: document.documentElement.hasAttribute("data-frank") },
    ].concat(twoBooksOpen()
      // THE FOURTH TOOL, AND ONLY WITH TWO BOOKS (the header-context entry's
      // §6 option (b), chosen by Osca). `#syncToggle` is the one header
      // control §6's three tools left on the keyboard alone; a tool list is
      // per-context, so the strip needs no header to carry it -- it rides in
      // the existing list and appears only in the layout where joining and
      // splitting mean anything.
      ? [{ id: "sync", glyph: "\u29c9", label: "join the books", on: SYNCED }]
      : []),
    // A READER TAB NEVER CARRIES THE LINE (§6). The 2 px line under a tab is
    // the Library's ingest and studio's render; nothing here is a job.
    progress: null,
  };
}

/* Called at load and on every change to what this page shows -- which is
 * `paintBookBar` (the book, the author, the chapter, the sync layout),
 * `paintSidebarBtn` (the contents tool's lit state), `paintViewBtn` (one
 * word's), and the size popover opening or closing. Every one of those is
 * already called at load too; `mountPopovers()` makes the call once more, for
 * the case where no book ever arrives and none of the three fire again. */
function pushHostContext() {
  if (!hostTakesContext()) return null;
  var ctx = hostContextModel();
  try { TTSTVHost.setContext(ctx); } catch (e) { /* an older host, or a closed tab */ }
  return ctx;
}

/* ======================================= AND WHAT STUDIO IS ABOUT TO RENDER
 * `TTSTVHost.setTarget({slug, current, chapters})` -- PROMPTS/studio-sidebar.md
 * Part 2.2, and the seam is studio/README.md's `studio-sidebar Part 1` §6,
 * items 3 and 4, exactly: chapters in BOOK ORDER, and with no picks send `[]`
 * or `[current]`.
 *
 * **The same channel, one more call -- not a second channel.** `setContext`
 * tells the strip what this page IS; `setTarget` tells the studio pane what
 * this page is ON. The desktop forwards it to that tab's sidebar webview and
 * re-sends the last one when the pane opens (Part 3.2), which is why nothing
 * here re-sends on open: the host holds the last value, and a page that also
 * pushed on some open event would be a second answer to the same question.
 *
 * **The guard is on the METHOD, never the object**, for the reason
 * `hostTakesContext` gives above it: `TTSTVHost` has existed since long
 * before it could take a target, so an older shell has the object and not
 * the call. In a plain browser and on the phone nothing below runs at all.
 *
 * **Which book.** `selectedPane()` -- the one place this page answers "which
 * book is the chrome about" (synced: the voice; split: the focused pane; one
 * book: that book). The pane is a webview per reader TAB, so there is one
 * target at a time and it is the book you are in.
 *
 * `[]` and not `[current]` when nothing is picked: both are read the same way
 * (§6.4), and the empty list is the truer of the two -- it says "no picks",
 * which is a thing the reader knows and studio would otherwise have to infer
 * from a one-item list it could not tell from a click on one chapter. */
function hostTakesTarget() {
  return !!(window.TTSTVHost && typeof window.TTSTVHost.setTarget === "function");
}

/* Pure over the page's own state, like `hostContextModel`, so the node tests
 * can read the target with no host at all. `null` before there is a pane --
 * every caller of this runs from an event, but `setFocusedPane` can fire
 * while the panes are still being built. */
function hostTargetModel() {
  var pane = null;
  try { pane = selectedPane(); } catch (e) { pane = null; }
  if (!pane) return null;
  var sb = null;
  try { sb = sidebars[pane.side]; } catch (e) { sb = null; }
  return {
    slug: paneSlug(pane),
    current: pane.currentChapterId || null,
    // `getSelection()` is already in book order -- `applySelection` filters
    // the book's own `unitOrder` -- so §6.3 costs nothing here.
    chapters: sb ? sb.getSelection() : [],
  };
}

/* Sent on every change and only on a change. The same target arrives from
 * two places on one navigation (the chapter renders, and the list's current
 * row moves) and, with the books joined, once per pane; the host would be
 * told the identical thing three times. Deduped on the value, not on the
 * caller, so no call site has to know about the others. */
var LAST_TARGET = null;
function pushHostTarget(force) {
  if (!hostTakesTarget()) return null;
  var t = hostTargetModel();
  if (!t) return null;
  var key = JSON.stringify(t);
  if (!force && key === LAST_TARGET) return t;
  LAST_TARGET = key;
  try { TTSTVHost.setTarget(t); } catch (e) { /* an older host, or a closed tab */ }
  return t;
}

/* The strip evaluates `window.TTSTVPage && TTSTVPage.tool(id)` in this page
 * when one of the icons it was given is clicked, and knows nothing else about
 * them (§6). Three ids, and each is this page's own existing verb. */
function toggleContents() { toggleSidebar(); return pushHostContext(); }
function toggleOneWord() {
  if (window.TTSTVView) paintViewBtn(window.TTSTVView.toggle());
  return pushHostContext();
}
function toggleTextSize() {
  if (sizePop) sizePop.toggle();
  return pushHostContext();
}
/* Exactly what `#syncToggle` does -- the same `setSynced(!SYNCED)` its own
 * click handler calls, so the header control and the strip's tool are one
 * verb and cannot drift. `setSynced` -> `applySync` -> `paintBookBar` already
 * pushes; the push here is for the case where nothing repainted. */
function toggleSync() {
  if (twoBooksOpen()) setSynced(!SYNCED);
  return pushHostContext();
}
window.TTSTVPage = Object.assign(window.TTSTVPage || {}, { tool(id) {
  /* UNDER FRANK THE CONTENTS ARE A STATION, not a panel: the same tool now
     travels the axis instead of opening and closing something. */
  if (id === "contents" && window.Frank && document.documentElement.hasAttribute("data-frank"))
    return Frank.stations.toggle();
  if (id === "contents") return toggleContents();
  if (id === "oneword")  return toggleOneWord();
  if (id === "size")     return toggleTextSize();
  if (id === "sync")     return toggleSync();
  if (id === "design")   { window.Frank && Frank.toggle();
                           try { localStorage.setItem("frank",
                             document.documentElement.hasAttribute("data-frank") ? "1" : "0"); } catch (e) {}
                           if (window.TTSTVHost) TTSTVHost.report && TTSTVHost.report();
                           return; }
} });

/* AND THE HEADER GOES, here rather than at the bottom of the file: this runs
 * while the rest of the page's script is still being parsed, so the app never
 * paints a frame with two headers in it. Hidden, not removed -- every control
 * inside it (`#sidebarToggle`, `#viewToggle`, `#syncToggle`, `#themeBtn`,
 * `#paneSwitch`) is still the element its handler was bound to and still
 * answers `getElementById`, so nothing else in this file has to know. */
if (hostTakesContext()) {
  var _hdr = document.querySelector("header");
  if (_hdr) _hdr.hidden = true;
}

/* ===================================== THE ARROWS MOVE THE HIGHLIGHT (1 Sep)
 * Osca's list: *"**arrows** move the highlight -- ← → a word, ↑ ↓ a line --
 * in the reader and in one-word view, which loses its speed bindings from
 * the arrows."*
 *
 * WHY THE HIGHLIGHT AND NOT THE CLOCK. The arrows used to be `stepSentence`,
 * which seeks the audio; the lit word then moved as a side effect of the
 * audio moving. Four other things hang off the lit word -- the note key, the
 * look-up, the one-word stage and the remembered position -- so seeking to
 * move it moved all of them and could only move a sentence at a time. Moving
 * the highlight moves exactly the highlight; the clock is untouched, and a
 * book with no audio at all answers the arrows, which it never did before.
 *
 * WHAT A LINE IS. Not a sentence and not a paragraph: the run of words the
 * browser actually laid out on one row, which is a fact only a browser has.
 * `wordLines` groups the chapter's word elements by the top of their own
 * boxes, in document order, so a wrapped line of verse and a line of prose
 * are the same kind of thing and neither is guessed at from the markup.
 * WITHOUT LAYOUT -- the node harness, where every rect is zero -- every word
 * lands in one group, so ↑ and ↓ find no other line and do nothing. That is
 * the honest answer there and it is why `reader/tests/browser/` measures the
 * vertical step and node measures the horizontal one.
 */
function chapterWords(pane) {
  if (!pane || !pane.els || !pane.els.reading) return [];
  return Array.from(pane.els.reading.querySelectorAll(".word"));
}

/* The lit word, whoever lit it: the clock, an arrow, or a tap. `null` when
 * nothing is lit -- which the callers treat as "nothing to do", never as
 * "start at the beginning", because a note written at a word nobody chose is
 * a note in the wrong place. */
function highlightedWord(pane) {
  return (pane && pane.activeWordEl) || null;
}

function wordLines(words) {
  const lines = [];
  let cur = null, top = null;
  for (const w of words) {
    let t = 0;
    try { t = Math.round(w.getBoundingClientRect().top); } catch (e) { t = 0; }
    if (cur === null || t !== top) { cur = []; lines.push(cur); top = t; }
    cur.push(w);
  }
  return lines;
}

/* One step. `dx` is ±1 word, `dy` is ±1 line, and exactly one of them is set.
 * Returns the word now lit, or null if there was nothing to light.
 *
 * THE FIRST PRESS LIGHTS, IT DOES NOT MOVE. With nothing lit -- a book just
 * opened, or a chapter turned -- an arrow puts the highlight on the word the
 * reading last reached (`lastSeenWordId`, which is how §4c already remembers
 * a place) and stops there. Moving off a word nobody has seen would skip it.
 *
 * The end of the chapter is a wall, not a turn: the highlight stays on the
 * last word. Turning the chapter is ⌘→, which has its own row on the tab. */
function moveHighlight(pane, dx, dy) {
  const words = chapterWords(pane);
  if (!words.length) return null;
  const lit = highlightedWord(pane);
  let i = lit ? words.indexOf(lit) : -1;
  if (i < 0) {
    const last = pane.lastSeenWordId ? pane.wordEls.get(pane.lastSeenWordId) : null;
    i = last ? words.indexOf(last) : 0;
    if (i < 0) i = 0;
    setActiveWord(pane, words[i]);
    showWord(words[i]);
    return words[i];
  }
  let next = null;
  if (dx) {
    next = words[Math.min(words.length - 1, Math.max(0, i + dx))];
  } else if (dy) {
    const lines = wordLines(words);
    let li = -1;
    for (let k = 0; k < lines.length && li < 0; k++) {
      if (lines[k].indexOf(words[i]) >= 0) li = k;
    }
    const target = li < 0 ? null : lines[li + dy];
    if (!target || !target.length) return words[i];      // no line that way
    // the word on the new line whose left edge is nearest the lit word's --
    // which is what a caret actually does, and what the eye expects
    let x = 0;
    try { x = words[i].getBoundingClientRect().left; } catch (e) { x = 0; }
    let best = Infinity;
    for (const w of target) {
      let wx = 0;
      try { wx = w.getBoundingClientRect().left; } catch (e) { wx = 0; }
      const d = Math.abs(wx - x);
      if (d < best) { best = d; next = w; }
    }
  }
  if (!next) return words[i];
  setActiveWord(pane, next);
  showWord(next);
  return next;
}

/* Bring a word into view without yanking the column: `nearest`, so a word
 * already on screen does not scroll at all. Guarded because minidom has no
 * scrollIntoView. */
function showWord(el) {
  try { if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  catch (e) { /* no layout */ }
}

/* An arrow key, once, for whichever mode is on. Synced: the voice pane moves
 * and the other is pulled to it. Split: only the side `\` selected moves. */
function stepSentence(delta) {
  if (SYNCED && panes.length === 2) {
    const m = voicePane();
    if (!m) return;
    seekSentence(m, delta);
    const f = otherPane(m);
    if (f) syncFollower(m, f);
    return;
  }
  const p = focusedPane || panes[0];
  if (p) seekSentence(p, delta);
}

/* There is no scroll-linking code any more, and that is the point. It used
 * to drag the second column into line proportionally, guarded against its own
 * echo; synced now makes `#panes` the one scroller (see the stylesheet), so
 * the columns move together because there is only one thing moving. Two
 * CSS rules replaced a function, a latch and a class of bug. */

/* Mute in one place, because three things ask for it: the speaker, dragging
 * the volume off zero, and the pane's own first paint. */
function setMuted(pane, on) {
  pane.muted = !!on;
  if (pane.clock) pane.clock.muted = pane.muted;
  if (pane.els.audioEl) pane.els.audioEl.muted = pane.muted;
  pane.els.muteBtn.classList.toggle("active", pane.muted);
  pane.els.muteBtn.innerHTML = pane.muted ? BAR.muted : BAR.speaker;
  pane.els.muteBtn.setAttribute("aria-pressed", pane.muted ? "true" : "false");
  pane.els.muteBtn.setAttribute("aria-label", pane.muted ? "Unmute" : "Mute");
}

/* ------------------------------------------- THE WORD UNDER THE CURSOR (D)
 * `D` looks a word up without a tap, so something has to know which word the
 * cursor is on. This is that, and it is deliberately the cheapest thing that
 * can be: a `pointermove` on the reading column that remembers the element
 * when -- and only when -- the pointer is actually over a `.word`. No
 * geometry, no hit-testing, nothing on a timer.
 *
 * When the pointer has never been over a word (a trackpad-free keyboard, a
 * finger, a window just focused), the answer is THE WORD BEING SPOKEN, which
 * is what "the word under the cursor" means when there is no cursor: the
 * reader's own `activeWordEl`, already painted by the clock. */
let hoverWordEl = null;
function noteHoverWord(e) {
  const w = e.target && e.target.closest && e.target.closest(".word");
  hoverWordEl = w || null;
}

function lookUpPointerWord(pane) {
  let wEl = hoverWordEl;
  // the remembered word must still be in THIS pane's chapter: a chapter turn
  // throws its words away, and a stale node would look a word up that is no
  // longer on screen
  if (wEl && !pane.els.reading.contains(wEl)) wEl = null;
  if (!wEl) wEl = pane.activeWordEl || null;
  if (!wEl) return null;
  const sEl = wEl.closest(".sentence");
  if (!sEl) return null;
  // the same close-on-the-same-word rule the tap has: D on the word already
  // open closes it, so one key is the whole gesture
  if (pane.lookup && pane.lookup.wordId === wEl.dataset.id) { closePopup(pane); return null; }
  focusedPane = pane;
  lookup(pane, wEl.dataset.text, sEl.dataset.id, sEl.dataset.lang, {
    raw: wEl.textContent.trim(),
    wordId: wEl.dataset.id,
    phon: wEl.dataset.phon || null,
    sentenceText: sEl.dataset.text,
    side: pane.side,
  });
  return wEl.dataset.id;
}

function wireControls(pane) {
  pane.els.reading.addEventListener("pointermove", noteHoverWord);
  pane.els.reading.addEventListener("pointerleave", () => { hoverWordEl = null; });
  /* THE DOOR TAKES THE CLICK, and it is bound BEFORE the look-up below on
   * the same element so it is heard first -- a contents line's words are
   * inside the paragraph, so `closest(".word")` would otherwise answer for
   * both and the page would look a poem's title up instead of opening it.
   *
   * AND THE LOOK-UP DOES NOT GO AWAY, it moves (Osca's own words): ⌥-click
   * on a matched line is the look-up, the 500 ms long press is the look-up
   * (`Look up "…"` is the first item of the menu the hold already opens, so
   * a phone needs nothing new), and D over the word is the look-up. Only the
   * plain click changed, and only on a line that names a chapter. */
  pane.els.reading.addEventListener("click", (e) => {
    const door = e.target.closest ? e.target.closest(".tocLine") : null;
    if (!door || !door.dataset.goto) return;
    if (e.altKey) return;                 // ⌥: the look-up below, unchanged
    e.preventDefault();
    tocOpen(pane, door.dataset.goto);
  });
  /* Enter on a focused line -- `role="link"` promises it, and a keyboard is
   * the one way through this page that has no pointer to hold. */
  pane.els.reading.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const door = e.target.closest ? e.target.closest(".tocLine") : null;
    if (!door || !door.dataset.goto) return;
    e.preventDefault();
    tocOpen(pane, door.dataset.goto);
  });
  pane.els.reading.addEventListener("click", (e) => {
    const wEl = e.target.closest(".word");
    if (!wEl) return;
    const door = e.target.closest ? e.target.closest(".tocLine") : null;
    // the door above has already navigated; a plain click on a matched line
    // must not ALSO open the panel behind the chapter it just turned to
    if (door && door.dataset.goto && !e.altKey) return;
    focusedPane = pane;
    // Tap the word that is already open and it CLOSES -- the same control
    // again, which is popover.js's third dismissal rule and the one the
    // dictionary panel never had. Keyed on the word's **id**, not its text:
    // `et` occurs eleven times on a page of Virgil and only the one under the
    // finger may close.
    if (pane.lookup && pane.lookup.wordId === wEl.dataset.id) { closePopup(pane); return; }
    const sEl = wEl.closest(".sentence");
    lookup(pane, wEl.dataset.text, sEl.dataset.id, sEl.dataset.lang, {
      raw: wEl.textContent.trim(),
      wordId: wEl.dataset.id,
      phon: wEl.dataset.phon || null,
      sentenceText: sEl.dataset.text,
      side: pane.side,
    });
  });

  pane.els.playBtn.addEventListener("click", () => {
    focusedPane = pane;
    if (pane.clock.paused) pane.clock.play(); else pane.clock.pause();
  });
  pane.els.prevBtn.innerHTML = BAR.prev;
  pane.els.nextBtn.innerHTML = BAR.next;
  pane.els.playBtn.innerHTML = BAR.play;

  // |< and >| are CHAPTERS now, not sentences -- the chapter <select> left the
  // bar and something has to carry that. |< is the transport's own rule and
  // not an invention: past the first few seconds it means "the start of this
  // one", before that "the one before". Sentence stepping is unchanged on the
  // arrow keys, where it always was.
  pane.els.prevBtn.addEventListener("click", () => {
    focusedPane = pane;
    const t = pane.clock && typeof pane.clock.currentTime === "number" ? pane.clock.currentTime : 0;
    if (t > 3) { pane.clock.currentTime = 0; return; }
    chapterStep(pane, -1);
  });
  pane.els.nextBtn.addEventListener("click", () => { focusedPane = pane; chapterStep(pane, 1); });

  // The speaker IS the mute (Osca, 30 Aug: "click the speaker icon, to mute
  // the whole thing"), and the bar beside it is the level. Both write the same
  // two properties on whichever clock the pane has, so a book with real audio
  // and a book with the VirtualClock behave identically here.
  pane.els.volume.addEventListener("input", () => {
    focusedPane = pane;
    const v = Number(pane.els.volume.value) / 100;
    pane.volume = v;
    if (pane.clock) pane.clock.volume = v;
    if (pane.els.audioEl) pane.els.audioEl.volume = v;
    if (v > 0 && pane.muted) setMuted(pane, false);   // asking to be heard
  });
  pane.els.chapterSelect.addEventListener("change", () => {
    focusedPane = pane;
    renderChapter(pane, pane.els.chapterSelect.value);
  });
  pane.els.muteBtn.addEventListener("click", () => { focusedPane = pane; setMuted(pane, !pane.muted); });
  setMuted(pane, pane.muted);

  pane.els.speedSelect.addEventListener("change", () => {
    pane.rate = parseFloat(pane.els.speedSelect.value);
    pane.clock.playbackRate = pane.rate;
  });
  pane.els.root.addEventListener("pointerdown", () => { focusedPane = pane; }, { capture: true });
}

/* ---------------------------------------------------- the two header icons
   Drawn here rather than written into the markup, because each one has to
   say which state the page is IN, and only this file knows that. Inline SVG
   and `currentColor`: an emoji glyph cannot take a colour, cannot be made
   crisp, and renders as a different picture on every platform. */
const ICON = {
  // One word, and the word is a letter. Osca, 30 Aug: "I don't want this
  // stupid ICON, I just want 'a' in red." Set in the READING serif, not the
  // UI font -- it is a piece of the text, standing for the text.
  oneword: '<span class="ow-a">a</span>',
  // lines of text -- deliberately UNEQUAL, so it reads as a paragraph and not
  // as the hamburger three inches to its left
  lines: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">'
    + '<path d="M4 6.5h16M4 12h16M4 17.5h9.5" stroke="currentColor" stroke-width="1.6"'
    + ' stroke-linecap="round"/></svg>',
  moon: '<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">'
    + '<path d="M20.5 14.8A8.6 8.6 0 0 1 9.2 3.5a7.8 7.8 0 1 0 11.3 11.3Z"'
    + ' fill="currentColor"/></svg>',
  sun: '<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">'
    + '<circle cx="12" cy="12" r="4.1" fill="currentColor"/>'
    + '<path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2'
    + 'M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"'
    + ' stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
};

/* THEME -- one line, because the theme is not this page's any more.
   settings.js owns it for the whole application (its "the theme, in public"
   section): one stored value, `storage` and the BroadcastChannel carrying a
   change to every other tab with no reload, and the attribute applied in the
   <head> before the first paint. This page keeps only its button, and even
   that is mounted by the owner so the moon/sun cannot disagree with the page
   it is drawn on. `Osca, 30 Aug: "IS universal."` */
const themeBtn = document.getElementById("themeBtn");
if (window.TTSTVSettings) TTSTVSettings.mountThemeButton(themeBtn);

/* ONE-WORD. The button is a view of `TTSTVView`, never a second source of
   truth: it calls toggle() and then paints whatever the settings say, so a
   change made in another tab, by the desktop app's View menu or by voice
   lands on this icon too (the painter is pushed onto settingsListeners at
   the bottom of the one-word section). */
const viewToggle = document.getElementById("viewToggle");
function paintViewBtn(view) {
  const on = view === "oneword";
  viewToggle.innerHTML = on ? ICON.lines : ICON.oneword;
  viewToggle.setAttribute("aria-pressed", on ? "true" : "false");
  viewToggle.setAttribute("aria-label", on ? "Back to the chapter" : "One-word reading");
  viewToggle.title = on ? "Back to the chapter" : "One word at a time";
  pushHostContext();   // and the strip's one-word tool with it
}
viewToggle.addEventListener("click", () => {
  if (window.TTSTVView) paintViewBtn(window.TTSTVView.toggle());
});
paintViewBtn("page");

/* Two sheets while they are together, one sheet while they are apart -- the
 * icon is what pressing it GIVES you, the same rule the theme button follows.
 * `applySync` draws it, so this only has to flip the bit. */
// `syncToggleEl`, not a fresh lookup: applySync() takes this button OUT of
// the document whenever there is one book on screen, and getElementById
// would then answer null. The listener is on the element itself, so it
// survives every removal and works again the moment it goes back in.
if (syncToggleEl) syncToggleEl.addEventListener("click", () => setSynced(!SYNCED));

/* ------------------------------------------------------- EVERY KEY, IN ORDER
 *
 * 31 Aug (`PROMPTS/reader-settings-design.md`, the Hotkeys tab): **not one
 * `e.key ===` test survives in this handler.** Every branch asks
 * `TTSTVSettings.hotkeyIs(e, <action>)`, and the action's key comes from the
 * settings store -- so the Hotkeys tab cannot describe a key this page does
 * not answer to, and a remap takes effect on the NEXT KEYSTROKE with nothing
 * reloaded. `hotkeyWhich` is the same question for the rows that are a pair:
 * 0 is next / faster / the plain comma, 1 is previous / slower / ⌘⇧S.
 *
 * The ORDER of the branches is unchanged and is still the behaviour: ⌘F, ⌘.
 * and ⌘, are tested before the field guard so they work with the find box
 * focused; the sidebar's plain `,` is tested after it so a comma still types;
 * one-word mode takes the plain keys before the page does. `hk` is a local
 * alias only because this handler says it fifteen times.
 *
 * `IS_MAC` is no longer consulted here: a Mod binding is ⌘ **or** Ctrl,
 * everywhere, which is what ⌘F already did and what an iPad keyboard needs.  */
const hk = (e, id) => !!(window.TTSTVSettings && TTSTVSettings.hotkeyIs(e, id));
const hkWhich = (e, id) => (window.TTSTVSettings ? TTSTVSettings.hotkeyWhich(e, id) : -1);

document.addEventListener("keydown", (e) => {
  // ⌘F / Ctrl+F -- both, always. A Mac keyboard sends ⌘; an iPad's or a
  // Bluetooth keyboard's Ctrl+F is the same request and there is no ⌘ to
  // press. Tested before the field guard below so ⌘F reaches this handler
  // with the find box itself focused.
  //
  // 30 Aug (Osca): it **toggles** -- pressing it again closes the bar, as
  // Esc does. That replaces the older Safari behaviour of re-selecting the
  // query on a second ⌘F; the query still survives the close, so re-opening
  // brings it back selected, which was the useful half of it.
  if (hk(e, "find")) { e.preventDefault(); findToggle(); return; }
  // ⌘. Actions, ⌘, Settings -- deliberately beside each other, and both
  // toggle. Before the field guard for the same reason ⌘F is: the panel must
  // close from inside itself, where the focus is on one of its own controls.
  if (hk(e, "actions")) {
    e.preventDefault(); if (actionsPop) actionsPop.toggle(); return;
  }
  // ...and ⌘, is no longer one of the pair. Osca, 30 Aug evening: "Settings
  // -- hotkey 'Command + ,' should OPEN IN A NEW WINDOW", which supersedes the
  // popover decision of that morning. The rule, so nobody re-opens it: **you
  // visit Actions and you work in Settings** -- a short list of verbs is a
  // popover, a place you sit is a window. It never toggles: a second press
  // focuses the window that is already open (settings.js `openWindow`).
  if (hk(e, "settings")) {
    e.preventDefault();
    if (window.TTSTVSettings) TTSTVSettings.openWindow();
    return;
  }
  // LIGHT / DARK, ⌘⇧L (Osca's list, 31 Aug). Beside the other two ⌘ keys and
  // above the field guard for the same reason: the theme is the whole
  // application's and is not about what has the focus. It is settings.js's
  // one store, so the Library and every other Reader tab follow without a
  // reload -- the same value the moon button and the Theme row write.
  // ⌘⇧L is the theme's SECOND cap and is tested here, above the field guard,
  // so it works with the find box focused. The bare `L` (cap 0, Osca's list,
  // 1 Sep) is tested BELOW the guard, beside the sidebar's plain comma --
  // otherwise every `l` typed into Find would flip the page to dark.
  if (hkWhich(e, "theme") === 1) {
    e.preventDefault();
    if (window.TTSTVSettings) TTSTVSettings.toggleTheme();
    return;
  }
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "SELECT" || tag === "INPUT" || tag === "TEXTAREA") return;
  const pane = focusedPane || panes[0];
  if (!pane) return;
  // cmd-left / cmd-right = previous / next unit (READER_FIRST.md "Move");
  // the plain arrows below stay the sentence step, which is for audio.
  const unit = hkWhich(e, "unit");
  if (unit >= 0) { e.preventDefault(); gotoUnit(unit === 0 ? 1 : -1); return; }
  // ⌘⇧S is the sidebar's SECOND cap, on the same row as `,` in the tab --
  // one action, two keys, and the plain one is tested below the one-word
  // block exactly as it always was.
  if (hkWhich(e, "sidebar") === 1) { e.preventDefault(); toggleSidebar(); return; }
  if (hk(e, "manual")) {
    e.preventDefault();
    const sb = sidebars[(focusedPane && focusedPane.side) || "left"] || sidebars.left;
    if (sb) sb.push("manual");
    return;
  }
  /* V -- ONE WORD ↔ NORMAL (Osca, 31 Aug). It writes the `view` SETTING and
   * nothing else: `owApplySettings` is the one place the stage is switched
   * on or off (`settings.js` -> subscribe -> owApplySettings), so the key
   * that toggles it must go through the store like the Reading tab's own
   * segment and the header's view button. A second Reader tab and the phone
   * follow, because they are reading the same value. */
  if (hk(e, "view")) {
    e.preventDefault();
    if (window.TTSTVSettings) {
      TTSTVSettings.patch({ view: OW.on ? "page" : "oneword" });
    }
    return;
  }
  /* C -- SYNC / UNSYNC, and INERT WITH ONE PANE (Osca, 31 Aug). Not merely
   * ignored: with one book on screen there is no sync control in the DOM at
   * all (the chrome rule this page adopted on 31 Aug), so a key that quietly
   * flipped a hidden flag would be the one state nothing on screen could
   * show. */
  if (hk(e, "sync")) {
    if (panes.length !== 2) return;      // no second book: the key means nothing
    e.preventDefault(); setSynced(!SYNCED); return;
  }
  /* D -- LOOK UP THE WORD UNDER THE CURSOR (Osca's list, 31 Aug). In one-word
   * mode that is the word on the stage and `owLookUp` already knows how to
   * pause and open on it; on a page it is the word the pointer is over, and
   * failing that the word being spoken -- which is what "under the cursor"
   * means when the hand is not on the mouse. `lookup()` is untouched: this is
   * a third way to reach it, not new machinery. */
  if (hk(e, "lookup")) {
    e.preventDefault();
    if (OW.on) { owLookUp(); return; }
    lookUpPointerWord(pane);
    return;
  }
  // One-word mode owns the plain keys while it is on: the arrows step ONE
  // FRAME -- the smallest change on screen -- rather than a sentence, and
  // up/down are speed. Everything with a modifier above is untouched.
  // `\`. One key, two meanings, and which one it has is the whole point of
  // the sync switch: synced, the pages already move together so the only
  // thing left to choose is WHICH BOOK SPEAKS; split, they move apart, so it
  // picks a side -- that side's page and that side's bar -- and leaves the
  // voice exactly where it was.
  //
  // `z` is the LAYOUT. Both were Tab and Shift+Tab until 1 Sep, and moving
  // them is the whole of that change here: TAB IS NOT TESTED ANYWHERE IN
  // THIS HANDLER any more, so it reaches the browser and the app's tab strip
  // untouched, on a two-book page as much as a one-book one.
  //
  // Each is taken with two books and only with two books: with one, neither
  // branch fires, which is the "one book open: neither key does anything"
  // half of the decision, and a page with nothing to cycle then leaves a
  // plain `z` to whatever else would have had it.
  //
  // Tested BEFORE `swap` for no reason other than reading order -- they are
  // separate keys now, so unlike Tab and Shift+Tab there is not even a shared
  // token between them to get the order wrong about.
  if (hk(e, "promote")
      && panes.length === 2
      && !(actionsPop && actionsPop.isOpen())) {
    e.preventDefault();
    cyclePaneLayout();
    return;
  }
  if (hk(e, "swap")
      && panes.length === 2
      && !(actionsPop && actionsPop.isOpen())) {
    e.preventDefault();
    // THE LAYOUT IS NOT TOUCHED HERE. Promoted or exclusive, `\` moves the
    // selection and the wide column follows it -- `setVoiceSide` and
    // `setFocusedPane` both end in `applyPaneLayout()`, which re-hangs
    // `.selectedPane` and leaves `PANE_LAYOUT` alone.
    if (SYNCED) swapVoice();
    else setFocusedPane(otherPane(focusedPane || panes[0]) || panes[0]);
    return;
  }
  // `,` -- the side panel, in one keystroke and no modifier (Osca, 30 Aug).
  // Below the field guard, so it still types a comma into the find box; and
  // above the one-word block, so it works in there too, where the chapter
  // list is the only way to move between poems.
  if (hkWhich(e, "sidebar") === 0) { e.preventDefault(); toggleSidebar(); return; }
  // L -- light / dark, the bare cap. Below the guard (see the note above).
  if (hkWhich(e, "theme") === 0) {
    e.preventDefault();
    if (window.TTSTVSettings) TTSTVSettings.toggleTheme();
    return;
  }
  /* S -- THE STUDIO SIDEBAR (Osca's list, 1 Sep). The panel is the host's,
   * so the key is a call into the host and nothing else: no state here, no
   * element here, and on a page with no host -- a browser tab, the phone, an
   * exported bundle -- pressing S does nothing at all rather than opening
   * some stand-in. `desktop/README.md`'s §6 for this session asks for
   * `studioToggle()`; until it exists the `typeof` below is false and the key
   * is inert, which is the same answer as no host and is the right one. */
  if (hk(e, "studio")) {
    const host = window.TTSTVHost;
    if (!host || typeof host.studioToggle !== "function") return;   // nothing to open
    e.preventDefault();
