[package]
name = "frank"
version = "0.1.0"
description = "Frank -- the thin client: the app shell, one window, no Python"
authors = ["Osca"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# `frank_lib`, not `app_lib`: two crates in one repo, and a name that says
# which. `desktop/src-tauri` is `frank-desktop`/`app_lib` and stays so.
name = "frank_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# Compiles ios/FrankAudio.m into the crate for iOS targets (the audio session,
# job 8b) -- the two `extern "C"` symbols lib.rs links against. 14:26, 6 Sep.
cc = "1"

[dependencies]
# The same versions `desktop/src-tauri` builds with, so the two crates share a
# registry cache and a rust-cache key shape. No `unstable` feature: that is
# there for the desktop app's tear-off windows, and Frank has one window.
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
log = "0.4"
# Sync (job 26, 6 Sep): the phone finds Studio on the network by Bonjour --
# `_ttstv._tcp`, what `studio/sync.py::Advert` registers. Pure Rust, no
# platform framework, so one crate serves the simulator, the phone and
# Android. Its cost, said once: it browses with its own multicast socket, and
# on a real iPhone (14+) that socket wants the `com.apple.developer.
# networking.multicast` entitlement, which Apple grants on request to a paid
# team -- so on Osca's phone under the free team the browse may find nothing,
# and the row then takes the address Studio's row shows (PHONE.md §8).
mdns-sd = "0.13"
serde = { version = "1", features = ["derive"] }
# `tauri::generate_context!()` emits code that names `::serde_json` in THIS
# crate -- E0433, found by Osca on the first real `tauri ios build --debug`,
# 6 Sep. Same pin as desktop/.
#
# WHAT PUTS IT THERE, because "the macro needs it" is not a reason and the next
# person will want one: the macro embeds `tauri.conf.json`, and the `plugins`
# block is a `HashMap<String, serde_json::Value>` whose `ToTokens`
# (`tauri-utils::config::PluginConfig`, config.rs) maps each value through
# `tokens::json_value_lit`, which writes `::serde_json::Value` / `::Map` /
# `::Number` straight into the calling crate. `map_lit` emits
# `::std::collections::HashMap::new()` and NOTHING ELSE for an empty map -- so
# this crate needed no `serde_json` until `tauri.conf.json` grew its first
# `plugins` block, which was `deep-link` on 6 Sep. **Adding any plugin config
# to that file requires this line**; removing the last one would make it
# unused again.
serde_json = "1"
# Pairing (job 23d, 6 Sep): the system camera reads a `frank-pair://` square on
# the Mac's screen and the OS hands the URL to this app. On iOS, macOS and
# Android that hand-over is an event only a plugin receives; the plugin's own
# build script is also what writes `CFBundleURLTypes` into the generated
# Info.plist from `tauri.conf.json`'s `plugins.deep-link.mobile`. 2.4.10 is the
# newest 2.x and wants `tauri ^2.10`, which the pin above satisfies.
tauri-plugin-deep-link = "2.4.10"
# Google (job 26b, 6 Sep): the consent page must open in the SYSTEM browser --
# Google refuses it in an embedded web view and RFC 8252 §8.12 says an app must
# not use one for it. This is the official Tauri v2 plugin (UIApplication
# openURL on iOS, NSWorkspace on macOS, an Intent on Android); it is registered
# in lib.rs and granted NO page permission -- `google_sign_in` is the only
# caller and it opens Google's authorization endpoint or nothing.
tauri-plugin-opener = "2"
