name: frank
options:
  bundleIdPrefix: com.ttstv.frank
  deploymentTarget:
    # 14.0 -> 15.0, 6 Sep (job 8b, the float). The float's native road is
    # `AVPictureInPictureController.ContentSource(sampleBufferDisplayLayer:
    # playbackDelegate:)`, which is iOS 15 -- a PiP window that paints
    # arbitrary content does not exist before it. Nothing else in this app
    # needed the move and nothing on a phone in 2026 is left behind by it.
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Frank
      PRODUCT_BUNDLE_IDENTIFIER: com.ttstv.frank
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  frank_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: frank_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: frank_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The float (job 8b, 6 Sep). WITHOUT THIS KEY THE APP IS SUSPENDED a
        # few seconds after it goes to the background and the reader's audio
        # stops with it -- so "listen along, do another thing" was blocked
        # before any floating window was drawn. `audio` is an Info.plist
        # value, NOT a provisioning entitlement, so the free personal team
        # signs it (PHONE.md §4).
        #
        # The key is half of it: `src-tauri/ios/FrankAudio.m` sets the
        # session's category to Playback, because a background mode over a
        # SoloAmbient session still goes quiet. Both, or neither works.
        #
        # `voip` is NOT here and must never be: it is what
        # AVPictureInPictureVideoCallLayer wants, and App Review rejects it
        # for an app that is not a phone (scratch-float/ANSWER.md §3).
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Frank listens for the hands-free trigger and for the phrase after it. Nothing is recorded or sent anywhere; the audio is used on this phone and discarded.
        NSSpeechRecognitionUsageDescription: Frank turns what you say into text on this phone so it can act on it -- "read on", "what?", the name of a chapter.
        # Sync (job 26, 6 Sep). iOS 14+ asks once before an app may look at the
        # local network; this sentence is the ask. NSBonjourServices names the
        # one service the browse is allowed to see. NSAllowsLocalNetworking lets
        # the page fetch http://<lan address> -- Studio is plain HTTP on the LAN
        # and App Transport Security would otherwise refuse it silently.
        NSLocalNetworkUsageDescription: Frank looks for Frank Studio on this network to sync your books, marks and reading position with it. Nothing leaves your network.
        NSBonjourServices: [_ttstv._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Pairing (job 23d, 6 Sep). The launch scheme, and it is NOT `frank`:
        # that one is the asset scheme this app answers with its own files, and
        # a launch scheme is a thing strangers can print on a wall.
        # `tauri-plugin-deep-link`'s build script writes this same key into
        # frank_iOS/Info.plist from tauri.conf.json's plugins.deep-link.mobile;
        # this copy is what an `xcodegen` regeneration puts back, so the two
        # must name the same scheme and src/lib.rs has the test that says so.
        CFBundleURLTypes:
          - CFBundleURLName: frank-pair
            CFBundleURLSchemes:
              - frank-pair
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
    entitlements:
      path: frank_iOS/frank_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        # Signing lives HERE, not in Xcode's Signing tab: xcodegen rewrites the
        # project from this file, and the team Osca picked by hand on 6 Sep was
        # wiped by the first `xcodegen generate`. Osca's personal team, read
        # off the working build's TeamIdentifierPrefix.
        DEVELOPMENT_TEAM: DC5G53NN4R
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      # FrankAudio.m (job 8b). AVAudioSession's framework, and it has to be
      # named HERE and not only by build.rs: the crate is a `staticlib`, so
      # cargo never runs a linker, and its `cargo:rustc-link-lib=framework=`
      # line reaches nothing. Xcode links this binary, so Xcode is told.
      #
      # The .m file itself is compiled by `build.rs` (the `cc` crate), NOT by
      # this target -- there is deliberately no `- path: ../../ios` above.
      # Two compilations of one file is `duplicate symbol
      # _frank_audio_session_category`, twenty minutes into a phone build.
      - sdk: AVFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      # Xcode's ▶ runs this phase with a LOGIN SHELL'S PATH AND NOT YOUR
      # SHELL'S: no `~/.zshrc`, so no `~/.cargo/bin`, so no cargo and no
      # rustup -- which is why ▶ died on "Build Rust Code" while the same
      # command in Terminal worked (6 Sep). `npm` is found because Xcode
      # inherits /usr/local/bin; cargo is not because rustup installs into
      # $HOME. One line, before the command, and ▶ is one click again.
      #
      # `$HOME/.cargo/bin` and not a hard-coded /Users/... so the file is not
      # about one Mac; `-` before `bin` deliberately PREPENDS, because a
      # Homebrew rust would otherwise win and build against a different
      # toolchain than the terminal does.
      - script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a