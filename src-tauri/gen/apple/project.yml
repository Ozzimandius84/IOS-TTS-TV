name: frank
options:
  bundleIdPrefix: com.ttstv.frank
  deploymentTarget:
    # 14.0 -> 15.0, 6 Sep (job 8b, the float). The float's native road is
    # `AVPictureInPictureController.ContentSource(sampleBufferDisplayLayer:
    # playbackDelegate:)`, which is iOS 15 -- a PiP window that paints
    # arbitrary content does not exist before it. Nothing else in this app
    # needed the move and nothing on a phone in 2026 is left behind by it.
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Frank
      PRODUCT_BUNDLE_IDENTIFIER: com.ttstv.frank
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  frank_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: frank_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: frank_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The float (job 8b, 6 Sep). WITHOUT THIS KEY THE APP IS SUSPENDED a
        # few seconds after it goes to the background and the reader's audio
        # stops with it -- so "listen along, do another thing" was blocked
        # before any floating window was drawn. `audio` is an Info.plist
        # value, NOT a provisioning entitlement, so the free personal team
        # signs it (PHONE.md §4).
        #
        # The key is half of it: `src-tauri/ios/FrankAudio.m` sets the
        # session's category to Playback, because a background mode over a
        # SoloAmbient session still goes quiet. Both, or neither works.
        #
        # `voip` is NOT here and must never be: it is what
        # AVPictureInPictureVideoCallLayer wants, and App Review rejects it
        # for an app that is not a phone (scratch-float/ANSWER.md §3).
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Frank listens for the hands-free trigger and for the phrase after it. Nothing is recorded or sent anywhere; the audio is used on this phone and discarded.
        NSSpeechRecognitionUsageDescription: Frank turns what you say into text on this phone so it can act on it -- "read on", "what?", the name of a chapter.
        # Sync (job 26, 6 Sep). iOS 14+ asks once before an app may look at the
        # local network; this sentence is the ask. NSBonjourServices names the
        # one service the browse is allowed to see. NSAllowsLocalNetworking lets
        # the page fetch http://<lan address> -- Studio is plain HTTP on the LAN
        # and App Transport Security would otherwise refuse it silently.
        NSLocalNetworkUsageDescription: Frank looks for Frank Studio on this network to sync your books, marks and reading position with it. Nothing leaves your network.
        NSBonjourServices: [_ttstv._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Pairing (job 23d, 6 Sep). The launch scheme, and it is NOT `frank`:
        # that one is the asset scheme this app answers with its own files, and
        # a launch scheme is a thing strangers can print on a wall.
        # `tauri-plugin-deep-link`'s build script writes this same key into
        # frank_iOS/Info.plist from tauri.conf.json's plugins.deep-link.mobile;
        # this copy is what an `xcodegen` regeneration puts back, so the two
        # must name the same scheme and src/lib.rs has the test that says so.
        CFBundleURLTypes:
          - CFBundleURLName: frank-pair
            CFBundleURLSchemes:
              - frank-pair
          # Google's answer comes home on the reverse of the iOS client id
          # (src-tauri/google.json); tests/test_google_link.py holds the two together.
          - CFBundleURLName: google-oauth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.831378567000-50bh7p37g80gssem6dq3l1f8ncj2j2o2
        # INGEST, ROAD ONE -- "Copy to Frank" (C2/K8, 13 Sep). The cheapest
        # ingest there is: THREE plist keys, no second target, no entitlement,
        # no App Group, and a free personal team signs it unchanged. Declaring
        # the types puts Frank in the share sheet's "Copy to..." row for a PDF,
        # an EPUB or a text file, and the OS copies the file into the app's own
        # `<Documents>/Inbox/` -- which `src/inbox.rs` reads and nothing else
        # writes. Road two (the share extension) is the FrankShare target
        # below and costs an App Group; the two are deliberately separate
        # commits so one can be reverted without the other.
        #
        # `LSSupportsOpeningDocumentsInPlace: false` ON PURPOSE, and it is the
        # load-bearing key: `true` means "open the file where it lives", and
        # Frank would then hold a security-scoped URL into another app's
        # container that stops working the moment the share sheet closes.
        # `false` means the OS COPIES, and a copy in our own container is the
        # only thing an inbox can be.
        #
        # `LSHandlerRank: Alternate` because Frank is not the system's PDF
        # reader and must not try to become it; Alternate is the rank that
        # says "offer me, do not prefer me".
        LSSupportsOpeningDocumentsInPlace: false
        # The Documents folder in the Files app, so a capture can also be
        # dragged in -- and so the inbox can be LOOKED AT on the phone without
        # a debugger, which is most of how this spike gets checked.
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: EPUB
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            # Both spellings: `org.idpf.epub-container` is the one Apple's own
            # declarations use and `public.epub` is what some apps export.
            LSItemContentTypes: [org.idpf.epub-container, public.epub]
          - CFBundleTypeName: Text
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
    entitlements:
      path: frank_iOS/frank_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        # Signing lives HERE, not in Xcode's Signing tab: xcodegen rewrites the
        # project from this file, and the team Osca picked by hand on 6 Sep was
        # wiped by the first `xcodegen generate`. Osca's personal team, read
        # off the working build's TeamIdentifierPrefix.
        DEVELOPMENT_TEAM: DC5G53NN4R
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      # INGEST, ROAD TWO -- the share extension (C2/K8, 13 Sep). `embed: true`
      # is what puts FrankShare.appex inside Frank.app; an extension that is
      # built but not embedded is a share sheet with no Frank row in it and no
      # error to say why. `codeSign: true` because an appex is signed
      # separately from its host.
      #
      # THE COST, said where it bites: this pair carries
      # `com.apple.security.application-groups` on BOTH binaries, and that
      # capability has to exist on the signing team. If automatic signing
      # refuses it, DELETE THIS DEPENDENCY AND THE FrankShare TARGET BELOW and
      # the app builds exactly as it did -- "Copy to Frank"
      # (CFBundleDocumentTypes above) needs neither, and `src/inbox.rs` reads
      # both roads and says which one a row came in by.
      - target: FrankShare
        embed: true
        codeSign: true
      - framework: libapp.a
        embed: false
      # FrankAudio.m (job 8b). AVAudioSession's framework, and it has to be
      # named HERE and not only by build.rs: the crate is a `staticlib`, so
      # cargo never runs a linker, and its `cargo:rustc-link-lib=framework=`
      # line reaches nothing. Xcode links this binary, so Xcode is told.
      #
      # The .m file itself is compiled by `build.rs` (the `cc` crate), NOT by
      # this target -- there is deliberately no `- path: ../../ios` above.
      # Two compilations of one file is `duplicate symbol
      # _frank_audio_session_category`, twenty minutes into a phone build.
      - sdk: AVFoundation.framework
      # FrankSearch.m (job 13, the search sheet). Same rule as AVFoundation
      # above: `build.rs` compiles the .m, Xcode links the binary, so
      # SafariServices is named HERE or `_OBJC_CLASS_$_SFSafariViewController`
      # is undefined at the last minute of a phone build.
      - sdk: SafariServices.framework
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      # Xcode's ▶ runs this phase with a LOGIN SHELL'S PATH AND NOT YOUR
      # SHELL'S: no `~/.zshrc`, so no `~/.cargo/bin`, so no cargo and no
      # rustup -- which is why ▶ died on "Build Rust Code" while the same
      # command in Terminal worked (6 Sep). `npm` is found because Xcode
      # inherits /usr/local/bin; cargo is not because rustup installs into
      # $HOME. One line, before the command, and ▶ is one click again.
      #
      # `$HOME/.cargo/bin` and not a hard-coded /Users/... so the file is not
      # about one Mac; `-` before `bin` deliberately PREPENDS, because a
      # Homebrew rust would otherwise win and build against a different
      # toolchain than the terminal does.
      #
      # /opt/homebrew/bin AND /usr/local/bin, 7 Sep: the 6 Sep note said "npm
      # is found because Xcode inherits /usr/local/bin" -- MEASURED FALSE on
      # this Mac. Press ▶ with only the cargo line and the phase dies at
      # `line 3: npm: command not found`, 0.1 s in (Xcode build log, 15:42).
      # Node is Homebrew's and this is an arm64 Mac, so it lives in
      # /opt/homebrew/bin, which no login shell gives Xcode. Both roots are
      # named so the file still works on an Intel Mac.
      - script: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a

  # ------------------------------------------------------------- FrankShare
  # The share sheet's Frank row. C2/K8, 13 September -- a spike, and the whole
  # of it is: accept a PDF, a web address or a selection, write it into the App
  # Group container, and get out of the way. No UI; `ShareViewController.swift`
  # says why.
  #
  # IT INHERITS NOTHING FROM THE APP ON PURPOSE. `settingGroups: [app]` sets
  # PRODUCT_NAME Frank and PRODUCT_BUNDLE_IDENTIFIER com.ttstv.frank, and an
  # extension that carried the app's own bundle id would be refused at install
  # with a message about a duplicate identifier. Its id is the app's with one
  # component added, which is Apple's convention and the only shape automatic
  # signing will make a profile for.
  #
  # NO RUST. There is deliberately no "Build Rust Code" phase here: the
  # extension writes files and reads none of ours, so it needs neither libapp.a
  # nor the crate -- and an extension that linked the app's static library
  # would double a 100 MB binary for nothing.
  FrankShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: FrankShare
    info:
      path: FrankShare/Info.plist
      properties:
        CFBundleDisplayName: Frank
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          # An Objective-C class name. `ShareViewController.swift` carries
          # `@objc(ShareViewController)` so this string finds the class; without
          # it the name is mangled and the row does nothing at all.
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            # What puts Frank in the sheet. A file (the PDF), a web address
            # (the article), or a selection -- one of each, because a spike
            # that took ten files would be a queue design nobody asked for.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: FrankShare/FrankShare.entitlements
    settings:
      base:
        PRODUCT_NAME: FrankShare
        PRODUCT_BUNDLE_IDENTIFIER: com.ttstv.frank.share
        # The same team as the app, and written HERE for the same reason it is
        # written in the app's settings: xcodegen rewrites the project from this
        # file and a team picked by hand in Xcode's Signing tab is wiped by the
        # next `xcodegen generate`.
        DEVELOPMENT_TEAM: DC5G53NN4R
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        SWIFT_VERSION: "5.0"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: false
