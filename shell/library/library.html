// If it should go for good rather than go quiet, that is a bigger and
// different change -- the <aside>, ~250 lines of queue and sync, the device
// rows on the shelf, and library/tests' device cases -- and it wants asking
// for by name.
let PHONE_PANEL = false;
function setPhonePanel(on) { PHONE_PANEL = !!on; renderPhoneShelf(); }

function renderPhoneShelf() {
  const el = document.getElementById("phoneShelf");
  if (!el) return "";
  const ctx = libraryContext();
  const on = PHONE_PANEL && ctx.bench;
  el.hidden = !on;
  if (!on) { el.innerHTML = ""; return ""; }
  const q = phoneShelf.queue.map(s => phoneRowHTML(s, "queued", null)).join("");
  const s = phoneShelf.sent.map(e => phoneRowHTML(e.slug, "sent", e)).join("");
  // ONLY when the mirror failed. "Recorded in TTS_DATA/reader/phone-shelf.json"
  // under a working panel was a caption on the normal case, and the picture
  // draws no such line; a save that did NOT reach the SSD is an error state,
  // which the picture is silent about and which must still be said.
  const line = phoneShelfWhy
    ? `<div class="phoneline">Kept on this Mac only — not mirrored to TTS_DATA/reader/phone-shelf.json: ${esc(phoneShelfWhy)}.</div>`
    : "";
  // The picture, in its order: PHONE, the queue, Sync and what it will do,
  // the drop zone, then ON THE PHONE. The long paragraph that used to sit
  // under the heading is gone -- rule 2, nothing the picture does not draw --
  // and what it said (that this is a record of sends, not the phone's own
  // shelf) is §6's one question back to Osca.
  const n = phoneShelf.queue.length;
  el.innerHTML =
    `<div class="phonehead"><h2>Phone</h2></div>` +
    (q || `<div class="phone-empty">Nothing queued.</div>`) +
    `<div class="phonesync">` +
    `<button id="syncPhone" type="button"${n && !phoneShelfBusy ? "" : " disabled"}>Sync</button>` +
    `<small>${n === 1 ? "1 book" : n + " books"} · to iCloud Drive</small></div>` +
    `<div class="phonedrop">Drop a book here to send it</div>` +
    // The heading the picture writes, and on it -- as a title, where a pointer
    // can ask and no pixel is spent -- the thing Osca said this panel must
    // never stop saying: it is a record of what was sent from here, not the
    // phone's own inventory. §6 asks whether that is enough now the picture
    // has named the list "On the phone".
    (s ? `<div class="phonehead onphone"><h2 title="${esc(PHONE_IS_A_RECORD)}">On the phone</h2></div>${s}` : "") +
    line;
  return el.innerHTML;
}


// ================================================== THE LIBRARY'S OWN RECORD
// PROMPTS/library-shelf.md §3/§4b/§4c, decided in READER_FIRST.md "Library --
// merges, shelves and memory" (30 Aug). Three things live here and nothing
// else does:
//
//   merges    a merged book is a REFERENCE, never a copy. `{slug: "<a>+<b>",
//             kind: "merge", members: [{slug, book_hash, hash_kind, at}, ...]}`.
//             No text is duplicated, no book is moved, and deleting the entry
//             deletes nothing else. `members[0]` is the TARGET (the top lane
//             in one-word mode), `members[1]` the ground -- the order is the
//             whole content of the record, so it is visible and swappable.
//   shelves   a shelf is a LABEL, not a location: `{id, name, books: [slug],
//             collapsed, order}`, and a book may sit on more than one
//             ("Eclogues is Latin *and* poetry"). Deleting a shelf returns
//             its books to unshelved and never deletes a book.
//   memory    where he left off: per book `{chapter, wordId, hash, hashKind,
//             at, device}` -- a WORD ID, not a scroll offset, because a word
//             id survives a re-parse and an offset does not -- plus the last
//             book and pane layout per app.
//
// **Where it lives, and why it looks like the phone shelf.** localStorage is
// the store every page actually reads; `TTS_DATA/reader/library.json` is the
// mirror, through studio's `/reader-library` -- a route that DOES NOT EXIST
// YET, exactly as `/phone-shelf` did not when that panel was written. So the
// shape is that panel's, verbatim: save locally, POST, and keep the server's
// own words in `libraryWhy` so the page can say in one line that this Mac is
// the only copy. The request is in reader/README.md §6.
//
// **Two writers, one key.** reader.html writes positions into this same
// record (only the reader knows where you stopped) while this page may be
// open in another tab. So every write is a READ-MODIFY-WRITE against
// localStorage -- `libPatch()` re-reads first and merges only the keys the
// caller touched -- and a `storage` event repaints. Last-write-wins over a
// whole document is how the merges would quietly disappear.
const LIB_KEY = "ttstv.reader.library";
const LIB_ROUTE = "/reader-library";
const LIB_VERSION = 1;
const LIB_DEVICE_KEY = "ttstv.reader.deviceId";

let library = libEmpty();
let libraryWhy = null;      // why the last save did not reach the SSD

function libEmpty() {
  return { version: LIB_VERSION, saved: 0, device: null, merges: [], shelves: [],
           mainCollapsed: false, zoom: SHELF_ZOOM_DEFAULT, order: SHELF_ORDER_DEFAULT,
           firstSeen: {}, positions: {}, last: null };
}

// A stable random id for THIS device. "Eventually shared with the phone" is
// gated (READER_FIRST.md: the phone shelf is a record of sends, not the
// phone's inventory), but a later merge needs something to merge ON -- a
// device and a timestamp per position -- so the field is written now and
// nothing reads it across devices yet.
function deviceId() {
  try {
    let id = localStorage.getItem(LIB_DEVICE_KEY);
    if (!id) {
      id = "d-" + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
      localStorage.setItem(LIB_DEVICE_KEY, id);
    }
    return id;
  } catch (e) { return null; }
}

// Everything that comes off disk or off another device goes through here, so
// a hand-edited library.json, an older version or a truncated write can only
// ever cost a field -- never throw on a page whose whole job is to list books.
function libNormalise(raw) {
  const d = (raw && typeof raw === "object") ? raw : {};
  const merges = (Array.isArray(d.merges) ? d.merges : []).map(m => {
    if (!m || typeof m !== "object") return null;
    const members = (Array.isArray(m.members) ? m.members : [])
      .filter(x => x && typeof x.slug === "string" && x.slug)
      .map(x => ({ slug: x.slug, book_hash: x.book_hash || null,
                   hash_kind: x.hash_kind || (x.book_hash ? "unknown" : "none"),
                   at: Number(x.at) || 0 }));
    if (members.length !== 2) return null;               // a pair, or it is not a merge
    return {
      slug: typeof m.slug === "string" && m.slug ? m.slug : libMergeSlug(members[0].slug, members[1].slug),
      kind: "merge", members,
      align: m.align || null,
      created: Number(m.created) || 0,
      device: m.device || null,
      // READER_FIRST's record carries a `shelves` array on the merge as well.
      // Shelf membership is kept in ONE place -- the shelf's own `books` list
      // -- because two spellings of the same fact is how they drift; a
      // `shelves` array found on an incoming record is folded into the
      // shelves below and never written back. (§3.)
      _shelves: Array.isArray(m.shelves) ? m.shelves.filter(s => typeof s === "string") : [],
    };
  }).filter(Boolean);
  const seen = new Set();
  const uniq = merges.filter(m => (seen.has(m.slug) ? false : (seen.add(m.slug), true)));

  const shelves = (Array.isArray(d.shelves) ? d.shelves : []).map((s, i) => {
    if (!s || typeof s !== "object" || typeof s.name !== "string") return null;
    return {
      id: typeof s.id === "string" && s.id ? s.id : "s-" + i + "-" + Date.now().toString(36),
      name: s.name,
      books: Array.isArray(s.books) ? s.books.filter(x => typeof x === "string") : [],
      collapsed: !!s.collapsed,
      order: Number.isFinite(Number(s.order)) ? Number(s.order) : i,
      /* SHELVES AS ALBUMS (ASKS #184 #185, Z7): when it was made (a drop of one book on another), and what the
         reader wrote about each book on it -- the shelf companion's own words, keyed by slug, strings only */
      made: Number.isFinite(Number(s.made)) && Number(s.made) > 0 ? Number(s.made) : 0,
      about: (() => { const a = {}, src = s.about && typeof s.about === "object" ? s.about : {};
        for (const k of Object.keys(src)) if (typeof src[k] === "string" && src[k].trim()) a[k] = src[k].slice(0, 4000);
        return a; })(),
    };
  }).filter(Boolean);
  // fold any merge-side `shelves` in, then forget the field
  for (const m of uniq) {
    for (const name of m._shelves) {
      const sh = shelves.find(x => x.id === name || x.name === name);
      if (sh && !sh.books.includes(m.slug)) sh.books.push(m.slug);
    }
    delete m._shelves;
  }
  shelves.sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
  shelves.forEach((s, i) => { s.order = i; });

  const positions = {};
  const p = (d.positions && typeof d.positions === "object") ? d.positions : {};
  for (const k of Object.keys(p)) {
    const v = p[k];
    if (!v || typeof v !== "object" || typeof v.chapter !== "string") continue;
    positions[k] = {
      chapter: v.chapter,
      wordId: typeof v.wordId === "string" ? v.wordId : null,
      hash: typeof v.hash === "string" ? v.hash : null,
      hashKind: typeof v.hashKind === "string" ? v.hashKind : "none",
      at: Number(v.at) || 0,
      device: v.device || null,
    };
  }
  const last = (d.last && typeof d.last === "object" && typeof d.last.book === "string")
    ? { book: d.last.book, right: typeof d.last.right === "string" ? d.last.right : null,
        at: Number(d.last.at) || 0, device: d.last.device || null }
    : null;

  /* WHICH COVER EACH BOOK WEARS. A per-book decision that belongs beside
     shelves, merges and positions -- the same record, the same mirror to
     TTS_DATA, the same "another tab wrote it" event. `{choice, by}` and not a
     bare string: `by: "you"` is a right-click and is never overruled, while
     `by: "measured"` is this page's own verdict and may be recomputed if the
     measure ever changes. Anything unreadable is dropped rather than kept. */
  const covers = {};
  const cv = (d.covers && typeof d.covers === "object") ? d.covers : {};
  for (const k of Object.keys(cv)) {
    const v = cv[k];
    if (!v || typeof v !== "object") continue;
    if (v.choice !== "source" && v.choice !== "typeset") continue;
    covers[k] = { choice: v.choice, by: v.by === "you" ? "you" : "measured" };
  }

  /* HOW MANY BOOKS ACROSS. One of six, and anything else -- an older record
     with no zoom in it, a hand-edited file, the bench's 2 ¶ that this page
     does not draw -- falls back to the app's own 4 rather than leaving the
     shelf with an attribute no rule answers. */
  const zoom = d.zoom === "1t" ? "1" : SHELF_ZOOMS.includes(d.zoom) ? d.zoom : SHELF_ZOOM_DEFAULT;

  /* HOW THEY ARE ORDERED, and WHEN EACH ONE FIRST APPEARED. An unknown order
     falls back to the app's own the same way a bad zoom does. `firstSeen` is
     read key by key and anything that is not a finite, non-negative number is
     DROPPED rather than kept -- a bad date would put a book in the newly-added
     band forever. An ABSENT map and an EMPTY one mean the same thing and must:
     `noteFirstSeen` reads emptiness as "this record has never watched the
     library" and stamps 0, so a record cannot be tricked into calling
     everything new by having its map deleted. */
  const order = SHELF_ORDERS[d.order] ? d.order : SHELF_ORDER_DEFAULT;
  const firstSeen = {};
  const fs = (d.firstSeen && typeof d.firstSeen === "object") ? d.firstSeen : {};
  for (const k of Object.keys(fs)) {
    const v = Number(fs[k]);
    if (isFinite(v) && v >= 0) firstSeen[k] = v;
  }

  return { version: LIB_VERSION, saved: Number(d.saved) || 0, device: d.device || null,
           merges: uniq, shelves, mainCollapsed: !!d.mainCollapsed, zoom, order, firstSeen,
           positions, last, covers };
}

function libRead() {
  try {
    const raw = localStorage.getItem(LIB_KEY);
    return libNormalise(raw ? JSON.parse(raw) : null);
  } catch (e) { return libEmpty(); }
}

function libLoad() { library = libRead(); return library; }

// The only writer. Re-reads first, hands the CURRENT record to `fn`, and
// writes that back -- so a reader tab that saved a position between this
// page's last paint and this call does not lose it, and vice versa.
function libPatch(fn) {
  const now = libRead();
  fn(now);
  now.saved = Date.now();
  now.device = deviceId();
  library = now;
  let local = true;
  try { localStorage.setItem(LIB_KEY, JSON.stringify(now)); } catch (e) { local = false; }
  libMirror();
  return local;
}

async function libMirror() {
  const r = await postJSON(LIB_ROUTE, library);
  libraryWhy = r.ok ? null : ((r.body && r.body.error) || ("HTTP " + r.status) || "no studio behind this origin");
  renderShelf();
  return { mirrored: r.ok, why: libraryWhy, path: r.body && r.body.path };
}

// The mirror wins when it is newer -- settings.js's rule and phone-shelf's,
// and the only reason to keep a file at all.
async function libFetchMirror() {
  const d = await getJSON(LIB_ROUTE);
  if (!d) return null;
  const m = libNormalise(d);
  // PERSIST, not just hold in memory: firstSeen's read-modify-write from
  // localStorage would otherwise discard a just-pulled newer mirror, losing
  // another device's shelves on every pull (mirror_wins caught this, 7 Sep).
  if (m.saved > library.saved) { library = m; try { localStorage.setItem(LIB_KEY, JSON.stringify(m)); } catch (e) {} renderShelf(); }
  return m;
}

// Another tab (the reader saving a position, a second Library window) wrote
// the key. Take it and repaint; never write back from here.
window.addEventListener("storage", (e) => {
  if (e && e.key && e.key !== LIB_KEY) return;
  library = libRead();
  renderShelf();
});

// ---- LIBRARY STORE: SHARED, BYTE-IDENTICAL ----
// Five functions that reader/reader.html and library/library.html must agree
// on exactly, kept as two copies rather than one file because a shared
// runtime file would be a new SHELL file -- sw.js, publish_shell.py,
// export_bundle.py and a <script> tag in every page -- for fifty lines.
// reader/tests/test_library_store.py extracts this block from both files and
// asserts they are byte-identical, the same anti-drift rule the shelf's rail
// already lives under (reader/tests/test_library_rail.py). Nothing in here
// touches the DOM, the network or localStorage: it is the record's shape and
// the pairing rule, and both pages wrap it in their own words.
//
// The witness hash is byte-for-byte `core/provenance.py::book_word_id_hash`:
// sha256 over every word id in order, joined by "|", first 16 hex.
function libWordIds(book) {
  const ids = [];
  for (const c of (book && book.chapters) || []) {
    for (const p of c.paragraphs || []) {
      for (const s of p.sentences || []) {
        for (const w of s.words || []) if (w && w.id) ids.push(w.id);
      }
    }
  }
  return ids;
}
async function libHash(text) {
  const sub = (typeof crypto !== "undefined" && crypto && crypto.subtle) ? crypto.subtle : null;
  if (sub) {
    try {
      const buf = await sub.digest("SHA-256", new TextEncoder().encode(text));
      const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
      return { hash: hex.slice(0, 16), kind: "word-ids" };
    } catch (e) { /* file://, or a browser that refuses outside a secure context */ }
  }
  // Not a weaker sha256 pretending to be one: a different function under a
  // different name, so a hash can never be compared across the two kinds.
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i) & 0xff;
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  return { hash: ("00000000" + h.toString(16)).slice(-8), kind: "fnv1a-word-ids" };
}

function libMergeSlug(a, b) { return String(a) + "-" + String(b); }

/* A MERGE IS EXACTLY TWO (Osca, confirmed 30 Aug; READER_FIRST.md "Logged for
 * later"). The parallel view holds two panes, so a pair of pairs is a view
 * that cannot be drawn -- and this is the one place that says so, for the
 * shelf's "Merge with..." and for a tab dropped on a tab alike. It returns
 * the SENTENCE, not a boolean, because every refusal in this app is a
 * refusal in words: a menu item that greys out silently is the bug this
 * project keeps naming.
 *
 * Pure, and every fact it needs is passed in -- whether each side is already
 * a pair, and what each is called -- so it is the same answer in a browser,
 * in the node harness and in a page that has no library loaded yet. */
function mergeRefusal(o) {
  o = o || {};
  if (!o.a || !o.b) return "A pair is two books, and this is one.";
  if (o.a === o.b) return "A book cannot be paired with itself.";
  if (o.aIsPair || o.bIsPair) {
    const which = o.aIsPair ? (o.aName || o.a) : (o.bName || o.b);
    return "\u201c" + which + "\u201d is already a pair, and a parallel view holds two. "
      + "Take its pairing off first, then pair one of its two books.";
  }
  return null;
}

/* The record, and nothing else: a name and two slugs. It copies no text,
 * moves no book and asserts nothing about language -- `members[0]` is the
 * target (the top lane in one-word mode) and `members[1]` the ground, and
 * that ORDER is the only claim it makes. `book_hash` is each member's hash as
 * at merge time, a witness: when a member is re-parsed the pair still opens
 * and marks itself stale rather than being quietly wrong. */
function libMergeRecord(a, b, ha, hb, at, device) {
  return {
    slug: libMergeSlug(a, b), kind: "merge",
    members: [{ slug: a, book_hash: ha.hash, hash_kind: ha.kind, at: at },
              { slug: b, book_hash: hb.hash, hash_kind: hb.kind, at: at }],
    // Where the word-alignment sidecar goes when align/ builds one
    // (PROMPTS/reader-one-word.md 5). A merge is the app's way of saying
    // "these two are a translation pair", which is that step's input -- so
    // the field exists, named, and stays null until something writes it.
    align: null,
    created: at, device: device,
  };
}
// ---- END LIBRARY STORE ----

// ---- MARGINALIA STORE: SHARED, BYTE-IDENTICAL ----
// Notes, highlights and bookmarks -- Osca, 31 August (READER_FIRST.md
// "Marginalia"): "the reader becomes a place you write in". Three things,
// ONE store, shared with the phone.
//
// This block is the record's SHAPE and its merge rule, and nothing else: no
// DOM, no network, no localStorage. It is kept as two byte-identical copies
// in reader/reader.html and library/library.html for the LIBRARY STORE
// block's reason (a shared runtime file would be a new SHELL file -- sw.js,
// publish_shell.py, export_bundle.py and a <script> tag in every page -- for
// eighty lines), and reader/tests/test_marginalia.py extracts both and
// asserts they are identical, which is the only thing that keeps two copies
// honest. The reader is the writer; the Library reads bookmarks, for "Open
// at bookmark...".
//
// **Where it lives.** `ttstv.reader.marginalia.<slug>` in localStorage, one
// key per book, mirrored to `TTS_DATA/reader/marginalia/<slug>.json` through
// studio's `/marginalia/<slug>` -- a route that DOES NOT EXIST YET, exactly
// as `/phone-shelf` and `/reader-library` did not when their panels were
// written, so `save()` says `mirrored: false` in words until it lands
// (reader/README.md 6). ONE KEY PER BOOK, not one for the library, because
// the mirror is one file per book and because a note written while reading
// Blood Meridian must not rewrite Hamlet's file.
//
// **Nothing here ever goes into `books/` or a bundle.** It is personal data
// about a person, sitting beside the book and never inside it.
//
//   notes       {id, from: wordId, to: wordId, text, at, device, witness,
//                witnessKind}
//   highlights  {id, from: wordId, to: wordId, colour, at, device, witness,
//                witnessKind}
//   bookmarks   {id, at: wordId, made, device, witness, witnessKind}
//
// **Anchored to word ids** -- the ids the timings, the aligner and the
// library record's `positions` already use, so an anchor survives a re-parse
// the way the reading position does. `from`/`to` are INCLUSIVE and are
// resolved against the ids actually on the page at paint time: an anchor
// whose chapter is not rendered simply does not paint, and is not lost.
//
// **The witness hash is the library record's, byte for byte** --
// `libHash(libWordIds(book).join("|"))`, which is `core/provenance.py::
// book_word_id_hash`. It is on EVERY ENTRY and not only on the record,
// because a record accumulates across a re-parse: a single record-level hash
// would call this morning's note stale along with last week's. The record
// carries `hash`/`hashKind` too, as at its last save, so the Library can say
// "this book has moved on" without loading the book. A stale witness is
// SHOWN as such and NEVER re-anchored -- an anchor moved to whichever words
// now hold those ids is the quiet lie this project keeps refusing.
//
// **Two writers, and neither may lose the other.** The voice layer is a
// second writer to this same store (voiceui/: "note: ...", "highlight that",
// "bookmark here" -- reader/README.md 6), and a Library tab is a third
// reader. So: every write is a read-modify-write, and `margMerge` merges BY
// ID, newest timestamp winning. Which forces the next decision --
//
// **a delete is a tombstone**, `{id, deleted: <ms>}`, kept. With merge-by-id
// a plain removal is undone by the first writer that still holds the entry;
// a tombstone is an entry with a timestamp and wins the same way any other
// edit does. `margPrune` drops tombstones older than 30 days so the file
// cannot grow without bound -- long enough for any second writer to have
// caught up, and this is a mirror file, not a queue.
var MARG_VERSION = 1;
var MARG_PREFIX = "ttstv.reader.marginalia.";
var MARG_ROUTE = "/marginalia/";
// Osca's four, in his order. The list is here rather than in a stylesheet
// because it is the record's vocabulary: a colour that is not one of these
// is not stored (margNormalise drops to the first), and the CSS is keyed off
// it rather than the other way round. AND ANY COLOUR THE PERSON ADDS (Z4,
// Osca 30 Sep: "any number, user-added"): an added colour is stored as its
// own "#rrggbb", so a mark paints on every device whatever that device's
// palette holds; names and order are design/reader/colours.js's.
var MARG_COLOURS = ["green", "yellow", "red", "pink"];
var MARG_TOMBSTONE_MS = 30 * 24 * 60 * 60 * 1000;

function margKey(slug) { return MARG_PREFIX + String(slug || ""); }

function margEmpty(slug) {
  return { version: MARG_VERSION, slug: String(slug || ""), saved: 0, device: null,
           hash: null, hashKind: "none", notes: [], highlights: [], bookmarks: [] };
}

// Unique enough that two writers on two devices cannot collide, and short
// enough to read in a file. Time first so an id sorts by when it was made.
function margId(kind, now, rand) {
  var t = Number(now) || 0;
  var r = (typeof rand === "function") ? rand : Math.random;
  // PADDED, and that is the whole point of the field: base 36 of a smaller
  // number is a SHORTER string, and a shorter string sorts before a longer
  // one whatever its value -- so an unpadded stamp sorts by digit count and
  // not by time. Eight places carries a millisecond epoch past the year
  // 5000; anything that overflows it simply keeps its own length.
  var stamp = ("00000000" + t.toString(36)).slice(-8);
  return String(kind || "m").slice(0, 1) + "-" + stamp
    + "-" + r().toString(36).slice(2, 8);
}

function margColour(c) {
  if (MARG_COLOURS.indexOf(c) >= 0) return c;
  if (typeof c === "string" && /^#[0-9a-f]{6}$/i.test(c)) return c.toLowerCase();
  return MARG_COLOURS[0];
}

// Everything off disk, off another device or out of another writer comes
// through here, so a hand-edited file, an older version or a truncated write
// can only ever cost a field -- never throw on the page whose whole job is
// to show a person their own words.
function margNormaliseEntry(e, kind) {
  if (!e || typeof e !== "object" || typeof e.id !== "string" || !e.id) return null;
  var at = Number(e.at) || Number(e.made) || 0;
  var out = { id: e.id, at: at,
              device: (typeof e.device === "string" && e.device) ? e.device : null,
              witness: (typeof e.witness === "string" && e.witness) ? e.witness : null,
              witnessKind: (typeof e.witnessKind === "string" && e.witnessKind) ? e.witnessKind : "none" };
  if (e.deleted != null && Number(e.deleted) > 0) {
    // A tombstone carries its id and its time and nothing else -- keeping the
    // text of a deleted note in the file is the opposite of deleting it.
    out.deleted = Number(e.deleted);
    out.at = Math.max(out.at, out.deleted);
    return out;
  }
  if (kind === "bookmarks") {
    if (typeof e.at !== "string" && typeof e.wordId !== "string") return null;
    out.wordId = typeof e.wordId === "string" ? e.wordId : e.at;
    out.at = Number(e.made) || Number(e.stamp) || at || 0;
    out.made = out.at;
    // A LABEL, never a decision. The Library lists bookmarks in a book's
    // menu ("Open at bookmark...") and it has no book.json to resolve a word
    // id against -- stevens-collected-poems' is 4 MB, and loading one to
    // draw a menu of three rows is not a trade. So the reader, which does
    // have the book, writes the chapter beside the anchor. Where the reader
    // LANDS is still decided by `wordId` alone, so a stale label can only
    // ever be a stale label.
    out.chapter = (typeof e.chapter === "string" && e.chapter) ? e.chapter : null;
    out.chapterTitle = (typeof e.chapterTitle === "string" && e.chapterTitle) ? e.chapterTitle : null;
    return out;
  }
  if (typeof e.from !== "string" || !e.from) return null;
  out.from = e.from;
  out.to = (typeof e.to === "string" && e.to) ? e.to : e.from;
  if (kind === "notes") out.text = typeof e.text === "string" ? e.text : "";
  else out.colour = margColour(e.colour);
  // A CARD'S MARK (Z6, Osca 30 Sep: "it's just a sort"): again / later / done, and when -- kept on the record so the
  // Library's "your stuff" reads it here (design/library/seams.js keeps its frank.review.<slug> fallback).
  if (e.review && typeof e.review === "object" && /^(again|later|done)$/.test(e.review.state))
    out.review = { state: e.review.state, at: Number(e.review.at) || 0 };
  return out;
}

function margNormalise(raw, slug) {
  var d = (raw && typeof raw === "object") ? raw : {};
  var out = margEmpty(slug || d.slug);
  out.saved = Number(d.saved) || 0;
  out.device = (typeof d.device === "string" && d.device) ? d.device : null;
  out.hash = (typeof d.hash === "string" && d.hash) ? d.hash : null;
  out.hashKind = (typeof d.hashKind === "string" && d.hashKind) ? d.hashKind : (out.hash ? "unknown" : "none");
  var kinds = ["notes", "highlights", "bookmarks"];
  for (var i = 0; i < kinds.length; i++) {
    var k = kinds[i];
    var list = Array.isArray(d[k]) ? d[k] : [];
    var seen = {};
    var kept = [];
    for (var j = 0; j < list.length; j++) {
      var e = margNormaliseEntry(list[j], k);
      if (!e) continue;
      // One id, one entry, even inside one file: the newer wins, which is
      // margMerge's rule applied to a file that has already been merged
      // badly by hand.
      if (Object.prototype.hasOwnProperty.call(seen, e.id)) {
        var prev = kept[seen[e.id]];
        if (e.at >= prev.at) kept[seen[e.id]] = e;
        continue;
      }
      seen[e.id] = kept.length;
      kept.push(e);
    }
    out[k] = kept;
  }
  return out;
}

// The merge, and the whole reason the record is shaped this way. BY ID,
// newest wins; a tombstone is an entry and wins the same way. Neither side
// is privileged -- `margMerge(mine, theirs)` and `margMerge(theirs, mine)`
// give the same set -- so it is the same answer whichever writer runs it.
function margMerge(a, b) {
  var base = margNormalise(a, (a && a.slug) || (b && b.slug));
  var other = margNormalise(b, base.slug);
  var kinds = ["notes", "highlights", "bookmarks"];
  for (var i = 0; i < kinds.length; i++) {
    var k = kinds[i];
    var byId = {};
    var order = [];
    var all = base[k].concat(other[k]);
    for (var j = 0; j < all.length; j++) {
      var e = all[j];
      if (!Object.prototype.hasOwnProperty.call(byId, e.id)) { byId[e.id] = e; order.push(e.id); continue; }
      var prev = byId[e.id];
      // A tie goes to the tombstone: two writers that disagree about whether
      // a note exists, at the same millisecond, resolve to gone -- the state
      // a person can undo by writing it again, rather than one they have to
      // notice and delete a second time.
      if (e.at > prev.at || (e.at === prev.at && e.deleted && !prev.deleted)) byId[e.id] = e;
    }
    var merged = [];
    for (var m = 0; m < order.length; m++) merged.push(byId[order[m]]);
    base[k] = merged;
  }
  base.saved = Math.max(base.saved, other.saved);
  if (other.saved >= base.saved && other.hash) { base.hash = other.hash; base.hashKind = other.hashKind; }
  return base;
}

// Tombstones older than 30 days go; live entries never do.
function margPrune(rec, now) {
  var t = Number(now) || 0;
  var kinds = ["notes", "highlights", "bookmarks"];
  for (var i = 0; i < kinds.length; i++) {
    var k = kinds[i];
    rec[k] = rec[k].filter(function (e) { return !e.deleted || (t - e.deleted) < MARG_TOMBSTONE_MS; });
  }
  return rec;
}

// What a page actually draws: the entries that are not tombstones.
function margLive(rec, kind) {
  var list = (rec && Array.isArray(rec[kind])) ? rec[kind] : [];
  return list.filter(function (e) { return !e.deleted; });
}

// "Made against an older parse" -- the entry's own witness against the
// book's hash NOW. Unknown either way is not stale: a record written before
// a hash could be computed (file://, no crypto.subtle) says nothing about
// the parse, and saying "stale" on no evidence is its own lie. The two
// KINDS must match as well as the values, because `libHash`'s fallback is a
// different function under a different name and comparing across them is
// meaningless.
function margStale(entry, hash, hashKind) {
  if (!entry || !entry.witness || !hash) return false;
  if (entry.witnessKind !== hashKind) return false;
  return entry.witness !== hash;
}

// Reading order for a list of anchored entries, given the page's own word
// order (`index` maps a word id to its position). An entry whose anchor is
// not on the page sorts last, in the order it was made -- it still has to
// appear somewhere, in the margin's "not on this page" line.
function margOrder(list, index) {
  var idx = index || {};
  function pos(e) {
    var k = e.wordId || e.from;
    var v = Object.prototype.hasOwnProperty.call(idx, k) ? idx[k] : -1;
    return v < 0 ? Infinity : v;
  }
  return list.slice().sort(function (x, y) {
    var a = pos(x), b = pos(y);
    if (a !== b) return a - b;
    return (x.at || 0) - (y.at || 0);
  });
}

// The words a span covers, given the page's ordered ids. Inclusive, and it
// answers `[]` rather than throwing when either end is missing -- the anchor
// is in a chapter that is not rendered, which is not an error.
function margSpanIds(from, to, ids) {
  var a = ids.indexOf(from);
  var b = ids.indexOf(to);
  if (a < 0 && b < 0) return [];
  if (a < 0) a = b;
  if (b < 0) b = a;
  if (b < a) { var t = a; a = b; b = t; }
  return ids.slice(a, b + 1);
}

// Which colour a word wears when several highlights cover it: the newest,
// because the last thing a person did to a word is what they meant. Returns
// null for a word no live highlight covers.
function margColourAt(wordId, highlights, ids) {
  var best = null;
  for (var i = 0; i < highlights.length; i++) {
    var h = highlights[i];
    if (h.deleted) continue;
    if (margSpanIds(h.from, h.to, ids).indexOf(wordId) < 0) continue;
    if (!best || (h.at || 0) >= (best.at || 0)) best = h;
  }
  return best ? best.colour : null;
}
// ---- END MARGINALIA STORE ----

async function bookHashFor(slug) {
  try {
    const res = await fetch("../books/" + encodeURIComponent(slug) + "/book.json", { cache: "no-store" });
    if (!res.ok) return { hash: null, kind: "none" };
    const book = await res.json();
    return await libHash(libWordIds(book).join("|"));
  } catch (e) { return { hash: null, kind: "none" }; }
}

// --------------------------------------------------------------- merges
function mergeFor(slug) { return library.merges.find(m => m.slug === slug) || null; }
function isMerge(slug) { return !!mergeFor(slug); }

// The one item on the shelf menu that writes anything. It writes a NAME and
// two slugs; it copies no text, moves no book and touches nothing on the SSD
// except this one record.
async function mergeCreate(a, b) {
  if (!a || !b || a === b) return null;
  const slug = libMergeSlug(a, b);
  if (mergeFor(slug)) { note(`“${entryTitle(slug)}” is already on the shelf.`); return mergeFor(slug); }
  // A merge is exactly two, and the refusal is one sentence from one place
  // (mergeRefusal, in the shared block above -- the same rule a tab dropped
  // on a tab in reader.html gets).
  const no = mergeRefusal({ a, b, aIsPair: isMerge(a), bIsPair: isMerge(b),
                            aName: entryTitle(a), bName: entryTitle(b) });
  if (no) { note(no); return null; }
  const at = Date.now();
  const [ha, hb] = await Promise.all([bookHashFor(a), bookHashFor(b)]);
  const rec = libMergeRecord(a, b, ha, hb, at, deviceId());
  libPatch(d => { d.merges = d.merges.filter(m => m.slug !== slug).concat([rec]); });
  renderShelf();
  note(`“${entryTitle(slug)}” is on the shelf. It always opens both — nothing was copied.`);
  return rec;
}

function mergeSwapOrder(slug) {
  const m = mergeFor(slug);
  if (!m) return null;
  const [a, b] = m.members;
  const next = libMergeSlug(b.slug, a.slug);
  libPatch(d => {
    const rec = d.merges.find(x => x.slug === slug);
    if (!rec) return;
    rec.members = [rec.members[1], rec.members[0]];
    rec.slug = next;
    for (const sh of d.shelves) sh.books = sh.books.map(s => (s === slug ? next : s));
    if (d.positions[slug]) { d.positions[next] = d.positions[slug]; delete d.positions[slug]; }
  });
  SEL = SEL.map(s => (s === slug ? next : s));
  renderShelf();
  note(`${entryTitle(next)} — ${bookTitle(b.slug)} is now the target, ${bookTitle(a.slug)} the ground.`);
  return next;
}

// "Deleting a merged entry removes only that entry" -- §4, and the one thing
// the confirmation has to say in words.
function mergeDelete(slug) {
  const m = mergeFor(slug);
  if (!m) return null;
  const [a, b] = m.members.map(x => bookTitle(x.slug));
  const ok = window.confirm(
    `Remove “${entryTitle(slug)}” from the shelf?\n\n` +
    `Only the pairing goes. ${a} and ${b} both stay on the shelf, with their text, audio and look-ups untouched.`);
  if (!ok) return null;
  libPatch(d => {
    d.merges = d.merges.filter(x => x.slug !== slug);
    for (const sh of d.shelves) sh.books = sh.books.filter(s => s !== slug);
    delete d.positions[slug];
  });
  SEL = SEL.filter(s => s !== slug);
  renderShelf();
  note(`“${entryTitle(slug)}” removed. ${a} and ${b} are both still on the shelf.`);
  return true;
}

// A member re-parsed underneath the pair. The entry still OPENS -- it names
// slugs and slugs resolve -- but it says so, and anything built against the
// pair (an alignment, when one exists) is stale rather than silently wrong.
function mergeStale(m) {
  if (!m) return [];
  return m.members.filter(x => x.hash_kind === "none" || !x.book_hash).map(x => x.slug);
}

// --------------------------------------------------------------- shelves
// `window.prompt` is the shelf's only text input, and it is the one browser
// affordance the node harness does not carry -- a test names the shelf by
// setting `window.prompt`. Guarded so a page with none simply does nothing
// rather than throwing halfway through a menu action.
function ask(question, initial) {
  if (typeof window.prompt !== "function") return null;
  return window.prompt(question, initial == null ? "" : initial);
}

function shelfCreate(name) {
  const clean = String(name || "").trim();
  if (!clean) return null;
  if (library.shelves.some(s => s.name.toLowerCase() === clean.toLowerCase())) {
    note(`There is already a shelf called “${clean}”.`); return null;
  }
  const id = "s-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6);
  libPatch(d => { d.shelves.push({ id, name: clean, books: [], collapsed: false, order: d.shelves.length }); });
  renderShelf();
  return id;
}

function shelfRename(id, name) {
  const clean = String(name || "").trim();
  if (!clean) return false;
  libPatch(d => { const s = d.shelves.find(x => x.id === id); if (s) s.name = clean; });
  renderShelf();
  return true;
}

// "Deleting a shelf NEVER deletes a book" -- and the confirmation says so.
function shelfDelete(id) {
  const s = library.shelves.find(x => x.id === id);
  if (!s) return false;
  const n = s.books.length;
  const ok = window.confirm(
    `Delete the shelf “${s.name}”?\n\n` +
    `The shelf label goes. ${n === 1 ? "The 1 book on it" : `The ${n} books on it`} stay${n === 1 ? "s" : ""} in the library — ` +
    `${n === 1 ? "it returns" : "they return"} to unshelved. Nothing is deleted.`);
  if (!ok) return false;
  libPatch(d => { d.shelves = d.shelves.filter(x => x.id !== id); d.shelves.forEach((x, i) => { x.order = i; }); });
  renderShelf();
  note(`Shelf “${s.name}” deleted. ${n} book${n === 1 ? "" : "s"} returned to unshelved — nothing was removed from the library.`);
  return true;
}

function shelfToggle(id) {
  if (id === MAIN_SHELF) {
    libPatch(d => { d.mainCollapsed = !d.mainCollapsed; });
  } else {
    libPatch(d => { const s = d.shelves.find(x => x.id === id); if (s) s.collapsed = !s.collapsed; });
  }
  renderShelf();
  return true;
}

function shelfAdd(id, slugs) {
  const list = [].concat(slugs).filter(Boolean);
  if (!list.length) return false;
  libPatch(d => {
    const s = d.shelves.find(x => x.id === id);
    if (!s) return;
    for (const slug of list) if (!s.books.includes(slug)) s.books.push(slug);
  });
  renderShelf();
  const s = library.shelves.find(x => x.id === id);
  if (s) note(`${list.length} book${list.length === 1 ? "" : "s"} on “${s.name}”. Nothing moved — a shelf is a label.`);
  return true;
}

function shelfRemove(id, slug) {
  libPatch(d => { const s = d.shelves.find(x => x.id === id); if (s) s.books = s.books.filter(x => x !== slug); });
  renderShelf();
  return true;
}

function shelvesFor(slug) { return library.shelves.filter(s => s.books.includes(slug)); }

// ============================================ SELECTION, AND ONLY THEN OPENING
// PROMPTS/library-shelf.md §1. Osca, 30 Aug: "the whole thing of opening
// multiple books right now is very strange, we have to simplify it".
//
// A single click used to open a reader tab, which meant the shelf had no way
// to say "this one and that one" -- so the parallel view was reachable only
// by typing a URL. Now:
//
//   click          selects, and opens NOTHING
//   shift-click    extends the selection
//   cmd/ctrl-click toggles one row in or out
//   Enter          opens the selection -- two = the parallel view, one = a tab
//   double-click   opens that book in a new tab immediately, whatever is
//                  selected (the gesture that means "just open it")
//   Esc            clears; so does a click on the shelf's background
//
// **The order is the content**, because it is what the parallel view and
// one-word mode read: first-selected is the LEFT pane and the target lane,
// second is the right and the ground. So the first carries a mark the second
// does not -- a number, not just a highlight, since "which of these two is
// first" cannot be read off two identical outlines.
//
// On a phone this is a long-press then tap-to-add (§5): there is no shift and
// no right button, and `wireLongPress` already stands in for both.
let SEL = [];                 // slugs, IN ORDER -- the whole selection model
let SEL_ANCHOR = null;        // the row shift-click measures from

const MAIN_SHELF = "__main__";

/* MOST RECENTLY OPENED FIRST, NEVER OPENED LAST (Osca, 4 Sep).
 *
 * The record already exists and it is the reader's: `positions[slug].at`, the
 * millisecond stamp `readercontrol.js` writes whenever it remembers where you
 * were (reader/memory.js's LIBRARY STORE). A book you have never opened has no
 * entry at all, which IS the bottom bucket -- nothing has to mark it.
 *
 * STABLE, and that is the whole of the tie-break: books with no time keep the
 * order they arrived in, which is studio's (`bookinfo.book_slugs`, alphabetical
 * by slug). So a fresh library reads exactly as it did before anybody opened
 * anything, and every book that has been read rises above it in the order it
 * was last read. `Array.prototype.sort` has been stable since ES2019 and is
 * stable in every engine this ships to.
 *
 * A MERGE takes the more recent of its members -- opening either half is
 * opening the pair, and a pair that sank below the book you just read out of
 * it would be the shelf disagreeing with itself. */
function openedAt(slug) {
  const p = library && library.positions && library.positions[slug];
  return (p && Number(p.at)) || 0;
}

function byLastOpened(rows) {
  return rows.slice().sort((a, b) => openedAt(b.slug) - openedAt(a.slug));
}

// One list, merges first, in the order the shelf paints them -- shift-click
// needs a linear order and it must be the order on screen.
function shelfEntries() {
  const books = shelfOrdered(libraryBooks || []);
  const loadingSlugs = new Set(Array.from(pending.values()).map(e => e.slug).filter(Boolean));
  const real = books.filter(b => !loadingSlugs.has(b.slug));
  const bySlug = new Map(real.map(b => [b.slug, b]));
  const merged = library.merges
    .filter(m => m.members.every(x => bySlug.has(x.slug)))     // a pair whose books are gone is not paintable
    .map(m => ({
      slug: m.slug, merge: m,
      title: m.members.map(x => bySlug.get(x.slug).title).join("  ·  "),
      author: bySlug.get(m.members[0].slug).author,
      lang: m.members.map(x => bySlug.get(x.slug).lang).join(" → "),
      chapters: Math.max.apply(null, m.members.map(x => bySlug.get(x.slug).chapters || 0)),
      has_audio: m.members.some(x => bySlug.get(x.slug).has_audio),
      has_timings: m.members.some(x => bySlug.get(x.slug).has_timings),
      // the pair's own last-opened: the later of its two halves
      openedAt: Math.max.apply(null, m.members.map(x => openedAt(x.slug))),
    }));
  merged.sort((a, b) => b.openedAt - a.openedAt);
  /* NEWLY ADDED COMES OFF THE TOP, so this list IS the order on screen --
     which is the property this function's own comment claims and the thing
     shift-click depends on. `renderShelf` splits it back out on the same
     rule; a merged entry has no `firstSeen` of its own, so it can never be
     lifted into the band. */
  /* ...AND THE BAND IS THE OPEN BOOKS AND THEN NEWLY ADDED (OPEN BOOKS COME
     FIRST), so it is the band that comes off the top now, ahead of the pairs
     -- which is where it is on screen. */
  /* ONE GRID, ONE ORDER (29 Sep, two Strangers: the open books were still pinned ahead of every order -- "by author"
     began Dumas · unknown · Dickens · Borges). The band is gone from the page (renderShelf), so nothing comes off the
     top: the pairs, then the books, in the order chosen. */
  return merged.concat(real);
}

/* ------------------------------------------------- the marginalia, read only
 * The Library never writes a note, a highlight or a bookmark -- the reader is
 * the writer (MARGINALIA STORE, above). It reads one thing: this book's
 * bookmarks, for "Open at bookmark...". localStorage is synchronous, the keys
 * are one small JSON per book, and this runs when a menu opens rather than at
 * boot, so it costs the shelf's cold open nothing. */
function margReadRec(slug) {
  let raw = null;
  try { raw = localStorage.getItem(margKey(slug)); } catch (e) { raw = null; }
  let d = null;
  try { d = raw ? JSON.parse(raw) : null; } catch (e) { d = null; }
  return margPrune(margNormalise(d, slug), Date.now());
}

function bookmarksFor(slug) {
  if (!slug) return [];
  const rec = margReadRec(slug);
  return margLive(rec, "bookmarks").slice().sort((a, b) => (a.made || 0) - (b.made || 0));
}

/* What a bookmark is CALLED in a list: its chapter if the reader recorded
 * one, and when it was made -- which is the pair a person actually recognises
 * ("the one in Act III I made last night"). The word id is not shown: it is
 * the anchor, not a name. */
function bookmarkLabel(b) {
  const when = b.made ? new Date(b.made).toLocaleString(undefined,
    { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
  const where = b.chapterTitle || b.chapter || null;
  return where ? (where + (when ? " — " + when : "")) : (when || "Bookmark");
}

function entryFor(slug) { return shelfEntries().find(e => e.slug === slug) || null; }
function bookTitle(slug) {
  const b = (libraryBooks || []).find(x => x.slug === slug);
  return (b && b.title) || slug;
}
function entryTitle(slug) {
  const m = mergeFor(slug);
  if (m) return m.members.map(x => bookTitle(x.slug)).join(" · ");
  return bookTitle(slug);
}

function selClear() { SEL = []; SEL_ANCHOR = null; paintSelection(); return SEL; }
function selIs(slug) { return SEL.indexOf(slug) >= 0; }

function selSet(slug) { SEL = slug ? [slug] : []; SEL_ANCHOR = slug || null; paintSelection(); return SEL; }

function selToggle(slug) {
  const i = SEL.indexOf(slug);
  if (i >= 0) SEL.splice(i, 1); else SEL.push(slug);
  SEL_ANCHOR = slug;
  paintSelection();
  return SEL;
}

// Shift extends from the anchor along the painted order, and APPENDS in that
// order rather than rebuilding, so "first" survives an extension backwards.
function selExtend(slug) {
  const order = shelfEntries().map(e => e.slug);
  const anchor = SEL_ANCHOR && order.indexOf(SEL_ANCHOR) >= 0 ? SEL_ANCHOR : (SEL[0] || slug);
  const a = order.indexOf(anchor), b = order.indexOf(slug);
  if (a < 0 || b < 0) return selSet(slug);
  const span = a <= b ? order.slice(a, b + 1) : order.slice(b, a + 1).reverse();
  SEL = [anchor].concat(span.filter(s => s !== anchor));
  SEL_ANCHOR = anchor;
  paintSelection();
  return SEL;
}

// Repaints the marks in place. Never a re-render: re-rendering the shelf on
// every click loses the pointer's own row under a fresh element, which is the
// bug renderSources() already documents for the sidebar.
function paintSelection() {
  const rows = document.querySelectorAll("#shelf .railrow");
  for (const row of rows) {
    const slug = row.dataset.slug;
    const i = slug ? SEL.indexOf(slug) : -1;
    row.setAttribute("aria-selected", i >= 0 ? "true" : "false");
    if (i >= 0) row.dataset.selOrder = String(i + 1); else delete row.dataset.selOrder;
    row.classList.toggle("selFirst", i === 0 && SEL.length > 1);
  }
  /* NO HINT BAR. It said what the marks already say -- the selected row's
   * own highlight (and `selOrder` / `selFirst` for a pair) is the whole
   * signal, and a line of prose under the title bar was one more strip of
   * chrome above the shelf. Removed outright: element, styles and this
   * update. Nothing replaces it. */
}

// ------------------------------------------------------------- opening
function readerPairUrl(a, b) {
  return `../reader/reader.html?${new URLSearchParams({ left: "books/" + a, right: "books/" + b })}`;
}

// The host (desktop/src/host.js) knows `openReader(slug)` and nothing about a
// pair, and `url_for` in tabs.rs builds `?book=books/<slug>` from a slug. But
// `classify()` there already reads `?left=` as a Reader tab, and
// `on_new_window` turns a window.open into a real tab beside this one -- so a
// pair opens correctly in the app today through window.open, and correctly in
// a browser through the same call. A native `openPair` is a §6 request, not a
// blocker.
function openPair(a, b, newWindow, asTab) {
  rememberBook(a);
  const h = host();
  if (h && typeof h.openPair === "function") { h.openPair(a, b); return "host:pair"; }
  const url = readerPairUrl(a, b);
  if (newWindow) { window.open(url, "_blank", "popup,width=1400,height=900"); return "window"; }
  if (asTab) { window.open(url, "_blank"); return "tab"; }
  location.assign(url); return "here";     // in a browser the pair opens HERE (STRANGER-FIX)
}

// One entry -- a book or a merge -- opened the way that entry means.
function openEntry(slug, newWindow, asTab) {
  const m = mergeFor(slug);
  if (m) return openPair(m.members[0].slug, m.members[1].slug, newWindow, asTab);
  return openReader(slug, newWindow, asTab);
}

// Enter. Two selected is the parallel view; one is a tab; three or more is
// three or more tabs, with a line saying so.
//
// **The judgment call, and it is the report's one question for Osca.**
// Refusing punishes a deliberate gesture -- nobody shift-clicks five books by
// accident -- and a parallel view of five is not a thing, so the honest
// reading of "Enter opens the selection" is one tab each. It is loud rather
// than silent: the note names the count.
function openSelection() {
  if (!SEL.length) return null;
  // one book: the book is the answer -- no "Opened X." line over a shelf the
  // person is no longer looking at (STRANGER-FIX, 28 Sep: *"a claim, when
  // nothing opened"*)
  if (SEL.length === 1) return openEntry(SEL[0], false);
  if (SEL.length === 2) {
    const [a, b] = SEL;
    if (mergeFor(a) || mergeFor(b)) {
      // a merged entry is already a pair; pairing it with a third book would
      // be a view of three columns, which does not exist
      SEL.forEach(s => openEntry(s, false, true));
      note(`Opened ${SEL.length} tabs — a merged book is already a pair, so these could not share one view.`);
      return "tabs";
    }
    const r = openPair(a, b, false);
    note(`Opened ${bookTitle(a)} beside ${bookTitle(b)} — ${bookTitle(a)} on the left.`);
    return r;
  }
  // three or more is the one gesture that WANTS tabs: one each, this page kept
  SEL.forEach(s => openEntry(s, false, true));
  note(`Opened ${SEL.length} tabs, one per book — a parallel view holds two.`);
  return "tabs";
}

// ------------------------------------------------------------- the shelves
// §4b. Osca, 30 Aug: "just separate shelves, like I can say, here's latin,
// here's my poems, here's my philosophy etc. So I can categorise my library,
// NOT folders. And allow me to drop it down (the shelf), minimise/expand --
// and if minimised OR open, tell me how many books are on that shelf."
//
// "Not folders" is the instruction and the useful reading is that a shelf is
// a LABEL: nothing is moved, nothing is nested, and a book may sit on more
// than one -- Eclogues is Latin *and* poetry. So the named shelves are drawn
// ABOVE the main shelf, and the main shelf goes on meaning what it means
// today: every book in the library, with the count Osca already reads off it.
// A book therefore appears in its shelves and again below, which is exactly
// what a label costs; the main shelf collapses like any other if that gets
// long. (If he would rather the main shelf became a "not yet filed" tray,
// that is one line -- §3.)
function shelfHeadHTML(id, name, count, collapsed, extra) {
  return `<div class="shelfhead" data-shelf="${esc(id)}">` +
    `<button type="button" class="shelftoggle" data-shelf="${esc(id)}" aria-expanded="${collapsed ? "false" : "true"}"` +
    ` aria-label="${collapsed ? "Expand" : "Collapse"} ${esc(name)}">` +
    `<span class="shelfcaret" aria-hidden="true">${collapsed ? "›" : "⌄"}</span>` +
    `<span class="shelfname">${esc(name)}</span>` +
    `<span class="shelfcount">\u00b7 ${count}</span></button>` +
    (extra || "") + `</div>`;
}

function namedShelvesHTML(entries) {
  if (!library.shelves.length) return "";
  const bySlug = new Map(entries.map(e => [e.slug, e]));
  return library.shelves.map(s => {
    const rows = s.books.map(x => bySlug.get(x)).filter(Boolean);
    const body = s.collapsed ? ""
      : (rows.length
          ? tileRows(rows)
          : `<div class="empty shelfempty">Nothing on this shelf yet — drag a book here, or use “Add to shelf” on the menu.</div>`);
    return `<section class="shelfgrp" data-shelf="${esc(s.id)}" data-collapsed="${s.collapsed ? "1" : "0"}">` +
      shelfHeadHTML(s.id, s.name, rows.length,
        s.collapsed,
        `<button type="button" class="shelfmenu" data-shelfmenu="${esc(s.id)}" aria-label="Shelf actions">⋯</button>`) +
      body + `</section>`;
  }).join("");
}

// -------------------------------------------------- the way out (step 0)
// Osca, 28 Aug 18:49, on the installed shell: "Open library means I pretty
// much have to close the app." In the desktop app the Library is a tab that
// cannot close and the Reader is another tab, so this is only the phone's
// problem -- but the control is in both layouts, because a browser tab on
// the Mac has exactly the same dead end.
//
// Three ways out, in order of how little they throw away:
//   1. reached from the reader -> history.back(), which keeps that reader's
//      chapter, scroll and playing audio;
//   2. otherwise the last book opened on this device, if it is still on the
//      shelf (or the shelf is unknown -- a published shell has none);
//   3. otherwise the first book on the shelf.
// Nothing at all -> stay here and say so, rather than navigating to a reader
// with no book, which would only offer "Open the library" back again.
const LAST_BOOK_KEY = "ttstvLastBook";   // reader.html writes it too, on boot

function rememberBook(slug) {
  if (!slug) return null;
  try { localStorage.setItem(LAST_BOOK_KEY, slug); } catch (e) { /* private mode / file:// */ }
  /* AND THE SHELF'S OWN ORDER IS TRUE (STRANGER-FIX, 28 Sep). "last opened
     first" read `positions[slug].at`, which only the reader wrote, and only
     on a chapter turn -- so a book opened and left at its title page never
     moved, and the default order was a promise the shelf did not keep. The
     open itself is the fact: stamp it here, on every door out (a tile, Enter,
     the menu, a pair), keeping whatever place the reader has recorded. */
  try {
    libPatch(d => {
      const p = (d.positions && d.positions[slug])
        || { chapter: "", wordId: null, hash: null, hashKind: "none", device: null };
      p.at = Date.now();
      if (!d.positions) d.positions = {};
      d.positions[slug] = p;
    });
  } catch (e) { /* no record to stamp: the order falls back to arrival */ }
  return slug;
}
function lastBook() {
  try { return localStorage.getItem(LAST_BOOK_KEY) || null; } catch (e) { return null; }
}

function cameFromReader(ref, here) {
  if (!ref) return false;
  try {
    const r = new URL(ref, here), h = new URL(here);
    return r.origin === h.origin && /(^|\/)reader\.html$/.test(r.pathname);
  } catch (e) { return false; }
}

function readerTargetSlug(books, last) {
  const shelf = books || [];
  if (last && (!shelf.length || shelf.some(b => b.slug === last))) return last;
  return shelf.length ? shelf[0].slug : null;
}

function backToReader() {
  if (cameFromReader(document.referrer, location.href)) { history.back(); return "back"; }
  const slug = readerTargetSlug(libraryBooks, lastBook());
  if (!slug) {
    note((libraryBooks || []).length
      ? "No book open yet \u2014 pick one from the shelf."
      : "No book on this device yet \u2014 nothing to go back to.");
    return "none";
  }
  const h = host();
  if (h && typeof h.openReader === "function") { h.openReader(slug); return "host"; }
  // same tab, deliberately: this is the way *back*, not a new reader.
  location.assign(readerUrl(slug));
  return "nav";
}

// --------------------------------------------------------------- opening
// A press on a book opens it IN THE SAME WINDOW: in the app the host opens
// the book's tab beside this one; in a browser this very tab becomes the
// reader (STRANGER-FIX, 28 Sep -- `window.open` was a pop-up Safari blocks
// and a tab the person never saw). The menu's "Open in New Window" is the
// one road to a second window (a "popup" feature string is what makes a
// new window rather than a tab in Safari and Chrome); a filled sidebar icon
// is a Studio tab.
// W1 SHELL-WEB: host() returns the host's API object, or null when there is
// no host. On "web" TTSTVHost exists but has no host methods, so return null.
function host() { return (typeof window !== "undefined" && window.TTSTVHost && !window.TTSTVHost.isWeb) ? window.TTSTVHost : null; }

function openReader(slug, newWindow, asTab) {
  rememberBook(slug);
  const h = host();
  if (h && newWindow && typeof h.openWindow === "function") { h.openWindow(slug); return "host:window"; }
  if (h && typeof h.openReader === "function") { h.openReader(slug); return "host:tab"; }
  if (newWindow) { window.open(readerUrl(slug), "_blank", "popup,width=1100,height=800"); return "window"; }
  if (asTab) { window.open(readerUrl(slug), "_blank"); return "tab"; }
  location.assign(readerUrl(slug)); return "here";
}

function openStudio(slug, units) {
  const h = host();
  if (h && typeof h.openStudio === "function") { h.openStudio(slug, units || []); return "host"; }
  window.open(studioUrl(slug, units), "_blank"); return "tab";
}

/* ============================================ OPEN IN FINDER (G-FINDER, 10 Sep)
 * Osca: *"right-click a book -> Open in Finder ... Absent source -> the item
 * is disabled, not hidden."* Two things decide it, in this order:
 *   FINDER[slug]   the last answer `POST /reveal {slug, check: true}` gave --
 *                  the server's own sentence when the file is not there (a
 *                  dead mount it could not re-root, a file moved away), null
 *                  when it was; asked every time the menu opens on a book
 *   /state's row   a book whose `source` names no path has no file to show,
 *                  which is known before anything is asked
 * The press is `POST /reveal {slug}`: studio resolves the file the way a
 * re-parse does (`studio.add.source_for`) and runs `open -R` on it. */
const FINDER = {};
function finderWhy(slug) {
  if (Object.prototype.hasOwnProperty.call(FINDER, slug)) return FINDER[slug];
  const row = stateBooks && stateBooks[slug];
  if (row && row.source && !row.source.path) return "this book has no source file on record";
  return null;
}
async function finderCheck(slug) {
  if (!slug || !libraryContext().bench) return null;
  const r = await postJSON("/reveal", { slug, check: true });
  // only the route's own "not there" disables it; a studio that does not know
  // the route at all is not a missing file, and the press will say so
  let why;
  if (r.ok) why = null;
  else if (r.body && r.body.exists === false) why = r.body.error || "the source file is not there";
  else return null;
  const was = FINDER[slug];
  FINDER[slug] = why;
  const el = document.getElementById("menu");
  if (was !== why && el && !el.hidden && menuTarget && menuTarget.slug === slug
      && (menuTarget.kind === "shelf" || menuTarget.kind === "source")) {
    showMenu(menuAt.x, menuAt.y, menuTarget.kind, menuTarget);   // the same menu, the item re-said
  }
  return why;
}
async function revealBook(slug) {
  const r = await postJSON("/reveal", { slug });
  if (r.ok) return "finder";
  const why = (r.body && r.body.error) || `studio answered ${r.status}`;
  if (r.body && r.body.exists === false) FINDER[slug] = why;
  note(`Couldn't open Finder — ${why}`);
  return "note";
}

function reveal(src) {
  const h = host();
  const p = sourcePath(src);
  if (h && typeof h.reveal === "function" && p) { h.reveal(p); return "host"; }
  note(p ? `Reveal needs the app. The file is at ${p}` : "Reveal needs the app.");
  return "note";
}

// DELETE'S SENTENCE IS THE SERVER'S (studio/README.md §6, 4 Sep). Until now
// this page wrote its own into the `window.confirm` -- *"Parse, look-ups,
// audio, timings and bundles go; the source file stays"* -- right in spirit,
// but a second copy of words studio also holds, and one that named neither
// the source FILE by name nor the kept parses, which Delete does take.
//
// `POST /remove {slug, dry_run: true}` answers with `{goes, stays, sentence,
// would_remove}` and DELETES NOTHING, which is exactly what a confirmation
// needs: the sentence a person agrees to is then the sentence the server acts
// on, not a paraphrase of it that can drift from `removal_words()`.
//
// THE ANSWER IS CHECKED BEFORE ANYTHING ELSE HAPPENS, and this is the part
// that matters: a studio too old to know `dry_run` would have taken the book
// on that first POST. So unless `dry_run: true` comes back, this stops where
// it is and says so -- posting again there would be the delete nobody was
// asked about.
async function removeBook(slug, title) {
  const name = title || slug;
  const dry = await postJSON("/remove", { slug, dry_run: true });
  if (!dry.ok) {
    if (dry.status === 409) note(`Not deleted: a job for ${name} is running or queued. Stop it in Studio first.`);
    else note(`Couldn't ask what deleting ${name} takes: ${(dry.body && dry.body.error) || ("HTTP " + dry.status)}`);
    return dry;
  }
  const said = dry.body || {};
  if (said.dry_run !== true || !said.sentence) {
    note(`Didn't delete ${name}: studio answered the question with something other than a dry run, so nothing was asked of it twice.`);
    return dry;
  }
  const ok = window.confirm(`${said.sentence}\n\nDelete ${name}?`);
  if (!ok) return null;
  const r = await postJSON("/remove", { slug });
  if (r.ok) { note(`Deleted ${name}. ${said.stays ? "What stays: " + said.stays + "." : "The source is back in the sidebar, grey."}`); await refresh(); }
  else if (r.status === 409) note(`Not deleted: a job for ${name} is running or queued. Stop it in Studio first.`);
  else note(`Couldn't delete ${name}: ${(r.body && r.body.error) || ("HTTP " + r.status)}`);
  return r;
}

// ------------------------------------------------------------ the menus
// Osca's order (READER_FIRST.md, seventh pass). Labels are the contract the
// desktop's native menus mirror; the ids are what this page acts on.
function menuItems(kind, state, opts) {
  opts = opts || {};
  // A book imported onto this device has no source file, no studio and no
  // /remove endpoint behind it -- three of the shelf menu's five items would
  // be dead. Its own menu says the two things that are true.
  if (kind === "device") {
    return [
      { id: "open", label: "Open" },
      { id: "sep" },
      { id: "forget", label: "Remove from this device", danger: true },
    ];
  }
  if (kind === "shelf" || (kind === "source" && state === "filled")) {
    return shelfMenuItems(opts.slug, {
      bench: opts.bench !== undefined ? opts.bench : libraryContext().bench,
      selection: opts.selection || SEL,
      merge: opts.slug ? mergeFor(opts.slug) : null,
      onShelves: opts.slug ? shelvesFor(opts.slug) : [],
      otherCount: opts.otherCount != null ? opts.otherCount
        : shelfEntries().filter(e => e.slug !== opts.slug && !e.merge).length,
      bookmarks: opts.bookmarks || (opts.slug ? bookmarksFor(opts.slug) : []),
      coverIsSource: opts.slug ? coverChoice(opts.slug) === "source" : true,
      hasCover: opts.hasCover,
      busy: opts.busy !== undefined ? opts.busy : (opts.slug ? reparseBusyReason(opts.slug) : null),
      finderWhy: opts.finderWhy !== undefined ? opts.finderWhy : (opts.slug ? finderWhy(opts.slug) : null),
      titleOf: entryTitle,
    });
  }
  if (kind === "source" && state === "busy") return [{ id: "reveal", label: "Reveal in Finder" }];
  return [{ id: "ingest", label: "Ingest" }, { id: "reveal", label: "Reveal in Finder" }];
}

// ============================================================== the six items
// PROMPTS/library-shelf.md §2, in Osca's order. Everything unavailable is
// DISABLED AND CARRYING ITS REASON -- "every disabled menu item carries its
// reason. Silence is a bug" -- except on a device, where Merge, Delete and
// Open in Studio are ABSENT rather than explained: there is no bench behind
// them and never will be, so an explanation would be a promise (§5).
//
// With two books selected, Open with… and Merge with… need no picker: they
// act on the pair, and their labels say which two and in which order.
function shelfMenuItems(slug, opts) {
  opts = opts || {};
  const bench = !!opts.bench;
  const sel = opts.selection || [];
  const pair = sel.length === 2 && sel.indexOf(slug) >= 0 ? sel : null;
  const merge = opts.merge || null;
  const others = opts.otherCount == null ? 0 : opts.otherCount;
  const items = [];

  items.push({ id: "open", label: merge ? "Open Both" : "Open" });
  items.push({ id: "window", label: "Open in New Window" });
  // OPEN AT BOOKMARK (Osca, 31 Aug: "opening a book lands on the most recent
  // position, or on a bookmark if the reader chose one from the Library").
  // Absent for a merged entry rather than disabled: a pair has two books and
  // "which one's bookmark" is a question this menu should not be asking.
  if (!merge) {
    const bms = opts.bookmarks || [];
    items.push(bms.length
      ? { id: "bookmarks", label: bms.length === 1 ? "Open at bookmark…" : `Open at bookmark… (${bms.length})` }
      : { id: "bookmarks", label: "Open at bookmark…", disabled: "no bookmarks in this book yet" });
  }

  const pairLabel = verb => pair
    ? `${verb} ${opts.titleOf(pair[0])} & ${opts.titleOf(pair[1])}`
    : `${verb}…`;

  if (merge) {
    // A merged entry is already a pair. Pairing it with a third book would be
    // a three-column view, which does not exist -- so these two say why
    // rather than offering something the reader cannot draw.
    items.push({ id: "openwith", label: "Open with…", disabled: "this is already a pair — a parallel view holds two" });
    items.push({ id: "swap", label: `Swap the order (${opts.titleOf(merge.members[1].slug)} first)` });
  } else {
    items.push(others
      ? { id: "openwith", label: pairLabel("Open with") }
      : { id: "openwith", label: "Open with…", disabled: "there is no second book on the shelf" });
    if (bench) {
      items.push(others
        ? { id: "mergewith", label: pairLabel("Merge with") }
        : { id: "mergewith", label: "Merge with…", disabled: "there is no second book on the shelf" });
    }
  }

  if (bench) {
    items.push({ id: "sep" });
    items.push(library.shelves.length
      ? { id: "shelve", label: "Add to shelf…" }
      : { id: "shelve", label: "Add to shelf…", disabled: "no shelves yet — “New shelf…” makes the first" });
    items.push({ id: "newshelf", label: "New shelf…" });
    if (opts.onShelves && opts.onShelves.length) {
      items.push({ id: "unshelve", label: `Take off ${opts.onShelves.map(s => "“" + s.name + "”").join(", ")}` });
    }
    items.push({ id: "sep" });
    items.push(merge
      ? { id: "studio", label: "Open in Studio", disabled: "a merged entry has no text of its own — open one of its two books" }
      : { id: "studio", label: "Open in Studio" });
    // OPEN IN FINDER (G-FINDER, Osca 10 Sep): the book's own SOURCE FILE,
    // selected in Finder -- studio does it (`POST /reveal {slug}`, `open -R`),
    // so it needs no Rust and no host. Beside Open in Studio, because both
    // answer "where does this book live". Absent source -> DISABLED, never
    // hidden, and the reason is the server's own sentence once it has been
    // asked (`finderCheck`, as the menu opens).
    items.push(merge
      ? { id: "finder", label: "Open in Finder", disabled: "a merged entry is two books — open one of its two" }
      : opts.finderWhy
        ? { id: "finder", label: "Open in Finder", disabled: opts.finderWhy }
        : { id: "finder", label: "Open in Finder" });
    // RE-PARSE BESIDE DELETE, because they are the same question answered
    // two ways -- "the parse is wrong" -- and the whole point of the pair is
    // that one of them keeps the audio and one does not. Disabled with its
    // reason like everything else here: studio has ONE job slot, so a press
    // while anything runs can only come back 409.
    if (!merge) {
      /* CHANGE COVER (Osca, 5 Sep). One item, and it toggles -- the book's own
         picture, or the one this page sets in type. Its label says what is
         about to happen rather than what is true now, because a menu item is
         a verb. Disabled with its reason where the source carried no picture
         at all, which `parser/cover.py` records by writing no file. */
      const wearingSource = opts.coverIsSource !== false;   // the common case
      items.push(opts.hasCover === false
        ? { id: "cover", label: "Change cover", disabled: "this book came with no cover of its own" }
        : { id: "cover", label: wearingSource ? "Change cover — use the typeset one"
                                              : "Change cover — use the book's own" });
    }
    if (!merge) {
      // Look at what is kept, THEN re-parse, THEN delete: the order a person
      // actually goes in, and it leaves Re-parse immediately above Delete.
      items.push({ id: "parses", label: "Parses…" });
      const busy = opts.busy || null;
      items.push(busy
        ? { id: "reparse", label: "Re-parse", disabled: busy }
        : { id: "reparse", label: "Re-parse" });
    }
    items.push(merge
      ? { id: "unmerge", label: "Remove the pairing", danger: true }
      : { id: "delete", label: "Delete", danger: true });
  }
  return items;
}

// The picker for "Open with…" and "Merge with…" when only one book is
// selected. It is the SAME `#menu` element, drawn as a list of the other
// entries -- reader/popover.js's rule is that the context menu is a popover
// and not a new component, and this is that popover with different rows.
/* The bookmark picker: the SAME `#menu`, redrawn as this book's bookmarks --
 * pickerItems' shape exactly, for its reason (the context menu is a popover,
 * not a new component). */
function bookmarkPickerItems(slug, bookmarks) {
  const bms = bookmarks || bookmarksFor(slug);
  return [{ id: "sep", head: "Open at bookmark…" }].concat(
    bms.length
      ? bms.map(b => ({ id: "bm:" + b.id, label: bookmarkLabel(b) }))
      : [{ id: "none", label: "No bookmarks in this book", disabled: "make one in the reader first" }]);
}

function pickerItems(slug, kind) {
  const others = shelfEntries().filter(e => e.slug !== slug && !e.merge);
  const verb = kind === "merge" ? "Merge with" : "Open with";
  return [{ id: "sep", head: `${verb}…` }].concat(
    others.length
      ? others.map(e => ({ id: "pick:" + e.slug, label: e.title }))
      : [{ id: "none", label: "No other book on the shelf", disabled: "ingest a second book first" }]);
}

/* ====================================== A RIGHT-CLICK ON NOTHING (Osca, 31 Aug)
 * "Today a right-click anywhere on the Library that is not a book row gives
 * WebKit's own menu (Back - Reload - AutoFill). It should give ours."
 *
 * Back, Reload and AutoFill are a BROWSER's menu, and this is not a browser:
 * there is nothing to go back to, reloading is the app's business and there
 * is no form to fill. Showing it is the page speaking to a developer about
 * the thing it happens to be built out of.
 *
 * So: the same `#menu` popover the book row uses, with the items that mean
 * something when nothing is selected. Pure, so the list and its reasons are
 * unit-testable, and disabled-with-a-reason as everything in this menu is.
 * `New shelf...` is first because it is the one thing a person right-clicks
 * empty space in a library to do. */
function shelfEmptyMenuItems(opts) {
  opts = opts || {};
  const shelves = opts.shelves || [];
  const items = [{ id: "newshelf", label: "New shelf…" }];
  if (shelves.length) {
    const anyOpen = shelves.some(s => !s.collapsed) || !opts.mainCollapsed;
    const anyShut = shelves.some(s => s.collapsed) || !!opts.mainCollapsed;
    items.push({ id: "sep" });
    items.push(anyOpen
      ? { id: "collapseall", label: "Collapse all shelves" }
      : { id: "collapseall", label: "Collapse all shelves", disabled: "every shelf is already closed" });
    items.push(anyShut
      ? { id: "expandall", label: "Expand all shelves" }
      : { id: "expandall", label: "Expand all shelves", disabled: "every shelf is already open" });
  }
  items.push({ id: "sep" });
  items.push(opts.bench
    ? { id: "opensource", label: "Open a source…" }
    : { id: "opensource", label: "Open a source…", disabled: "there is no bench behind this page" });
  return items;
}

function shelfPickerItems() {
  return [{ id: "sep", head: "Add to shelf…" }].concat(
    library.shelves.map(s => ({ id: "shelf:" + s.id, label: `${s.name} (${s.books.length})` })),
    [{ id: "sep" }, { id: "newshelf", label: "New shelf…" }]);
}

function shelfActionItems(id) {
  const s = library.shelves.find(x => x.id === id);
  if (!s) return [];
  const i = library.shelves.indexOf(s);
  const items = [
    { id: "sh:rename", label: "Rename…" },
    i > 0 ? { id: "sh:up", label: "Move up" } : { id: "sh:up", label: "Move up", disabled: "already the first shelf" },
    i < library.shelves.length - 1 ? { id: "sh:down", label: "Move down" } : { id: "sh:down", label: "Move down", disabled: "already the last shelf" },
    { id: "sep" },
    { id: "sh:delete", label: "Delete shelf", danger: true },
  ];
  return window.FrankZero ? FrankZero.shelfItems(id, items) : items;   /* Z7: Add books… · Share · Leave */
}

// ------------------------------------------------------- opening, in words
// Every disabled row says why, right there, because a grey row with no reason
// is the app refusing without speaking.
function menuRowHTML(it) {
  if (it.id === "sep") return it.head ? `<div class="menuhead">${esc(it.head)}</div>` : "<hr>";
  const cls = [it.danger ? "danger" : "", it.disabled ? "off" : ""].filter(Boolean).join(" ");
  const why = it.disabled ? `<span class="menuwhy">${esc(it.disabled)}</span>` : "";
  // a row that is a CHOICE among several (the orders) says which one holds
  const role = it.checked !== undefined ? "menuitemradio" : "menuitem";
  const chk = it.checked !== undefined ? ` aria-checked="${it.checked ? "true" : "false"}"` : "";
  return `<button role="${role}"${chk} data-act="${esc(it.id)}"${cls ? ` class="${cls}"` : ""}` +
    `${it.disabled ? " disabled aria-disabled=\"true\" title=\"" + esc(it.disabled) + "\"" : ""}>` +
    `<span class="menulabel">${esc(it.label)}</span>${why}</button>`;
}


let menuTarget = null;
let menuAt = { x: 0, y: 0 };
function showMenu(x, y, kind, target, items) {
  const el = document.getElementById("menu");
  items = items || menuItems(kind, target.state, { slug: target.slug });
  el.innerHTML = items.map(menuRowHTML).join("");
  menuTarget = { kind, ...target };
  menuAt = { x, y };
  el.hidden = false;
  // on the phone the menu is a bottom sheet (CSS); the pointer position is irrelevant
  if (isPhone()) { el.style.left = ""; el.style.top = ""; }
  else { el.style.left = x + "px"; el.style.top = y + "px"; }
  // not `button:not([disabled])`: the node harness's selector engine is a
  // subset, and a selector it cannot parse throws rather than missing.
  const buttons = Array.from(el.querySelectorAll("button"));
  const first = buttons.find(b => !b.disabled && b.getAttribute("aria-disabled") !== "true") || buttons[0];
  if (first) first.focus();
}

// ------------------------------------------------------------- the phone
// PROMPTS/reader-mobile.md step 3. The same breakpoint as reader.html:
// narrow or short, so a phone in landscape is a phone here too.
const PHONE_QUERY = "(max-width: 640px), (max-height: 500px)";
function isPhone() {
  return !!(window.matchMedia && window.matchMedia(PHONE_QUERY).matches);
}

let SHEET_OPEN = false;
function setSheet(open) {
  SHEET_OPEN = !!open;
  document.getElementById("sources").classList.toggle("sheet-open", SHEET_OPEN);
  document.getElementById("sourcesScrim").classList.toggle("on", SHEET_OPEN);
  document.getElementById("sourcesToggle").setAttribute("aria-expanded", SHEET_OPEN ? "true" : "false");
  pushHostContext();
}

// A long-press stands in for the right-click on a touch screen: one finger
// held still for `holdMs` on a row opens the same menu, and the click that
// follows the release is swallowed so a held press never also opens the
// book. Movement past `slop` px, a second finger or lifting early cancels.
// The pointer handlers below feed this; it is pure so the node harness can
// prove the timing (reader/tests/test_library_page.py).
function makeLongPress(opts) {
  opts = Object.assign({ holdMs: 500, slop: 10 }, opts || {});
  const st = { timer: null, x: 0, y: 0, fired: false, target: null };
  return {
    down(x, y, target, fire, setTimer) {
      this.cancel();
      st.x = x; st.y = y; st.fired = false; st.target = target;
      st.timer = (setTimer || setTimeout)(() => { st.timer = null; st.fired = true; fire(target, x, y); }, opts.holdMs);
    },
    move(x, y) {
      if (st.timer != null && (Math.abs(x - st.x) > opts.slop || Math.abs(y - st.y) > opts.slop)) this.cancel();
    },
    cancel() { if (st.timer != null) { clearTimeout(st.timer); st.timer = null; } },
    // called on the click that follows a release: true = swallow it
    consumeClick() { const f = st.fired; st.fired = false; return f; },
    get pending() { return st.timer != null; },
    get fired() { return st.fired; },
  };
}

const longPress = makeLongPress();
function wireLongPress(container, rowSelector, onHold) {
  container.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "touch" || !e.isPrimary) return;
    const row = e.target.closest(rowSelector);
    if (!row) return;
    longPress.down(e.clientX, e.clientY, row, (target, x, y) => onHold(target, x, y));
  });
  container.addEventListener("pointermove", (e) => { if (e.pointerType === "touch") longPress.move(e.clientX, e.clientY); });
  for (const t of ["pointerup", "pointercancel", "pointerleave"]) container.addEventListener(t, () => longPress.cancel());
  container.addEventListener("click", (e) => {
    if (longPress.consumeClick()) { e.stopPropagation(); e.preventDefault(); }   // capture phase on the container: nothing below hears it
  }, { capture: true });
  container.addEventListener("contextmenu", (e) => {
    // iOS Safari fires this for a held link/image but not for our rows; when
    // a browser does fire it for a touch, the long-press already opened the
    // menu -- don't open it twice.
    if (longPress.fired) e.preventDefault();
  }, { capture: true });
}
function hideMenu() {
  const el = document.getElementById("menu");
  el.hidden = true; el.classList.remove("menu-right"); menuTarget = null;
  const btn = document.getElementById("shelforder");
  if (btn) btn.setAttribute("aria-expanded", "false");
}

// `pending` here is the menu's own two-step: "Open with…" and "Merge with…"
// with one book selected re-draw the same popover as a list of the others,
// and the row that is then clicked comes back through `pick:<slug>`.
let menuPick = null;          // {slug, kind: "open" | "merge"} while picking

function menuAct(act) {
  const t = menuTarget;
  const at = menuAt;
  hideMenu();
  // the order menu (LIBRARY-DESIGN): one act per order, no book behind it
