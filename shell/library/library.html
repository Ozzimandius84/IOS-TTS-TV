  // The typeset cover first and the book's own picture over it -- in that
  // order, so the box is never empty while the image is on its way and never
  // empty at all if the book has no image. Lazy, because a shelf of thirty
  // books is thirty JPEGs and only the first row is looked at.
  return `<span class="${cls.join(" ")}" aria-hidden="true">` +
    `<span class="ini">${esc(coverInitial(title))}</span>` +
    `<span class="t">${esc(title)}</span>` +
    (author ? `<span class="a">${esc(author)}</span>` : "") +
    (first ? `<span class="fw">${esc(first)}</span>` : "") +
    // `has_cover === false` is a device row that KNOWS it has none (import.js
    // writes it, G-COVERS): no request for a picture that is not there. A row
    // that does not say (the Mac's, or a book imported before the field) asks,
    // and a 404 removes itself as it always has.
    (slug && coverChoice(slug) === "source" && b.has_cover !== false
      ? `<img class="covimg" alt="" loading="lazy" decoding="async" src="${
          esc(coverUrl(slug))}">` : "") +
    `</span>`;
}

/* THE VERDICT, ON THE SHELF AND IN THE BOOK (P1, `90de5a8`; drawn 14 Sep).
   `parser/facts.py`'s opening line is the rule: *"a book's verdict is VISIBLE
   on the shelf and in the book -- the reader follows the parser; it never
   hides a verdict."* Every `book.json` has carried `meta.verdict` since the
   13th and until today NOTHING SHOWED IT -- T-MAC2 found 40 of 40 books
   carrying a verdict, 0 of 40 rows of `/state` carrying the key, and no page
   drawing it.

   FOUR WORDS AND WHERE EACH GOES. `clean` is 23 of the 40 and is not news, so
   it is silent on the shelf -- a word on twenty-three tiles is furniture, and
   furniture is what an eye stops seeing, which is how the other seventeen
   would go quiet too. It IS drawn on the book page, faint, because that page
   is where you have gone to ASK about the book and "clean" is the answer.
   DAMAGED, UNUSUAL and UNRECOVERABLE are one word on the tile and the same
   word plus the parse's own one sentence on the book page.

   Nothing here decides anything and nothing here styles a verdict away: the
   word is the parser's, the sentence is the parse's own `why`, and a book with
   no verdict (parsed before there were any) draws nothing, which is honest and
   is not "clean". */
const VERDICT_WORDS = { clean: "clean", damaged: "damaged",
                        unusual: "unusual", unrecoverable: "unrecoverable" };
function verdictOf(b) {
  const v = b && typeof b.verdict === "string" ? b.verdict : "";
  return VERDICT_WORDS[v] ? v : "";
}
function verdictTileHTML(b) {
  const v = verdictOf(b);
  if (!v || v === "clean") return "";
  return `<span class="railrow-verdict tile-verdict" data-verdict="${esc(v)}">${
    esc(VERDICT_WORDS[v].toUpperCase())}</span>`;
}
function verdictBookHTML(b) {
  const v = verdictOf(b);
  if (!v) return "";
  const why = v === "clean" ? "" : String((b && b.verdict_why) || "");
  return `<span class="tile-slot tile-verdictslot" data-verdict="${esc(v)}">` +
    `<b>${esc(VERDICT_WORDS[v].toUpperCase())}</b>` +
    (why ? `<span>${esc(why)}</span>` : "") + `</span>`;
}

function tileHTML(b) {
  const m = b.merge || null;
  const stale = m ? mergeStale(m) : [];
  const title = m
    ? `${bookTitle(m.members[0].slug)} above ${bookTitle(m.members[1].slug)} \u2014 always opens both`
      + (stale.length ? ` \u00b7 one of these has changed since the pair was made` : "")
    : (b.voiced != null ? b.voiced + " of " + b.chapters + " voiced" : "");
  // A BOOK ON THIS DEVICE (the phone, G-COVERS) is a tile like any other and
  // keeps the device row's two marks -- `.device`/`data-device` (a tap opens
  // it straight through the host, a long-press is the device menu with
  // "Remove from this device") and `data-hash`, the version it is.
  return `<button class="railrow tile${b.device ? " device" : ""}${m ? " merged" : ""}${stale.length ? " stale" : ""}" data-slug="${esc(b.slug)}"${
    m ? ` data-merge="1" aria-description="${esc(title)}"` : ""}${b.device ? ` data-device="1" data-hash="${esc(b.hash || "")}"` : ""} aria-selected="false">` +
    tileCoverHTML(b) +
    `<span class="railrow-title">${esc(b.title)}</span>` +
    `<span class="railrow-by">${esc(tileLine(b))}</span>` +
    // P1: the one word, where the book is not clean (above)
    verdictTileHTML(b) +
    // G-LANG: a book here in a language with no pack says so -- settings.js TTSTVLangs
    (b.device && window.TTSTVLangs ? TTSTVLangs.tileLineHTML(b) : "") +
    // 1 ¶'s pane: empty in the memo'd markup, filled by paintBookViews
    `<span class="tile-pane"></span>` +
    // an OPEN book's close (OPEN BOOKS COME FIRST, below) -- a span, because
    // a button cannot hold a button; the device row's ✕ is the same shape
    (openNow.has(b.slug) ? `<span class="tile-close" role="button" tabindex="0" data-close="${
      esc(b.slug)}" aria-label="Close ${esc(b.title || b.slug)}">\u2715</span>` : "") +
    `</button>`;
}

// The grid the tiles sit in. `entries` is a named shelf's books, or
// (undefined) every finished book plus the merged entries that stand for a
// pair -- the same argument `railRows()` took.
function tileRows(entries, extra) {
  const loadingSlugs = new Set(Array.from(pending.values()).map(e => e.slug).filter(Boolean));
  const books = entries || shelfEntries().filter(b => !loadingSlugs.has(b.slug));
  // in shelf order, before anything is drawn: the neighbour rule needs to
  // know what came before, and a tile cannot ask its own markup
  assignPairings(books);
  const body = books.map(tileHTML).join("") + (extra || "");
  return body ? `<div class="shelfgrid">${body}</div>` : "";
}

function railRows(entries) {
  // BASE ROW -- shared verbatim with studio/studio.html's railRows()
  // (PROMPTS/library-sidebar.md); reader/tests/test_library_rail.py asserts
  // this `base` template stays byte-identical between the two files. The
  // bench appends .railmore after it; this page appends nothing to a
  // finished book's row (a loading one gets .ingest-* from loadingRows()).
  const loadingSlugs = new Set(Array.from(pending.values()).map(e => e.slug).filter(Boolean));
  // `entries` is the list to draw -- a named shelf's books, or (undefined)
  // every finished book plus the merged entries that stand for a pair.
  const books = entries || shelfEntries().filter(b => !loadingSlugs.has(b.slug));
  return books.map(b => {
    const total = b.chapters;
    const spoken = b.has_audio;
    const timed = b.has_timings;
    const base = `<span class="railrow-title">${esc(b.title)}</span>
      <span class="railrow-by">${esc(b.author || "unknown")} \u00b7 ${esc(langLine(b) || b.lang)}</span>
      <span class="railrow-status">${total} ch${spoken ? " \u00b7 <b>audio</b>" : ""}${
        timed ? " \u00b7 <b>timed</b>" : ""}</span>`;
    // The wrapper, and only the wrapper: `base` above is byte-shared with
    // studio/studio.html (test_library_rail.py) and nothing here may reach it.
    const m = b.merge || null;
    const stale = m ? mergeStale(m) : [];
    const title = m
      ? `${bookTitle(m.members[0].slug)} above ${bookTitle(m.members[1].slug)} — always opens both`
        + (stale.length ? ` · one of these has changed since the pair was made` : "")
      : (b.voiced != null ? b.voiced + " of " + total + " voiced" : "");
    return `<button class="railrow${m ? " merged" : ""}${stale.length ? " stale" : ""}" data-slug="${esc(b.slug)}"${
      m ? ` data-merge="1" aria-description="${esc(title)}"` : ""} aria-selected="false">${base}</button>`;
  }).join("");
}

// The entries still loading (or failed), after the finished books. Before
// the parser has named the book the card carries the source's name; once
// /state lists the slug it is the real base row under the same veil.
function loadingRows(now) {
  now = now == null ? Date.now() / 1000 : now;
  return Array.from(pending.values()).map(entry => {
    const b = entry.slug ? (libraryBooks || []).find(x => x.slug === entry.slug) : null;
    const p = entry.failed ? null
      : ingestProgress(entry.job || { phase: "running", step: "parse", started: entry.started }, ingestLogFor === entry.name ? ingestLog : "", now);
    // the picture's parsing tile: the cover faded, the title, and the grey
    // line reading `<author> · parsing…` -- the step label IS that line, so
    // there is no second one under it (`.tile .ingest-step` is display:none).
    const label = entry.failed ? (entry.failed.label || "failed") : p.label;
    const title = b ? b.title : entry.title;
    const inner = tileCoverHTML(b || { slug: entry.slug || "", title: title, author: null }) +
      (b
      ? `<span class="railrow-title">${esc(b.title)}</span>
      <span class="railrow-by">${esc(b.author || "unknown")} · ${esc(label)}</span>`
      : `<span class="railrow-title">${esc(entry.title)}</span>
      <span class="railrow-by">${esc(entry.kind || "source")} · ${esc(label)}</span>`);
    const step = entry.failed
      ? `<span class="ingest-step">${esc(entry.failed.label || "failed")}</span>`
      : `<span class="ingest-step">${esc(p.label)}</span>`;
    const veilStep = step;
    const veil = entry.failed
      ? `<span class="ingest-veil failed"><span class="ingest-fail-title">${esc(title)} — ${esc(entry.failed.label || "failed")}</span>` +
        `<span class="ingest-fail-line">${esc(entry.failed.line)}</span>` +
        `<button type="button" class="ingest-retry" data-retry="${esc(entry.name)}">Retry</button></span>`
      : `<span class="ingest-veil${p.known ? "" : " pulse"}"></span>`;
    const pct = entry.failed ? 0 : p.fraction * 100;
    // a <div role=button>, not a <button>: the failed veil holds the Retry
    // <button>, and a button inside a button is not HTML (Chrome hoists it out)
    return `<div class="railrow tile loading${entry.failed ? " failed" : ""}" role="button" tabindex="0" data-slug="${esc(entry.slug || "")}" data-source="${esc(entry.name)}"` +
      ` data-step="${esc(entry.failed ? "failed" : p.step)}" data-fraction="${entry.failed ? "0" : p.fraction.toFixed(3)}"` +
      ` data-known="${entry.failed ? "false" : p.known}" aria-selected="false" aria-busy="${entry.failed ? "false" : "true"}"` +
      ` style="--ingest: ${pct.toFixed(1)}%">${inner}${veilStep}${veil}</div>`;
  }).join("");
}

// ------------------------------------------------------------ the context
// The bug Osca saw (READER_FIRST.md "Osca's app decisions -- 30 Aug"): this
// one file is loaded by the desktop app *and* by the installed shell on the
// phone, and the phone's "On this device" panel was showing on the Mac --
// "0 books · 19.2 GB free" against the Mac's own disk, beside a shelf of nine
// books that live on the SSD. The rule is one helper, `reader/context.js`,
// shared with reader.html so the two pages can never disagree:
//   bench   the desktop app or Studio's injector sets kind !== "web", or
//           /state answered -> the Sources rail, ingest, drops and the phone shelf;
//   device  neither of those, and this page could really keep a book (Cache
//           + crypto.subtle + import.js) -> the "On this device" panel.
// Neither is a screen width: a narrow window on the Mac is not a phone.
function libraryContext() {
  if (window.TTSTVContext) return TTSTVContext.read();
  // a shell published before context.js existed: the old rule, using host.js's kind
  const app = TTSTVHost.kind !== "web";
  const bench = app || studioLive;
  return { app, phone: false, bench, device: CAN_IMPORT && !app && !studioLive,
           kind: "static", benchReason: bench ? null : TTSTVHost.WHY_STUDIO };
}

// Everything that needs studio, shown or hidden in one place: the Sources
// rail, its phone sheet toggle and its scrim. Called after every poll, since
// `studioLive` turns true on the first answer.
function paintContext() {
  const ctx = libraryContext();
  const root = document.documentElement;
  if (root && root.setAttribute) root.setAttribute("data-ttstv-context", ctx.kind);
  const bench = ctx.bench;
  for (const id of ["sources", "sourcesToggle", "sourcesScrim"]) {
    const el = document.getElementById(id);
    if (el) el.hidden = !bench;
  }
  if (!bench && SHEET_OPEN) setSheet(false);
  pushHostContext();   // the Sources tool goes dark with the rail
  return ctx;
}

// ------------------------------------------------------- on this device
// PROMPTS/phone-book-import.md. A bundle .zip -- AirDropped into Files and
// picked with the button, or shared straight into the app (manifest
// share_target) -- is unzipped in the page by library/unzip.js, validated and
// stored one Cache per book by library/import.js, and answered offline by
// reader/sw.js at the same books/<slug>/... URLs the reader already asks for.
// This section is the visible half: the button, the rows, the sizes, remove,
// and how much room is left.
//
// Shown only where it can actually work: the Cache API and a secure-context
// crypto.subtle (the book hash is sha256 of the word ids -- core/provenance.py's
// own rule). Over file:// there is neither, and the section stays away rather
// than offering a button that would fail on the first click.
// THE STORE IS THE CACHE OR THE HOST'S DOOR (G-PULL's rule, context.js
// `canHoldBooks`), and this line now says so too (G-COVERS): it still asked
// for the Cache API alone, so a webview that offers the door and no `caches`
// would have drawn no shelf at all. WebKit exposes `caches` at
// `frank://localhost` (and refuses every put), which is why the phone
// never showed the difference.
const CAN_IMPORT = (typeof caches !== "undefined"
    || !!(window.TTSTVContext && TTSTVContext.detect().hostBooks))
  && typeof crypto !== "undefined" && !!(crypto && crypto.subtle)
  && typeof TTSTVBundle !== "undefined";
let deviceBooks = [];     // TTSTVBundle.listInstalled(): one row per installed book
let deviceListed = false; // the first list has answered (so "no books" is true, not "not asked yet")
let storage = null;       // navigator.storage.estimate(), or null where it is not offered
let importing = null;     // {name, label, fraction} while a zip is being read
let importError = null;   // {name, lines} until the next import replaces it

async function refreshDevice() {
  if (!CAN_IMPORT) return deviceBooks;
  try {
    deviceBooks = await TTSTVBundle.listInstalled();
    storage = await TTSTVBundle.estimate();
  } catch (e) { note("Couldn't read what's on this device: " + (e.message || e)); }
  deviceListed = true;
  if (deviceIsShelf()) placeDeviceBooks();
  return deviceBooks;
}

/* ON THE PHONE, THE BOOKS ON THE PHONE ARE THE SHELF (G-COVERS, Osca's
 * screenshot, 11 Sep 17:34: "each book is a full-screen-tall white tile with
 * no cover, a ✕ in a huge square box").
 *
 * WHAT IT WAS, MEASURED (Chromium, 393x852, this page at 8903c12 with the
 * door answering eight real books): the phone's shelf was `deviceSection()`
 * alone -- eight `.railrow.device` LIST rows, no cover markup at all, laid out
 * by the 30 Aug phone rule `#shelf .railrow { aspect-ratio: 2/3 }` at the
 * full 365 px of the column: 365x547.5 each, outside any `.shelfgrid`, so the
 * zoom (which was 4, not 1) never reached them. The ✕ was the row's
 * `.rmbook`, 44x44 with a border: the square box. `libraryBooks` -- what the
 * tiles are drawn from -- is `/state` on the Mac and was EMPTY here (no
 * studio, no library.json in the shell), so the covers, the band, the order
 * and the pinch had nothing to draw.
 *
 * So on a host with the book door (`libraryContext().phone`) the installed
 * rows are handed to the shelf as its books: the same `.railrow.tile` with the
 * same typeset cover and `books/<slug>/cover.jpg` over it, in the same band
 * (open books first, each with its ✕) and the same order, and the device
 * section keeps only its heading and the storage line. A phone PWA or a
 * laptop browser holding books in a Cache (a device, no door) keeps the list
 * rows exactly as they were -- `test_library_import.py` holds that. */
function deviceIsShelf() {
  const c = libraryContext();
  /* AND ON THE WEB TOO (LIBRARY-WEB, wave 9, 26 Sep). Osca saw *"No books on
     this device yet -- 0 books · 10.0 GB free"* printed over 41 drawn books:
     the phone's device-section copy firing on a website whenever the Cache
     was empty, whatever the folder shelf held. On the web there is ONE
     shelf: a bundle imported here is a tile beside the folder's books, and
     the section, its heading and its storage line do not exist. */
  return !!(c.device && (c.phone || TTSTVHost.isWeb));
}
function deviceShelfRow(b) {
  return { slug: b.slug, title: b.title || b.slug, author: b.author || null, lang: b.lang || null,
           langs: Array.isArray(b.langs) && b.langs.length > 1 ? b.langs.slice() : undefined,
           chapters: Number(b.chapters) || 0, has_audio: !!b.has_audio, has_timings: !!b.has_timings,
           voiced: Number(b.chapters_voiced) || 0, device: true, hash: b.hash || "",
           has_cover: typeof b.has_cover === "boolean" ? b.has_cover : null };
}
function placeDeviceBooks() {
  const memo = coverFactsMemo();
  /* EVERY BOOK IN THE DEVICE'S BOOKS FOLDER IS ON THE SHELF (#191, 1 Oct). The Simulator held twelve books and the
     Library drew one: a folder put there by hand -- or by an install cut short before its row was written -- has no
     row, so book_list (the app's lib.rs) answers {slug, title: slug, broken: true}, and this filter dropped it; the
     shelf then showed library.json's one stale row. A folder with no row is still that book's files on this phone,
     so it is a tile, named by its slug until its cover facts (book.json) give it a title. */
  const rows = deviceBooks.filter(b => b && b.slug && b.slug.charAt(0) !== ".").map(b => {
    const r = deviceShelfRow(b);
    // a row that does not say whether it has a cover (imported before
    // `has_cover`) and whose picture 404'd here once is not asked again
    // for this version -- the error listener remembers it (THE COVER)
    const m = memo[r.slug + "@" + r.hash];
    if (r.has_cover === null && m && m.cover === false) r.has_cover = false;
    return r;
  });
  const mine = new Set(rows.map(b => b.slug));
  // an EMPTY store leaves a null shelf null: on the web `refresh()`'s
  // books/index.json road is guarded by `libraryBooks === null`, and a `[]`
  // written here first would hide the person's whole folder (wave 9)
  if (!rows.length && libraryBooks === null) return 0;
  /* ...and a row from library.json that the device does not hold is dropped once the device has answered on a phone
     (a ghost: it opens nothing). A bundled book (SHELVES-1b, the app's own resources) stays. */
  const phoneShelf = deviceIsShelf() && libraryContext().phone;
  libraryBooks = (libraryBooks || []).filter(b => !b.device && !mine.has(b.slug) && !(phoneShelf && b.file && !b.bundled)).concat(rows);
  // the row's own two strings when import.js wrote them, else what this page
  // worked out once before (THE BOOK'S OWN WORDS): no fetch, and no second
  // paint to put them on the cover
  for (const b of deviceBooks) {
    if (!b || !b.slug || (coverFacts.get(b.slug) || {}).first_words) continue;
    const m = memo[b.slug + "@" + (b.hash || "")];
    const f = (b.first_words || b.form) ? b : (m && (m.first_words || m.form)) ? m : null;
    if (f) coverFacts.set(b.slug, { form: f.form || null, first_words: f.first_words || null });
  }
  loadCoverFacts(rows.map(b => b.slug)).then(got => { if (got) renderShelf(); });
  return rows.length;
}

function deviceStatus(b) {
  const bits = [b.chapters + " ch", TTSTVBundle.fmtBytes(b.bytes)];
  if (b.has_audio) bits.push("<b>audio</b>");
  else if (b.has_timings) bits.push("timed");
  return bits.join(" · ");
}

function deviceRowHTML(b) {
  return `<button class="railrow device" data-slug="${esc(b.slug)}" data-device="1" data-hash="${esc(b.hash || "")}"` +
    ` aria-selected="false">` +
    `<span class="railrow-title">${esc(b.title || b.slug)}</span>` +
    `<span class="railrow-by">${esc(b.author || "unknown")} · ${esc(langLine(b))}</span>` +
    `<span class="railrow-status">${deviceStatus(b)}</span>` +
    `<span class="rmbook" role="button" tabindex="0" data-remove="${esc(b.slug)}"` +
    ` aria-label="Remove ${esc(b.title || b.slug)} from this device">✕</span></button>`;
}

// The importing row: the same greyed entry + bar the bench uses for an
// ingest (.railrow.loading + .ingest-veil, --ingest is the fraction), because
// it is the same event from the reader's side -- a book arriving.
function importingRowHTML() {
  const p = importing;
  const pct = Math.max(0, Math.min(1, p.fraction || 0)) * 100;
  return `<div class="railrow loading" role="button" tabindex="-1" data-importing="1"` +
    ` style="--ingest: ${pct.toFixed(1)}%">` +
    `<span class="railrow-title">${esc(p.name)}</span>` +
    `<span class="railrow-by">bundle · importing</span>` +
    `<span class="railrow-status">${esc(TTSTVBundle.fmtBytes(p.bytes || 0))}</span>` +
    `<span class="ingest-step">${esc(p.label || "reading")}</span>` +
    `<span class="ingest-veil${p.fraction ? "" : " pulse"}"></span></div>`;
}

function storageLine() {
  const n = deviceBooks.length;
  const used = deviceBooks.reduce((t, b) => t + (b.bytes || 0), 0);
  const bits = [n === 1 ? "1 book" : n + " books"];
  if (n) bits.push(TTSTVBundle.fmtBytes(used) + " of books");
  if (storage && storage.quota) {
    bits.push(TTSTVBundle.fmtBytes(Math.max(0, storage.quota - (storage.usage || 0))) + " free of "
      + TTSTVBundle.fmtBytes(storage.quota));
  } else {
    bits.push("this browser doesn't say how much room is left");
  }
  return `<div class="storageline">${esc(bits.join(" · "))}</div>`;
}

function importErrorHTML() {
  if (!importError) return "";
  return `<div class="importerr" role="alert"><b>${esc(importError.name)} was not imported</b>` +
    `<ul>${importError.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul></div>`;
}

function deviceSection() {
  // CAN_IMPORT says this page *could* keep a book; libraryContext().device
  // says it is the kind of machine that does. On the Mac -- the app, or a
  // browser with studio behind it -- the books are on the SSD and this panel
  // was measuring the wrong disk (READER_FIRST.md, 30 Aug).
  if (!CAN_IMPORT || !libraryContext().device) return "";
  // on the phone the books are tiles on the shelf (placeDeviceBooks), so the
  // section is its heading, a bundle being read, and what went wrong -- and
  // the storage line moves under the shelf (renderShelf)
  const onShelf = deviceIsShelf();
  const rows = (importing ? importingRowHTML() : "") + (onShelf ? "" : deviceBooks.map(deviceRowHTML).join(""));
  // NO SECTION ON ANY HOST (wave 9 for the web; LIBRARY-DESIGN for the
  // phone too, POLISH rule 5): the tiles are the shelf, Import bundle… is
  // the link in the foot, the empty sentence is the shelf's own, and a
  // bundle being read is the one row this returns -- above the shelf
  if (onShelf) return rows + importErrorHTML();
  const head = `<div class="devicehead"><h2>On this device</h2>` +
    `<button id="importBtn" type="button"${importing ? " disabled" : ""}>` +
    `${importing ? "Importing…" : "Import bundle…"}</button></div>`;
  const body = rows || (onShelf
    ? (deviceBooks.length || !deviceListed ? "" : `<div class="empty">${TTSTVHost.isWeb ? TTSTVHost.WHY_DRIVE : "No books on this phone yet. Sync, in Settings, brings them from the Mac."}</div>`)
    : `<div class="empty">${TTSTVHost.isWeb ? "No books on this device yet — import a bundle .zip." : "No books here yet. AirDrop a bundle .zip to this phone, then Import bundle… and pick it out of Files."}</div>`);
  return head + importErrorHTML() + body + (onShelf ? "" : storageLine());
}

// One import, start to finish. Everything that can go wrong says which file
// and why, in the row, and leaves whatever was already on the device alone.
async function runImport(file) {
  if (!CAN_IMPORT || importing) return null;
  importError = null;
  importing = { name: file.name || "bundle.zip", label: "reading the zip", fraction: 0, bytes: file.size || 0 };
  renderShelf();
  let result = null;
  try {
    const buf = await file.arrayBuffer();
    result = await TTSTVBundle.importZip(buf, {
      onProgress: (p) => {
        importing.label = p.label;
        importing.fraction = p.total ? p.done / p.total : 0;
        paintImport();
      },
    });
  } catch (e) {
    importError = { name: importing.name, lines: [String(e.message || e)] };
    importing = null;
    await refreshDevice();
    renderShelf();
    note(`${importError.name}: ${importError.lines[0]}`);
    return null;
  }
  importing = null;
  const bad = result.books.filter(b => !b.ok);
  const good = result.books.filter(b => b.ok);
  if (bad.length) importError = {
    name: file.name || "bundle.zip",
    lines: bad.flatMap(b => b.errors.map(e => (b.slug ? b.slug + ": " : "") + e)),
  };
  await refreshDevice();
  renderShelf();
  if (good.length && window.FrankZero) FrankZero.kept("add", good.length === 1 ? "“" + good[0].title + "”" : "The books you added");
  if (good.length) {
    note(good.map(b => `${b.title} · ${b.chapters} ch · ${TTSTVBundle.fmtBytes(b.bytes)}`
      + (b.reimported ? " (already here, replaced)" : b.replaced.length ? " (replaced an older version)" : "")).join("   ") + " — tap it to read.");
  } else if (!bad.length) {
    note("Nothing to import from that .zip.");
  }
  return result;
}

// Only the bar moves while a zip is read -- re-rendering the whole shelf per
// file would throw away the row the veil is animating on (and there are
// hundreds of files in a book).
function paintImport() {
  const row = document.querySelector('#shelf .railrow.loading[data-importing="1"]');
  if (!row || !importing) return;
  const pct = Math.max(0, Math.min(1, importing.fraction || 0)) * 100;
  row.style.setProperty("--ingest", pct.toFixed(1) + "%");
  const step = row.querySelector(".ingest-step");
  if (step) step.textContent = importing.label || "reading";
  const veil = row.querySelector(".ingest-veil");
  if (veil) veil.classList.toggle("pulse", !importing.fraction);
}

async function forgetBook(slug) {
  const b = deviceBooks.find(x => x.slug === slug);
  const title = (b && b.title) || slug;
  if (!window.confirm(`Remove “${title}” from this device?\nIts text, look-ups, timings and audio are deleted here. The bundle on the bench is untouched, so it can be imported again.`)) return null;
  const gone = await TTSTVBundle.removeBook(slug);
  await refreshDevice();
  renderShelf();
  note(gone ? `Removed ${title}. ${TTSTVBundle.fmtBytes((b && b.bytes) || 0)} back.` : `${title} was not on this device.`);
  return gone;
}

// The share_target hand-off (reader/sw.js): iOS/Android share a .zip into the
// app, the service worker stashes it and redirects here with ?shared=1.
async function takeSharedBundle() {
  const q = new URLSearchParams(location.search);
  if (!CAN_IMPORT || !q.has("shared")) return null;
  if (q.get("shared") === "failed") { note("That share didn't arrive as a file this app could read."); return null; }
  try {
    const cache = await caches.open("ttstv-share");
    // The worker stashes the share under ITS OWN folder (sw.js: `new URL(SHARE_KEY,
    // self.location.href)`), and the worker lives in reader/ (settings/README.md,
    // manifest D1) -- so the key is named from there, not from this page.
    const url = new URL("../reader/share-bundle", location.href).href;
    const res = await cache.match(url);
    if (!res) { note("The shared bundle wasn't there when the Library opened."); return null; }
    const name = res.headers.get("X-Bundle-Name") || "shared bundle.zip";
    const blob = await res.blob();
    await cache.delete(url);
    return await runImport(new File([blob], name, { type: "application/zip" }));
  } catch (e) { note("Couldn't read the shared bundle: " + (e.message || e)); return null; }
}

/* ============================== WHY THE LIBRARY WAS SLOW (measured, 31 Aug)
 * Osca: *"loading is quite slow -- the Library, when quit and then open."*
 * Measured rather than guessed (`reader/tests/browser/library_open.py`, and
 * reader/README.md §2 for the numbers): on a cold open this page was PARSED
 * AND PAINTED at 182 ms and then showed an empty shelf until `/state`
 * answered at 942 ms. **Four fifths of the wait was the page having nothing
 * to draw** -- not the network being slow, not the shelf being expensive.
 *
 * And `/state` was not cheap: on Osca's nine books it was 9,848 stat calls and
 * **403 MB read** to produce 135 KB of JSON. Studio has since fixed its half
 * (`studio/statecache.py`, `studio/bookinfo.py`: the shelf digest, the disk
 * memo, and the shelf/detail split) -- a warm `/state` is now ~8 KB and a
 * cold one about a second and a half. The reader still does not have to WAIT
 * for it, which is why the cache below stays.
 *
 * So: the shelf's own rows are cached here, in the store every page already
 * reads, and painted synchronously before the first request goes out. It is
 * `libraryBooks` exactly as `booksFromState` reduces it -- seven scalars a
 * book, about a kilobyte for nine -- never `/state` itself.
 *
 * **It is a cache and it says so by behaving like one**: it is replaced whole
 * the moment `/state` answers, so a book deleted on another Mac is on this
 * shelf for the length of one request and no longer, and nothing is decided
 * from it -- an ingest in flight, a source's state, the phone shelf and every
 * action still wait for the real answer. */
const SHELF_CACHE_KEY = "ttstv.reader.shelfCache";
const SHELF_CACHE_VERSION = 1;

function shelfCacheRead() {
  try {
    const raw = localStorage.getItem(SHELF_CACHE_KEY);
    const d = raw ? JSON.parse(raw) : null;
    if (!d || d.version !== SHELF_CACHE_VERSION || !Array.isArray(d.books)) return null;
    // Only what renderShelf draws, and only in the shape booksFromState
    // gives it: a hand-edited or older cache can cost a row, never throw on
    // the page whose whole job is to list books.
    const books = d.books.filter(b => b && typeof b.slug === "string" && b.slug).map(b => ({
      slug: b.slug, title: b.title || b.slug, author: b.author || null, lang: b.lang || null,
      langs: Array.isArray(b.langs) && b.langs.length > 1 ? b.langs.slice() : undefined,
      chapters: Number(b.chapters) || 0,
      has_audio: !!b.has_audio, has_timings: !!b.has_timings, voiced: Number(b.voiced) || 0,
    }));
    return books.length ? books : null;
  } catch (e) { return null; }
}

function shelfCacheWrite(books) {
  try {
    localStorage.setItem(SHELF_CACHE_KEY, JSON.stringify({
      version: SHELF_CACHE_VERSION, saved: Date.now(), books: books || [] }));
    return true;
  } catch (e) { return false; }
}

let shelfDrawn = null;   // the markup as last written -- see the note below
/* ------------------------------------------------------------- THE ZOOM.
 * SIX SHELF ZOOMS (design/reader/bench-library.html; Osca: "the bench
 * wins"). One control on the shelf and it moves in one direction: how much of
 * the pane a single book is given. Out to in --
 *
 *    16   the whole library on one screen, covers only (Osca, 6 Sep: "a new
 *         view in library on 16 book rows, larger than 8 -- keep all others,
 *         just add a 16 row view")
 *     8   the whole shelf at a glance, covers only
 *     4   THE APP, and the one it opens on
 *     2   two books, the covers given the caption's room
 *     1   one jacket a screen, unframed, the book view's own drawing, and the
 *         shelf snaps book to book -- no words (ASKS #165)
 *
 * `1t` (1 ¶, one book with its text beside it) LEFT THE LADDER on 30 Sep (ASKS
 * #165, Osca: "Go all the way in, the view should be consistent ... Keeping
 * also the one book view, which is just slide up and down - without the
 * info"). A book's info lives in ONE place, the book view (a press on any
 * cover, then scroll). A record that remembers `1t` opens at `1`.
 *
 * Every difference between them is CSS off `#shelf[data-zoom]` (library.css,
 * "THE LADDER"), so this is the whole of the page's half: an attribute and a
 * field on the record. NOTHING IS RE-RENDERED when it changes -- the tiles
 * are already whole -- which is why zooming can keep the book that was in the
 * middle in the middle instead of jumping to the top of the shelf, and why a
 * zoom costs no JPEG (renderShelf's memo, above).
 *
 * THE PINCH IS THE CONTROL, AND THE ONLY ONE (Osca, 10 Sep: "Remove the
 * 16/8/4/2/1 zoom-ladder buttons from the page -- pinch already drives
 * data-zoom and stays"). The five buttons in a `.shelffoot` under the shelf
 * went with that line; cmd/ctrl + wheel, which is what a trackpad pinch
 * arrives as, walks the ladder one step per gesture (the listener at the foot
 * of this file). The bench keeps its own buttons, and 2 ¶ stays the bench's.
 */
const SHELF_ZOOMS = ["16", "8", "4", "2", "1"];      // out to in (1t retired, ASKS #165)
const SHELF_ZOOM_DEFAULT = "4";

function shelfZoom() { return library.zoom === "1t" ? "1" : SHELF_ZOOMS.includes(library.zoom) ? library.zoom : SHELF_ZOOM_DEFAULT; }

// Whatever is nearest the middle of the shelf stays in the middle after the
// pane changes -- a shelf that jumps to the first book on every zoom is
// unusable. Measured before the attribute moves, scrolled to after.
function shelfNearestTile() {
  const el = document.getElementById("shelf");
  if (!el) return null;
  const mid = el.scrollTop + el.clientHeight / 2;
  let best = null, d = Infinity;
  for (const t of el.querySelectorAll(".railrow.tile")) {
    const c = t.offsetTop + t.offsetHeight / 2, gap = Math.abs(c - mid);
    if (gap < d) { d = gap; best = t; }
  }
  return best;
}

// The attribute, off the record -- and, at 1 ¶, the panes beside the covers.
// Called by renderShelf (which may skip its own innerHTML write) and by
// setShelfZoom.
function paintShelfZoom() {
  const el = document.getElementById("shelf");
  if (!el) return;
  el.setAttribute("data-zoom", shelfZoom());
  paintBookViews();
}

/* THE PINCH KEEPS THE BOOK UNDER THE FINGERS (ASKS #167, the Photos Stranger, 30 Sep: "the book you pinch on
   slides away and a neighbour takes its place"). A pinch has a POINT -- ctrl/⌘-wheel's clientX/Y on a Mac or the
   web, the two fingers' midpoint on the phone -- and the tile under that point is the anchor: after the rung
   changes, the shelf is scrolled so the same book sits under the same point, at the same height within the tile
   (its fraction top to bottom), so pinching in on a book walks THAT book to one-up. The grid reflows by columns, so
   sideways the book goes to its own column; up and down it does not move off the point. At `1` (one book a
   screen, snapped) the book is seated at the top of its screen, which covers every point. Keys and menus, with no
   pointer, keep the middle (shelfNearestTile). */
function shelfTileAt(x, y) {
  const el = document.getElementById("shelf");
  if (!el) return null;
  const hit = document.elementFromPoint(x, y);
  const t = hit && hit.closest && hit.closest("#shelf .railrow.tile");
  if (t) return t;
  let best = null, d = Infinity;                       // the seam, or the foot of a short last row: the nearest
  for (const u of el.querySelectorAll(".railrow.tile")) {
    const r = u.getBoundingClientRect(); if (!r.width) continue;
    const dx = Math.max(r.left - x, 0, x - r.right), dy = Math.max(r.top - y, 0, y - r.bottom), g = dx * dx + dy * dy;
    if (g < d) { d = g; best = u; }
  }
  return best;
}

/* THE BOOK YOU COME BACK TO IS MARKED, QUIETLY (ASKS #175, the Stranger: "nothing marks the book you came back to
   (no ring, no mark, focus on <body>)"). A ring drawn over the jacket that fades on its own (library.css,
   `[data-back]`), and -- when the way back was a close -- the keyboard's focus, so the next arrow starts there. */
function shelfMarkBack(t, focus) {
  if (!t) return;
  t.removeAttribute("data-back"); void t.offsetWidth; t.setAttribute("data-back", "");
  clearTimeout(t.__backT); t.__backT = setTimeout(() => t.removeAttribute("data-back"), 1700);
  if (focus) { try { t.focus({ preventScroll: true }); } catch (e) {} }
}

const SHELF_PINCH_HOLD_MS = 1500;   // a step this soon after the last, at the same point, is the same pinch
const SHELF_PINCH_AGAIN_MS = 4000; // a new pinch this soon after the last, at the same point, keeps its book (#175)
let shelfPinchKeep = null;          // {slug, fy, x, y, t}: the book the pinch began on

function setShelfZoom(z, anchor) {
  if (!SHELF_ZOOMS.includes(z)) return false;
  if (z === shelfZoom()) { paintShelfZoom(); return true; }
  const el = document.getElementById("shelf");
  const at = anchor && typeof anchor === "object" && isFinite(anchor.x) && isFinite(anchor.y) ? anchor : null;
  let keep = null, fy = 0.5;
  if (at) {
    /* ONE GESTURE, ONE BOOK. The grid reflows by columns, so after a step the point can sit over the book's
       neighbour; a pinch that goes on (the same point, within SHELF_PINCH_HOLD_MS of the last step) keeps the book
       it began on, so 16 -> 8 -> 4 -> 2 -> 1 and back out is ONE book, not a walk across the row */
    const P = shelfPinchKeep, now = Date.now();
    /* ASKS #175: a gesture that anchored ONCE (at its first event) names its book; that book is kept, whatever is
       under the point now */
    const named = at.slug ? el.querySelector('.railrow.tile[data-slug="' + (window.CSS && CSS.escape ? CSS.escape(at.slug) : at.slug) + '"]') : null;
    const same = !named && P && now - P.t < SHELF_PINCH_HOLD_MS && Math.hypot(P.x - at.x, P.y - at.y) < 12;
    if (named) { keep = named; fy = isFinite(at.fy) ? at.fy : 0.5; }
    else keep = same ? el.querySelector('.railrow.tile[data-slug="' + (window.CSS && CSS.escape ? CSS.escape(P.slug) : P.slug) + '"]') : null;
    if (named) {}
    else if (keep) fy = P.fy;
    else {
      keep = shelfTileAt(at.x, at.y);
      if (keep) { const r = keep.getBoundingClientRect(); fy = r.height ? Math.min(1, Math.max(0, (at.y - r.top) / r.height)) : 0.5; }
    }
    shelfPinchKeep = keep ? { slug: keep.getAttribute("data-slug"), fy, x: at.x, y: at.y, t: now } : null;
  } else if (anchor !== false) keep = shelfNearestTile();
  libPatch(d => { d.zoom = z; });
  paintShelfZoom();
  if (!keep) return true;
  if (at && el) {
    /* the scroller: #shelf on a window, the document on the phone (#shelf grows there and the page scrolls) */
    const own = el.scrollHeight > el.clientHeight + 1 && /auto|scroll/.test(getComputedStyle(el).overflowY);
    const sc = own ? el : (document.scrollingElement || document.documentElement);
    const r = keep.getBoundingClientRect();
    if (z === "1") sc.scrollTop += r.top - (own ? el.getBoundingClientRect().top : 0);   // seated: its screen is the pane
    else sc.scrollTop += (r.top + fy * r.height) - at.y;
  } else if (keep.scrollIntoView) keep.scrollIntoView({ block: "center" });
  return true;
}

// dir +1 = closer in, -1 = further out. Clamped rather than wrapped: the
// ladder has two ends and stepping off one of them should do nothing.
function shelfZoomStep(dir, at) {
  const i = SHELF_ZOOMS.indexOf(shelfZoom());
  return setShelfZoom(SHELF_ZOOMS[Math.min(SHELF_ZOOMS.length - 1, Math.max(0, i + dir))], at);
}

/* ------------------------------------------ 1 ¶ -- ONE BOOK AS ITS OWN PAGE.
 * The bench's one-book text view (design/reader/bench-library.html, `1t`),
 * shipped 10 Sep: at that rung the tile turns on its side, the cover on the
 * left and, beside it, the book's own text --
 *
 *    title · AUTHOR · LANG                 the tile's own two lines, set large
 *    LANG · N CHAPTERS · BUILT             the facts line (the bench's metaLine)
 *    publisher · published · id · subjects one details line, what the record has
 *    blurb                                 the description, else the opening lines
 *    languages   voices                    voices only once a chapter is rendered
 *    chapters                              the chapter titles
 *    read                                  a door: one press opens the book
 *
 * ONE SOURCE, THE BOOK RECORD, READ ONCE PER BOOK. `GET /book?slug=` is the
 * record as studio serves it -- `meta` carries description, publisher, date,
 * identifier and subjects since `c0ad5df` put them there, through
 * `studio/sourcemeta.py`'s META_ALLOW, the same tuple the filler writes by --
 * with `preview_text` (the book's opening lines, picked past the front
 * matter), the chapter titles, the language's name, the voice and the voiced
 * count. `bookRecordFrom` reduces it ONCE to the few strings this view draws
 * and keeps them in `bookRecords`; the view reads that map and derives
 * nothing of its own. BUILT is the one fact not on that record, so it comes
 * from the file the bench's own BUILT came from, `books/index.json`
 * (`updated`: book.json's date, as studio's write_index records it), asked
 * once per page. A fact the record does not have is not drawn -- no label
 * over nothing, no grey bar.
 *
 * ASKED FOR ONLY WHEN IT CAN BE SEEN. Osca, 4 Sep: a shelf loads "only the
 * INFO actually needed to SHOW the book in the library". So nothing here runs
 * until the shelf is at 1 ¶, and then only for the tiles within a screen of
 * the view (an IntersectionObserver on #shelf; every tile at once where there
 * is none). A book is asked once, ever, even if it 404s.
 *
 * AND IT IS PAINTED, NOT RENDERED. The pane is an empty `<span class=
 * "tile-pane">` in the tile markup `renderShelf` memoises -- the same string at
 * every zoom and before and after a record lands -- and `paintBookViews` fills
 * it in place afterwards, the way `paintShelfZoom` moves the pressed state.
 * A record arriving therefore touches one pane and no cover: the memo's rule
 * (a write that throws away every decoded JPEG on the shelf is the jitter of
 * 5 Sep) holds here too. On the rare full rewrite the panes come back empty
 * and are refilled in the same task, before a frame can show them empty.
 */
const BOOK_VIEW_ZOOM = "1t";
const BOOK_VIEW_CHAPTERS = 10;        // titles drawn before "and N more"
const bookRecords = new Map();        // slug -> the view's strings; null = asked, nothing came
let bookBuilt = null;                 // slug -> "YYYY-MM-DD", from books/index.json
let bookBuiltAsked = false;
let bookViewEntries = new Map();      // slug -> the shelf entry its tile was drawn from

/* A description is the publisher's HTML (`<p><b><u>Winner of the Booker of
   Bookers<br></u></b><br>Saleem Sinai is born ...`) and the view wants its
   words. Block ends and breaks become spaces, every tag goes, and the named
   and numeric entities are decoded BY HAND: the two DOM ways to do it -- a
   parser, or innerHTML on a spare element -- would fetch the images an
   `<img>` in it names, and a publisher's blurb is not something this page
   should run. What comes out is text, and `esc()` sees it before the page does. */
function blurbText(html) {
  const NAMED = { amp: "&", lt: "<", gt: ">", quot: '"', apos: "'", nbsp: " ",
                  mdash: "—", ndash: "–", hellip: "…",
                  rsquo: "’", lsquo: "‘", rdquo: "”", ldquo: "“" };
  return String(html == null ? "" : html)
    .replace(/<\s*(br|\/p|\/div|\/li|\/h\d)\b[^>]*>/gi, " ")
    .replace(/<[^>]*>/g, "")
    .replace(/&(#x[0-9a-f]+|#\d+|[a-z]+);/gi, (m, e) => {
      if (e[0] === "#") {
        const n = e[1] === "x" || e[1] === "X" ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10);
        try { return Number.isFinite(n) && n > 0 ? String.fromCodePoint(n) : m; } catch (err) { return m; }
      }
      return Object.prototype.hasOwnProperty.call(NAMED, e.toLowerCase()) ? NAMED[e.toLowerCase()] : m;
    })
    .replace(/\s+/g, " ").trim();
}

// `/book`'s answer, reduced to what the view draws -- once, on arrival.
// `bookinfo._public_meta` already joins a list with ", "; an array is joined
// the same way in case a record ever arrives unjoined.
function bookRecordFrom(r) {
  if (!r || typeof r !== "object" || Array.isArray(r)) return null;
  const m = r.meta && typeof r.meta === "object" ? r.meta : {};
  const s = v => (Array.isArray(v) ? v.filter(x => typeof x === "string").join(", ")
                  : typeof v === "string" || typeof v === "number" ? String(v) : "").trim();
  return {
    description: blurbText(s(m.description)),
    opening: s(r.preview_text),
    publisher: s(m.publisher),
    published: s(m.date).slice(0, 10),
    identifier: s(m.identifier),
    subjects: s(m.subjects),
    langName: s(r.lang_name),
    chapters: Array.isArray(r.chapters)
      ? r.chapters.map(c => s(c && c.title).replace(/\s+/g, " ")).filter(Boolean) : [],
    voice: s(r.voice),
    voiced: Number(r.voiced) || 0,
  };
}

async function loadBookRecord(slug) {
  if (!slug || bookRecords.has(slug)) return false;
  bookRecords.set(slug, null);                   // asked: never twice, even if it 404s
  // THE BOOK'S OWN WORDS, FROM TWO PLACES (above): studio's record, or the
  // book's own file on a device that keeps it
  const rec = bookWordsOnDisk() ? await bookRecordFromDisk(slug)
    : bookRecordFrom(await getJSON("/book?" + new URLSearchParams({ slug })));
  if (!rec) return false;
  bookRecords.set(slug, rec);
  return true;
}

async function loadBookBuilt() {
  if (bookBuiltAsked) return false;
  bookBuiltAsked = true;
  try {
    const res = await fetch("../books/index.json", { cache: "no-store" });
    if (!res.ok) return false;
    const rows = await res.json();
    const out = {};
    for (const r of Array.isArray(rows) ? rows : []) {
      if (r && r.slug && typeof r.updated === "string" && r.updated) out[r.slug] = r.updated.slice(0, 10);
    }
    bookBuilt = out;
    return true;
  } catch (e) { return false; }
}

// The pane for one shelf entry. A merged pair is two books opened as one, so
// its languages and voices are both halves' and the rest is the first's.
function bookViewHTML(b) {
  if (!b || !b.slug) return "";
  const slugs = b.merge ? b.merge.members.map(x => x.slug) : [b.slug];
  const recs = slugs.map(x => bookRecords.get(x) || null);
  const one = recs[0] || null;
  const dot = " <i>\u00b7</i> ";
  const parts = [];

  const facts = [];
  if (b.lang) facts.push(esc(String(b.lang).toUpperCase()));
  if (b.chapters) facts.push(esc(b.chapters + (Number(b.chapters) === 1 ? " chapter" : " chapters")));
  const built = !b.merge && bookBuilt ? bookBuilt[b.slug] : null;
  if (built) facts.push("built " + esc(built));
  if (facts.length) parts.push(`<span class="tile-facts">${facts.map(f => `<span>${f}</span>`).join(dot)}</span>`);

  if (one) {
    const details = [one.publisher, one.published ? "published " + one.published : "",
                     one.identifier, one.subjects].filter(Boolean);
    // ONE line, as asked: a subject list can run to five (Walden's does), so
    // the line ends in an ellipsis; no title= tooltip (PHOTOS rule 7) -- the book view lets it wrap instead
    if (details.length) parts.push(`<span class="tile-details">` +
      `${details.map(esc).join(dot)}</span>`);
    const blurb = one.description || one.opening;
    if (blurb) parts.push(`<span class="tile-slot tile-blurb"><b>blurb</b><span>${esc(blurb)}</span></span>`);
  }

  const uniq = xs => xs.filter((x, i) => x && xs.indexOf(x) === i);
  const langs = uniq(slugs.map((x, i) => (recs[i] && recs[i].langName)
    || (!b.merge ? String(b.lang || "").toUpperCase() : "")));
  const voices = uniq(recs.map(r => (r && r.voiced > 0 ? r.voice : "")));
  const row = [];
  if (langs.length) row.push(`<span class="tile-slot"><b>languages</b><span>${langs.map(esc).join(" · ")}</span></span>`);
  if (voices.length) row.push(`<span class="tile-slot"><b>voices</b><span>${voices.map(esc).join(" · ")}</span></span>`);
  if (row.length) parts.push(`<span class="tile-slotrow">${row.join("")}</span>`);

  // P1: the word, and the parse's own sentence for a book that is not clean
  const verdict = verdictBookHTML(b);
  if (verdict) parts.push(verdict);

  if (one && one.chapters.length) {
    const shown = one.chapters.slice(0, BOOK_VIEW_CHAPTERS).map(t => `<span>${esc(t)}</span>`);
    const more = one.chapters.length - shown.length;
    if (more > 0) shown.push(`<span class="tile-more">and ${more} more</span>`);
    parts.push(`<span class="tile-slot tile-chapters"><b>chapters</b><span>${shown.join("")}</span></span>`);
  }

  parts.push(`<span class="tile-read" role="link">read</span>`);
  return parts.join("");
}

// Fill every tile's pane from the map, writing only a pane whose text has
// changed. Called from paintShelfZoom (so from renderShelf and every zoom)
// and whenever a record lands. Off 1 ¶ it does nothing and asks for nothing.
// ON THE PHONE TOO, since G-COVERS (11 Sep): the phone walks the Mac's rungs
// by pinch and 1 ¶ is the step between 2 and 1 there as here (Osca: "as on
// the Mac"), so its pane is filled -- from the book's own file, THE BOOK'S
// OWN WORDS above -- where until today the phone drew one size and a record
// asked for would have been a request for a hidden span.
function paintBookViews() {
  const el = document.getElementById("shelf");
  if (!el || shelfZoom() !== BOOK_VIEW_ZOOM) {
    watchBookViews(null); return;
  }
  if (!bookBuiltAsked) loadBookBuilt().then(got => { if (got) paintBookViews(); });
  const tiles = Array.from(el.querySelectorAll(".railrow.tile[data-slug]"))
    .filter(t => t.querySelector(".tile-pane"));
  for (const t of tiles) {
    const pane = t.querySelector(".tile-pane");
    const html = bookViewHTML(bookViewEntries.get(t.dataset.slug));
    if (pane._drawn !== html) { pane.innerHTML = html; pane._drawn = html; }
  }
  watchBookViews(tiles);
}

// "READ BY" IN THE BOOK VIEW'S ⓘ CARD (Z8, integration 1 Oct): the voices that have read this book, each a press that
// plays it, and this device's own voice always there -- design/reader/voicepage.js's VoicePage.bookVoices(slug), over
// window.FrankVoice (voicestore.js), the seam the Surface's voice cards already ask. Mounted under the chapters, above
// READ, by the book view's fill(); the two files arrive beside surface.js when the Surface has not brought them yet.
let readByTries = 0;
function readBy(pane, slug) {
  if (!pane || !slug) return;
  pane.__readBy = slug;                         /* the newest book asked for wins a retry still in flight */
  if (pane.querySelector(".tile-readby")) return;
  if (!window.VoicePage || !window.FrankVoice) {
    if (!document.querySelector("script[data-voiceseam]")) {
      const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "../reader/voicepage.css"; css.setAttribute("data-voiceseam", ""); document.head.appendChild(css);
      ["voicestore.js", "voicepage.js"].forEach(f => { const x = document.createElement("script"); x.src = "../reader/" + f; x.async = false; x.setAttribute("data-voiceseam", ""); document.head.appendChild(x); });
    }
    if (readByTries++ < 40) setTimeout(() => { if (pane.isConnected && pane.__readBy === slug) readBy(pane, slug); }, 250);
    return;
  }
  const slot = document.createElement("span"); slot.className = "tile-slot tile-readby";
  try { slot.appendChild(VoicePage.bookVoices(slug)); } catch (e) { console.warn("[read by]", e); return; }
  const read = pane.querySelector(".tile-read");
  if (read) pane.insertBefore(slot, read); else pane.appendChild(slot);
}

let bookViewWatch = null, bookViewWatched = [];
function wantBookView(tile) {
  const b = bookViewEntries.get(tile.dataset.slug);
  const slugs = b && b.merge ? b.merge.members.map(x => x.slug) : [tile.dataset.slug];
  Promise.all(slugs.map(loadBookRecord)).then(got => { if (got.some(Boolean)) paintBookViews(); });
}
function watchBookViews(tiles) {
  const same = tiles && tiles.length === bookViewWatched.length
    && tiles.every((t, i) => t === bookViewWatched[i]);
  if (same) return;
  if (bookViewWatch) { bookViewWatch.disconnect(); bookViewWatch = null; }
  bookViewWatched = tiles || [];
  if (!tiles) return;
  if (typeof IntersectionObserver !== "function") { tiles.forEach(wantBookView); return; }
  bookViewWatch = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) wantBookView(e.target); }),
    { root: document.getElementById("shelf"), rootMargin: "100% 0px" });
  tiles.forEach(t => bookViewWatch.observe(t));
}


/* ------------------------------------------------------------------ ORDER.
 * Osca, on the bench (design/reader/bench-library.html): "I need a small drop
 * down in library, to change how the books are ordered. Alphabetically by
 * title, and by author and most recent. Put newly added in its own section
 * too."
 *
 * FIVE ORDERS, AND ONE RULE: THE COVERS DO NOT MOVE WITH THEM. A pairing is
 * assigned by `assignPairings` walking the list about to be drawn and is kept
 * in `coverPairings`, KEYED BY SLUG -- so re-ordering the shelf re-orders the
 * books and nothing else. A book has one cover whichever way the shelf is
 * stacked.
 *
 * `opened` IS THE DEFAULT AND IS THE APP'S OWN. This shelf has sorted by last
 * opened since it was written (`byLastOpened`), and a drop down that silently
 * changed that would be a redesign nobody asked for: the request was a way to
 * CHANGE the order, not a different one to start on. The bench opens on
 * `title` because a bench has no reading history to sort by.
 *
 * AND THE TWO DATE ORDERS ASK `firstSeen`, NOT THE BOOK. The bench sorts on
 * `books/index.json`'s `updated`; /state's shelf row carries no date at all
 * (studio/bookinfo.py `shelf_of` -- counters and flags, nothing else), and a
 * date derived from a counter would be a picture of a fact. `firstSeen`
 * below is the one date this page can know honestly.
 */
function authorKey(a) { const w = String(a || "").trim().split(/\s+/); return (w[w.length - 1] || "") + " " + String(a || ""); }
function orderTitleOf(b) { return String((b && (b.title || b.slug)) || ""); }
const SHELF_ORDERS = {
  opened: { label: "last opened first",
            cmp: (a, b) => openedAt(b.slug) - openedAt(a.slug) },
  title:  { label: "by title, a–z",
            cmp: (a, b) => orderTitleOf(a).localeCompare(orderTitleOf(b), undefined, { sensitivity: "base" }) },
  /* A BOOK WITH NO AUTHOR GOES TO THE END, said out loud rather than left to a
     sentinel string: "~" looks like it sorts last and does not -- ICU puts
     punctuation BEFORE letters, which is how a book with author "" came out at
     the TOP of the author shelf on the bench. */
  /* BY SURNAME (the Photos Stranger, 29 Sep: it ran Administrador · Alexandre Dumas · … William Shakespeare --
     first names -- while the head said "Borges – Shakespeare"): the last word of the name first, then the whole */
  author: { label: "by author, a–z",
            cmp: (a, b) => (!a.author - !b.author)
              || authorKey(a.author).localeCompare(authorKey(b.author), undefined, { sensitivity: "base" })
              || orderTitleOf(a).localeCompare(orderTitleOf(b), undefined, { sensitivity: "base" }) },
  added:  { label: "newest here first",
            cmp: (a, b) => firstSeenAt(b.slug) - firstSeenAt(a.slug) },
  oldest: { label: "longest here first",
            cmp: (a, b) => firstSeenAt(a.slug) - firstSeenAt(b.slug) },
};
const SHELF_ORDER_KEYS = ["opened", "title", "author", "added", "oldest"];
const SHELF_ORDER_DEFAULT = "opened";

/* AN ORDER THAT CANNOT DIFFER IS NOT OFFERED (STRANGER-FIX, 28 Sep: *"three
   of the five orders are the same order"*). The two date orders read
   `firstSeen`, and on a shelf where every book was stamped "already here"
   they are the arrival order twice over -- so each is listed only once two
   books carry different dates, and a remembered choice of one falls back to
   the default. `rows` is the shelf about to be drawn; without it the whole
   library answers. */
function orderCanDiffer(k, rows) {
  if (k !== "added" && k !== "oldest") return true;
  const books = rows || (typeof libraryBooks !== "undefined" && libraryBooks) || [];
  return new Set(books.map(b => firstSeenAt(b.slug))).size > 1;
}
function shelfOrderKeys(rows) { return SHELF_ORDER_KEYS.filter(k => orderCanDiffer(k, rows)); }
function shelfOrder(rows) {
  const k = library.order;
  return SHELF_ORDERS[k] && orderCanDiffer(k, rows) ? k : SHELF_ORDER_DEFAULT;
}

// `opened` goes through `byLastOpened` rather than through its own comparator
// so the app's own order is the same code it always was, and the drop down
// can only ever ADD orders to it.
function shelfOrdered(rows) {
  const key = shelfOrder(rows);
  if (key === "opened") return byLastOpened(rows);
  return (rows || []).slice().sort(SHELF_ORDERS[key].cmp);
}

/* ------------------------------------------------- NEWLY ADDED, HONESTLY.
 * "Put newly added in its own section too." A band above the shelf holding the
 * SHELF_NEW_N books that arrived last, LIFTED OUT of the shelf rather than
 * repeated in it -- so the count on the Shelf heading still adds up, which is
 * the bench's own rule.
 *
 * WHAT "ADDED" MEANS HERE, AND WHY IT IS NOT THE BOOK'S OWN DATE. /state's
 * shelf row has no timestamp on it, so the only date this page can be honest
 * about is the one it keeps itself: the first time the shelf SAW a slug. It
 * lives on the library record beside `positions`, so it survives a reload and
 * rides the same mirror to TTS_DATA.
 *
 * AND THE FIRST RUN ADDS NOTHING. A record with no `firstSeen` in it has never
 * watched this library, so every slug already on the shelf is stamped 0 --
 * "was already here" -- and the band stays empty until a book actually
 * arrives. Stamping them `now` instead would open the page with four books
 * called new that have been there for weeks, which is the invented fact this
 * avoids.
 *
 * SHELF_NEW_N IS A NUMBER AND NOT A SLIDER. The bench has the slider (0..12,
 * default 4) because setting it is what a bench is for; the app ships what it
 * settled on, exactly as it ships the gaps rather than the spacing dial.
 */
const SHELF_NEW_N = 4;

function firstSeenAt(slug) {
  const m = library && library.firstSeen;
  return (m && Number(m[slug])) || 0;
}

// Called from `renderShelf`, so every path that puts books on the shelf goes
// through it. It writes only when a slug is genuinely new, so a poll that
// brings no news writes nothing and mirrors nothing.
function noteFirstSeen(rows) {
  const books = rows || [];
  if (!books.length) return false;
  const seen = (library && library.firstSeen) || {};
  const add = books.map(b => b.slug).filter(x => x && !(x in seen));
  if (!add.length) return false;
  const now = Date.now();
  libPatch(d => {
    d.firstSeen = d.firstSeen || {};
    const virgin = !Object.keys(d.firstSeen).length;
    for (const x of add) if (!(x in d.firstSeen)) d.firstSeen[x] = virgin ? 0 : now;
  });
  return true;
}

// The n most recently first-seen books, newest first. A book stamped 0 was
// already there when the record began and is never "newly added".
function shelfFresh(rows) {
  if (!SHELF_NEW_N) return [];
  return (rows || []).filter(b => firstSeenAt(b.slug) > 0)
    .sort((a, b) => firstSeenAt(b.slug) - firstSeenAt(a.slug))
    .slice(0, SHELF_NEW_N);
}

/* ------------------------------------------- OPEN BOOKS COME FIRST (10 Sep).
 * PROMPTS/phone-chrome.md: the bar's drag-up is *"the library. Open books and
 * newly added come first at the top; below that, the whole library."* -- and,
 * added the same day, *"In the library, each open book carries a small ✕ at
 * its top-right -- press it to close."*
 *
 * THE LIST IS THE READER'S, AND THIS PAGE ONLY READS IT -- except for the ✕.
 * `localStorage["ttstv.openBooks"]`, `[{slug, title}]`, front first:
 * reader/reader.html's phone bar writes it (every open puts the book at the
 * front; the reading route out of a book takes it off; a slide between books
 * walks it without reordering). Until now the open books reached the top of
 * this shelf only by accident of the default order -- `opened`, the last
 * reading position -- and under any other order they were wherever they fell.
 * Only the phone writes the list, so on the Mac it is empty and nothing here
 * changes there.
 *
 * ONE BAND, AND ITS SIZE IS NOT CHANGED. SHELF_NEW_N places: the open books
 * first, in the list's own order, then newly added -- each book once, lifted
 * out of the shelf as the band always was. An open book the band has no room
 * for stays in the shelf and still carries its ✕. How big the band is (4 vs
 * 10) is Osca's, and is not decided here. */
const OPEN_BOOKS_KEY = "ttstv.openBooks";
let openNow = new Set();              // the open slugs, as the last paint read them
function openBookSlugs() {
  let v = null;
  try { v = JSON.parse(localStorage.getItem(OPEN_BOOKS_KEY) || "[]"); } catch (e) { v = null; }
  if (!Array.isArray(v)) return [];
  const seen = new Set();
  return v.map(e => (e && typeof e.slug === "string") ? e.slug : "")
    .filter(x => x && !seen.has(x) && seen.add(x));
}
// The ✕: this book leaves the open list, and only this book. The list is the
// reader's shape, so an entry is removed whole and the rest keep their order.
function closeOpenBook(slug) {
  if (!slug) return false;
  let v = null;
  try { v = JSON.parse(localStorage.getItem(OPEN_BOOKS_KEY) || "[]"); } catch (e) { v = null; }
  if (!Array.isArray(v)) return false;
  const kept = v.filter(e => !(e && e.slug === slug));
  if (kept.length === v.length) return false;
  try { localStorage.setItem(OPEN_BOOKS_KEY, JSON.stringify(kept)); } catch (e) { return false; }
  return true;
}
function shelfBand(rows) {
  if (!SHELF_NEW_N) return [];
  const bySlug = new Map((rows || []).map(b => [b.slug, b]));
  const open = openBookSlugs().map(x => bySlug.get(x)).filter(Boolean);
  const taken = new Set(open.map(b => b.slug));
  return open.concat(shelfFresh(rows).filter(b => !taken.has(b.slug))).slice(0, SHELF_NEW_N);
}

// The heading says what the band holds: `newly added` as it always did, `open`
// when every book in it is open, and both names when it holds both.
function bandHTML(band, open) {
  if (!band || !band.length) return "";
  const o = open || new Set();
  const nOpen = band.filter(b => o.has(b.slug)).length;
  const head = !nOpen ? "newly added" : nOpen === band.length ? "open" : "open \u00b7 newly added";
  // `shelfband`, not `band` (LIBRARY-DESIGN): `.band` is the doors' component
  return `<section class="shelfband" data-band="${nOpen ? "open" : "new"}">` +
    `<h2 class="bandhead">${head}</h2>` + tileRows(band) + `</section>`;
}

/* The drop down, at the top of the shelf and at its right (Osca's dial,
   10 Sep -- library.css `.sortbar`). ITS MARKUP DOES NOT SAY WHICH ORDER IS
   ON, for the same reason the tile markup carries 1 ¶'s pane EMPTY: `renderShelf` writes its markup only when it differs from what
   it wrote last, and a `selected` attribute in here would make a poll that
   brings no news rewrite the shelf whenever the order was not the default --
   throwing away and re-requesting every decoded JPEG on it.
   `paintShelfOrder()` sets the value afterwards.

   One book cannot be in an order, so the bar is not drawn for one. */
function sortbarHTML(entries) {
  if (!entries || entries.length < 2) return "";
  /* ON THE WEB THE CONTROL IS ONE QUIET WORD (LIBRARY-WEB, wave 9, 26 Sep;
     Osca: *"order SHOULD just be a drop down, I don't need to see the 'last
     opened' crap all the time"*). The <select> stays -- it IS a drop down of
     the five orders with the current one ticked, `paintShelfOrder` still
     sets it, the change handler is untouched -- but under `html[data-web]`
     library.css lays it over `.sortface` at opacity 0, so what the page
     PRINTS is "Sort" and never the order's name; the label is hidden there.
     Off the web nothing changes: `.sortface` is display:none. */
  /* LIBRARY-DESIGN (26 Sep): the row above the grid holds two things -- the
     SOURCE LINE at the left (where these books come from, and on the Mac the
     door to the Sources sheet) and SORT at the right, one word over the
     page's OWN menu (#menu, the tile's), the current order ticked. No
     <select>: POLISH rule 1 -- the native menu is a browser default and it
     was visible the moment it opened; rule 3 -- the control shows its STATE
     and never its name beside it: the word IS the order the shelf is in
     (STRANGER-FIX, 28 Sep -- *"the word still says Sort; the page never

  return `<div class="sortbar">${sourceLineHTML()}` +
    `<button type="button" id="shelforder" class="sortface" aria-haspopup="menu" aria-expanded="false"` +
    ` aria-label="Sort the shelf" data-order="${esc(shelfOrder(entries))}">${SORT_FACE}</button></div>`;
}

/* THE ORDERS AS A MENU. The same rows the tile menu draws, one act per order,
   the current one marked; `menuAct` sees the "order:" prefix and sets it. */
function orderMenuItems() {
  const z = window.FrankZero && FrankZero.orderItems();
  if (z) return z;
  const now = shelfOrder();
  return shelfOrderKeys().map(k => ({ id: "order:" + k, label: SHELF_ORDERS[k].label, checked: k === now }))
    .concat(window.FrankZero ? FrankZero.orderExtra() : []);
}
function openOrderMenu(btn) {
  const r = btn.getBoundingClientRect();
  showMenu(Math.round(r.right), Math.round(r.bottom + 4), "order", { slug: null }, orderMenuItems());
  const el = document.getElementById("menu");
  el.classList.add("menu-right");
  // the menu's left edge is the pointer's; an order menu hangs from the word's RIGHT edge
  if (!isPhone()) el.style.left = Math.max(8, Math.round(r.right - el.offsetWidth)) + "px";

/* THE SOURCE LINE: one quiet sentence saying where this shelf comes from, in
   Frank's voice, per host (POLISH rule 5 -- nothing about another device).

const SHELF_SOURCES = {
  studio: { line: "On this Mac", door: "Sources…" },
  web:    { line: "", door: "" },   /* nothing to say on the web: "The folder beside this page" was a sentence about the machine (EXPORT, 28 Sep) */

}
function sourceLineHTML() {
  const src = SHELF_SOURCES[shelfSourceKey()] || SHELF_SOURCES.web;
  const door = src.door && studioLive
    ? ` · <a href="#" class="sourcedoor" data-sources="1">${esc(src.door)}</a>` : "";
  if (!src.line) return `<span class="sourceline"></span>`;
  return `<span class="sourceline">${esc(src.line)}${door}</span>`;
}

/* THE SHELF'S FOOT, ON EVERY HOST (wave 9 drew it for the web; LIBRARY-DESIGN
   makes it the one foot). The counts of what is DRAWN -- never the Cache's
   "0 books · 10.0 GB free" -- and the secondary action: Import bundle… as a
   small link, not a button competing with the covers. With nothing drawn the

   carries no audio fact, so "N with audio" is printed only when some book on

function webFootHTML(entries) {
  const n = (entries || []).length;
  const bits = [];
  /* Osca, 28 Sep: "4 books, get rid of that, not important" -- the counts are
     not drawn; the foot is the Import link alone (the code that counted stays
     below, off, so a later ask can turn one count back on) */
  if (n && false) {
    bits.push(n === 1 ? "1 book" : n + " books");
    const voiced = entries.filter(b => b.has_audio || (b.voiced > 0)).length;
    if (voiced) bits.push(voiced + " with audio");

  const link = CAN_IMPORT && libraryContext().device
    ? `<a href="#" id="importBtn" class="importlink"${importing ? ' aria-disabled="true"' : ""}>${importing ? "Importing…" : "Import bundle…"}</a>`
    : "";

}

/* THE EMPTY SHELF SPEAKS IN ONE VOICE (POLISH rule 11), AND HAS ONE DOOR

/* THE FACE IS "Sort ⌄" (Osca, 28 Sep, newer than STRANGER-FIX's "the word IS the

}

function setShelfOrder(k) {

/* ================================================ SHELVES AS ALBUMS (ASKS #184 #185, 30 Sep; Z7)
 * Osca: *"hold down on a book and push it onto another book to make a shelf with those two. The shelf just goes
 * at the top, just below newly added (which are for books/renders) and then all the shelves/projects you've
 * created THEN your entire library, a thing will always appear in your entire library, even if it's in a
 * project."* -- and *"after that, just drag it onto the shelf which has been created. Then inside a shelf ...
 * books on a shelf have a mega companion, made up of the individual companions and what you describe about those
 * books, individually, in one context layer."*
 *
 * THE PAGE, TOP TO BOTTOM: NEWLY ADDED (a short row: books that arrived and renders that finished, newest first) ·
 * SHELVES (one album tile each: the stack of its covers, its name, its count) · LIBRARY (every book, always --
 * a shelf is a LABEL, so filing a book takes it off nothing). With neither a new book nor a shelf the page is the
 * library alone, exactly as before (Photos: nothing said that is not there).
 *
 * THE TWO ROWS ARE NOT `.railrow.tile`. Every hand on this page that walks the books -- the ladder's anchor, the
 * book view's neighbours, the range under the head, the selection -- asks for `#shelf .railrow.tile`, and a book
 * drawn twice there would be walked twice. So the rows draw their own `.nw-item` / `.album`, and a press on a new
 * book opens the ONE tile the library holds (FrankBookView).
 *
 * WHAT WAS MADE FROM A BOOK comes through ONE SEAM, `window.TTSTVMade` ({recent(entries), of(slug, book)}): the
 * renders and the voices that read them, words looked up before (Z10), an exported EPUB. The host gives it; on the
 * design bench library-bench.js gives fixtures; with neither, only what this page can know honestly is shown --
 * `firstSeen`, the reader's own highlights and notes (the MARGINALIA STORE), a pair's partner, `has_audio`. */
const NEW_ROW_N = 12;                 // "a short row"
let OPEN_SHELF = null;                // the shelf whose page is drawn, or null for the library
function madeSeam() { return (typeof window !== "undefined" && window.TTSTVMade) || null; }

function newlyAdded(entries) {
  const bySlug = new Map((entries || []).map(b => [b.slug, b]));
  const got = new Map();
  const push = (slug, kind, at, what) => {
    const b = bySlug.get(slug); if (!b) return;
    const was = got.get(slug);
    if (!was || at > was.at) got.set(slug, { b, kind, at: at || 0, what: what || "" });
  };
  for (const b of entries || []) { const t = firstSeenAt(b.slug); if (t > 0) push(b.slug, "book", t, ""); }
  const M = madeSeam();
  if (M && typeof M.recent === "function") {
    try { for (const r of (M.recent(entries || []) || [])) if (r && r.slug) push(r.slug, r.kind === "render" ? "render" : "book", Number(r.at) || 0, r.what); } catch (e) {}
  }
  return Array.from(got.values()).sort((a, b) => b.at - a.at).slice(0, NEW_ROW_N);
}
function newlyAddedHTML(entries) {
  const list = newlyAdded(entries);
  if (!list.length) return "";
  return `<section class="libsec lib-new" aria-label="Newly added"><h2 class="libhead">Newly added</h2>` +
    `<div class="libstrip">` + list.map(x =>
      `<button type="button" class="nw-item" data-slug="${esc(x.b.slug)}" data-kind="${x.kind}" aria-label="${esc((x.b.title || x.b.slug) + (x.kind === "render" ? ", newly voiced" : ", newly added"))}">` +
      tileCoverHTML(x.b) + (x.kind === "render" ? `<span class="nw-tag">${esc(x.what || "voiced")}</span>` : "") + `</button>`).join("") +
    `</div></section>`;
}

function shelfBooks(s, entries) {
  const bySlug = new Map((entries || []).map(e => [e.slug, e]));
  return s.books.map(x => bySlug.get(x)).filter(Boolean);
}
function albumHTML(s, entries) {
  const rows = shelfBooks(s, entries);
  const stack = rows.slice(0, 3).reverse().map((b, i, a) => `<span class="al-c" data-i="${a.length - 1 - i}">${tileCoverHTML(b)}</span>`).join("");

// settings.js uses, and the reason for having a file at all.
async function phoneShelfFetchMirror() {
  const d = await getJSON(PHONE_SHELF_ROUTE);
  if (!d) return null;
  const m = phoneShelfNormalise(d);
  if (m.saved > phoneShelf.saved) { phoneShelf = m; renderPhoneShelf(); }
  return m;
}

function phoneQueue(slug) {
  if (!slug || phoneShelf.queue.includes(slug)) return false;
  phoneShelf.queue.push(slug);
  renderPhoneShelf();
  phoneShelfSave();
  return true;
}

function phoneUnqueue(slug) {
  const i = phoneShelf.queue.indexOf(slug);
  if (i < 0) return false;
  phoneShelf.queue.splice(i, 1);
  renderPhoneShelf();
  phoneShelfSave();
  return true;
}

// "a way to forget one": the record goes, the .zip on disk does not -- this
// page has never written a file and does not start by deleting one.
function phoneForget(slug) {
  const before = phoneShelf.sent.length;
  phoneShelf.sent = phoneShelf.sent.filter(e => e.slug !== slug);
  if (phoneShelf.sent.length === before) return false;
  renderPhoneShelf();
  phoneShelfSave();
  note(`Forgot ${slug}. The .zip itself is untouched.`);
  return true;
}

function phoneTitle(slug) {
  const b = (libraryBooks || []).find(x => x.slug === slug);
  return (b && b.title) || slug;
}

function fmtBytes(n) {
  if (!n && n !== 0) return "size unknown";
  const u = ["B", "KB", "MB", "GB"];
  let i = 0, v = Number(n);
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(v < 10 ? 1 : 0)) + " " + u[i];
}

function fmtWhen(ms) {
  const d = new Date(Number(ms) || 0);
  if (!Number.isFinite(d.getTime()) || !ms) return "";
  const M = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const p = n => String(n).padStart(2, "0");
  return `${d.getDate()} ${M[d.getMonth()]} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// The zip studio just wrote, over the same origin studio serves the repo on:
// a HEAD is the only honest way this page can know a size and a date, and it
// asks for `out/<name>`, never for anything under TTS_DATA.
async function zipStat(zipPath) {
  const name = String(zipPath || "").split("/").filter(Boolean).pop();
  const url = name ? api("/out/" + name) : null;
  if (!url) return { bytes: null, at: Date.now() };
  try {
    const res = await fetch(url, { method: "HEAD", cache: "no-store" });
    if (!res.ok) return { bytes: null, at: Date.now() };
    const len = res.headers && res.headers.get && res.headers.get("Content-Length");
    const mod = res.headers && res.headers.get && res.headers.get("Last-Modified");
    const at = mod ? Date.parse(mod) : Date.now();
    return { bytes: len ? Number(len) : null, at: Number.isFinite(at) ? at : Date.now() };
  } catch (e) { return { bytes: null, at: Date.now() }; }
}

async function phoneSend(slug) {
  phoneShelfBusy = { slug, label: "zipping" };
  renderPhoneShelf();
  const r = await postJSON("/phone-send", { slug });
  phoneShelfBusy = null;
  if (!r.ok) {
    const why = (r.body && r.body.error) || ("HTTP " + r.status);
    note(`${phoneTitle(slug)} was not sent: ${why}`);
    renderPhoneShelf();
    return { slug, ok: false, why };
  }
  const stat = await zipStat(r.body.zip);
  const entry = { slug, title: phoneTitle(slug), zip: r.body.zip, copied_to: r.body.copied_to || null,
                  bytes: stat.bytes, at: stat.at };
  phoneShelf.sent = [entry].concat(phoneShelf.sent.filter(e => e.slug !== slug));
  phoneUnqueue(slug);            // saves, and repaints
  return { slug, ok: true, entry };
}

// Sync: everything queued, one at a time and in order. One failure does not
// stop the rest -- each row keeps its own reason.
async function phoneSync() {
  const queued = phoneShelf.queue.slice();
  if (!queued.length) { note("Nothing queued for the phone."); return []; }
  const out = [];
  for (const slug of queued) out.push(await phoneSend(slug));
  const ok = out.filter(r => r.ok);
  const bad = out.filter(r => !r.ok);
  const copied = ok.filter(r => r.entry.copied_to).length;
  // a failure keeps its own words -- studio's, verbatim -- and its book stays
  // queued, so Sync can be pressed again once the bundle has been exported
  const why = bad.length ? ` ${bad.length} not sent: ${bad.map(b => b.slug + " — " + b.why).join("; ")}` : "";
  note(ok.length
    ? `Sent ${ok.length} of ${out.length}. ${copied ? copied + " copied into the synced folder — AirDrop from there." : "No synced folder is configured, so the .zips are in out/ — use Reveal."}${why}`
    : `Nothing was sent.${why}`);
  return out;
}

async function phoneReveal(slug) {
  const r = await postJSON("/phone-reveal", { slug });
  note(r.ok ? `${phoneTitle(slug)}: selected in Finder — share it from there.`
            : `Couldn't reveal ${phoneTitle(slug)}: ${(r.body && r.body.error) || ("HTTP " + r.status)}`);
  return r;
}

// The picture's day, not a clock: "31 Aug". A book landed on the phone on a
// day; the minute it landed is not something anybody reads a list for.
function fmtDay(ms) {
  const d = new Date(Number(ms) || 0);
  if (!Number.isFinite(d.getTime()) || !ms) return "";
  const M = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return `${d.getDate()} ${M[d.getMonth()]}`;
}

// `18 ch · audio · 212 MB` for a queued book, `24 ch · 31 Aug` for one on the
// phone -- the picture's own lines. Every part is dropped rather than guessed
// when it is not known: a book queued but never sent has no size yet (only
// studio's zip can say), and a book no longer on the shelf has no chapter
// count. Nothing here is estimated.
function phoneRowMeta(slug, kind, entry) {
  const b = (libraryBooks || []).find(x => x.slug === slug) || null;
  const bits = [];
  if (b && b.chapters) bits.push(b.chapters + " ch");
  if (b && b.has_audio) bits.push("audio");
  if (kind === "sent") {
    const when = fmtDay(entry && entry.at);
    if (when) bits.push(when);
    if (entry && !entry.copied_to) bits.push("in out/");
  } else {
    const size = entry && entry.bytes ? fmtBytes(entry.bytes) : null;
    if (size) bits.push(size);
  }
  return bits.join(" \u00b7 ");
}

function phoneRowHTML(slug, kind, entry) {
  const busy = phoneShelfBusy && phoneShelfBusy.slug === slug;
  const title = kind === "sent" ? (entry.title || slug) : phoneTitle(slug);
  const meta = busy ? phoneShelfBusy.label + "…" : phoneRowMeta(slug, kind, entry);
  const b = (libraryBooks || []).find(x => x.slug === slug) || { slug: slug, title: title, author: null };
  return `<div class="phonerow ${kind}${busy ? " busy" : ""}" data-slug="${esc(slug)}">` +
    tileCoverHTML(b) +
    `<span class="phonerow-title">${esc(title)}</span>` +
    `<span class="phonerow-meta">${esc(meta)}</span>` +
    (kind === "sent" ? `<button type="button" class="phonebtn reveal" data-reveal="${esc(slug)}" title="${esc(entry.zip || "")}">Reveal</button>` : "") +
    `<button type="button" class="phonebtn x" data-${kind === "sent" ? "forget" : "unqueue"}="${esc(slug)}"` +
    ` aria-label="${kind === "sent" ? "Forget" : "Remove from the queue"} ${esc(title)}">✕</button></div>`;
}

// What this list is, in one sentence, kept where a pointer can reach it.
const PHONE_IS_A_RECORD =
  "This lists what was sent from here, not what the phone holds. " +
  "Sending exports the book's bundle .zip to your iCloud Drive's \u201cTTS TV\u201d folder, " +
  "where it appears in Files on the phone; no book is ever written into the public IOS-TTS-TV repo.";

// THE PHONE PANEL IS OFF (Osca, 5 Sep: "Get rid of the phone sidebar too").
// One switch, and it is a switch rather than a deletion on purpose: the panel
// is 250px of standing furniture on the Library, which is what he is getting
// rid of, but sending a book to the phone is a feature with a queue, a record
// of what was sent, an iCloud mirror and a set of tests behind it, and none of
// that is what he asked to lose. Flip this to `true` and the panel is back
// exactly as it was. The other door to the same feature is already there and
// unaffected: Actions > Push to Phone in the menu bar.
//
