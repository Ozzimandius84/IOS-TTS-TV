// No "< Reader" button in the header (Osca, 30 Aug). The Library is a place
// you arrive at and leave by opening a book, not a modal you back out of --
// and the browser's own back button already does the one thing that button
// did. `backToReader()` stays: the shelf opens a book through it.

// the sources sheet (phone only; the button is display:none on desktop)
/* The Sources rail, whatever shape it is in (Osca, 30 Aug: `,` opens and
 * closes the side panels, in the reader and here). On a phone it is a sheet
 * and `setSheet` owns it; on a desktop it is a column, and collapsing it is
 * a class plus one remembered bit. Nothing happens when studio is not behind
 * this page -- there is no rail to collapse and the key should not pretend
 * otherwise. */
const NARROW = "(max-width: 640px), (max-height: 500px)";
function toggleSources() {
  const bar = document.getElementById("sources");
  if (!bar || bar.hidden) return;
  if (window.matchMedia && window.matchMedia(NARROW).matches) { setSheet(!SHEET_OPEN); return; }
  // not remembered -- see the block under this function
  bar.classList.toggle("srcCollapsed");
  pushHostContext();
}
/* SOURCES IS SHUT WHEN THE LIBRARY OPENS, ALWAYS (Osca, 5 Sep: "I need the
 * source sidebar in library, not to be there on startup, only when I open it
 * with `,`"). It used to restore whatever it was last left as, out of
 * `librarySourcesCollapsed`. It no longer restores anything: the Library
 * opens as the shelf and nothing else, and the rail is one keystroke away
 * whenever it is wanted -- `,` is already the `sidebar` hotkey's first
 * binding (prefs.js: defs [",", Cmd+Shift+S]) and already reaches
 * `toggleSources()` here, so no key was added for this.
 *
 * The remembered bit is not just ignored, it is REMOVED -- a value that is
 * written and never read is a trap for the next person, who will reasonably
 * assume it does something. `toggleSources()` stops writing it too. */
try { localStorage.removeItem("librarySourcesCollapsed"); } catch (e) { /* private browsing */ }
document.getElementById("sources").classList.add("srcCollapsed");

/* ================================================= INLINE SEARCH (Osca, 3
 * Sep: "in the frank app itself... just placement of the search bar and
 * the drop down... just need it to HAVE/SHOW results"). Same /search
 * tools/search/serve.py already answers for search.html and pipeline.html,
 * called cross-origin -- a different process, a different port, so
 * serve.py now sends Access-Control-Allow-Origin: * for exactly this.
 * Picking a result is the "push": it hands the same title/author to
 * pipeline.html, which reads them off its own URL and re-runs the search
 * there, so the fuller table picks up where this dropdown left off rather
 * than starting over. The bar is a sibling of `.shell`, not inside `#shelf`
 * -- this page rewrites that wholesale on every ingest/shelf change, which
 * would blow away whatever was typed (studio's own `#shelf` taught this
 * lesson first, same day). */
// Search, Peek, Fetch and Parse are all served by studio itself now --
// the same already-running process Frank auto-launches for everything
// else -- so this is same-origin via `api()`, exactly like every other
// route on this page (§ postJSON/getJSON above). No separate server to
// start by hand any more (Osca, 4 Sep: "search should just be live in
// the app"). The one piece that still needs the standalone
// `tools/search/.venv` process is Attach (forced alignment, needs
// torch) inside pipeline.html -- studio's own venv is bare pytest by
// design, so that one route answers a clean error there instead.
let librarySearchToken = 0; // an older in-flight search must not clobber a newer one's dropdown
let lastSearchCandidates = []; // raw candidate dicts from the last /search, for "Parse" (stage_for_ingest wants the whole thing)

function escapeHtmlSearch(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
}

/* What the source itself said about heft, on the row -- so "which of these
 * nine Pensees is the actual book" is answerable by looking (Osca, 4 Sep:
 * "the size of the file"). A stub is called one here rather than left to be
 * discovered after a download. Sources that state no size say nothing,
 * which is honest: unknown is not the same as small. */
function sizeNote(c) {
  if (!c || !c.size_bytes) return "";
  const label = fileSizeLabel(c.size_bytes);
  if (!label) return "";
  return ' \u00b7 ' + label + (c.size_bytes < 20000 ? " (looks like a stub)" : "");
}

/* Why a source is missing from these results (Osca, 4 Sep: "I'm getting no
 * gutenberg results"). The server has always returned this -- run_search_
 * with_report's per-adapter {count, error}, built precisely so "found
 * nothing" and "failed" could be told apart -- and this page threw it away,
 * so a source that was simply DOWN looked exactly like a source with
 * nothing to offer. Both are now said out loud, and a source whose hits
 * were all filtered out is a third, different line. */
function adapterNote(adapters, kept, droppedCount) {
  if (!adapters) return "";
  const keptBySource = {};
  (kept || []).forEach(c => { keptBySource[c.source] = (keptBySource[c.source] || 0) + 1; });
  const failed = [], filtered = [];
  Object.keys(adapters).forEach(name => {
    const a = adapters[name] || {};
    if (a.error) { failed.push(name + " \u2014 " + shortErr(a.error)); return; }
    // A source that swallowed its own failure and returned nothing. Every
    // adapter does that by design (one dead source must not sink the rest),
    // so `error` stays null and the reason lives only in what it logged --
    // which the server now hands over. Without this, a source that was DOWN
    // read exactly like one with nothing to offer, which is the confusion
    // this whole line exists to end.
    if (!a.count) {
      const why = whyEmpty(a.log);
      if (why) { failed.push(name + " \u2014 " + shortErr(why)); return; }
    }
    if (a.count > 0 && !keptBySource[name]) filtered.push(name + " (" + a.count + ")");
  });
  let out = "";
  if (failed.length) {
    out += '<div class="snote serror">Couldn\'t reach: ' + escapeHtmlSearch(failed.join("; "))
        + '. Those sources are missing from these results \u2014 it\'s them, not you.</div>';
  }
  if (filtered.length) {
    out += '<div class="snote">Set aside as not this book: '
        + escapeHtmlSearch(filtered.join(", ")) + '.</div>';
  }
  return out;
}

/* The last line an adapter logged that reads like a failure rather than a
 * remark. Adapters log plenty that is not trouble -- "3 from the local
 * catalogue", gutendex's standing robots.txt note -- and printing those as
 * reasons a source is missing would be worse than saying nothing. */
const _TROUBLE = /error|timed out|timeout|refused|failed|unavailable|not found/i;
function whyEmpty(lines) {
  if (!Array.isArray(lines)) return null;
  for (let i = lines.length - 1; i >= 0; i--) {
    if (_TROUBLE.test(lines[i])) return String(lines[i]).replace(/^search\.[a-z]+:\s*/i, "");
  }
  return null;
}

/* Server-side error strings are exception reprs ("HTTPError: HTTP Error 503:
 * Service Unavailable"); a row of the dropdown has room for the gist. */
function shortErr(e) {
  const s = String(e).replace(/^[A-Za-z]+Error:\s*/, "");
  return s.length > 70 ? s.slice(0, 68) + "\u2026" : s;
}

/* THE SEARCH, WITH NO BAR AROUND IT.
 *
 * This was `runLibrarySearch()`: it read two input boxes, drew its own
 * dropdown, and wired the clicks. The boxes and the dropdown are the window's
 * now (`reader/askbar.js`), so what is left is the half that was always this
 * page's -- the request, the candidate list it must remember for staging, and
 * the note about which sources were unreachable.
 *
 * It RETURNS what it found rather than painting it. `notes` is `adapterNote`'s
 * own html, unchanged and still pinned by its own tests: the bar draws it at
 * the foot of the list, where the dropdown used to.
 *
 * `error` is a sentence, never a thrown thing. Three failures reach a person
 * here and they are not the same: no studio behind the page, a request that
 * did not answer, and a search that answered with a complaint. Each says which.
 */
async function librarySearch(title, author) {
  title = String(title || "").trim();
  author = String(author || "").trim();
  if (!title) return { candidates: [], notes: "", error: "Type a title first." };
  const myToken = ++librarySearchToken;
  const q = new URLSearchParams({ title });
  if (author) q.set("author", author);
  const searchUrl = api("/search?" + q.toString());
  if (!searchUrl) {
    return { candidates: [], notes: "",
             error: "Search needs studio behind this page -- open the Library from the app, not as a static file." };
  }
  let data;
  try {
    const res = await fetch(searchUrl);
    data = await res.json();
  } catch (e) {
    if (myToken !== librarySearchToken) return null;   // a newer search owns the list
    // SAY WHICH FAILURE IT WAS. "Couldn't reach the search" was printed for
    // every one of these, including the ones where the search WAS reached and
    // broke -- a request that dies mid-answer and a studio that is not there
    // read the same and are not the same thing to fix (Osca, 4 Sep).
    return { candidates: [], notes: "",
             error: "The search didn't answer -- " + (e && e.message ? e.message : String(e))
                    + ". Studio's own log is scratch/logs/search.log." };
  }
  if (myToken !== librarySearchToken) return null;
  if (data && data.error) return { candidates: [], notes: "", error: String(data.error) };
  const candidates = data.candidates || [];
  // REMEMBERED, because staging wants the whole candidate dict back and the
  // bar only ever hands back a row's identity.
  lastSearchCandidates = candidates;
  return {
    candidates,
    notes: adapterNote(data.adapters, candidates, (data.dropped || []).length),
    error: null,
  };
}

/* ================================ THE BAR'S DOOR INTO THIS PAGE (5 Sep)
 *
 * There is ONE search bar and it is the window's (`desktop/src/tabs.html`,
 * answered by `reader/askbar.js`). This page no longer has one -- but staging
 * a book, parsing it and putting it on the shelf is still THIS page's and only
 * this page's, and so is knowing which files an archive.org item offers. So
 * the bar asks, and this answers. One path onto the shelf, not two.
 *
 * Three verbs, and they are the three questions the bar can ask:
 *
 *   search(title, author)   what is out there  -> {candidates, notes, error}
 *   files(i)                which of this item's files can become a book
 *   take(pick, file?)       do it              -> {status, ...}
 *
 * `take` runs the page's own search again for the same words and then presses
 * the row the person chose -- by its SOURCE AND TITLE, never by an index,
 * because the two searches are two requests and a row's position is not a
 * promise. It is also how a pick made in another tab arrives (below).
 */
window.TTSTVLibrary = {
  search: (title, author) => librarySearch(title, author),

  /* The choose case: an item that ships several files. The bar draws them as
     more rows, because choosing is still choosing -- and `parseableFiles` is
     the same pure rule the old picker used, best first. */
  files(list) { return parseableFiles(list); },

  async take(pick, file) {
    if (!pick || !pick.title) return { status: "error", error: "nothing to take" };
    // A second pass (a file chosen out of a `choose`) already has its
    // candidate remembered from the first, so it does not search again.
    if (!file) {
      const got = await librarySearch(pick.title, pick.author);
      if (!got) return { status: "stale" };
      if (got.error) return { status: "error", error: got.error };
    }
    if (!pick.ctitle) return { status: "error", error: "nothing to take" };
    const i = lastSearchCandidates.findIndex(c =>
      c && c.title === pick.ctitle && (!pick.source || c.source === pick.source));
    if (i < 0) return { status: "error", error: "that book is not in the answer any more" };
    const c = lastSearchCandidates[i];
    // Audio has no parser step to hand off to, so it still opens the fuller
    // Attach tool -- one click away, and reachable from a text result too.
    if (c.kind !== "text" && !file) {
      openInPipeline(pick.title, pick.author || "");
      return { status: "pipeline" };
    }
    return parseSearchResult(i, file);
  },
};

/* ...and the same door from ANOTHER tab, which cannot call into this page:
 * the pick is written to one localStorage key there and read once here. One
 * shot -- it is removed before it is acted on, so a reload can never repeat a
 * parse -- and ignored if it has been sitting for more than a minute, which
 * means it belongs to a press nobody is waiting on any more. */
(function readAskHandoff() {
  const KEY = "ttstv.ask.handoff";
  let pick = null;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { localStorage.removeItem(KEY); pick = JSON.parse(raw); }
  } catch (e) { return; }
  if (!pick || !pick.at || Date.now() - pick.at > 60000) return;
  addEventListener("load", async () => {
    const r = await window.TTSTVLibrary.take(pick);
    if (r && r.error) note(r.error);
  });
})();

function openInPipeline(title, author) {
  const q = new URLSearchParams({ title });
  if (author) q.set("author", author);
  // Same origin, served statically by studio (paths.RUNNER is the repo
  // root) -- so this works with zero separate process, same as /search
  // above. Attach specifically (inside pipeline.html) still wants the
  // standalone tools/search server for its torch dependency; it answers
  // a clean error here otherwise.
  const url = api("/tools/search/pipeline.html?" + q.toString());
  location.href = url || ("tools/search/pipeline.html?" + q.toString());
}

// "I just want to parse it straight away... using the same parser" (Osca,
// 4 Sep): fetches the candidate, copies it into TTS_DATA/sources/search/
// (tools/search/serve.py's new /stage_for_ingest), then hands it to the
// SAME POST /ingest studio/serve.py already runs for a book dropped into
// Sources by hand -- library/library.html's own `ingest()`, unmodified, so
// this book gets every bit of that: the real parser, the grey placeholder
// on the shelf, the progress bar, the poll loop that clears it. A
// `refresh()` first is what makes `sourceByName()` inside `ingest()` able
// to find a file that did not exist a moment ago.
/* What `parser/readers.py` can actually read -- and nothing else.
 *
 * This list used to say epub|txt|pdf, which was wrong in both directions
 * and cost Osca a book: the parser has never read .txt (staging one gave
 * "ValueError: unsupported format: .txt" a step later, 4 Sep, on a
 * Gutenberg Moby Dick), while the whole .html family, which it has always
 * read, was hidden from this picker. `tools/search/serve.py` now imports
 * the set from `parser.readers.SUPPORTED_SUFFIXES` instead of restating it,
 * and `reader/tests/test_search_parse.py` holds THIS list against that one,
 * so the three cannot drift apart again.
 *
 * .txt is back in the list as of the same day, and by the right route: the
 * parser learned to read plain text (`readers.read_text`), rather than this
 * list being widened to hope for it. That is what the arrangement is for --
 * the server half tracked the change on its own, because it imports the set
 * instead of restating it, and this half is held to it by the test. */
const PARSEABLE_SUFFIX = /\.(epub|html?|xhtml|txt|text|pdf)$/i;

/* Best-first, so the top of the list is the right default and a person who
 * does not care can just press Parse.
 *
 * An .epub wins outright: it carries real chapter structure the parser can
 * use rather than infer. Marked-up html is next, then plain text, then .pdf
 * last -- readable, but the most work to get structure out of. Within each
 * family a `_djvu` file is the OCR layer of a scan, the same book but
 * noisier, so it ranks just below its cleaner sibling when an item has
 * both. */
function searchFileRank(name) {
  const n = String(name).toLowerCase();
  const djvu = n.includes("_djvu") ? 1 : 0;
  if (n.endsWith(".epub")) return 0;
  if (n.endsWith(".xhtml") || n.endsWith(".html") || n.endsWith(".htm")) return 2 + djvu;
  if (n.endsWith(".txt") || n.endsWith(".text")) return 4 + djvu;
  if (n.endsWith(".pdf")) return 6;
  return 7;
}

/* The rule, apart from the drawing of it: which of the files an item offers
 * can actually become a book here, best first. Pure over its argument, so
 * the harness can hold a real archive.org file list against it. */
/* The shelf's own convention is MB to one decimal (`normaliseSources`),
 * which reads "0 MB" for the plain-text files this picker mostly lists --
 * a real 193 KB book shown as nothing at all. Under a megabyte, say KB. */
function fileSizeLabel(bytes) {
  const b = Number(bytes);
  if (!isFinite(b) || b <= 0) return "";
  if (b < 1048576) return Math.max(1, Math.round(b / 1024)) + " KB";
  return (Math.round(b / 1048576 * 10) / 10) + " MB";
}

function parseableFiles(files) {
  return (files || [])
    .filter(f => PARSEABLE_SUFFIX.test((f && f.name) || ""))
    .sort((a, b) => searchFileRank(a.name) - searchFileRank(b.name));
}

/* "I want to search and just add to library (parse it) without the audio"
 * (Osca, 4 Sep). An archive.org item is usually several files, and that
 * answer -- `{"status": "choose"}` -- used to be a dead end here.
 *
 * THE PICKER IS NOT DRAWN HERE ANY MORE. Choosing which file is still
 * choosing, and choosing is the bar's; `parseSearchResult` hands the list
 * back and `reader/askbar.js` draws it as more rows, picked with the same
 * arrows and the same return. What stays is the RULE -- `parseableFiles`,
 * pure and best-first, still this page's and still its own tests' -- offered
 * to the bar as `TTSTVLibrary.files`.
 */
/* WHAT HAPPENED, AS AN ANSWER. This took a button and a row and wrote into
 * them; there is no row now, so it returns one of five things and the bar says
 * them where the caret is:
 *
 *   {status:"parsing", title}   staged, ingesting -- the shelf takes it from here
 *   {status:"choose", files}    several files in the item; the bar draws them
 *   {status:"none"}             ...and none of them is one the parser reads
 *   {status:"error", error}     said as a sentence, never thrown
 *   {status:"pipeline"}         audio: handed to the fuller Attach tool
 *
 * The DOING is unchanged and still only here: stage_for_ingest, then the same
 * `ingest()` a book dropped into Sources by hand goes through -- the real
 * parser, the grey placeholder on the shelf, the progress bar, the poll that
 * clears it. `refresh()` first is what lets `sourceByName()` find a file that
 * did not exist a moment ago.
 */
async function parseSearchResult(i, pick) {
  const candidate = lastSearchCandidates[i];
  if (!candidate) return { status: "error", error: "that book is not in the answer any more" };
  const stageUrl = api("/stage_for_ingest");
  if (!stageUrl) {
    return { status: "error",
             error: "Parse needs studio behind this page -- open the Library from the app, not as a static file." };
  }
  const body = pick ? { candidate, file_url: pick.url, file_name: pick.name } : { candidate };
  let data;
  try {
    const res = await fetch(stageUrl, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    data = await res.json();
  } catch (e) {
    return { status: "error", error: "Couldn't reach the parser -- try again in a moment." };
  }
  if (data && data.error) return { status: "error", error: String(data.error) };
  if (data && data.status === "choose") {
    // A pick that comes BACK as "choose" would loop the picker for ever; the
    // staging call resolves a given `file_url` directly, so this only happens
    // if that contract changes. Say so, rather than spin.
    if (pick) return { status: "error", error: "That file couldn't be resolved -- try another one." };
    const usable = parseableFiles(data.files);
    if (!usable.length) return { status: "none", title: candidate.title };
    return { status: "choose", files: usable, title: candidate.title };
  }
  // staged (data.name is a Sources-relative file `ingest()`'s own
  // `sourceByName()` can look up, once `refresh()` has seen it on disk)
  await refresh();
  await ingest(data.name);
  /* THE STRIP SAYS THIS NOW (bar/lanes.js). A sentence here could only ever
     name ONE parse -- five run at once and `/state.job` carries the oldest --
     and it died the moment you left this page, which is the wrong place for
     something that outlives the click that started it. `note()` keeps what it
     is for: errors, and one-off sentences about this page. */
  /* bare, not `window.` -- this page is booted in a DOM stub for its tests
     where `window` is not an alias for the global, and a ReferenceError here
     would take the staging call's promise down with it, silently. */
  try { if (typeof TTSTVLanes !== "undefined") TTSTVLanes.nudge(); } catch (e) { /* no strip */ }
  return { status: "parsing", title: candidate.title };
}

/* ============================================ THE STRIP IS THIS PAGE'S HEADER
 * `desktop/README.md`'s `## Status` -> desktop-headless-chrome entry §6, word
 * for word. In the app the tab strip is the title bar, so this page has no
 * header of its own and pushes what would have been in it.
 *
 * **The guard is on the METHOD, never the object.** `window.TTSTVHost` has
 * existed since long before it could take a context, so an older shell has the
 * object without the call -- and a page that dropped its header on the object
 * alone would be a Library with no chrome at all in that shell. In a plain
 * browser and on the phone `TTSTVHost` does not exist, none of this runs, and
 * the header is exactly what it always was: the test that matters.
 *
 * Note this is a DIFFERENT context from `libraryContext()` / `paintContext()`
 * above, which answer "what machine is this page on". Nothing here decides
 * anything; it only says what the strip should paint. */
function hostTakesContext() {
  return !!(window.TTSTVHost && typeof window.TTSTVHost.setContext === "function");
}

/* Whether the Sources rail is showing, in whichever shape it is in -- the same
 * three cases `toggleSources()` itself resolves, and `false` when there is no
 * bench and the rail is `hidden` (a tool that cannot be lit because there is
 * nothing to light). */
function sourcesOpenNow() {
  const bar = document.getElementById("sources");
  if (!bar || bar.hidden) return false;
  if (window.matchMedia && window.matchMedia(NARROW).matches) return SHEET_OPEN;
  return !bar.classList.contains("srcCollapsed");
}

/* THE 2 PX LINE UNDER THE LIBRARY'S OWN TAB, and only while an ingest is
 * actually running. `pending` holds one entry per ingest; an entry is deleted
 * the moment its book is on the shelf and carries `failed` when it stopped, so
 * "no running entries" is exactly §6's "the moment it ends, stops or fails"
 * and the answer there is `null`, never a zero bar. Several at once average,
 * because the strip has one line and there is one Library tab.
 * `text` is not read by anything -- `null` (§6). */
function ingestProgressNow(now) {
  const rows = Array.from(pending.values()).filter(e => !e.failed);
  if (!rows.length) return null;
  let sum = 0;
  for (const e of rows) {
    const p = ingestProgress(e.job || { phase: "running", step: "parse", started: e.started },
                             ingestLogFor === e.name ? ingestLog : "", now);
    sum += p.fraction;
  }
  return { fraction: sum / rows.length, text: null };
}

/* Pure over this page's own state, so the node tests can drive it with no
 * host: what the strip is told, as an object. */
function hostContextModel(now) {
  return {
    // NO INFO IN THE BAR OUTSIDE TABS AND BUTTONS (Osca, 31 Aug evening) --
    // the Library tab already says Library and the shelf is on the page.
    // `null` is §6's own "nothing here", so no strip, old or new, needs a
    // line changed for this. `shelfCountWord`, which existed only to write
    // the subtitle "· 9 books", goes with it: nothing else read it.
    title: null,
    subtitle: null,
    tools: [
      { id: "sources", glyph: "☰", label: "sources", on: sourcesOpenNow() },
      // AND NO SEARCH ICON. It was here because the strip is the one place
      // on-screen whatever tab is open, and that was the right instinct with
      // the wrong shape: the strip carries the search bar ITSELF now, always
      // open, on every tab. An icon beside it that opened a second search
      // would be the "two controls for one thing" this page's own exhaustion
      // test exists to catch (Osca, 5 Sep).
      // AND NO DESIGN TOOL, for the same reason the header link went: the
      // bench is not part of the app, so the strip does not offer it either.
      // This row is the Library's whole published set now, which is one tool.
    ],
    progress: ingestProgressNow(now),
  };
}

/* At load, whenever the shelf count changes (`renderShelf`), and on every step
 * of an ingest (`paintProgress`, once a second while one runs) -- plus the two
 * things that move the Sources tool's lit state, `setSheet` and
 * `toggleSources`, and `paintContext`, which is what takes the rail away when
 * there is no studio behind this page. */
function pushHostContext(now) {
  if (!hostTakesContext()) return null;
  const ctx = hostContextModel(now);
  try { TTSTVHost.setContext(ctx); } catch (e) { /* an older host, or a closed tab */ }
  return ctx;
}

/* The strip evaluates `window.TTSTVPage && TTSTVPage.tool(id)` in this page
 * when one of the icons it was given is clicked, and knows nothing else about
 * them (§6). One id here, and it is this page's own existing verb. */
window.TTSTVPage = Object.assign(window.TTSTVPage || {}, { tool(id) {
  if (id === "sources") return toggleSources();
} });

/* THE HEADER STAYS (LIBRARY-DESIGN, 26 Sep). It used to go when the host
 * took the context (the Mac's tab strip was the header); now it holds the
 * band, which the Mac wears under its strip like every other host. The two
 * nodes the handlers below bind to are still in it, hidden. */

document.getElementById("sourcesToggle").addEventListener("click", () => setSheet(!SHEET_OPEN));
document.getElementById("sourcesScrim").addEventListener("click", () => setSheet(false));
/* Every key on this page asks settings.js which ACTION a press is, exactly as
 * `reader.html` does (31 Aug, the Hotkeys tab): the tab lists these bindings,
 * so this page must not decide them itself, and a remap has to work here on
 * the next keystroke with no reload. `libHk` is the same alias reader.html
 * uses; `TTSTVSettings` is in the <head> of this page too, so it is always
 * there -- the guard is for the node harness that loads the page bare. */
const libHk = (e, id) => !!(window.TTSTVSettings && TTSTVSettings.hotkeyIs(e, id));

document.addEventListener("keydown", (e) => {
  if (libHk(e, "close") && SHEET_OPEN) { setSheet(false); return; }
  // Not while something is being typed into, and not while a modifier is
  // down -- Cmd+, is the app's Settings and must reach the menu bar.
  const t = e.target;
  const typing = t && (t.isContentEditable
    || /^(input|textarea|select)$/i.test(t.tagName || ""));
  if (!typing && TTSTVSettings && TTSTVSettings.hotkeyWhich(e, "sidebar") === 0) {
    e.preventDefault(); toggleSources();
  }
});

document.getElementById("menu").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]");
  // A disabled row is there to SAY something, not to do it. Real browsers
  // swallow the click; the node harness does not, so the guard is here.
  if (b && (b.disabled || b.getAttribute("aria-disabled") === "true")) { e.preventDefault(); return; }
  if (b) menuAct(b.dataset.act);
});
/* A COVER THAT DOES NOT LOAD LEAVES THE TYPESET ONE STANDING. Six of the
   thirty books have no cover.jpg, and the parser is right not to write them
   one -- so six of these images 404 on every paint, and each must take itself
   off the box rather than sit there as a blank. `error` does not bubble, so
   this listens in the capture phase; it is one listener for the whole
   document, which is what lets `#shelf` be rebuilt from scratch on every
   ingest without anything being re-attached. */
/* MEASURED ONCE, THE FIRST TIME THE PICTURE IS SEEN. A book whose record
   already says something -- yours or this page's own earlier verdict -- is
   never measured again, so this costs nothing on every visit after the first
   and the shelf paints correctly on the FIRST frame rather than showing a bad
   cover and then withdrawing it. `load` does not bubble; capture, as above. */
document.addEventListener("load", (e) => {
  const img = e.target;
  if (!img || !img.classList || !img.classList.contains("covimg")) return;
  const tile = img.closest ? img.closest(".railrow") : null;
  const slug = tile && tile.dataset ? tile.dataset.slug : null;
  if (!slug || (library.covers && library.covers[slug])) return;
  let bands;
  try { bands = coverBands(img); } catch (err) { return; }   // tainted, or no canvas
  if (bands < COVER_LINES_MAX) { setCoverChoice(slug, "source", "measured"); return; }
  // a page of running text, not a cover: ours goes on, and the record says so
  setCoverChoice(slug, "typeset", "measured");
  img.remove();
}, { capture: true });

document.addEventListener("error", (e) => {
  const el = e.target;
  if (el && el.classList && el.classList.contains("covimg")) {
    // a book on this device with no picture: remembered for its version, so
    // the next paint does not ask (placeDeviceBooks reads it)
    const row = el.closest && el.closest('.railrow[data-device="1"]');
    if (row && row.dataset.hash) {
      try { const m = coverFactsMemo(), k = row.dataset.slug + "@" + row.dataset.hash;
            m[k] = Object.assign({}, m[k], { cover: false }); localStorage.setItem(COVER_FACTS_KEY, JSON.stringify(m)); } catch (err) { /* a memo */ }
    }
    el.remove();
  }
  // `{capture: true}`, not a bare `true`: both are the capture phase in a
  // browser, but testkit/minidom.js reads the option off an object and would
  // silently file this as a bubble listener -- which never runs, because
  // `error` does not bubble. The object form is the one both understand.
}, { capture: true });


document.addEventListener("click", (e) => {
  if (!document.getElementById("menu").hidden && !e.target.closest("#menu")) hideMenu();
});
document.addEventListener("keydown", (e) => { if (libHk(e, "close")) hideMenu(); });

// ENTER OPENS THE SELECTION; ESC CLEARS IT. Below the menu's own Escape
// (a menu is over the shelf, so it takes the key first), and never while
// something is being typed into.
document.addEventListener("keydown", (e) => {
  const el = e.target;
  const typing = el && (el.isContentEditable || /^(input|textarea|select)$/i.test(el.tagName || ""));
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (libHk(e, "openBook") && SEL.length) { e.preventDefault(); openSelection(); return; }
  if (libHk(e, "close") && SEL.length && document.getElementById("menu").hidden) {
    e.preventDefault(); selClear();
  }
});

/* The moon/sun toggle -- settings.js's, not this page's. The theme is one
 * stored value for the whole application now (settings.js, "the theme, in
 * public"), so the Library, every Reader tab and the Settings window all
 * paint the same choice, and changing it here reaches them without a reload.
 * What this page keeps is the button. */
const themeBtnEl = document.getElementById("themeBtn");
if (window.TTSTVSettings) TTSTVSettings.mountThemeButton(themeBtnEl);

// The Library registers the worker too, not only reader.html. Two reasons:
// share_target lands a POST on THIS page, and it is the worker that turns
// that POST into an import -- an app whose worker had never registered would
// answer a share with a 405 from the static host. And a phone launched
// straight into the Library (a home-screen link, a shared sheet) must still
// be able to read a book offline afterwards. Registering the same "sw.js"
// twice is a no-op: the browser keeps one registration per scope.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    // The worker is reader/'s and its scope is reader/ (a worker cannot reach
    // above its own folder without a header no static host sends), so this page
    // registers it to keep the shell cached but is NOT itself controlled by it --
    // manifest D1, the worker's home, is the decision that changes that.
    /* ============ THE DESKTOP APP HAS NO USE FOR A WORKER ============
       Osca, 10 September, four times: *"the desktop app is still the old
       one."* Everything was right and had been for days -- dist/ staged fresh
       at every launch, clean/ rebuilt, the binary rebuilt. PROVED by
       elimination: `tauri dev` embeds nothing (grep of the rebuilt binary for
       WORD_SNAP, wordview, zoomTo: zero), so the app reads ../dist off disk,
       and ../dist had the new code. The only thing left between the disk and
       the window was a service worker, and it had been answering with a shell
       it cached days earlier.

       The worker exists to make a PHONE work offline. The desktop app's shell
       is already on the disk it is running from: there is no network for it to
       be offline from, so the worker buys nothing there and costs exactly
       this. So in the app it is not registered -- and, because a registration
       already made outlives the code that made it, any worker already there is
       unregistered and the SHELL caches are dropped.

       What is NOT dropped, deliberately: the book caches (ttstv-book-*) and
       localStorage. His marginalia and every reading position live in
       localStorage, and clearing the app's data to fix a stale shell would
       have cost him those. This costs nothing. */
    // W1 SHELL-WEB: the kind is the gate, not protocol strings.
    const inApp = TTSTVHost.kind === "phone";
    if (inApp) {
      navigator.serviceWorker.getRegistrations()
        .then((rs) => Promise.all(rs.map((r) => r.unregister())))
        .then(() => caches.keys())
        .then((keys) => Promise.all(keys
          .filter((k) => k.indexOf("ttstv-shell") === 0)
          .map((k) => caches.delete(k))))
        .catch(() => {});
      return;
    }
    /* ...AND ASK IT FOR A NEW ONE, EVERY TIME. Osca, 10 Sep, after a full loop
       and a push: *"the desktop app is still the old one."* Everything on disk
       was right; a service worker was answering with the shell it had cached
       days before. register() alone does not re-fetch sw.js once a
       registration exists, and this page is the ONLY one that can ask -- it
       sits outside the worker's scope (a worker's scope is its own folder), so
       it is always served fresh, while every page the worker covers is served
       whatever the worker already has. Without this, a shell that went stale
       could never un-stale itself: the reader would be handed the old
       reader.html forever, including any code meant to fix exactly this. */
    navigator.serviceWorker.register("../reader/sw.js")
      .then((r) => r && r.update())
      .catch((e) => console.warn("[sw] registration failed:", e));
  });
}

// ---- the order: one word, the page's own menu (LIBRARY-DESIGN, 26 Sep);
// and the source line's door to the Sources sheet on the Mac
shelfEl.addEventListener("click", (e) => {
  const btn = e.target.closest("#shelforder");
  if (btn) { e.preventDefault(); e.stopPropagation(); if (document.getElementById("menu").hidden) openOrderMenu(btn); else hideMenu(); return; }
  const door = e.target.closest("[data-sources]");
  if (door) { e.preventDefault(); setSheet(!SHEET_OPEN); }
});

// ---- the zoom: the trackpad pinch, and nothing else (Osca, 10 Sep)
/* AND NO KEYS, WHICH IS A DECISION AND NOT AN OVERSIGHT. The bench zooms on
 * `+` / `-` (and `[` / `]`) as well as by button, and those two would be four
 * lines here. But "every key on this page asks settings.js which ACTION a
 * press is" is the rule twenty lines below, and the Hotkeys tab cannot be
 * honest about a key a page tests by hand -- `settings/tests/test_hotkeys.py`
 * says so in its own name. Two ids in the table, `shelfIn` and `shelfOut`,
 * are what makes the keys legal, and the table is settings/'s: the request is
 * in library/STATUS.md §6. `shelfZoomStep` is written, exported and tested
 * for the day it lands, so that step is one `libHk` line and nothing else.
 */
// cmd/ctrl + wheel is the pinch gesture on a trackpad; take it off the browser.
/* THE MAC / WEB PINCH IS LIVE AND ANCHORED ONCE (ASKS #175, the Stranger 30 Sep: "a trackpad pinch must hold on to
   the book it started on: today each rung re-anchors to whatever cover is under the pointer at that moment ...
   Anchor once, at the first ctrl+wheel of the gesture, and scale live like the phone").
   A GESTURE is a run of ctrl/⌘-wheel events each within MAC_PINCH_GAP_MS of the last. Its FIRST event picks the book
   under the pointer (slug + height fraction) and the point; nothing after that re-picks. Each event multiplies the
   live scale by exp(-deltaY / MAC_PINCH_PX) -- a trackpad's many small deltas and a mouse's one ⌘-notch both --
   and the grid is drawn with the phone's own transform (phonePinchDraw: scale about the point, clamped to the
   ladder's two ends), so the book under the pointer stays under it on every frame. When the wheel goes quiet the
   nearest rung is taken (round of log2 of the scale: a gentle pinch is one rung, a -1 tick is none) and the grid is
   reflowed ONCE with the anchored book seated at the pointer's height, then FLIPped from where it was drawn to where
   it now sits so the eye follows it into its column. If the reflow moved it off the pointer sideways (a column is a
   column), it gets the quiet returning mark. */
const MAC_PINCH_GAP_MS = 250;      // quieter than this between two events: a new gesture
const MAC_PINCH_PX = 100;          // wheel px per e-fold of scale (Chromium's own pinch -> ctrl-wheel mapping)
let macPinch = null;               // {k, t, timer} while a ctrl-wheel gesture runs
function macPinchSettle() {
  const P = phonePinch, m = macPinch; macPinch = null;
  if (!P || !m) { phonePinch = null; return; }
  const g = shelfGridEl();
  const idx = Math.round(phonePinchIdx(P.raw)), z = SHELF_ZOOMS[idx], at = P.at;
  phonePinch = null;
  if (at.slug) shelfPinchKeep = { slug: at.slug, fy: at.fy, x: at.x, y: at.y, t: Date.now() };
  if (!g) { setShelfZoom(z, at); return; }
  const esc = window.CSS && CSS.escape ? CSS.escape(at.slug || "") : (at.slug || "");
  const tile = at.slug ? g.querySelector('.railrow.tile[data-slug="' + esc + '"]') : null;
  const before = tile ? tile.getBoundingClientRect() : null;       // where it is DRAWN (scaled)
  phonePinchClear(g);
  if (z !== shelfZoom()) setShelfZoom(z, at);
  if (!tile || !before || !before.width) return;
  const after = tile.getBoundingClientRect(), G = g.getBoundingClientRect();
  if (!after.width) return;
  const s = before.width / after.width;
  const tx = before.left - (G.left + s * (after.left - G.left)), ty = before.top - (G.top + s * (after.top - G.top));
  if (Math.abs(s - 1) > 0.002 || Math.abs(tx) > 0.5 || Math.abs(ty) > 0.5) {
    g.style.transition = "none"; g.style.transformOrigin = "0 0";
    g.style.transform = "translate(" + tx.toFixed(1) + "px," + ty.toFixed(1) + "px) scale(" + s.toFixed(4) + ")";
    void g.offsetWidth;
    g.style.transition = "transform " + (PHONE_SETTLE_MS + 60) + "ms cubic-bezier(.22,.61,.36,1)";
    g.style.transform = "none";
    setTimeout(() => phonePinchClear(g), PHONE_SETTLE_MS + 80);
  }
  if (at.x < after.left || at.x > after.right || at.y < after.top || at.y > after.bottom) shelfMarkBack(tile, false);
}
shelfEl.addEventListener("wheel", (e) => {
  if (!(e.metaKey || e.ctrlKey)) return;
  e.preventDefault();
  if (phonePinch && !macPinch) return;             // two fingers already hold the grid
  const now = performance.now();
  if (!macPinch || now - macPinch.t > MAC_PINCH_GAP_MS) {
    if (macPinch) { clearTimeout(macPinch.timer); macPinchSettle(); }
    if (!phonePinchStart(e.clientX, e.clientY)) return;
    macPinch = { k: 1, t: now, timer: 0, n: 0 };
  }
  let dy = e.deltaY; if (e.deltaMode === 1) dy *= 16; else if (e.deltaMode === 2) dy *= 400;
  const lo = Math.pow(2, -phonePinch.startIdx), hi = Math.pow(2, SHELF_ZOOMS.length - 1 - phonePinch.startIdx);
  macPinch.k = Math.min(hi, Math.max(lo, macPinch.k * Math.exp(-dy / MAC_PINCH_PX)));   // bounded: no unwinding past an end
  macPinch.t = now; macPinch.n++;
  phonePinchDraw(macPinch.k);
  clearTimeout(macPinch.timer);
  macPinch.timer = setTimeout(macPinchSettle, MAC_PINCH_GAP_MS);
}, { passive: false });

/* ---- the zoom on the PHONE: two fingers on the shelf, and it is Photos'
 * (Osca, 14 Sep, chat 108: "I can't get up to a 16-column view on the phone.
 * We need them on the phone, like Photos has -- the native iOS app").
 *
 * THIS REPLACES THE RATIO STEPPER (G-COVERS, 11 Sep), which took a rung every
 * time the fingers reached 1.25x the span they last stopped at: the ladder
 * jumped a step at a time under a moving hand, drew nothing in between, and
 * never showed a rung the phone's CSS did not name -- and the phone's CSS
 * named FOUR across for `16` and THREE for `8`, which is Osca's complaint
 * exactly. The CSS is fixed above its own comment (library.css, "16: sixteen
 * across"); this is the gesture.
 *
 * PHOTOS' FEEL IS THREE THINGS.
 *   1. LIVE. The grid follows the fingers while they are down -- `transform:
 *      scale()` on `.shelfgrid` and nothing else, so no reflow, no re-render,
 *      no JPEG, 60 Hz from the compositor. The tiles are already whole (THE
 *      LADDER, library.css), so there is nothing to build.
 *   2. SETTLED. On lift, the nearest rung, one short ease (PHONE_SETTLE_MS),
 *      and ONE reflow at the end of it -- `setShelfZoom`, which is the record
 *      and the attribute, as every other caller has it.
 *   3. BOUNDED. A hand that keeps spreading past `1` does not run the grid off
 *      the screen: the continuous rung is clamped to the ladder's two ends and
 *      the scale DRAWN is that clamped rung, so the grid stops where the
 *      ladder stops.
 *
 * THE LADDER IS GEOMETRIC, AND THAT IS THE WHOLE OF THE ARITHMETIC. One rung
 * is one doubling -- 16 -> 8 -> 4 -> 2 -> 1 -- so the rung the fingers are on
 * is `startIdx + log2(scale)`, a real number, and the rung they LEAVE them on
 * is that number rounded. (`1t`, one book with its words, sat between `2` and
 * `1` until ASKS #165 took it off the ladder: 2 -> 1 is one doubling now.) Nothing
 * here knows a column count, so the CSS can change a rung's columns without
 * touching a line of this.
 *
 * A TWO-FINGER TAP IS ONE RUNG OUT (more books, toward 16) -- two fingers
 * down and up inside PHONE_TAP_MS having moved less than PHONE_TAP_SLOP, the
 * gesture that never becomes a pinch. Photos' own two-finger tap steps out.
 *
 * TWO EVENT FAMILIES, ONE STATE. Chromium (the harness) sends touches only;
 * WebKit sends BOTH touches and `gesturestart/change/end` with a ready-made
 * `scale`. The gesture family wins where it exists (`phoneGesture`), because
 * its scale is the web view's own and matches what a finger expects; the
 * touch handlers then only hold the gesture open. The refusal below is
 * unchanged and is still the reason a phone gets this far at all. */
const PHONE_PINCH_RATIO = 1.25;    // retired as the stepper's gate; still exported
const PHONE_SETTLE_MS = 140;       // the ease that lands the nearest rung
const PHONE_TAP_MS = 320;          // two fingers down and up inside this is a tap
const PHONE_TAP_SLOP = 0.06;       // ... having moved the span less than 6%
let phonePinch = null;             // {startIdx, raw, origin} while two fingers are down
let phoneGesture = false;          // WebKit's gesture family has the wheel
let phoneTouchBase = 1, phoneTouchAt = 0, phoneTouchMoved = false;
function pinchSpan(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
function phoneFlag() { return document.documentElement.hasAttribute("data-phone"); }
function shelfGridEl() { return document.querySelector("#shelf .shelfgrid"); }

// the continuous rung under the fingers, clamped to the ladder's two ends
function phonePinchIdx(k) {
  const i = phonePinch.startIdx + Math.log2(Math.max(k, 0.001));
  return Math.min(SHELF_ZOOMS.length - 1, Math.max(0, i));
}

function phonePinchStart(cx, cy) {
  const g = shelfGridEl();
  if (!g) return false;
  const r = g.getBoundingClientRect();
  let i = SHELF_ZOOMS.indexOf(shelfZoom());
  if (i < 0) i = SHELF_ZOOMS.indexOf(SHELF_ZOOM_DEFAULT);
  // the origin is where the fingers are, in the grid's own box, so the book
  // between them stays between them (the pointer rule the Mac's zoom has)
  const at = { x: cx, y: cy };
  let ox = cx, oy = cy;
  /* ASKS #175: the gesture's book, picked ONCE, here. And a pinch that comes back to the same point soon after the
     last one (out, then back in) is the same hand on the same book: a step out can reflow the book into another
     column, and the pointer is then over a neighbour -- the book it began on is kept, and it grows from where it
     now is, so pinching out and back in lands on the book you started with. */
  const K = shelfPinchKeep, fresh = K && Date.now() - K.t < SHELF_PINCH_AGAIN_MS && Math.hypot(K.x - cx, K.y - cy) < 16;
  const kept = fresh ? g.querySelector('.railrow.tile[data-slug="' + (window.CSS && CSS.escape ? CSS.escape(K.slug) : K.slug) + '"]') : null;
  const t0 = kept || shelfTileAt(cx, cy);
  if (t0) {
    const tr = t0.getBoundingClientRect(); at.slug = t0.getAttribute("data-slug");
    at.fy = kept ? K.fy : tr.height ? Math.min(1, Math.max(0, (cy - tr.top) / tr.height)) : 0.5;
    if (kept) { ox = Math.min(tr.right, Math.max(tr.left, cx)); oy = tr.top + at.fy * tr.height; }
  }
  phonePinch = { startIdx: i, raw: 1, origin: (ox - r.left) + "px " + (oy - r.top) + "px", at };
  return true;
}

// transform only: no layout is read and none is written
function phonePinchDraw(k) {
  const g = shelfGridEl();
  if (!phonePinch || !g) return;
  phonePinch.raw = k;
  const s = Math.pow(2, phonePinchIdx(k) - phonePinch.startIdx);
  g.style.transformOrigin = phonePinch.origin;
  g.style.willChange = "transform";
  g.style.transition = "none";
  g.style.transform = "scale(" + s.toFixed(4) + ")";
}

function phonePinchClear(g) {
  if (!g) return;
  g.style.transition = ""; g.style.transform = "";
  g.style.transformOrigin = ""; g.style.willChange = "";
}

// the settle: the nearest rung, one ease, then exactly one reflow
function phonePinchSettle() {
  if (!phonePinch) return;
  const g = shelfGridEl();
  const idx = Math.round(phonePinchIdx(phonePinch.raw));
  const s = Math.pow(2, idx - phonePinch.startIdx), z = SHELF_ZOOMS[idx], at = phonePinch.at;
  phonePinch = null;
  if (!g) { setShelfZoom(z, at); return; }
  if (Math.abs(s - 1) < 0.001 && z === shelfZoom()) { phonePinchClear(g); return; }
  /* the draw above left `transition: none` on the element; setting the
     transition and the transform in one frame would be no animation at all,
     so the layout read between them is what makes the ease happen */
  g.style.transition = "transform " + PHONE_SETTLE_MS + "ms cubic-bezier(.22,.61,.36,1)";
  void g.offsetWidth;
  g.style.transform = "scale(" + s.toFixed(4) + ")";
  /* the anchor is read off the UNSCALED grid (the transform comes off first), so the tile found under the fingers
     is the one the reflow will be measured against -- the one the fingers were on when they came down */
  setTimeout(() => { phonePinchClear(g); setShelfZoom(z, at); }, PHONE_SETTLE_MS + 10);
}

// a two-finger tap: nothing was drawn, so nothing has to be undone
function phonePinchTap() {
  const g = shelfGridEl();
  phonePinch = null;
  phonePinchClear(g);
  shelfZoomStep(-1);
}

shelfEl.addEventListener("touchstart", (e) => {
  const t = e.touches || [];
  if (!phoneFlag() || t.length !== 2) return;
  e.preventDefault();
  phoneTouchBase = Math.max(1, pinchSpan(t));
  phoneTouchAt = Date.now();
  phoneTouchMoved = false;
  if (!phonePinch) phonePinchStart((t[0].clientX + t[1].clientX) / 2, (t[0].clientY + t[1].clientY) / 2);
}, { passive: false });

shelfEl.addEventListener("touchmove", (e) => {
  const t = e.touches || [];
  if (!phonePinch || t.length !== 2) return;
  e.preventDefault();
  const k = pinchSpan(t) / phoneTouchBase;
  if (Math.abs(k - 1) > PHONE_TAP_SLOP) phoneTouchMoved = true;
  if (phoneGesture) return;                 // WebKit's own scale has the wheel
  phonePinchDraw(k);
}, { passive: false });

function phonePinchEnd(e) {
  if (e && e.touches && e.touches.length >= 2) return;
  if (phoneGesture || !phonePinch) return;  // gestureend settles WebKit's
  if (!phoneTouchMoved && Date.now() - phoneTouchAt <= PHONE_TAP_MS
      && e && e.type === "touchend") { phonePinchTap(); return; }
  phonePinchSettle();
}
shelfEl.addEventListener("touchend", phonePinchEnd);
shelfEl.addEventListener("touchcancel", phonePinchEnd);

/* THE REFUSAL IS ON THE WINDOW, NOT ON THE SHELF (13 Sep). WebKit's
   `gesturestart`/`gesturechange` are dispatched on the DOCUMENT's path -- the
   reader refuses them exactly this way and has always worked on Osca's phone
   (`reader/book-nav.js::refusePinch`, bound with a bare `addEventListener`).
   Bound to `shelfEl` the listener never fired, the web view kept its own
   pinch-to-zoom, and the moment it claimed the gesture the page was sent a
   `touchcancel` -- which is `phonePinchEnd`, which nulls `phonePinch`. So the
   ladder walked in Chromium and stood still on the phone.
   SINCE 14 SEP THE REFUSAL ALSO DRIVES: `e.scale` on `gesturechange` is the
   web view's own pinch factor, which is what the fingers mean, and it is read
   only when the gesture began on the shelf (`phonePinch` is set, or the target
   is inside it). Elsewhere on the page it is refused and nothing more. */
function phoneGestureOnShelf(e) {
  const n = e && e.target;
  return !!(n && n.closest && (n.closest("#shelf") || n === shelfEl));
}
addEventListener("gesturestart", (e) => {
  if (!phoneFlag()) return;
  if (e.preventDefault) e.preventDefault();
  if (!phoneGestureOnShelf(e)) return;
  phoneGesture = true;
  if (!phonePinch) phonePinchStart(e.clientX || 0, e.clientY || 0);
}, { passive: false });
addEventListener("gesturechange", (e) => {
  if (!phoneFlag()) return;
  if (e.preventDefault) e.preventDefault();
  if (!phoneGesture || !phonePinch) return;
  phonePinchDraw(e.scale || 1);
}, { passive: false });
addEventListener("gestureend", (e) => {
  if (!phoneFlag()) return;
  if (e.preventDefault) e.preventDefault();
  if (!phoneGesture) return;
  phoneGesture = false;
  if (!phonePinch) return;
  if (!phoneTouchMoved && Date.now() - phoneTouchAt <= PHONE_TAP_MS) { phonePinchTap(); return; }
  phonePinchSettle();
}, { passive: false });

// ---- import: the button, the file input, and a bundle shared into the app
const importInput = document.getElementById("importFile");
shelfEl.addEventListener("click", (e) => {
  if (e.target.closest("#importBtn")) { e.preventDefault(); importInput.click(); }
});
if (importInput) importInput.addEventListener("change", () => {
  const f = importInput.files && importInput.files[0];
  importInput.value = "";                 // so the same file can be picked twice
  if (f) runImport(f);
});


// ---- the context gate, the Settings popover, and the phone shelf (30 Aug)
paintContext();
phoneShelfLoad();
renderPhoneShelf();
if (libraryContext().bench) phoneShelfFetchMirror();

// The shelf's own record: merges, shelves and where he left off. Loaded
// before the first paint (localStorage is synchronous, so the shelf is never
// drawn without its pairs) and reconciled with the SSD's copy after, if there
// is a bench to ask.
libLoad();
// THE SHELF BEFORE THE NETWORK. `shelfCacheRead` is synchronous, so the rows
// are on screen in the same frame the page paints in rather than a second
// later, and `/state` replaces them whole when it answers (SHELF_CACHE_KEY
// above). `libraryBooks` stays null when there is no cache, which is exactly
// what this page did before -- a first-ever open is unchanged.
if (libraryBooks === null) {
  const cached = shelfCacheRead();
  if (cached) libraryBooks = cached;
}
renderShelf();
// Asked once, and only once a bench has actually answered -- at this point in
// the boot `/state` has not, so `bench` is still false in a plain browser and
// the guard here would refuse forever. `refresh()` calls it on the first poll
// that turns `studioLive` true.
let libMirrorAsked = false;
function libMirrorOnce() {
  if (libMirrorAsked || !libraryContext().bench) return null;
  libMirrorAsked = true;
  return libFetchMirror();
}
libMirrorOnce();

/* SETTINGS IS A WINDOW (Osca, 30 Aug evening: "Settings -- hotkey 'Command +
 * ,' should OPEN IN A NEW WINDOW"), which supersedes the popover this page
 * carried for a day. The door is settings.js's `openWindow`, shared with
 * reader.html and with the Mac's own Settings… item, so all three open the
 * SAME window -- and a second ⌘, focuses it rather than opening another,
 * which is the whole reason the window has a name.
 *
 * The gear left the header on 30 Aug; this still binds where an older shell
 * puts a button on the page. */
/* THE WEB BAND'S DOORS (wave 9). Surface opens the ⌘K surface over this page
 * -- `reader/surface.js` mounts `window.SearchSurface` here since the
 * one-script fix above -- and with no surface module falls back to the
 * search page itself, so the press always does something. */
const webSurfaceEl = null;   // the band's Surface door opens it (band.js); nothing here to bind
if (webSurfaceEl) webSurfaceEl.addEventListener("click", () => {
  if (window.SearchSurface && typeof SearchSurface.open === "function") SearchSurface.open("");
  else location.href = "../reader/search.html";
});
const settingsBtnEl = document.getElementById("settingsBtn");
if (settingsBtnEl) settingsBtnEl.addEventListener("click", () => {
  if (window.TTSTVSettings) TTSTVSettings.openWindow(); else location.href = "../settings/settings.html";
});
document.addEventListener("keydown", (e) => {
  if (libHk(e, "settings")) {
    e.preventDefault();
    if (window.TTSTVSettings) TTSTVSettings.openWindow();
    return;
  }
  // ⌘⇧L -- the same one theme the moon button and the Settings window write.
  // The Library binds it because the Library is where the app opens.
  if (libHk(e, "theme")) {
    e.preventDefault();
    if (window.TTSTVSettings) TTSTVSettings.toggleTheme();
  }
});

// Drag a book from the shelf into the phone shelf to queue it. The payload is
// its own MIME type, so a source row dragged onto the shelf (which is an
// ingest) and a book dragged onto the phone shelf can never be confused.
shelfEl.addEventListener("dragstart", (e) => {
  const row = e.target.closest(".railrow");
  if (!row || !e.dataTransfer || row.classList.contains("loading") || !row.dataset.slug) return;
  e.dataTransfer.setData("text/x-ttstv-book", row.dataset.slug);
  e.dataTransfer.effectAllowed = "copy";
});
const phoneEl = document.getElementById("phoneShelf");
for (const type of ["dragenter", "dragover"]) {
  phoneEl.addEventListener(type, (e) => {
    e.preventDefault();
    phoneEl.classList.add("dropping");
    if (e.dataTransfer) e.dataTransfer.dropEffect = "copy";
  });
}
phoneEl.addEventListener("dragleave", () => phoneEl.classList.remove("dropping"));
phoneEl.addEventListener("drop", (e) => {
  e.preventDefault();
  phoneEl.classList.remove("dropping");
  const slug = e.dataTransfer && e.dataTransfer.getData && e.dataTransfer.getData("text/x-ttstv-book");
  if (!slug) { note("Drag a book from the shelf here to queue it for the phone."); return; }
  if (phoneQueue(slug)) note(`${phoneTitle(slug)} is queued for the phone. Sync sends everything queued.`);
  else note(`${phoneTitle(slug)} is already queued.`);
});
phoneEl.addEventListener("click", (e) => {
  const sync = e.target.closest("#syncPhone");
  if (sync) { e.preventDefault(); phoneSync(); return; }
  const un = e.target.closest("[data-unqueue]");
  if (un) { e.preventDefault(); phoneUnqueue(un.dataset.unqueue); return; }
  const rv = e.target.closest("[data-reveal]");
  if (rv) { e.preventDefault(); phoneReveal(rv.dataset.reveal); return; }
  const fg = e.target.closest("[data-forget]");
  if (fg) { e.preventDefault(); phoneForget(fg.dataset.forget); return; }
});

/* The panel's own ×. It is not inside #shelf, so it needs its own listener;
 * dismissal is keyed on the job, so the next re-parse draws again. */
const parsesEl = document.getElementById("parses");
if (parsesEl) parsesEl.addEventListener("click", (e) => {
  const x = e.target.closest('[data-panel="parses"]');
  if (!x) return;
  e.preventDefault();
  closeParses();
});

const reparseEl = document.getElementById("reparse");
if (reparseEl) reparseEl.addEventListener("click", (e) => {
  const x = e.target.closest('[data-panel="reparse"]');
  if (!x) return;
  e.preventDefault();
  reparseDismissed = reparseKey(reparseJob());
  renderReparse();
});

poll();
if (CAN_IMPORT) refreshDevice().then(() => { renderShelf(); return takeSharedBundle(); });
/* ONCE AT LOAD (§6): `renderShelf()` above has already pushed, but only if it
 * ran -- an empty Library that never renders a shelf must still name itself. */
pushHostContext();

// Internal debug hook for the load harness (not a documented API).
window.__LIBRARY_DEBUG__ = {
  get sources() { return sources; }, get books() { return libraryBooks; }, get job() { return job; },
  ingesting, refresh, ingest, menuAct, get menuTarget() { return menuTarget; },
  renderSources, selectSource, sourceState, shelfSlugFor, slugify, srcRowFor,
  // sources is the folder you opened (PROMPTS/reader-library-mock.md §3)
  get sourcesFolder() { return sourcesFolder; }, get localFiles() { return localFiles; },
  pickSourcesFolder, takeLocalFolder, sourcesFolderCard, folderName, folderWhere,
  backToReader, readerTargetSlug, cameFromReader, lastBook, rememberBook,
  pending, ingestProgress, paintProgress, get ingestLog() { return ingestLog; },
  // the re-parse: studio/README.md "three verbs for a bad parse" §6
  reparseReading, reparsePanelHTML, reparseBook, reparseJob, reparseBusyReason, laneJobs,
  renderReparse, syncReparse, get reparseLog() { return reparseLog; },
  parsesPanelHTML, openParses, closeParses,
  CAN_IMPORT, refreshDevice, runImport, forgetBook, takeSharedBundle, deviceSection,
  get deviceBooks() { return deviceBooks; }, get storage() { return storage; },
  get importing() { return importing; }, get importError() { return importError; },
  libraryContext, paintContext, get studioLive() { return studioLive; },
  // the strip is the header (desktop-headless-chrome §6)
  hostTakesContext, hostContextModel, pushHostContext, sourcesOpenNow,
  ingestProgressNow, toggleSources,
  get phoneShelf() { return phoneShelf; }, phoneQueue, phoneUnqueue, phoneForget, phoneSend,
  phoneSync, phoneReveal, renderPhoneShelf, phoneShelfLoad, phoneShelfFetchMirror,
  setPhonePanel, get PHONE_PANEL() { return PHONE_PANEL; },
  fmtBytes, fmtWhen, fmtDay, phoneRowMeta, PHONE_IS_A_RECORD,
  // the shelf as cover tiles, and the cover (PROMPTS/reader-library-mock.md)
  tileHTML, tileRows, tileLine, tileCoverHTML, coverPairing, coverLayout, coverHash,
  assignPairings, pairingFor, coverPairings, COVER_PAIRINGS, COVER_LAYOUTS, coverInitial,
  coverFacts, loadCoverFacts, coverFactsSidecarOnly, bookFirstWords, coverUrl,
  coverChoice, setCoverChoice, coverToggle, coverBands, COVER_LINES_MAX,
  // the shelf: selection, merges, shelves, memory (PROMPTS/library-shelf.md)
  get library() { return library; }, get selection() { return SEL; },
  get libraryWhy() { return libraryWhy; },
  libLoad, libRead, libPatch, libNormalise, libFetchMirror, libWordIds, libHash, bookHashFor,
  shelfEntries, entryTitle, mergeFor, mergeCreate, mergeDelete, mergeSwapOrder, mergeStale,
  shelfCreate, shelfRename, shelfDelete, shelfToggle, shelfAdd, shelfRemove, shelvesFor,
  selSet, selToggle, selExtend, selClear, openSelection, openEntry, readerPairUrl,
  shelfMenuItems, shelfEmptyMenuItems, pickerItems, shelfPickerItems, shelfActionItems, menuItems, renderShelf,
  // the six shelf zooms (design/reader/bench-library.html), and 1 ¶'s pane
  SHELF_ZOOMS, SHELF_ZOOM_DEFAULT, shelfZoom, setShelfZoom, shelfZoomStep, PHONE_PINCH_RATIO,
  PHONE_SETTLE_MS, PHONE_TAP_MS, PHONE_TAP_SLOP, phonePinchIdx, phonePinchStart, phonePinchDraw, phonePinchSettle,
  get phonePinch() { return phonePinch; },
  deviceIsShelf, deviceShelfRow, placeDeviceBooks, bookOpening, bookWordsOnDisk, bookRecordFromDisk, coverFactsFromDisk,
  paintShelfZoom, shelfNearestTile,
  BOOK_VIEW_ZOOM, BOOK_VIEW_CHAPTERS, bookRecords, bookRecordFrom, blurbText, loadBookRecord,
  loadBookBuilt, get bookBuilt() { return bookBuilt; }, bookViewHTML, paintBookViews,
  // the order, and the newly-added band (design/reader/bench-library.html)
  SHELF_ORDERS, SHELF_ORDER_KEYS, SHELF_ORDER_DEFAULT, SHELF_NEW_N, webFootHTML,
  shelfOrder, setShelfOrder, shelfOrdered, shelfFresh, firstSeenAt, noteFirstSeen,
  sortbarHTML, bandHTML, paintShelfOrder,
  margReadRec, margKey, margNormalise, margMerge, margLive, margPrune, margOrder, margSpanIds,
  margColourAt, margStale, margEmpty, margId, margColour, bookmarksFor, bookmarkLabel,
  bookmarkPickerItems, readerUrl,
};
</script>
<!-- THE PHONE BAR, AND IT IS THE READER'S (Osca, 11 Sep, G-CHROME2: *"The
     Library on the phone uses THIS bar, not its own ≡/⚙/☾"*). The same mount
     reader.html runs -- ⚙ · the pill · the mic, at the foot -- told which page
     it is on: here the pill reads "Library", a drag up does nothing and it
     never hides. It returns on its first line without html[data-phone], so
     the Mac's Library gains no bar node (this tag and the <link> are all). Last in <body> because it mounts on
     parse and moves voiceui's mic into its slot if one is ever drawn here. -->
<!-- NO pbar.js: the band is mounted in the header above (see it); on the
     phone band.css fixes it to the foot. pbar's gestures move under band.js
     on Osca's word (band.js's head says so). -->
<script src="../reader/hints.js"></script>
<link rel="stylesheet" href="../reader/tellfrank.css"><script src="../reader/tellfrank.js"></script><!-- Tell Frank (ASKS #134-#136) -->
<script src="../reader/dismiss.js"></script><!-- pinch out / fling out (ASKS #148, #149) -->
<script>
/* THE PHONE'S SHELF HEAD -- its hand (see the markup at the top of <body>). What is on screen, said the way the
   shelf is ordered: opened -> "Opened 2 Apr – 25 May 2026", added -> "Added …", title -> "A – D", author ->
   "Borges – Dickens". Measured off the tiles between the head's foot and the bar's top on every scroll and every
   redraw of the shelf; nothing is stored. The circle opens the shelf's own order menu (openOrderMenu). */
(function () {
  var head = document.getElementById("phhead"), out = document.getElementById("phrange"), btn = document.getElementById("phsort");
  if (!head || !out || !btn) return;
  var phone = function () { return document.documentElement.hasAttribute("data-phone"); };
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function days(a, b) {                       /* Photos' own shape: "27–31 Jul 2026", "2 Apr–25 May 2026", "25 Sep 2025–5 Jan 2026" */
    var x = new Date(Math.min(a, b)), y = new Date(Math.max(a, b));
    var d = function (t, yr) { return t.getDate() + " " + MON[t.getMonth()] + (yr ? " " + t.getFullYear() : ""); };
    if (x.toDateString() === y.toDateString()) return d(y, true);
    if (x.getFullYear() !== y.getFullYear()) return d(x, true) + " – " + d(y, true);
    if (x.getMonth() === y.getMonth()) return x.getDate() + "–" + d(y, true);
    return d(x, false) + " – " + d(y, true);
  }
  function surname(a) { var w = String(a || "").trim().split(/\s+/); return w[w.length - 1] || ""; }
  function span(a, b) { return !a ? "" : a === b ? a : a + " – " + b; }
  function book(slug) { try { return (libraryBooks || []).filter(function (b) { return b.slug === slug; })[0] || null; } catch (e) { return null; } }
  function onScreen() {
    var top = head.getBoundingClientRect().bottom - 24, bot = window.innerHeight;
    var band = document.querySelector(".band"); if (band) { var br = band.getBoundingClientRect(); if (br.height) bot = Math.min(bot, br.top); }
    return [].filter.call(document.querySelectorAll("#shelf .railrow.tile[data-slug]"), function (t) {
      var r = t.getBoundingClientRect(); return r.width > 0 && r.bottom > top && r.top < bot && t.getAttribute("data-slug");
    }).map(function (t) { return t.getAttribute("data-slug"); });
  }
  function say() {
    var s = onScreen(), k = "opened", t = "";
    try { k = shelfOrder(); } catch (e) {}
    if (!s.length) t = "";
    else if (k === "opened" || k === "added" || k === "oldest") {
      var at = s.map(function (x) { try { return k === "opened" ? openedAt(x) : firstSeenAt(x); } catch (e) { return 0; } }).filter(Boolean);
      t = !at.length ? (k === "opened" ? "Not opened yet" : "")
        : (k === "opened" ? "Opened " : "Added ") + days(Math.min.apply(null, at), Math.max.apply(null, at));
    } else if (k === "title") {
      var L = s.map(function (x) { var b = book(x); return String((b && (b.title || b.slug)) || x).replace(/^[^A-Za-z0-9À-ɏ]+/, "").charAt(0).toUpperCase(); }).filter(Boolean);
      t = span(L[0], L[L.length - 1]);
    } else if (k === "author") {
      var A = s.map(function (x) { var b = book(x); return surname(b && b.author); }).filter(Boolean);
      t = span(A[0], A[A.length - 1]);
    }
    if (out.textContent !== t) out.textContent = t;
  }
  var q = 0; function soon() { if (!q) q = requestAnimationFrame(function () { q = 0; say(); }); }
  window.addEventListener("scroll", soon, { passive: true, capture: true });
  window.addEventListener("resize", soon);
  var sh = document.getElementById("shelf"); if (sh && window.MutationObserver) new MutationObserver(soon).observe(sh, { childList: true, subtree: true, attributes: true, attributeFilter: ["data-zoom", "data-order"] });
  /* THE ORDER HANGS FROM ITS CIRCLE, as Photos' filter menu does (the Photos Stranger, 29 Sep: it opened as the
     long-press bottom sheet, 650 px away under the floating bar, its third order covered by Search); a second
     press on the circle closes it */
  var menu = document.getElementById("menu");
  btn.addEventListener("click", function (e) {
    e.preventDefault(); e.stopPropagation();
    if (menu && !menu.hidden && menu.classList.contains("menu-head")) { menu.hidden = true; return; }
    try { openOrderMenu(btn); } catch (x) {}
    if (menu) menu.classList.add("menu-head");
    btn.setAttribute("aria-expanded", "true");
  });
  if (menu && window.MutationObserver) new MutationObserver(function () {
    if (menu.hidden) { menu.classList.remove("menu-head"); btn.setAttribute("aria-expanded", "false"); }
  }).observe(menu, { attributes: true, attributeFilter: ["hidden"] });
  document.addEventListener("click", function () { btn.setAttribute("aria-expanded", "false"); setTimeout(soon, 0); });
  /* SELECT (Osca, 29 Sep: "you can keep the select button … just make it nice and small and well proportioned").
     Photos' own: Select turns the shelf into a picking surface -- a tap marks a cover instead of opening it, the
     line under Library counts what is chosen, Select reads Cancel, and a small ⋯ appears beside it with what can be
     done to the chosen books (the shelf's own menu, which already acts on a selection: pair, shelve, remove).
     The marks are the page's one selection (SEL, paintSelection); nothing new is stored. */

 *
 * #169 (Osca, 30 Sep): "book WILL be different shapes there's no way about it, but we DO know that that size is always
 * correct ... cutting the image in the middle and bringing sides/panes/assets closer to the middle".
 * #173 (Osca, 30 Sep): "But maybe not the convesxity thing. BOttom line we need picturees to fit the books without
 * leaving loads of blank space, or it not fitting."  So the convex squeeze (631c43a) is GONE: no picture is ever
 * scaled more one way than the other. Every path below is crops and a uniform scale, nothing else.
 *
 * The slot is always right (88:120 on every rung, rung 1 and the book view, every host). The jacket is whatever shape
 * the source carried. With m = |1 - (jacket aspect / slot aspect)|:
 *
 *   STRAIGHT   m <= 1.5 %  the jacket as it is; the few px it is too long are trimmed off its PLAINER end (or split
 *                          between the ends by how plain each is) -- a uniform cover-crop of at most 1.5 % of its
 *                          length (<= 2 px at 4 across, <= 11 px on rung 1's 713).
 *   CUT        m >  1.5 %  exactly the excess is taken OUT of the middle of the long axis -- the window (or two half
 *                          windows) with the least edge energy, 30-88 % down a tall jacket (clear of the title band
 *                          and the author's foot), the sides of a wide one -- and the two sides brought together and
 *                          cross-faded over 1.5 % so no seam shows. The result is the slot's shape to the pixel.
 *
 * The canvas that comes out is W x round(W / slot) (tall) or round(H * slot) x H (wide), so `object-fit: fill` on it
 * is a uniform scale to within one source pixel (library.css, `.covimg[data-fit]`).
 *
 * COST. Once per (picture, slot aspect), on the picture's own `load`, into a canvas at the picture's own resolution,
 * then a blob: URL the <img> is pointed at. Memoised: every later tile, rung, book-view copy or shelf rebuild with the
 * same picture is swapped to the memo's blob before it loads (a MutationObserver), so a pinch costs nothing.
 * Proof: `coverFit.report()` -- per picture: path, mismatch, what was trimmed or cut (px and % of its length), the cut's
 * detail vs the mean, the output aspect's error vs the slot, page-ground hits on the four edges, ms.

  var memo = new Map();              // key -> Promise while working

 * blank -- but its TYPE did not fit it: the title was clamped with an ellipsis ("The Bucolics and E", "LES MISÉRABL…"),
 * a long author ran off the edge ("ADMINISTRADO"), the first words were always cut mid-sentence, and the big initial

 * the cover's own width, like everything else in the box -- that is the largest (never above the layout's own) at which

 *   * its rectangle lies inside the cover's,

 * cqw). Because every length is `cqw`, the sizes found at one rung hold at every rung, rung 1 and the book view; they are
 * memoised per (layout, title, author) and written onto every copy (the book view's, the filmstrip's, a rebuilt shelf),
