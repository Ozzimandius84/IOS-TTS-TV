<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TTSTV Settings</title>
<link rel="icon" href="../reader/icon-192.png">
<meta name="theme-color" content="#832f2b">
<link rel="manifest" href="../reader/manifest.webmanifest">
<!-- BEFORE THE FIRST PAINT, and that is the whole reason it is up here.
     prefs/prefs.js owns the theme for the entire application (one stored
     value, one owner, every surface subscribing) and applies it at load: a
     window opened after someone chose dark opens dark, rather than opening
     light and correcting itself once the body exists. A <head> script is
     synchronous, so nothing has been painted when the attribute lands. It
     also carries the reading font, which flashed for the same reason. -->
<script src="../prefs/prefs.js"></script>
<!-- THE PHONE'S ONE FLAG (design/phone/, 6 Sep): `html[data-phone]`, set before
     the first paint, is what the phone-only rules in this page's sheet key
     on -- a door, a bar that is not there. The test is the one settings.js
     asks for the Voice group (a coarse pointer and no hover: a phone, not a
     Mac with a trackpad), or ?phone, the design bench's word. Width alone
     will not do: the Mac's Settings window is 560 wide and matches every
     phone media query, and "Mac untouched" means untouched. -->
<script>
(function () {
  try {
    if (/(?:^|[?&])phone(?:[=&]|$)/.test(location.search)
        || (window.matchMedia && matchMedia("(pointer: coarse)").matches && matchMedia("(hover: none)").matches))
      document.documentElement.setAttribute("data-phone", "1");
  } catch (e) { /* no matchMedia: not a phone */ }
})();
</script>
<!-- THIS PAGE'S OWN FORM, and it is the only page that loads it (module-split
     Stage 4, 5 Sep). The tabs, the fields, the Cloud GPU cards, Models,
     Languages, Hotkeys and this window's CSS were the other half of what used
     to be reader/settings.js; they are this surface's, so they live here and
     no other page carries 139 KB it never draws. NOT in the <head> with the
     store above: nothing in it is painted before the body exists, and the
     inline script at the foot of this page is its only caller. -->
<!-- THE APPLICATION'S CHROME, one file for every web surface: the
     scrollbar, and so far nothing else. reader.html, library.html and
     settings.html link this one. studio/studio.html does NOT, though this
     comment said it did until 4 Sep (module-split Stage 2b step 2; the
     manifest's F.2) -- see the head of reader/chrome.css for what that
     costs and whose it is to close. -->
<link rel="stylesheet" href="../reader/chrome.css">
<!-- THIS PAGE LIVES IN settings/ (module-split Stage 2b step 4, 5 Sep),
     beside its own stylesheet AND -- since Stage 4 -- its own form script,
     both named bare; chrome.css, the icon and the manifest are still
     reader/'s and are reached as "../reader/<name>", and the preferences
     store is "../prefs/prefs.js". -->
<link rel="stylesheet" href="settings.css">
</head>
<body>
<!-- NO "< Library" (Osca, 31 Aug: "Inside Settings, I DO NOT need a Library
     button to take me back to the Library. Get rid of that one.")  It was a
     page-navigation control that survived the move from tab to window, and a
     window has no back: this page is what the Settings WINDOW shows, and the
     window's own title bar is its chrome.  Nothing replaces it -- the reader
     closes the window, they do not navigate out of it. -->
<!-- THE FIRST CHILD OF <body>, AND IT IS THE TITLE BAR. `data-tauri-drag-region`
     is what makes the empty part of the row move the window: Tauri hit-tests the
     event's own target, so the attribute on this element drags and the tabs,
     which are <button>s inside it, still click. It is inert in a browser tab and
     in the export, which is exactly right -- there is no window to drag there. -->
<header class="set-titlebar" id="titlebar" data-tauri-drag-region>
  <!-- THE DOOR BACK TO THE LIBRARY, ON THE PHONE ONLY (design/phone/settings.html,
       6 Sep). It does not contradict the note below: on the Mac this page is
       a WINDOW and the door is display:none (settings.css); on the phone it
       is a PAGE, reached from the Library's own door, and a page needs a way
       out. An <a href>, not a <button>: no handler, and a press that
       navigates is its own proof. -->
  <a id="libraryDoor" class="headerLink" href="../library/library.html" aria-label="Library" title="Library">&#8249;</a>
  <!-- settings.js's tab strip lands HERE (the form's `mount`, `tabsInto`), not at the top
       of the panel: the picture puts the six icons in the title bar. Nothing
       else is in this row -- the moon went with the Theme setting (31 Aug). -->
</header>

<main>
  <!-- NO SECTION AROUND THE FORM. Every setting is a row inside a grouped
       card now (settings.js `.set-card`), with a small-caps heading above
       each card, so one more box around all of them was the page drawing a
       border it had nothing to separate. The tab strip is in the title bar;
       what is left here is the panels, the preview and #status. -->
  <div id="fields"></div>

  <!-- The preview belongs to the Reading tab and is shown with it: it is a
       paragraph of a book set in the reading font, and under General -- the
       tab about the CHROME's font -- it would be the exact confusion the
       two tabs exist to end. -->
  <div class="preview" id="preview" aria-label="Preview" hidden>
    <p><span class="sent"><span class="word">You,</span> <span class="word">Tityrus,</span>
    <span class="word">&#8217;neath</span> <span class="word">a</span> <span class="word">broad</span>
    <span class="word">beech-canopy</span> <span class="word">reclining,</span> <span class="word">on</span>
    <span class="word">the</span> <span class="word">slender</span> <span class="word">oat</span>
    <span class="word">rehearse</span> <span class="word">your</span> <span class="word">silvan</span>
    <span class="word">ditties.</span></span></p>
    <p>I from my sweet fields, and home&#8217;s familiar bounds, even now depart.</p>
  </div>

  <div id="status" role="status"></div>
</main>

<!-- the store is in the <head>, before the first paint (see the note there);
     the form is this page's own file and is loaded here, right before the one
     script that calls it -->
<!-- voiceui's OWN recogniser adapter, and the ONLY application code from
     another module this page loads. The Voice group's Test button opens one
     listening window and prints what it heard; `voiceui/asr.js` is the
     twenty lines that turn a `SpeechRecognition` into two callbacks, and a
     second copy of them written into `settings.js` would be a second thing to
     keep true about the layer this button exists to prove. It is a plain UMD
     script with no dependencies and no side effects beyond
     `window.VoiceUI.asr` -- it starts nothing, listens to nothing and reaches
     no network. With it absent (an export, an old bundle) Test still opens the
     microphone and says there is nothing to transcribe with. -->
<script src="../voiceui/asr.js"></script>
<!-- THE LIBRARY'S IMPORTER, for the Sync button's pull (job 26, 6 Sep). On a
     phone the Transfer tab's Sync fetches every book Studio has that this
     device lacks, file by file, and stores it through `TTSTVBundle.importFiles`
     -- library/import.js's own store step, the one a dropped zip goes
     through -- so a synced book and a zip-imported book are the same bytes
     in the same cache. It is a shell file already (reader/sw.js SHELL_FILES),
     loaded here as library.html loads reader/context.js and popover.js: a
     leaf of another surface, by name, and the second such seam this page
     carries after voiceui/asr.js. It defines `window.TTSTVBundle` and does
     nothing until asked. On the Mac the Sync press never pulls (its shelf IS
     the library) and the file is 20 KB the window does not use. -->
<script src="../library/import.js"></script>
<!-- The marks' merge (26b): the Drive press on the phone merges its own
     marginalia records with Drive's by the ONE rule -- `margMerge`, by id,
     newest wins, tombstones kept -- and that rule lives in
     reader/marginalia.js (its `window.Marginalia.merge`; the Mac's copy is
     studio/marginalia.py::merge, held equal by studio/tests/test_sync.py).
     A shell file already, loaded here like import.js above: a leaf of
     another surface, by name. It defines `window.Marginalia` and mounts
     nothing until asked. -->
<script src="../reader/marginalia.js"></script>
<!-- Google, and the Drive folder (26b): the sign-in this page presses on a
     phone, the Drive v3 client, the `Frank/` folder and the press. It lives
     in library/ because what it pulls lands in library/import.js's store,
     and it is handed this page's own readers -- it names no key of the
     reader's. `window.TTSTVDrive`, and nothing runs until asked. -->
<script src="../library/drive.js"></script>
<script src="settings.js"></script>
<script>
"use strict";
const S = window.TTSTVSettings;
let current = S.read();

/* NO THEME CONTROL ON THIS PAGE (Osca, 31 Aug: "light/dark setting does not
 * need to be present at all in the settings window"). Light/dark is the
 * strip's toggle and Mod+Shift+L, and the moon that used to sit in this
 * window's corner went with the row. `prefs/prefs.js` still owns the theme for
 * the whole app and `mountThemeButton` is still mounted by the pages that
 * have that button -- this one simply is not one of them any more.
 *
 * What this page does still do is remember the WINDOW it is in -- its size
 * and where it was put -- because nothing outside it can know: a popup's
 * opener is told nothing about it. The guard is the window's own name, so
 * settings.html opened as an ordinary tab records nothing. */
if (window.TTSTVSettings) TTSTVSettings.rememberWindow();

// The form itself is settings/settings.js's -- and since the popovers went (30 Aug,
// Settings became a window) this page is its ONE home, so "do not fork it"
// costs nothing now. It builds the tab strip and every field into #fields,
// writes into this page's own #status, and owns the same save path it always
// did (localStorage + the /reader-settings mirror). `paint` stays a name here
// because the mirror check below is this page's own.
const previewEl = document.getElementById("preview");

/* THE WINDOW'S HEIGHT FOLLOWS THIS TAB, and the measuring moved into
 * the form on 1 Sep (`TTSTVSettings.tabHeight` / `reportHeight`, called
 * from `mount` and from every `showTab`). The version that stood here asked
 * `#status.getBoundingClientRect().bottom` -- a viewport coordinate, off an
 * empty zero-height box -- so the figure it sent was not the height of
 * anything and the window kept its opening 620. The route is unchanged:
 * `TTSTVHost.settingsHeight(h)` -> `invoke("host_settings_height")`, and in
 * a browser tab there is no host and nothing is sent.
 *
 * This page keeps one line of it, because the preview it moves into the
 * Reading panel changes that tab's height AFTER mount has measured it. */
const reportHeight = () => requestAnimationFrame(() => {
  if (window.TTSTVSettings) TTSTVSettings.reportHeight(document.getElementById("fields"));
});

/* THE PHONE'S SHAPE (settings.js `phoneTabs`, and every "no studio" branch):
   the flag the <head> script set -- a real phone by its pointer, or ?phone,
   the design bench's word, so design/phone/settings.html can show it in a
   frame on a Mac. The app never carries a query. */
const PHONE = document.documentElement.getAttribute("data-phone") === "1";
const form = S.mount(document.getElementById("fields"), {
  status: document.getElementById("status"),
  phone: PHONE || undefined,
  studio: PHONE ? false : undefined,
  // the six icon tabs go in the window's own bar, not above the panel
  tabsInto: document.getElementById("titlebar"),
  // the preview is a paragraph of a BOOK, so it is shown with the tab about
  // the book's type and with no other. The height is the form's now: it
  // reports on mount and on every showTab, so this hook is furniture again.
  onTab: id => { previewEl.hidden = id !== "reading"; },
});
const paint = s => { current = form.paint(s); return current; };

/* THE PREVIEW SITS INSIDE THE READING PANEL, under Size & spacing and above
 * One word -- where the picture puts it, and where a person changing the size
 * is already looking. It stays this page's element (it is a paragraph of a
 * BOOK, and the form styles no book), so it is moved rather than rebuilt:
 * one insertion, after mount, before the panel's last heading. */
(function placePreview() {
  const panel = form.el.querySelector('.set-panel[data-tab="reading"]');
  if (!panel) return;                       // no Reading tab: nothing to place
  const heads = panel.querySelectorAll(".set-head");
  const last = heads[heads.length - 1];
  if (last) panel.insertBefore(previewEl, last);
  else panel.appendChild(previewEl);
  // Reading is that much taller for having it, and mount measured the tab
  // before this ran -- so say so once, now the page is whole.
  reportHeight();
})();

// Another page (a Reader tab, the Library) may change these too -- the
// subscription is form's, made in mount(), so there is only ever one.

// The mirror wins on load when it is newer than what this device holds --
// the point of having one (the phone and the Mac share the choice).
current = form.current;
S.fetchMirror().then(m => {
  if (!m) return;
  let localSaved = 0;
  try { localSaved = Number(JSON.parse(localStorage.getItem(S.KEY) || "{}").saved) || 0; } catch (e) {}
  if (m.saved > localSaved) paint(m.settings);
});

// Internal debug hook for the load harness (not a documented API).
window.__SETTINGS_DEBUG__ = { get current() { return form.current; }, paint, status: form.status, form };
</script>
</body>
</html>
