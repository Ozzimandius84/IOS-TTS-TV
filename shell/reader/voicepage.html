<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A voice · Frank</title>
<!-- THE VOICE PAGE (ZERO-TO-ONE-FOR-DESIGN Z8 · Z9; DESIGN #197, 1 Oct 2026). One page, two views:
       ?voice=<id>   a voice and every book it has read (a press plays it)
       ?book=<key>   a book and the voices that have read it
     ?state= picks the sample (voicestore.js): voice · none · signedout · use · private · asking · shared · withdrawn ·
     notyours · failed for a voice; book · none · signedout · owner · refused · failed for a book.
     ?phone, ?land, ?web, ?theme=dark|light, ?embed (band.html draws the band over it) -- as every master reads them. -->
<script>
(function () {
  var Q = new URLSearchParams(location.search), R = document.documentElement;
  if (Q.has("phone") || Q.get("host") === "phone") R.setAttribute("data-phone", "1");
  if (Q.has("land")) R.setAttribute("data-land", "");
  if (Q.has("web") || Q.get("host") === "web") R.setAttribute("data-web", "");
  if (Q.get("theme") === "dark" || Q.get("theme") === "light") R.setAttribute("data-theme", Q.get("theme"));
  if (Q.has("embed")) R.setAttribute("data-embed", "");
})();
</script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="band.css">
<link rel="stylesheet" href="tellfrank.css">
<link rel="stylesheet" href="voicepage.css">
</head>
<body>
<div id="bandHost"></div>
<main id="vp"></main>
<script src="band.js"></script>
<script src="tellfrank.js"></script>
<script src="voicestore.js"></script>
<script src="voicepage.js"></script>
<script>
(function () {
  var Q = new URLSearchParams(location.search), st = Q.get("state") || "";
  var book = Q.get("book"), voice = Q.get("voice") || (book ? null : "osca");
  /* the sample states, through the one seam's picker (a wiring lane deletes this block with the samples) */
  if (st === "signedout") FrankVoice.pick("account", "out");
  if (st === "notyours") { voice = "eliot-quartets"; st = "private"; }
  if (book) FrankVoice.pick("book", st || "book"); else FrankVoice.pick("voice", st || "voice");
  if (!document.documentElement.hasAttribute("data-embed") && window.Band && (document.documentElement.hasAttribute("data-web") || document.documentElement.hasAttribute("data-phone"))) Band.mount(document.getElementById("bandHost"), { page: "library" });
  var keep = ["phone", "land", "web", "theme", "embed", "host"].filter(function (k) { return Q.has(k); }).map(function (k) { return "&" + k + (Q.get(k) ? "=" + Q.get(k) : ""); }).join("");
  VoicePage.mount(document.getElementById("vp"), { voice: voice, book: book, state: st === "signedout" ? (book ? "book" : "voice") : st, q: keep });
  document.title = (book ? "Read by" : "A voice") + " · Frank";
})();
</script>
