<!doctype html>
<meta charset="utf-8">
<!-- THE PHONE LAYS THIS PAGE OUT AT ITS OWN WIDTH (design/phone/reader.html,
     6 Sep). Without a viewport meta a WKWebView lays a page out 980 CSS px
     wide and shrinks it -- a Mac window squeezed, which is exactly the thing
     the phone pages exist to end. library.html and settings.html carry the
     same line; the reader had none. Inert in a desktop window. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frank — the shell</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="wheel.css">
<link rel="stylesheet" href="page.css">
<link rel="stylesheet" href="scrub.css">
<link rel="stylesheet" href="pane.css">
<link rel="stylesheet" href="wordpane.css">
<link rel="stylesheet" href="wordview.css">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="pbar.css">
<link rel="stylesheet" href="listen.css">
<link rel="stylesheet" href="marginalia.css">
<link rel="stylesheet" href="surface.css">

<!-- THE TWO ROOTS EVERY SURFACE LOADS BEFORE IT PAINTS (job 15 step 3b).
     keys.js: while the caret is in a field the keyboard belongs to the
     field -- under ?bench this page still has a file picker and the
     tuner's ranges, and the listen keys below are bare.
     prefs/prefs.js: the store, and it must be SYNCHRONOUS and BEFORE
     the body, or a window opened dark opens light and corrects itself
     (prefs/prefs.js's own closing comment). It applies the theme, the
     interface font and the scrollbars by itself; the only thing this
     page asks it for is the hotkey grammar. -->
<script src="../library/host.js"></script>
<script src="keys.js"></script>
<script src="../prefs/prefs.js"></script>
<!-- THE PHONE'S ONE FLAG (design/phone/, 6 Sep): `html[data-phone]`, set before
     the first paint, is what the phone-only rules in this page's sheet key
     on -- a door, a bar that is not there. The test is the one settings.js
     asks for the Voice group (a coarse pointer and no hover: a phone, not a
     Mac with a trackpad), or ?phone, the design bench's word. Width alone
     will not do: the Mac's Settings window is 560 wide and matches every
     phone media query, and "Mac untouched" means untouched. -->
<script>
(function () {
  try {
    if (/(?:^|[?&])phone(?:[=&]|$)/.test(location.search)
        || (window.matchMedia && matchMedia("(pointer: coarse)").matches && matchMedia("(hover: none)").matches))
      document.documentElement.setAttribute("data-phone", "1");
  } catch (e) { /* no matchMedia: not a phone */ }
})();
</script>

<div id="book">
  <div class="readerbox" id="readerbox">
    <div class="pane" id="readerpane"><div class="column" id="readercol"></div></div>
    <div class="runhead" id="readerhead"></div>
    <!-- THE RAIL. Empty on purpose: scrub.js builds its own capsules into
         this host (9 Sep). It used to carry page.js's track and fill. -->
    <div id="readerscrub"></div>
  </div>

  <!-- level 0 of the left stack -- the pane closest to the reader, same
       static element every pass since the tenth has used. Levels 1 and 2
       (a book whose own `structure` runs deeper -- "up the branch, by
       scrolling left") are created lazily by book-nav.js itself, appended
       inside #leftmore below; most books never reach past this one. -->
  <div class="cpane contentsbox" id="contentsbox">
    <div id="contentscol"></div>
    <!-- THE WAY OUT OF THE BOOK IS THE SCROLL, AND THERE IS NO BUTTON
         (Osca, 8 September: *"Remove ... the `.paneexit` 'LEAVE THE BOOK'
         button -- the scroll is the way out now, so there's no separate
         button (its small hitbox is moot once gone)."*).

         WHAT STOOD HERE: `<button class="paneexit" id="leavebook">`, drawn in
         pane 0 alone, calling `nav.closeToLibrary()`. It was the 7 September
         answer to a phone whose only gesture stopped at pane 0 and could go no
         further, so the last step out had to be a control. The gesture reaches
         the library itself now -- one continuous scroll, on the trackpad and
         on the glass alike (book-nav.js, THE SWIPE IS THE WHEEL) -- so the
         button was the second route out, not the only one.

         THERE IS STILL ALWAYS A WAY BACK, and it is the same one function on
         both platforms: `closeToLibrary()`, reached by the push past the
         deepest pane, by a second ArrowLeft there, and by Escape. -->
  </div>
  <div id="leftmore"></div>
</div>

<!-- THE LIBRARY DOOR IS GONE (Osca, 7 September: *"Remove the Library
     button/tab everywhere."*). It was `.barrow` -- a 28px pointer-transparent
     row pinned to the top of the window with one 28x22 anchor at its centre,
     `#librarydoor`, three shelved spines, pointing at the library page. It was
     itself the 6 September replacement for a text link at the foot of the
     bench strip, and it is the last button this page had.

     THE WAY BACK IS THE SCROLL ITSELF, on both platforms (8 Sep): push the
     axis past the deepest contents pane this book has and it goes to the
     library. Nothing else in this page changes: the door was a link and
     nothing read it. -->

<!-- ===================== THE PHONE BAR — the mount ==========================
     pbar.js is the mount (the markup, the gestures, the open-books list)
     and pbar.css the picture; both stood in this page and in shell.css
     until 11 Sep (G-CHROME2), and moved, byte for byte, so that the Library
     can mount the same bar. It still runs HERE, at parse time, after #book
     and before the playback strip's mount below, which reads `#pbar`.
     THE MAC GAINS NOTHING: it returns on its first line without
     `html[data-phone]`. -->
<script src="pbar.js"></script>

<!-- THE TRANSPORT IS LOADED HERE AND NOT WITH THE OTHER ENGINES, and the
     reason is order: the mount below runs at parse time, where the reading
     page's own <script src> block is a hundred lines further down the file
     (Lane A's region, not this one). A bar that mounted before its transport
     existed would return on its first line and the page would carry no bar at
     all -- measured, 7 Sep. transport.js depends on nothing and reads
     window.ReaderControl lazily, so it is safe this early and belongs beside
     the two mounts that are its only callers. -->
<script src="transport.js"></script>

<!-- ...AND FOLLOW WITH IT, FOR THE SAME REASON (13 Sep). The bar below is
     built at parse time and carries FOLLOW's button; `follow.js` depends on
     nothing, reads no global until it is mounted, and answers `off` to every
     door until then -- so it is safe this early and belongs beside the
     transport, which is its only other caller. The ENGINE is mounted much
     further down, where `nav` and the open book exist (THE PAGE FOLLOWS THE
     VOICE). -->
<script src="follow.js"></script>

<!-- ================== THE PLAYBACK BARS — the two mounts ====================
     Osca, 7 September: *"a SEPARATE PLAYBACK bar -- the TTS transport
     (play/pause, scrub the chapter, speed) -- on BOTH platforms. Same shell,
     two distinct bars: the phone's (designed in design/phone/) and the Mac's
     (designed in design/reader/) are NOT based on each other, but they share
     one transport API. Gate the two presentations by the data-phone split in
     the shell, exactly as the nav bar already is."*

     SO THIS BLOCK BUILDS ONE OF TWO BARS AND NEVER BOTH. The flag decides
     which, on the first line, the same way the nav bar's mount above returns
     without it -- a Mac document gains the capsule and no strip, a phone
     document gains the strip and no capsule, and neither ever holds a hidden
     copy of the other. What the two share is `reader/transport.js` and the
     wiring below it: the same five doors (play/pause, the two arcs, the two
     sentence steps, the rail, the speed) said to the same object, so the
     pictures are two and the behaviour is one.

     THE PICTURES ARE reader/shell.css -- `.mplay` for the Mac (a floating
     capsule, quiet until the pointer is near) and `.pplay` for the phone (a
     full-width strip at the foot, 44 everywhere). design/reader/shell.css is
     the master of both; design/reader/bench-playbar.html and
     design/phone/playbar.html are their two contracts.

     NO BAR WITHOUT A VOICE (Osca, 1 September: *"no playback or volume
     control shows when the chapter has no audio -- hide the player when
     there's no master for the chapter"*). `Transport.hasVoice()` is that
     question asked once; `--mplay-when` / `--pplay-when` are the dials that
     answer it differently, and `always` is what the benches measure the
     layout on when the shelf has no rendered chapter to hand.

     THE TWO PHONE BARS HIDE TOGETHER, and this block does not decide when.
     The nav bar owns "away as you read"; the strip WATCHES `#pbar`'s
     `data-shown` and follows it. One observer, no coupling back into the nav
     bar's own code, and `--pplay-autohide: 0` unpicks it so the player can
     stay while the nav bar goes.

     HIDDEN WHILE ZOOMED, on both platforms. The state both bars watch is the
     pinch lane's own, and it is read as a CLASS PAIR -- `.pane.zoomed,
     .column.zoomed` -- never as `#readerpane.zoomed`, which is the name this
     block guessed before the pinch landed. book-nav.js's `writePageZoom` puts
     `.zoomed` on `#readercol` and on its pane together, at every factor above
     1, so a bar goes on the first frame of a pinch and not only once one word
     view has committed. On this page the two reads agree (measured, zoom 2.4:
     all three selectors true); the pair is the one that keeps agreeing
     wherever the reader is mounted under another id. It is a FORCED hide: it beats `--pplay-autohide:
     0`, it beats the peek tap, and nothing brings a bar back until the zoom
     is out -- in that state the page is the control.
     ======================================================================== -->
<script>
(function () {
  "use strict";
  var R = document.documentElement;
  var PHONE = R.hasAttribute("data-phone");
  var T = window.Transport;
  if (!T) return;                      /* transport.js absent: no bar, no throw */

  /* --------------------------------------------------------------- the ink
     One drawing per control, at 20x20, in the stroke language the nav bar's
     three already use. The two arcs carry their seconds as a <text> inside
     the svg, because the seconds are a dial. */
  function svg(inner, fill) {
    return '<svg viewBox="0 0 20 20" aria-hidden="true" fill="' + (fill || "none") + '"'
         + ' stroke="currentColor" stroke-width="1.7" stroke-linecap="round"'
         + ' stroke-linejoin="round">' + inner + '</svg>';
  }
  var ICON = {
    play:  svg('<path d="M6.4 4.2 15.6 10 6.4 15.8z" fill="currentColor" stroke-width="1.4"/>'),
    pause: svg('<path d="M7.4 4.6v10.8M12.6 4.6v10.8" stroke-width="2"/>'),
    prev:  svg('<path d="M14.6 4.8 8.2 10l6.4 5.2z" fill="currentColor" stroke-width="1.3"/>'
             + '<path d="M5.6 4.8v10.4"/>'),
    next:  svg('<path d="M5.4 4.8 11.8 10l-6.4 5.2z" fill="currentColor" stroke-width="1.3"/>'
             + '<path d="M14.4 4.8v10.4"/>'),
    /* ~270 degrees of circle with the gap where the arrowhead goes, so the
       direction is read off the head and not off the sweep */
    back:  svg('<path d="M10 4.6a5.4 5.4 0 1 1-5.4 5.4" stroke-width="1.5"/>'
             + '<path d="M10 1.9 10 7.3 6.6 4.6z" fill="currentColor" stroke="none"/>'
             + '<text class="sec" x="10" y="12.9" text-anchor="middle" font-size="6.4"'
             + ' font-weight="700" fill="currentColor" stroke="none">15</text>'),
    fwd:   svg('<path d="M10 4.6a5.4 5.4 0 1 0 5.4 5.4" stroke-width="1.5"/>'
             + '<path d="M10 1.9 10 7.3 13.4 4.6z" fill="currentColor" stroke="none"/>'
             + '<text class="sec" x="10" y="12.9" text-anchor="middle" font-size="6.4"'
             + ' font-weight="700" fill="currentColor" stroke="none">15</text>'),
    /* FOLLOW: three lines of a page with a caret standing on the middle one.
       Not an eye and not a pin -- what the button does is keep a MARK on the
       line being read, and the same glyph lit or faint is the whole state. */
    follow: svg('<path d="M7.6 5.2h8.8M7.6 10h8.8M7.6 14.8h6"/>'
             + '<path d="M2.9 7.8 5.9 10l-3 2.2z" fill="currentColor" stroke="none"/>'),
    /* FLOAT: a small card standing off the corner of a bigger one. Not a
       window and not an arrow -- what the button does is put ONE WORD in a
       card that stays in front of everything else. */
    float: svg('<rect x="2.6" y="3.4" width="10.6" height="9" rx="1.8"/>'
             + '<rect x="9.4" y="9.2" width="8" height="7.4" rx="1.8" fill="var(--ground)"/>'
             + '<path d="M11.6 12.9h3.6"/>'),
  };
  function num(v) { return String(Math.round(v)); }
  function cssVar(name, fallback) {
    var v = (getComputedStyle(R).getPropertyValue(name) || "").trim();
    return v || fallback;
  }

  /* ------------------------------------------------------------ the markup
     TWO PICTURES, and the DOM says so: the phone's five controls sit in their
     own row under their own rail, the Mac's nine sit in one line. Neither is
     built from the other's template -- writing them as one parameterised
     string is exactly the sharing Osca said not to do. */
  var bar = document.createElement("div");
  var b = function (id, cls, label, ink) {
    return '<button type="button" class="' + cls + '" id="' + id + '"'
         + ' aria-label="' + label + '" title="' + label + '">' + ink + '</button>';
  };
  var P = PHONE ? "pplay" : "mplay";
  var rail = '<input type="range" class="' + P + '-rail" id="' + P + 'rail"'
           + ' min="0" max="1000" step="1" value="0" aria-label="Scrub the chapter">';
  var t0 = '<span class="' + P + '-t left" id="' + P + 't">0:00</span>';
  var t1 = '<span class="' + P + '-t" id="' + P + 'left">0:00</span>';
  /* ★ THE PACE READOUT (Osca, 13 Sep: *"Needs to be a rough wpm play in the
     voice."*). THE SAME SLOT, AND THE BAR STAYS ONE PIECE -- this is the
     element the speed multiplier stood in, the same class, the same id, the
     same `--*-speed` dial that turns it off; what changed is what it SAYS and
     what it WRITES. It says the pace in words a minute, because that is the
     number Settings calls Pace and the one thing stored (`wpm`); it used to
     say a multiple of nothing in particular. A tap is one coarse stop along
     `Transport.PACES` -- 150 200 250 300 350 400 500 600 -- wrapping.
     The Mac has room for the unit and the phone's 44px slot does not, so the
     Mac says "300 wpm" and the phone says "300". Nothing else moves: no
     second control, no second row, no new element on either bar. */
  /* FOLLOW IS THE LAST CONTROL ON BOTH BARS (13 Sep). Osca: *"simple button
     in the playback bar."* It is the only LATCHING control here -- everything
     else is a press that does a thing -- so it sits at the end, off the
     transport cluster, on the Mac and on the phone alike. `aria-pressed` is
     the state for a screen reader; `data-follow` is the same state for the
     sheet, which needs three values and not two (on / held / off). */
  var follow = '<button type="button" class="' + P + '-b ' + P + '-follow" id="' + P + 'follow"'
             + ' aria-label="Follow the voice" title="Follow the voice"'
             + ' aria-pressed="false" data-follow="off">' + ICON.follow + '</button>';
  var speed = '<button type="button" class="' + P + '-speed" id="' + P + 'speed"'
            + ' aria-label="Pace" title="Pace">' + (PHONE ? "300" : "300 wpm") + '</button>';
  /* ★ THE FLOAT IS THE MAC'S AND ONLY THE MAC'S (13 Sep, design/reader/FLOAT.md).
     "The Mac has no PiP limit": the float there is our own always-on-top
     window and every pixel of it is ours. The phone's float is Apple's window
     with Apple's buttons in it (FLOAT.md §1, §2) and is a different road
     entirely. The string below is built once like `follow` and `speed` are,
     and it is appended in the MAC branch alone -- there is no `.pplay-float`
     rule in shell.css and no id for one, so the phone's strip cannot hold a
     hidden copy of it even by accident.

     AND THIS IS WHERE THE READER'S RULE 7 MOVED. reader/README.md: *"The Mac
     page draws no control but the playback capsule"*, and FLOAT.md §6.4 left
     the button's place open -- *"a change to that rule or a menu item. It is
     not drawn until Osca says which."* Osca, 13 Sep, and it is a dated line,
     so it wins: *"a Float button on the Mac reader's play bar."* It is ON the
     capsule, which is the one control the page already draws, so no rule
     moves. It LATCHES like FOLLOW beside it -- `aria-pressed` for a screen
     reader, `data-float` for the sheet -- and it is last, off the transport
     cluster, because the transport cluster is a press that does a thing. */
  var floatb = '<button type="button" class="mplay-b mplay-float" id="mplayfloat"'
             + ' aria-label="Float" title="Float this word"'
             + ' aria-pressed="false" data-float="off">' + ICON.float + '</button>';

  if (PHONE) {
    bar.className = "pplay"; bar.id = "pplay";
    bar.innerHTML =
        '<div class="pplay-scrub">' + t0 + rail + t1 + '</div>'
      + '<div class="pplay-row">'
      +   b("pplayback", "pplay-b", "Back fifteen seconds", ICON.back)
      +   b("pplayprev", "pplay-b", "The sentence before", ICON.prev)
      +   b("pplaygo",   "pplay-b pplay-go", "Play", ICON.play)
      +   b("pplaynext", "pplay-b", "The sentence after", ICON.next)
      +   speed
      +   follow
      + '</div>';
  } else {
    bar.className = "mplay"; bar.id = "mplay";
    bar.innerHTML =
        b("mplayback", "mplay-b", "Back fifteen seconds", ICON.back)
      + b("mplayprev", "mplay-b", "The sentence before", ICON.prev)
      + b("mplaygo",   "mplay-b mplay-go", "Play", ICON.play)
      + b("mplaynext", "mplay-b", "The sentence after", ICON.next)
      + b("mplayfwd",  "mplay-b", "Forward fifteen seconds", ICON.fwd)
      + t0 + rail + t1 + speed + follow + floatb;
  }
  bar.setAttribute("data-shown", "off");
  bar.hidden = true;                    /* until the transport says there is a voice */
  document.body.appendChild(bar);

  var $ = function (id) { return document.getElementById(id); };
  var railEl = $(P + "rail"), tEl = $(P + "t"), leftEl = $(P + "left"),
      goEl = $(P + "go"), speedEl = $(P + "speed"), followEl = $(P + "follow");
  var floatEl = $("mplayfloat");                 /* null on the phone */

  /* ★ THE FLOAT BUTTON. One press opens the panel, the next dismisses it, and
     what it paints is what the panel IS after the press -- the answer Rust
     gives back, never a flag kept here, because the window can also be closed
     by its own X and a second copy of its state would be wrong the moment it
     was. `floatdoor.js` is mounted lazily for the same reason FOLLOW's press
     goes to the module and not to a handle: this bar is built before a book is
     open. With no host there is no panel, so the button never appears at all
     -- a control that cannot do anything is worse than no control. */
  /* ★ WHERE THE READER IS STANDING, for the float's paused tick (14 Sep).
     `book-nav.js` announces every cursor move on `ttstv:cursor` and it
     bubbles, so this is the same fact `cursor.js` already writes down, read
     rather than re-derived. Nothing is computed here and nothing is stored:
     with no float open it is one property write per stepped word. */
  var lastCursor = null;
  addEventListener("ttstv:cursor", function (e) {
    var d = e && e.detail;
    if (d && d.word != null) lastCursor = { chapter: d.chapter, word: d.word };
  });
  var floatDoor = null;
  function floatReady() {
    if (floatDoor) return floatDoor;
    if (!window.FloatDoor) return null;
    var d = FloatDoor.mount({
      slug: (function () { try { return OPEN_BOOK && OPEN_BOOK.slug; } catch (_) { return ""; } })(),
      control: function () { return window.ReaderControl; },
      /* `Transport.system` IS the registered engine, and it is asked for
         rather than held: the system voice is registered further down this
         file, after this bar is built. */
      sysvoice: function () { return window.Transport ? Transport.system : null; },
      cursor: function () { return lastCursor; },
      /* ★ D7b: the book's own data, for unrendered chapters. Asked for, never
         held: OPEN_BOOK changes on every openBook(). */
      book: function () { try { return OPEN_BOOK; } catch (_) { return null; } },
      doors: {
        voiceui: function () { return window.VoiceUI && VoiceUI.instance; },
        transport: function () { return window.Transport; },
        define: function () { window.dispatchEvent(new CustomEvent("ttstv:float-define")); },
        translate: function () { window.dispatchEvent(new CustomEvent("ttstv:float-translate")); },
        /* ★ AND CLOSE REALLY CLOSES (14 Sep). `floatDoor.stop()` stops the
           FEED; it does not take the window down, and nothing else did
           either -- `host.js::floatClose` is `float_cmd "close"`, which is
           the very message that arrives here, and Rust's own `close()` is
           not a command. So the card's X stopped the word and left the card
           on the screen. `host_float` is a toggle and the panel is open
           whenever this arrives, so one call closes it. The paint and
           book-nav are told by `setFloat`, as every road is. */
        close: function () {
          if (floatDoor) floatDoor.stop();
          if (!floatIsOpen) { setFloat(false); return; }
          var H = window.TTSTVHost;
          if (H && typeof H.float === "function") H.float().then(setFloat, function () { setFloat(false); });
          else setFloat(false);
        },
        said: function () {
          var V = window.VoiceUI && VoiceUI.instance;
          return V && typeof V.said === "function" ? V.said() : "";
        },
      },
    });
    floatDoor = d && d.ok ? d : null;
    return floatDoor;
  }
  /* ★ ONE STATE, AND EVERY ROAD SAYS SO (14 Sep, G-FLOATAXIS). There are
     three ways in and out of the float now -- the button, the card's own X,
     and the scroll past the end of the one-word view -- and `book-nav.js`
     needs to know which, because a gesture may not open a window that is
     open (`TTSTVHost.float` is a toggle: it would DISMISS it). So the panel's
     state is written in exactly one place and announced on one event, which
     the axis listens for beside `nav` further down this file. The button's
     own paint is the same subscription and not a second copy. */
  var floatIsOpen = false;
  function setFloat(open) {
    floatIsOpen = open !== false;
    if (floatEl) {
      floatEl.setAttribute("data-float", floatIsOpen ? "on" : "off");
      floatEl.setAttribute("aria-pressed", floatIsOpen ? "true" : "false");
    }
    try {
      window.dispatchEvent(new CustomEvent("ttstv:float-state", { detail: { open: floatIsOpen } }));
    } catch (e) {}
    return floatIsOpen;
  }
  /* ★ THE AXIS'S DOOR. `book-nav.js` calls this when a scroll past the view's
     end has committed, and it OPENS -- never toggles. It resolves to what the
     panel IS, which is what the axis records and what the button paints. */
  window.ReaderFloat = {
    open: function () {
      if (floatIsOpen) return Promise.resolve(true);
      var d = floatReady();
      if (!d) return Promise.resolve(false);
      return d.toggle().then(setFloat, function () { return setFloat(false); });
    },
    isOpen: function () { return floatIsOpen; },
  };
  if (floatEl) {
    if (!window.TTSTVHost || typeof window.TTSTVHost.float !== "function") {
      floatEl.hidden = true;                  /* no panel to open: no button */
    } else {
      floatEl.addEventListener("click", function () {
        var d = floatReady();
        if (!d) return;
        d.toggle().then(setFloat);
      });
    }
  }

  /* -------------------------------------------------------------- the doors
     Every one of them is a call into `Transport`, which guards itself: with no
     book open, no chapter loaded or no `window.ReaderControl` yet, each of
     these is a no-op that returns false rather than a throw. */
  function skip() { return +cssVar(PHONE ? "--pplay-skip" : "--mplay-skip", "15") || 15; }
  $(P + "back").addEventListener("click", function () { T.nudge(-skip()); });
  if ($(P + "fwd")) $(P + "fwd").addEventListener("click", function () { T.nudge(skip()); });
  $(P + "prev").addEventListener("click", function () { T.stepSentence(-1); });
  $(P + "next").addEventListener("click", function () { T.stepSentence(1); });
  /* FOLLOW's press goes to the module and not to a handle: the bar is built
     before a book is open and `follow.js` is mounted after one is, so a button
     that held a handle would hold null for ever. With nothing mounted this is
     a no-op that answers `off`, which is exactly what the button should show. */
  followEl.addEventListener("click", function () {
    if (window.Follow) { Follow.toggle(); repaint(); }
  });
  goEl.addEventListener("click", function () { T.toggle(); });
  /* ★ ONE STORE. The press writes Settings' `wpm` and nothing else; the
     rendered master follows through `playbackRate` inside the same call and
     the system voice re-bases off the store's own subscriber (below). No
     re-render (D7), and POSITION IS SACRED -- nothing here seeks. */
  speedEl.addEventListener("click", function () { T.stepPace(1); });

  /* THE RAIL IS THE ONE CONTROL THAT FIGHTS THE CLOCK. While a finger or a
     pointer is on it, the paint below must not put the thumb back where the
     voice is -- so dragging holds the paint off, and `input` seeks live so
     the highlight moves under the finger rather than after it. */
  var dragging = false;
  function railSeek() { T.seekFraction((+railEl.value || 0) / 1000); }
  railEl.addEventListener("pointerdown", function () { dragging = true; });
  railEl.addEventListener("input", function () { dragging = true; railSeek(); });

     MEASURED at HEAD with real touch (CDP `dispatchTouchEvent`, Chromium
     402x874): a drag along the rail from its left end to its middle moved
     the value to 4/1000 on touchstart and then NOT AT ALL -- 12 touchmoves,
     0 `input` events, the voice left at 0:01 -- while the same drag with a
     mouse went to 763/1000. And WebKit's range answers a finger only on its
     14px thumb, never on the track. So under a finger the rail is a
     position: where the finger is on the rail IS the time, from the first
     touch to the last move, and the range's own touch handling is switched
     off so the two never fight. A mouse keeps the native range. */
  if (PHONE) {
    var scrubId = null;
    var scrubAt = function (x) {
      var r = railEl.getBoundingClientRect(), inset = 7;          /* the thumb's half width */
      var f = r.width > 2 * inset ? (x - r.left - inset) / (r.width - 2 * inset) : 0;
      railEl.value = String(Math.round(Math.max(0, Math.min(1, f)) * 1000));
      railSeek();

       took a finger along the rail as the axis and STOPPED ITS POINTERUP
       (measured at HEAD: 0 pointerups on the rail after a drag along it). */

      bar.addEventListener(t, function (e) { e.stopPropagation(); }, { passive: true });
    });

      if (e.pointerType === "mouse") return;
      scrubId = e.pointerId; dragging = true;
      try { railEl.setPointerCapture(e.pointerId); } catch (_) { /* the finger is captured already */ }

      if (e.pointerId === scrubId) scrubAt(e.clientX);
    });

     (transport.js, "...AND ARMING MOVED THE PAGE"): a bar is here only when
     the chapter on screen has a master, and finding that out no longer throws
     the reader off the title page. The folder is listen.js's own
     `base + "audio/"`, from the book this page actually opened.
     ON THE MAC TOO (Osca, 10 Sep: the Mac still jumped on opening a voiced
     book -- the same `arm()`). This sat inside `if (PHONE)` above until then,
     so the capsule's page registered no folder and `arm()` opened the chapter
     to look, and listen.js's paint scrolled its first sentence in: 976 px on
     the Mac. One question now, asked the same way by both bars. */

     engine; the page owns both, exactly as it does for `voiceFolder` and the
     system voice. `prefs/prefs.js` is in this document's <head>, before first
     paint, so the store is here by the time this line runs.

     THE SECOND HALF IS THE SETTINGS WINDOW. Pace is also the seventh row of
     Settings, and a drag there must reach a playing master as surely as a tap
     on the bar does -- so the store's own subscriber re-applies the rate. The
     system voice's half of the same change is wired where the system voice is
     (THE SYSTEM VOICE, MOUNTED, below): `sys.rebase()`, which speaks the same
     word again. Two engines, one write, and neither is asked to seek. */

    if (!S || !T.pace) return;
    T.pace({ read: function () { return +S.read().wpm; },
             write: function (w) { S.patch({ wpm: w }); } });
    var was = +S.read().wpm;
    S.subscribe(function (st) {
      if (+st.wpm === was) return;
      was = +st.wpm;
      T.applyPace();
    });
  })();

  if (T.voiceFolder) T.voiceFolder(function () {
    var b = null;
    try { b = OPEN_BOOK; } catch (_) { b = null; }   /* declared further down this file */

     silent preview is worth a bar), `always` (the bench, measuring a layout on
     a shelf with nothing rendered).

     chat 70). This read `s.voice` alone, and `state().voice` means A RENDERED
     MASTER -- so on a freshly imported book the system voice spoke out of a
     page with no play button, no pause button and no pace readout, and the
     only control was the same key pressed again. `transport.js`'s own comment
     left it here on purpose (*"`state().system` is the separate fact, and what
     a bar does with it is the bars' lane, not this one"*); this is that lane
     running.

     *"no playback control shows when the chapter has no audio"*, and its
     reason -- written down in shell.css -- is that *"offering to play a
     silence is the regression that rule was written about"*. `state().system`
     is true only when there IS an engine and it HAS words for the chapter on
     screen (`transport.js::speaks()`, every clause load-bearing), so what the
     bar now offers is not a silence: it is a chapter this app reads aloud.
     A chapter with timings and no master and no engine still shows nothing.

    return s.voice || s.system;

  function autohide() {
    if (!PHONE) return true;

  }

    if (!here) { R.removeAttribute("data-pplay"); return; }

       `state().t` and `state().d` both stay 0 and `seekFraction`, `nudge` and
       `stepSentence` all go to `ReaderControl`, which has no master to move.
       So a bar shown for `s.system` alone would read `0:00 / -0:00` under a
       dead scrubber and four arcs that do nothing, which is a bar that lies.
       One attribute; shell.css takes the row down to the three controls that
       DO work while the system voice speaks -- play/pause, pace and FOLLOW.
       `s.voice` and not `!s.system`: the question is whether there is a
       clock, and a master is the only thing that is one. */

       second the clock moves through -- paint() runs ten times a second while
       the voice is playing, and rebuilding an svg at that rate for a picture
       that is already right is the one expensive thing on this strip. */

       above and for the same reason: paint() runs ten times a second while a
       voice plays and the attribute is almost always the one already there. */

    if (!dragging) railEl.value = String(Math.round(s.f * 1000));
    railEl.setAttribute("aria-valuetext", T.fmt(s.t) + " of " + T.fmt(s.d));
    tEl.textContent = T.fmt(s.t);

    /* THE READOUT IS THE STORE, not the element's rate. `s.rate` is what the
       master is playing at this second and voiceui moves it by itself (its
       "slower", its clarify); `s.wpm` is what the reader chose, which is what
       a control showing a setting must say. A page with no store registered
       reports 0 and the readout is left exactly as it is. */
    if (s.wpm && s.wpm !== lastWpm) {
      lastWpm = s.wpm;
      speedEl.textContent = PHONE ? String(Math.round(s.wpm)) : (Math.round(s.wpm) + " wpm");
      speedEl.setAttribute("aria-label", "Pace, " + Math.round(s.wpm) + " words a minute");
      speedEl.setAttribute("title", "Pace");

    var sec = num(skip());
    Array.prototype.forEach.call(bar.querySelectorAll("text.sec"), function (n) {
      if (n.textContent !== sec) n.textContent = sec;
    });
  }
  var repaint = function () { paint(T.state()); };
  T.on(paint);
  /* A PLAY, A PAUSE AND A SEEK ARE THE THREE THINGS THE FLOAT CANNOT WORK OUT
     FOR ITSELF -- its clock runs forward off the last tick, so a jump has to
     be told. `sync` is one `float_feed`, it is refused in Rust when there is
     no panel, and `floatdoor.js` stops its own clock on that refusal; with no
     float open this costs the bar nothing but a property read. */
  var floatWas = null;
  T.on(function (s) {
    /* ITS OWN LAST VALUE, not `lastPlaying`: `paint` is registered first and
       has already moved that one by the time this runs, so reading it would
       compare a thing with itself and this would never fire. */
    if (!floatDoor || !floatDoor.isOpen()) { floatWas = s.playing; return; }
    if (s.playing === floatWas) return;
    floatWas = s.playing;
    floatDoor.sync();
  });

  /* the three things that change the ANSWER without changing the clock: the
     zoom going in or out, the nav bar going away, and a dial being turned on
     the bench (which writes an inline custom property on <html>) */
  /* BOTH ELEMENTS THE ZOOM MARKS, and by class -- `writePageZoom` writes
     `.zoomed` on the column and on its pane together, and this bar asks the
     same pair `zoomed()` asks rather than one id it guessed. */
  /* ...AND ONLY THE ZOOM FLIPPING (G-PHONE step 4, 10 Sep). The pane and the
     column are rewritten far more often than the zoom changes -- scrub.js's
     `.sb-live` on every frame of a scroll, the column on every frame the voice
     plays (the nav bar's own watch measured 371 records in 2.7 s on the
     simulator) -- and each record was a full repaint of this strip: its
     state read, its clock faces written, its rail set. The strip answers the
     zoom going in or out, which is the only thing those classes tell it. */
  var stripZoomed = zoomed();
  function zoomFlip() {
    var z = zoomed();
    if (z === stripZoomed) return;
    stripZoomed = z;
    /* COMING OUT OF THE ZOOM CATCHES FOLLOW UP. While the page is zoomed
       FOLLOW stands down -- book-nav.js's own cursor seat owns the scroller
       there, and two things seating one scroller is the fight follow.js exists
       to end -- so the sentence being spoken when the zoom comes out has
       already had its one decision taken and refused. `kick()` gives it back,
       and the very next tick follows it. */
    if (!z && window.Follow) Follow.kick();
    repaint();
  }
  [document.querySelector(".pane"), document.querySelector(".column")]
    .forEach(function (el) {
      if (el) new MutationObserver(zoomFlip).observe(el, { attributes: true, attributeFilter: ["class"] });
    });
  var nav = document.getElementById("pbar");
  if (nav) new MutationObserver(repaint).observe(nav, { attributes: true, attributeFilter: ["data-shown"] });
  new MutationObserver(repaint).observe(R, { attributes: true, attributeFilter: ["style"] });
  /* #pbar is built by the mount above, which runs before this one; on a Mac
     there is none and this observer is simply never created. */

  window.PlayBar = { el: bar, phone: PHONE, sync: repaint, zoomed: zoomed, zoomFlip: zoomFlip,
                     follow: followEl,
                     pace: speedEl,
                     wanted: function () { return wanted(T.state()); } };
})();
</script>

<script>
/* ============ THE SHELL MUST NOT BE ABLE TO GO STALE ============
   Osca, 10 September, after a full loop and a push: *"the desktop app is still
   the old one... the live app, launched from the terminal, is still the old
   one."* Everything on disk was right -- dist/ freshly staged with the new
   files in it, SHELL_CACHE moved -- and the app still showed yesterday's
   reader, because a SERVICE WORKER was answering for it.

   sw.js is registered by library/library.html with scope reader/, and it does
   the right things once it knows: skipWaiting on install, clients.claim on
   activate. What was missing is the ASKING. A browser only re-fetches sw.js
   when something asks it to, and nothing did -- so a reader opened straight
   into (a desktop window, a home-screen link) kept the worker it had, for as
   long as that profile lived. "Changing SHELL_CACHE IS the eviction" was true
   of the code and not of the app.

   One line, on the page the worker actually serves. It costs a conditional
   request per load and it means a rebuilt shell can never be more than one
   launch behind. */
/* ...AND NOT ONE LAUNCH BEHIND EITHER. The line above said so itself: *"a
   rebuilt shell can never be more than one launch behind."* One launch behind
   IS the bug. `sw.js` calls skipWaiting and clients.claim, so a rebuilt shell
   does take over -- but it takes over AFTER this page has already loaded every
   script from the old cache. So the first launch after a ship shows the old
   build, every time, and only the second shows the new one.

   That is the whole of "the desktop app is still the old one", asked six times
   between 9 and 10 September, and every time the files on disk were correct
   and the answer was that he was looking at a page loaded a moment before the
   new worker arrived. A build you cannot trust on the launch you are looking
   at is a build you cannot check anything in.

   So when a NEW worker takes the wheel, the page reloads, once. `controller`
   is null on a first-ever install -- nothing stale to replace there -- and
   after the reload the new worker is already the controller, so this cannot
   loop. */
if ("serviceWorker" in navigator) {
  const hadWorker = !!navigator.serviceWorker.controller;
  let swapping = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadWorker || swapping) return;
    swapping = true;
    location.reload();
  });
  addEventListener("load", () => {
    navigator.serviceWorker.getRegistration()
      .then(r => r && r.update())
      .catch(() => {});
  });
  /* AND THE PAGE SAYS WHICH SHELL IT IS. `html[data-shell]` is the build
     actually on the screen, straight from the worker serving it -- so "is this
     the new one" stops being a matter of opinion. */
  navigator.serviceWorker.ready.then((reg) => {
    const sw = reg && reg.active;
    if (!sw) return;
    const ch = new MessageChannel();
    ch.port1.onmessage = (e) => {
      if (e.data) document.documentElement.setAttribute("data-shell", String(e.data));
    };
    sw.postMessage({ q: "shell-version" }, [ch.port2]);
  }).catch(() => {});
}
</script>
<script>
/* THE BUILD, ON THE SCREEN (Z1, 10 Sep: "are we even looking at the current
   build?"). `html[data-shell]` above answers only where a service worker
   serves the page, and the desktop app unregisters its worker (53e9137) -- so
   in Frank it was never set, and it was never visible anywhere. This paints
   the commit of the clean/ this page was SERVED from
   (`reader/routes.py::build_stamp`) in the bottom-left corner, small and
   grey: `1.2.8 · a3e0a38` (`1.2.8+2 · <hash>` two commits past Osca's last
   bare-version commit); `· clean/ edited` when clean/ differs from that
   commit; `· from <path>` when it is not the checkout's own clean/. With
   no server (the phone, file://) it falls back to the worker's shell name.
   It sits inside pxread.py's chrome strip (yc > 0.88, xc < 0.045), so it is
   never counted as a second layer, and it takes no pointer. */
function buildStampText(b) {
  if (!b) return "";
  if (!b.head) return "build ?" + (b.served ? " \u00b7 " + b.served : "");
  var v = b.version ? b.version + (b.ahead ? "+" + b.ahead : "") : (b.subject || "").slice(0, 24);
  var t = v + " \u00b7 " + b.head;
  if (b.dirty) t += " \u00b7 clean/ edited";
  if (b.elsewhere) t += " \u00b7 from " + (b.served || "?");
  return t;
}
(function () {
  var el = null, fromServer = false;
  function paint(t) {
    if (!t || !document.body) return;
    if (!el) {
      el = document.createElement("div");
      el.id = "build-stamp";
      el.setAttribute("aria-hidden", "true");
      el.style.cssText = "position:fixed;left:6px;bottom:3px;z-index:2147483647;"
        + "font:10px/1.2 ui-monospace,Menlo,monospace;color:#8a8a8a;opacity:.8;"
        + "pointer-events:none;user-select:none;white-space:nowrap";
      document.body.appendChild(el);
    }

  }
  function fromShell() {
    var v = document.documentElement.getAttribute("data-shell");
    if (v && !fromServer) paint(v);
  }
  new MutationObserver(fromShell).observe(document.documentElement,
    { attributes: true, attributeFilter: ["data-shell"] });

    // W1 SHELL-WEB: `/build-stamp` is a Studio route; skip on a website to
    // avoid a 404.  The shell name (`data-shell`) is still painted if present.
    if (window.TTSTVHost && TTSTVHost.isWeb) { fromShell(); return; }
    fetch("/build-stamp", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (b) { if (b) { fromServer = true; paint(buildStampText(b)); } else fromShell(); })
      .catch(fromShell);
  });
})();
</script>
