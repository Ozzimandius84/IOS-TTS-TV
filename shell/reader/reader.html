<!doctype html>
<meta charset="utf-8">
<!-- THE PHONE LAYS THIS PAGE OUT AT ITS OWN WIDTH (design/phone/reader.html,
     6 Sep). Without a viewport meta a WKWebView lays a page out 980 CSS px
     wide and shrinks it -- a Mac window squeezed, which is exactly the thing
     the phone pages exist to end. library.html and settings.html carry the
     same line; the reader had none. Inert in a desktop window. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frank — the shell</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="wheel.css">
<link rel="stylesheet" href="page.css">
<link rel="stylesheet" href="scrub.css">
<link rel="stylesheet" href="pane.css">
<link rel="stylesheet" href="wordpane.css">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="listen.css">
<link rel="stylesheet" href="marginalia.css">
<link rel="stylesheet" href="surface.css">

<!-- THE TWO ROOTS EVERY SURFACE LOADS BEFORE IT PAINTS (job 15 step 3b).
     keys.js: while the caret is in a field the keyboard belongs to the
     field -- under ?bench this page still has a file picker and the
     tuner's ranges, and the listen keys below are bare.
     prefs/prefs.js: the store, and it must be SYNCHRONOUS and BEFORE
     the body, or a window opened dark opens light and corrects itself
     (prefs/prefs.js's own closing comment). It applies the theme, the
     interface font and the scrollbars by itself; the only thing this
     page asks it for is the hotkey grammar. -->
<script src="keys.js"></script>
<script src="../prefs/prefs.js"></script>
<!-- THE PHONE'S ONE FLAG (design/phone/, 6 Sep): `html[data-phone]`, set before
     the first paint, is what the phone-only rules in this page's sheet key
     on -- a door, a bar that is not there. The test is the one settings.js
     asks for the Voice group (a coarse pointer and no hover: a phone, not a
     Mac with a trackpad), or ?phone, the design bench's word. Width alone
     will not do: the Mac's Settings window is 560 wide and matches every
     phone media query, and "Mac untouched" means untouched. -->
<script>
(function () {
  try {
    if (/(?:^|[?&])phone(?:[=&]|$)/.test(location.search)
        || (window.matchMedia && matchMedia("(pointer: coarse)").matches && matchMedia("(hover: none)").matches))
      document.documentElement.setAttribute("data-phone", "1");
  } catch (e) { /* no matchMedia: not a phone */ }
})();
</script>

<div id="book">
  <div class="readerbox" id="readerbox">
    <div class="pane" id="readerpane"><div class="column" id="readercol"></div></div>
    <div class="runhead" id="readerhead"></div>
    <!-- THE RAIL. Empty on purpose: scrub.js builds its own capsules into
         this host (9 Sep). It used to carry page.js's track and fill. -->
    <div id="readerscrub"></div>
  </div>

  <!-- level 0 of the left stack -- the pane closest to the reader, same
       static element every pass since the tenth has used. Levels 1 and 2
       (a book whose own `structure` runs deeper -- "up the branch, by
       scrolling left") are created lazily by book-nav.js itself, appended
       inside #leftmore below; most books never reach past this one. -->
  <div class="cpane contentsbox" id="contentsbox">
    <div id="contentscol"></div>
    <!-- THE WAY OUT OF THE BOOK IS THE SCROLL, AND THERE IS NO BUTTON
         (Osca, 8 September: *"Remove ... the `.paneexit` 'LEAVE THE BOOK'
         button -- the scroll is the way out now, so there's no separate
         button (its small hitbox is moot once gone)."*).

         WHAT STOOD HERE: `<button class="paneexit" id="leavebook">`, drawn in
         pane 0 alone, calling `nav.closeToLibrary()`. It was the 7 September
         answer to a phone whose only gesture stopped at pane 0 and could go no
         further, so the last step out had to be a control. The gesture reaches
         the library itself now -- one continuous scroll, on the trackpad and
         on the glass alike (book-nav.js, THE SWIPE IS THE WHEEL) -- so the
         button was the second route out, not the only one.

         THERE IS STILL ALWAYS A WAY BACK, and it is the same one function on
         both platforms: `closeToLibrary()`, reached by the push past the
         deepest pane, by a second ArrowLeft there, and by Escape. -->
  </div>
  <div id="leftmore"></div>
</div>

<!-- THE LIBRARY DOOR IS GONE (Osca, 7 September: *"Remove the Library
     button/tab everywhere."*). It was `.barrow` -- a 28px pointer-transparent
     row pinned to the top of the window with one 28x22 anchor at its centre,
     `#librarydoor`, three shelved spines, pointing at the library page. It was
     itself the 6 September replacement for a text link at the foot of the
     bench strip, and it is the last button this page had.

     THE WAY BACK IS THE SCROLL ITSELF, on both platforms (8 Sep): push the
     axis past the deepest contents pane this book has and it goes to the
     library. Nothing else in this page changes: the door was a link and
     nothing read it. -->

<!-- ===================== THE PHONE BAR — the mount ==========================
     Osca, 7 September: *"THE PHONE BAR, its own design ... Replace them with
     ONE phone bar ... Left: <- back to Library. Centre: the book · chapter,
     once. Right: Settings, and the hands-free mic ... the bar auto-hides as
     you read and returns on scroll-up or a tap at the top edge -- like Apple
     Books. Osca dials whether it auto-hides or stays."*

     THE PICTURE IS reader/shell.css (design/reader/shell.css is the master and
     design/phone/bar.html is the contract). This is the hand: the markup the
     bar needs and the one behaviour CSS cannot have -- which way the reader
     just scrolled.

     THE MAC GAINS NOTHING. It returns on the first line unless
     `html[data-phone]` is set, so on a Mac this page's DOM is the same
     document it was before the bar existed -- not a hidden node, no node. Same
     division as the viewport meta and the head script above: the phone's own
     two lines live in this page, and the shell files carry the rules.

     It creates NO second source for anything already on the page. The centre
     mirrors page.css's `.runhead` -- the element page.js keeps current -- and
     the mic is voiceui's own button, MOVED into the bar's slot rather than
     copied, so there is one mic on the page and its state colours still come
     from voiceui. `--pbar-mic: float` moves that same element back.
     ======================================================================== -->
<script>
(function () {
  var R = document.documentElement;
  if (!R.hasAttribute("data-phone")) return;          /* the Mac: no node at all */

  var bar = document.createElement("div");
  bar.className = "pbar"; bar.id = "pbar";
  bar.setAttribute("data-shown", "on");
  /* THE LEFT NO LONGER HOLDS A DOOR TO THE LIBRARY (Osca, 7 September:
     *"Remove the Library button/tab everywhere ... the phone nav bar's
     < Library."*). What was here: `#pbarback`, an <a href> to the library
     page drawn as a left chevron, 44 square, the bar's first child -- and its
     href was that page's path written out a SECOND time, which is why the name
     now appears in this file exactly once, in `LIBRARY_PAGE`, and why
     reader/tests/test_shell_no_benches.py counts it.

     THE EXIT IS THE SCROLL NOW, not a button on a bar that hides itself as
     you read: a one-finger sideways swipe reveals the contents panes, scrolls
     through them, and past the deepest one goes to the library -- the same
     axis the Mac's trackpad pushes (book-nav.js, THE SWIPE IS THE WHEEL).
     Nothing else in this mount moves -- `--pbar-side` is
     measured off the RIGHT group and is unchanged, so the centred title has
     not shifted a pixel; the search door simply becomes the first child. */
  bar.innerHTML =
      /* THE PHONE'S DOOR TO THE SEARCH SURFACE (Osca, 7 Sep: *"THE PHONE BAR
       opens it too. Two bars, one surface."*). It is a BUTTON and not an
       <a href>, and that is the difference between this control and the two
       doors either side of it: the Library and Settings are places you GO,
       and on a phone a place you go is a link; the surface opens OVER what
       you are reading and closes without moving you, so it is not a
       navigation and must not be written as one.
       IT GOES ON THE LEFT, and that is a measurement rather than a taste.
       `--pbar-side` is the inset the centred title is held off BOTH edges by,
       and it was already `pad + 88 + 2*gap` -- the right group's two 44s --
       while the left held one. A second 44 on the left makes the two groups
       the same width, so the title's box is now centred on the bar rather
       than sitting 44px right of centre, and `--pbar-side` did not move.
       ITS OWN REASON OUTLIVED THE LIBRARY DOOR IT WAS MEASURED AGAINST: the
       inset is the RIGHT group's width, so with the left down to this one
       control the title is still centred on the bar and the left is merely
       roomy. Left is where it stays -- a control that opens something over
       the page does not belong in the corner the two doors used. */
      '<button type="button" class="pbar-b pbar-find" id="pbarfind"'
    + ' aria-label="Search" title="Search">'
    +   '<svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor"'
    +   ' stroke-width="1.7" stroke-linecap="round">'
    +   '<circle cx="9" cy="9" r="5.2"/><path d="M12.9 12.9 16.8 16.8"/></svg></button>'
    + '<div class="pbar-title" id="pbartitle"><b></b><span></span></div>'
    + '<div class="pbar-right">'
    +   '<a class="pbar-b pbar-set" id="pbarset" href="../settings/settings.html"'
    +   ' aria-label="Settings" title="Settings">'
    +     '<svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor"'
    +     ' stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="2.7"/>'
    +     '<path d="M10 2.4v2.1M10 15.5v2.1M17.6 10h-2.1M4.5 10H2.4'
    +     'M15.4 4.6l-1.5 1.5M6.1 13.9l-1.5 1.5M15.4 15.4l-1.5-1.5M6.1 6.1L4.6 4.6"/>'
    +   '</svg></a>'
    +   '<span class="pbar-mic" id="pbarmic"></span>'
    + '</div>';
  var peek = document.createElement("div");
  peek.className = "pbar-peek"; peek.id = "pbarpeek";
  document.body.appendChild(bar);
  document.body.appendChild(peek);           /* the peek is the bar's next sibling */

  /* ---------------------------------------------------- the centre, once */
  var src = document.getElementById("readerhead");   /* page.css's .runhead */
  var tb = bar.querySelector(".pbar-title b"), ts = bar.querySelector(".pbar-title span");
  /* ONE SOURCE, AND NOW IT IS THE ONLY ONE. This read `.head`'s `#big`/`#small`
     as a fallback while that block existed; `.head` left the page on 7 Sep
     and the fallback goes with it rather than reading two elements that are
     one element. `.runhead` is page.js's and is kept current on every scroll,
     so an empty string here means the page has not painted yet, which is the
     honest answer and was already what the fallback returned. */
  function title() {
    var b = src && src.querySelector("b"), s = src && src.querySelector("span");
    var t1 = b ? b.textContent : "";
    var t2 = s ? s.textContent : "";
    if (tb.textContent !== t1) tb.textContent = t1;
    if (ts.textContent !== t2) ts.textContent = t2;
  }
  if (src) new MutationObserver(title).observe(src, { childList: true, subtree: true, characterData: true });
  title();

  /* ------------------------------------------------------------- the mic */
  var slot = document.getElementById("pbarmic");
  function mic() {
    var pill = document.querySelector(".voiceui-pill");
    if (!pill) return;
    var want = (getComputedStyle(R).getPropertyValue("--pbar-mic") || "bar").trim();
    var home = (want === "float") ? document.body : slot;
    if (pill.parentNode !== home) home.appendChild(pill);
  }
  new MutationObserver(mic).observe(document.body, { childList: true });

  /* ---------------------------------------- away as you read, back on the
     way up. The reader's scroller is #readerpane; the document is watched too
     so a page that scrolls itself (one word view, a short chapter) is not a
     bar that never moves. A tap on the top edge is the other way back. */
  var pane = document.getElementById("readerpane");
  var last = pane ? pane.scrollTop : 0, tick = false;
  function autohide() {
    var v = (getComputedStyle(R).getPropertyValue("--pbar-autohide") || "1").trim();
    return v !== "0" && v !== "off" && v !== "false";
  }
  /* HIDDEN WHILE ZOOMED (7 Sep, corrected 7 Sep).

     THE MARKER IS THE PINCH LANE'S OWN, AND IT IS A CLASS PAIR, NOT AN ID.
     This asked `#readerpane` for `.zoomed` -- a name guessed while the pinch
     was still being built. What book-nav.js actually writes, in
     `writePageZoom` and at EVERY factor above 1 rather than only at the word,
     is `.zoomed` on the column (`#readercol`, which is where the css `zoom`
     goes) AND on that column's pane. So the question is asked of those two
     classes -- `.pane.zoomed, .column.zoomed` -- and either one answers.

     AND THE HONEST SIZE OF THE FIX, because it is not a bug being closed.
     MEASURED on the master at zoom 2.4 mid-pinch: `.pane.zoomed` true,
     `.column.zoomed` true, `#readerpane.zoomed` ALSO true -- the id happens to
     be on the element that takes one of the two classes, so on this page the
     old read and the new read agreed and the bars were already hiding from the
     first frame. What changes is that the read is now correct by construction
     instead of by coincidence: it survives a bench, an iframe, a second reader
     on one page, or a rename of the scroller -- none of which is obliged to
     call anything `readerpane`, and one of which the playback bars' own bench
     already is. It also stops being the ONE selector in this page that names a
     state by a different name from the file that owns the state.

     It is a FORCED hide and it goes through `show()` rather than around it,
     so every way back --
     scrolling up, the peek strip at the top edge, `--pbar-autohide: 0` -- is
     answered by the same two lines and none of them can bring the bar back
     over a zoomed page. The playback bar reads the same class for itself. */
  function zoomed() { return !!document.querySelector(".pane.zoomed, .column.zoomed"); }
  function show() { bar.setAttribute("data-shown", zoomed() ? "off" : "on"); }
  function hide() { if (autohide() || zoomed()) bar.setAttribute("data-shown", "off"); }
  function moved(top) {
    var d = top - last;
    if (Math.abs(d) < 5) return;
    last = top;
    if (!autohide()) { show(); return; }
    if (top <= bar.offsetHeight) { show(); return; }
    if (d > 0) hide(); else show();
  }
  function onScroll(el) {
    if (tick) return; tick = true;
    requestAnimationFrame(function () { tick = false; moved(el.scrollTop || 0); });
  }
  if (pane) pane.addEventListener("scroll", function () { onScroll(pane); }, { passive: true });
  addEventListener("scroll", function () {
    if (pane && pane.scrollHeight > pane.clientHeight + 4) return;   /* the pane is the scroller */
    onScroll(document.scrollingElement || document.documentElement);
  }, { passive: true });
  peek.addEventListener("pointerdown", show);
  peek.addEventListener("click", show);

  /* ...and the door it opens. ONE function, the same one the Mac's ⌘K and the
     bar's ⏎ call (reader/surface.js) -- there is no phone implementation of
     search on this page and there must never be one. The bar shows itself
     first: pressing a control that is on its way out is confusing, and the
     surface closing puts you back on a bar you can see. */
  document.getElementById("pbarfind").addEventListener("click", function () {
    show();
    if (window.SearchSurface) window.SearchSurface.open("");
  });

  /* the bench writes its dials as inline properties on <html>; re-read them */
  new MutationObserver(function () { mic(); if (!autohide()) show(); })
    .observe(R, { attributes: true, attributeFilter: ["style"] });

  /* the zoom going in or out is not a scroll, so it has its own watch: in,
     and the bar goes; out, and the page has changed enough that the bar
     coming back is the right answer whatever the scroll position is. */
  [document.querySelector(".pane"), document.querySelector(".column")]
    .forEach(function (el) {
      if (el) new MutationObserver(function () { show(); })
        .observe(el, { attributes: true, attributeFilter: ["class"] });
    });

  window.PhoneBar = { el: bar, peek: peek, show: show, hide: hide,
                      sync: function () { title(); mic(); if (!autohide()) show(); },
                      autohide: autohide, zoomed: zoomed };
  mic();
})();
</script>

<!-- THE TRANSPORT IS LOADED HERE AND NOT WITH THE OTHER ENGINES, and the
     reason is order: the mount below runs at parse time, where the reading
     page's own <script src> block is a hundred lines further down the file
     (Lane A's region, not this one). A bar that mounted before its transport
     existed would return on its first line and the page would carry no bar at
     all -- measured, 7 Sep. transport.js depends on nothing and reads
     window.ReaderControl lazily, so it is safe this early and belongs beside
     the two mounts that are its only callers. -->
<script src="transport.js"></script>

<!-- ================== THE PLAYBACK BARS — the two mounts ====================
     Osca, 7 September: *"a SEPARATE PLAYBACK bar -- the TTS transport
     (play/pause, scrub the chapter, speed) -- on BOTH platforms. Same shell,
     two distinct bars: the phone's (designed in design/phone/) and the Mac's
     (designed in design/reader/) are NOT based on each other, but they share
     one transport API. Gate the two presentations by the data-phone split in
     the shell, exactly as the nav bar already is."*

     SO THIS BLOCK BUILDS ONE OF TWO BARS AND NEVER BOTH. The flag decides
     which, on the first line, the same way the nav bar's mount above returns
     without it -- a Mac document gains the capsule and no strip, a phone
     document gains the strip and no capsule, and neither ever holds a hidden
     copy of the other. What the two share is `reader/transport.js` and the
     wiring below it: the same five doors (play/pause, the two arcs, the two
     sentence steps, the rail, the speed) said to the same object, so the
     pictures are two and the behaviour is one.

     THE PICTURES ARE reader/shell.css -- `.mplay` for the Mac (a floating
     capsule, quiet until the pointer is near) and `.pplay` for the phone (a
     full-width strip at the foot, 44 everywhere). design/reader/shell.css is
     the master of both; design/reader/bench-playbar.html and
     design/phone/playbar.html are their two contracts.

     NO BAR WITHOUT A VOICE (Osca, 1 September: *"no playback or volume
     control shows when the chapter has no audio -- hide the player when
     there's no master for the chapter"*). `Transport.hasVoice()` is that
     question asked once; `--mplay-when` / `--pplay-when` are the dials that
     answer it differently, and `always` is what the benches measure the
     layout on when the shelf has no rendered chapter to hand.

     THE TWO PHONE BARS HIDE TOGETHER, and this block does not decide when.
     The nav bar owns "away as you read"; the strip WATCHES `#pbar`'s
     `data-shown` and follows it. One observer, no coupling back into the nav
     bar's own code, and `--pplay-autohide: 0` unpicks it so the player can
     stay while the nav bar goes.

     HIDDEN WHILE ZOOMED, on both platforms. The state both bars watch is the
     pinch lane's own, and it is read as a CLASS PAIR -- `.pane.zoomed,
     .column.zoomed` -- never as `#readerpane.zoomed`, which is the name this
     block guessed before the pinch landed. book-nav.js's `writePageZoom` puts
     `.zoomed` on `#readercol` and on its pane together, at every factor above
     1, so a bar goes on the first frame of a pinch and not only once one word
     view has committed. On this page the two reads agree (measured, zoom 2.4:
     all three selectors true); the pair is the one that keeps agreeing
     wherever the reader is mounted under another id. It is a FORCED hide: it beats `--pplay-autohide:
     0`, it beats the peek tap, and nothing brings a bar back until the zoom
     is out -- in that state the page is the control.
     ======================================================================== -->
<script>
(function () {
  "use strict";
  var R = document.documentElement;
  var PHONE = R.hasAttribute("data-phone");
  var T = window.Transport;
  if (!T) return;                      /* transport.js absent: no bar, no throw */

  /* --------------------------------------------------------------- the ink
     One drawing per control, at 20x20, in the stroke language the nav bar's
     three already use. The two arcs carry their seconds as a <text> inside
     the svg, because the seconds are a dial. */
  function svg(inner, fill) {
    return '<svg viewBox="0 0 20 20" aria-hidden="true" fill="' + (fill || "none") + '"'
         + ' stroke="currentColor" stroke-width="1.7" stroke-linecap="round"'
         + ' stroke-linejoin="round">' + inner + '</svg>';
  }
  var ICON = {
    play:  svg('<path d="M6.4 4.2 15.6 10 6.4 15.8z" fill="currentColor" stroke-width="1.4"/>'),
    pause: svg('<path d="M7.4 4.6v10.8M12.6 4.6v10.8" stroke-width="2"/>'),
    prev:  svg('<path d="M14.6 4.8 8.2 10l6.4 5.2z" fill="currentColor" stroke-width="1.3"/>'
             + '<path d="M5.6 4.8v10.4"/>'),
    next:  svg('<path d="M5.4 4.8 11.8 10l-6.4 5.2z" fill="currentColor" stroke-width="1.3"/>'
             + '<path d="M14.4 4.8v10.4"/>'),
    /* ~270 degrees of circle with the gap where the arrowhead goes, so the
       direction is read off the head and not off the sweep */
    back:  svg('<path d="M10 4.6a5.4 5.4 0 1 1-5.4 5.4" stroke-width="1.5"/>'
             + '<path d="M10 1.9 10 7.3 6.6 4.6z" fill="currentColor" stroke="none"/>'
             + '<text class="sec" x="10" y="12.9" text-anchor="middle" font-size="6.4"'
             + ' font-weight="700" fill="currentColor" stroke="none">15</text>'),
    fwd:   svg('<path d="M10 4.6a5.4 5.4 0 1 0 5.4 5.4" stroke-width="1.5"/>'
             + '<path d="M10 1.9 10 7.3 13.4 4.6z" fill="currentColor" stroke="none"/>'
             + '<text class="sec" x="10" y="12.9" text-anchor="middle" font-size="6.4"'
             + ' font-weight="700" fill="currentColor" stroke="none">15</text>'),
  };
  function num(v) { return String(Math.round(v)); }
  function cssVar(name, fallback) {
    var v = (getComputedStyle(R).getPropertyValue(name) || "").trim();
    return v || fallback;
  }

  /* ------------------------------------------------------------ the markup
     TWO PICTURES, and the DOM says so: the phone's five controls sit in their
     own row under their own rail, the Mac's nine sit in one line. Neither is
     built from the other's template -- writing them as one parameterised
     string is exactly the sharing Osca said not to do. */
  var bar = document.createElement("div");
  var b = function (id, cls, label, ink) {
    return '<button type="button" class="' + cls + '" id="' + id + '"'
         + ' aria-label="' + label + '" title="' + label + '">' + ink + '</button>';
  };
  var P = PHONE ? "pplay" : "mplay";
  var rail = '<input type="range" class="' + P + '-rail" id="' + P + 'rail"'
           + ' min="0" max="1000" step="1" value="0" aria-label="Scrub the chapter">';
  var t0 = '<span class="' + P + '-t left" id="' + P + 't">0:00</span>';
  var t1 = '<span class="' + P + '-t" id="' + P + 'left">0:00</span>';
  var speed = '<button type="button" class="' + P + '-speed" id="' + P + 'speed"'
            + ' aria-label="Speed" title="Speed">1&times;</button>';

  if (PHONE) {
    bar.className = "pplay"; bar.id = "pplay";
    bar.innerHTML =
        '<div class="pplay-scrub">' + t0 + rail + t1 + '</div>'
      + '<div class="pplay-row">'
      +   b("pplayback", "pplay-b", "Back fifteen seconds", ICON.back)
      +   b("pplayprev", "pplay-b", "The sentence before", ICON.prev)
      +   b("pplaygo",   "pplay-b pplay-go", "Play", ICON.play)
      +   b("pplaynext", "pplay-b", "The sentence after", ICON.next)
      +   speed
      + '</div>';
  } else {
    bar.className = "mplay"; bar.id = "mplay";
    bar.innerHTML =
        b("mplayback", "mplay-b", "Back fifteen seconds", ICON.back)
      + b("mplayprev", "mplay-b", "The sentence before", ICON.prev)
      + b("mplaygo",   "mplay-b mplay-go", "Play", ICON.play)
      + b("mplaynext", "mplay-b", "The sentence after", ICON.next)
      + b("mplayfwd",  "mplay-b", "Forward fifteen seconds", ICON.fwd)
      + t0 + rail + t1 + speed;
  }
  bar.setAttribute("data-shown", "off");
  bar.hidden = true;                    /* until the transport says there is a voice */
  document.body.appendChild(bar);

  var $ = function (id) { return document.getElementById(id); };
  var railEl = $(P + "rail"), tEl = $(P + "t"), leftEl = $(P + "left"),
      goEl = $(P + "go"), speedEl = $(P + "speed");

  /* -------------------------------------------------------------- the doors
     Every one of them is a call into `Transport`, which guards itself: with no
     book open, no chapter loaded or no `window.ReaderControl` yet, each of
     these is a no-op that returns false rather than a throw. */
  function skip() { return +cssVar(PHONE ? "--pplay-skip" : "--mplay-skip", "15") || 15; }
  $(P + "back").addEventListener("click", function () { T.nudge(-skip()); });
  if ($(P + "fwd")) $(P + "fwd").addEventListener("click", function () { T.nudge(skip()); });
  $(P + "prev").addEventListener("click", function () { T.stepSentence(-1); });
  $(P + "next").addEventListener("click", function () { T.stepSentence(1); });
  goEl.addEventListener("click", function () { T.toggle(); });
  speedEl.addEventListener("click", function () { T.cycleSpeed(); });

  /* THE RAIL IS THE ONE CONTROL THAT FIGHTS THE CLOCK. While a finger or a
     pointer is on it, the paint below must not put the thumb back where the
     voice is -- so dragging holds the paint off, and `input` seeks live so
     the highlight moves under the finger rather than after it. */
  var dragging = false;
  function railSeek() { T.seekFraction((+railEl.value || 0) / 1000); }
  railEl.addEventListener("pointerdown", function () { dragging = true; });
  railEl.addEventListener("input", function () { dragging = true; railSeek(); });
  ["pointerup", "pointercancel", "change", "blur"].forEach(function (e) {
    railEl.addEventListener(e, function () { railSeek(); dragging = false; });
  });

  /* ------------------------------------------------------------- when it is
     `--*-when`: `voice` (the default, and Osca's 1 Sep rule), `timings` (a
     silent preview is worth a bar), `always` (the bench, measuring a layout on
     a shelf with nothing rendered). */
  function wanted(s) {
    var w = cssVar(PHONE ? "--pplay-when" : "--mplay-when", "voice");
    if (w === "always") return true;
    if (w === "timings") return s.voice || s.timings;
    return s.voice;
  }
  function zoomed() { return !!document.querySelector(".pane.zoomed, .column.zoomed"); }
  function autohide() {
    if (!PHONE) return true;
    var v = cssVar("--pplay-autohide", "1");
    return v !== "0" && v !== "off" && v !== "false";
  }
  /* the nav bar owns "away as you read"; the strip follows it */
  function navShown() {
    var n = document.getElementById("pbar");
    return !n || n.getAttribute("data-shown") !== "off";
  }

  var lastRate = null, lastPlaying = null;
  function paint(s) {
    var here = wanted(s);
    if (bar.hidden === here) bar.hidden = !here;
    if (!here) { R.removeAttribute("data-pplay"); return; }

    var on = !zoomed() && (PHONE ? (autohide() ? navShown() : true) : true);
    bar.setAttribute("data-shown", on ? "on" : "off");
    if (PHONE) { if (on) R.setAttribute("data-pplay", "on"); else R.removeAttribute("data-pplay"); }

    /* the glyph is redrawn when it CHANGES and not on every tenth of a
       second the clock moves through -- paint() runs ten times a second while
       the voice is playing, and rebuilding an svg at that rate for a picture
       that is already right is the one expensive thing on this strip. */
    if (s.playing !== lastPlaying) {
      lastPlaying = s.playing;
      goEl.innerHTML = s.playing ? ICON.pause : ICON.play;
      goEl.setAttribute("aria-label", s.playing ? "Pause" : "Play");
      goEl.setAttribute("title", s.playing ? "Pause" : "Play");
    }

    bar.style.setProperty("--" + P + "-f", s.f.toFixed(4));
    if (!dragging) railEl.value = String(Math.round(s.f * 1000));
    railEl.setAttribute("aria-valuetext", T.fmt(s.t) + " of " + T.fmt(s.d));
    tEl.textContent = T.fmt(s.t);
    leftEl.textContent = "-" + T.fmt(Math.max(0, s.d - s.t));

    if (s.rate !== lastRate) {
      lastRate = s.rate;
      speedEl.innerHTML = (Math.round(s.rate * 100) / 100) + "&times;";
      speedEl.setAttribute("aria-label", "Speed, " + s.rate + " times");
    }
    /* the seconds on the two arcs are a dial, so they are written, not drawn */
    var sec = num(skip());
    Array.prototype.forEach.call(bar.querySelectorAll("text.sec"), function (n) {
      if (n.textContent !== sec) n.textContent = sec;
    });
  }
  var repaint = function () { paint(T.state()); };
  T.on(paint);

  /* the three things that change the ANSWER without changing the clock: the
     zoom going in or out, the nav bar going away, and a dial being turned on
     the bench (which writes an inline custom property on <html>) */
  /* BOTH ELEMENTS THE ZOOM MARKS, and by class -- `writePageZoom` writes
     `.zoomed` on the column and on its pane together, and this bar asks the
     same pair `zoomed()` asks rather than one id it guessed. */
  [document.querySelector(".pane"), document.querySelector(".column")]
    .forEach(function (el) {
      if (el) new MutationObserver(repaint).observe(el, { attributes: true, attributeFilter: ["class"] });
    });
  var nav = document.getElementById("pbar");
  if (nav) new MutationObserver(repaint).observe(nav, { attributes: true, attributeFilter: ["data-shown"] });
  new MutationObserver(repaint).observe(R, { attributes: true, attributeFilter: ["style"] });
  /* #pbar is built by the mount above, which runs before this one; on a Mac
     there is none and this observer is simply never created. */

  window.PlayBar = { el: bar, phone: PHONE, sync: repaint, zoomed: zoomed,
                     wanted: function () { return wanted(T.state()); } };
})();
</script>

<!-- THE SEARCH SURFACE (design/reader/surface.js). It mounts itself over this
     page and opens on ⌘K, on the bar's ⏎, and on the phone bar's ⌕ -- the
     reader has no askbar, so surface.js's own `bar()` takes `TTSTVPage.ask`
     here and answers the one verb that means "search". -->

<script>
/* THE SHELL -- thirteenth pass, 4 September: book-nav.js owns the mechanic
   (see that file's own long comment). No more #titlescreen -- chapter
   zero's own tinted opener, genuinely page.js, is the book's cover now.
   The library has left this page entirely (library.html), and the left pane
   can stack up to five deep for a book whose own `structure` runs that far.
   This file keeps its same two jobs -- how a chosen book actually arrives
   (a <script src>, file:// having no fetch()) and the warmth slider
   reading-page.html already proved -- plus wiring book-nav.js's options to
   this page's real elements. */

/* THE LIBRARY IS library.html NOW. This page no longer carries a shelf: no
   dashboard screen, no cards, no manifest read at mount. All it needs of the
   library is the one thing only it can do -- fetch a book's own data by slug
   (a <script src>, file:// having no fetch()) -- and the way back out. */
function onOpenBook(slug){
  return new Promise((resolve, reject)=>{
    window.__LIB_BOOK = null;
    const s = document.createElement("script");
    s.src = "../books/" + encodeURIComponent(slug) + "/book-data.js";
    s.onload = () => {
      const b = window.__LIB_BOOK; window.__LIB_BOOK = null; s.remove();
      if(!b){ reject(new Error("no window.__LIB_BOOK from "+slug)); return; }
      resolve(b);
    };
    s.onerror = () => { s.remove(); reject(new Error("could not load "+slug)); };
    document.body.appendChild(s);
  });
}

function $(id){ return document.getElementById(id); }

const LIBRARY_PAGE = "../library/library.html";
const nav = BookNav.mount({
  onOpenBook,
  /* scrolling left past the last pane leaves the book -- and that now means
     leaving the page, so the library is read fresh every time you come out */
  onLibrary: () => { location.href = LIBRARY_PAGE; },
  bookEl: $("book"),
  contentsBox: $("contentsbox"),
  contentsColEl: $("contentscol"),
  leftMoreEl: $("leftmore"),
  readerBox: $("readerbox"), readerPane: $("readerpane"), readerCol: $("readercol"),
  readerScrub: $("readerscrub"), readerHead: $("readerhead"),
  /* `big` and `small` are NOT passed any more, and there is nothing to pass
     them: `.head`, the top-left running header, left the app on 7 September
     (shell.css says what it carried). book-nav.js still writes both behind
     `if(o.big)` guards, so the omission is the whole of the change here. */
});
/* ===================== THE BENCH -- ?bench, AND ONLY ?bench ================
   Osca, 6 September, pressing the reader in Frank Studio: *"it looks like a
   designer, not a finished reader."* So the page IS the reader now. Every
   knob below is still in this file, unchanged and reachable -- it just does
   not EXIST unless the URL says so. `shell.html#book=x` is the picture;
   `shell.html?bench#book=x` is the workbench it was built on. The app never
   carries a query, so the app never sees any of it.
   WHAT IS NOT BEHIND THE GATE, and must not be: the wheel's own SET numbers
   and the pane tint below. Those are the design, not options -- they were
   only ever written inside the tuner because that is where their sliders
   used to be. */
const BENCH = /(?:^|[?&])bench(?:[=&]|$)/.test(location.search);

/* bench only: the handle, reachable from a console and from anything driving
   this page from outside (a browser extension's isolated world cannot see a
   top-level `const`). Nothing in the design reads this. */
if (BENCH) window.nav = nav;
/* ================= LISTENING, LOOKING UP, AND THE MARGIN =================
   Job 15 step 3(a) and job 15b steps 1-2. Three things the picture does not
   show and the product is not the product without, mounted on the one door
   every book arrives through.

   THIS BLOCK SITS ABOVE THE OPEN, AND THAT IS A BUG FIX, NOT A TIDY-UP
   (job 15b step 2, 6 Sep). It was below `openDefault()` and the `?book=`
   IIFE, which was safe only while `book-data.js` cost a network round-trip:
   on a RELOAD the file is in the HTTP cache, `s.onload` fires before the
   browser has parsed the script tag that installed the wrapper, and
   `nav.openBook` is still the bare one. The page then came up with no audio,
   no dictionary, no margin and no hands-free -- voiceui printing "the
   supplied control object is missing: getPosition, ..." -- and only ever on
   the second visit, which is the visit nobody tests. Measured in
   reader/tests/browser/lookup_marks.py: undefined at 500 ms and still
   undefined at 8 s. Installing the wrapper before the open removes the race
   rather than narrowing it.

   Why nav.openBook is wrapped rather than every call site edited: this page
   opens a book from four places (the ?book= slug, the file picker, the
   hashchange, and openDefault) and book-nav.js may open one itself. Wrapping
   the one function catches all of them and cannot fall out of step with a
   fifth. */
let listen = null, lookup = null, marginalia = null, cursor = null;
try{ (function(){
  const openBook0 = nav.openBook;
  nav.openBook = function(b){
    const r = openBook0.call(nav, b);
    try{
      listen = Listen.mount({ nav, col: $("readercol"), pane: $("readerpane"),
                              slug: b && b.slug, book: b });
      /* THE DICTIONARY MOUNTS BEFORE THE HOOK IS PUBLISHED, and the order is
         the whole of it: Lookup.mount hangs `getDictionaryEntry` on the
         control, and voiceui/app.js reads OPTIONAL_DATA_HOOKS off
         window.ReaderControl once, at boot. Publish the control first and the
         boot line would say "dictionary hooks missing" for the rest of the
         session.
         `col` and `pane` are no longer passed: the panel that needed them is
         gone (7 Sep -- the OS owns look-up now, reader/lookup.js's own
         comment), and this module no longer touches the page at all. */
      try{
        lookup = Lookup.mount({ slug: b && b.slug, book: b, control: listen });
      }catch(e){ console.warn("[dictionary] not mounted:", e); }
      try{
        marginalia = Marginalia.mount({ nav, col: $("readercol"), pane: $("readerpane"),
                                        slug: b && b.slug, book: b, control: listen });
      }catch(e){ console.warn("[marginalia] not mounted:", e); }
      try{
        cursor = Cursor.mount({ nav, bookEl: $("book"), slug: b && b.slug,
                                book: b, control: listen });
      }catch(e){ console.warn("[cursor] not mounted:", e); }
      /* bench only, the same handle `window.nav` already is: a browser driver
         and a console can reach the two mounts. Nothing in the design or the
         app reads either. */
      window.lookup = lookup; window.marginalia = marginalia; window.cursor = cursor;
      window.ReaderControl = listen;      // voiceui/reader-bridge.js's one hook
    }catch(e){ console.warn("[listen] not mounted:", e); }
    return r;
  };
})(); }catch(e){ console.warn("[listen] wiring failed:", e); }

/* ================= SETTINGS DRIVES THE PAGE, AND NOTHING ELSE DOES ========
   Osca, 6 September: *"I do NOT want a button for light/dark. Settings drives
   it."* -- and the same for the other six rows of the Reading tab. The store
   is `prefs/prefs.js`, loaded in the head; this block is only the two names
   it cannot write for itself, and the one row that is not a custom property
   at all.

   WHAT PREFS ALREADY DOES, and is not repeated here (one owner, one write):
     theme       `data-theme` on <html>. tokens.css and pane.css key their
                 dark palette on it since 996eae3, so the reader answers it
                 with no code of its own. The key is below with the others.
     warmth      `--warm`, which IS tokens.css's own name -- 0..18 since the
                 one-line fix in prefs/prefs.js's `cssVars` that this session
                 is the other half of.
   WHAT PREFS WRITES UNDER A NAME NOTHING HERE READS, which is this block:
     `--read-family` and `--read-scale` are the OLD reader's names.  The shell
     spends the reading face as `--serif` (shell.css:34, wheel.css, listen.css)
     and the reading size as `--optical`, tokens.css's multiplier on the root
     font size -- so the two are translated, never copied: a default removes
     the property and tokens.css's own value stands, exactly the way prefs
     means "absent at the default".
     THE 1.06 IS NOT WRITTEN DOWN TWICE. `--optical` is READ off the cascade
     once, before anything overrides it, so tokens.css stays the only place
     that number lives (tokens.css's own rule: a number that appears twice is
     already wrong in one of the two places).
   AND THE TWO §6s ARE BOTH ANSWERED NOW, six hours apart, so the sentence
   that named them is deleted rather than left standing beside the code that
   reversed it (CLAUDE.md's precedence rule 4).
     line height  was "page.css spends 1.5 as a literal -- there is no token
                  to write", which is why 22b invented no page-side default
                  for it. `design/reader` wrote `line-height: var(--read-line,
                  1.5)` and the re-copy brought it here, so the row prefs was
                  already writing now lands with nothing translating it and
                  nothing here to add. `settings_drives.py` §6 is an assert:
                  23.7578px -> 34.0528px at Airy, x2.15/1.5 exactly.
     pace         was "the one-word view advances by hand; nothing on this
                  page reads words-a-minute". 22c is the block directly below
                  this one: `wpm` is the seventh row and the one that is not a
                  custom property at all. */
try{ (function(){
  const S = window.TTSTVSettings; if(!S) return;
  const R = document.documentElement;
  const OPTICAL0 = (getComputedStyle(R).getPropertyValue("--optical") || "").trim();

  function paint(s){
    /* the reading face */
    if(s.family === S.DEFAULTS.family) R.style.removeProperty("--serif");
    else R.style.setProperty("--serif", S.familyById(s.family).stack);
    /* the reading size, as tokens.css spends it:
       html{ font-size: calc((14.5px + 0.75vw) * var(--optical)) } */
    if(s.size === S.DEFAULTS.size || !OPTICAL0) R.style.removeProperty("--optical");
    else R.style.setProperty("--optical", String(parseFloat(OPTICAL0) * s.size / 100));
  }
  /* ONE WORD IS A POSITION, NOT A CLASS. book-nav.js's axis is a short list of
     places (-n..-1 contents, 0 the book, +1 the word on the page, +2 the word
     alone); `data-read-view` picks between the two ends of it. Applied only
     when it is what the reader asked for, so a gesture is never overruled by
     a value that did not change. */
  function view(s, force){
    if(!force && s.view === S.DEFAULTS.view) return;
    try{ if(typeof nav !== "undefined" && nav.go) nav.go(s.view === "oneword" ? 2 : 0); }catch(e){}
  }
  paint(S.read());
  /* openBook resets the axis to 0 (book-nav.js), and the first book arrives
     asynchronously -- so the view is re-applied on the way out of every open,
     for the same reason the block above this one sits above the open. */
  const open0 = nav.openBook;
  nav.openBook = function(b){ const r = open0.call(nav, b); view(S.read()); return r; };
  S.subscribe(s => { paint(s); view(s, true); });
})(); }catch(e){ console.warn("[settings] not wired:", e); }

/* ======================= PACE — ONE WORD'S OWN CLOCK ======================
   Osca, 6 September, answering job 22b's §6.2: *"Pace is ONE WORD's
   auto-advance — when one word view is open and no audio is playing, the
   cursor advances a word every 60/wpm seconds from the store's pace; space
   pauses/resumes; any wheel/tap/key stops the auto-advance until the next
   play. It never touches listen.js's speed."*  So this is the seventh
   Settings row, and it is the one that is not a CSS custom property: `wpm`
   is a rate, and what it drives is book-nav.js's ONE cursor.

   IT NEVER TOUCHES `listen.js`. Not `setSpeed`, not `playbackRate`, not
   `seekWordDelta` — a reader who picks 600 wpm must not find the narration
   at 2x, which is the reading of §6.2 Osca did NOT take. The only thing this
   moves is `nav.goTo`, the same door the audio's own highlight uses, so
   there is still ONE cursor (Osca, 4 Sep) and this is a second driver of it,
   never a second copy of it.

   THE THREE CONDITIONS, checked every pump and not cached:
     the axis is at one word   `nav.level === "word"` — the POSITION, not the
                               store's `view`, because the axis is also
                               reached by hand and the picture is what counts
     nothing is playing        `listen.isPaused()`. **While audio plays this
                               stands down entirely** — the advance is then
                               the narration's, through listen.js's own
                               paint, and the two never both drive the cursor
     armed                     see below

   ARMED, AND WHAT DISARMS IT. Arriving at one word arms it (that is what
   "when one word view is open ... the cursor advances" says). Any wheel, tap
   or key EXCEPT the play key disarms it, because those are you moving the
   word yourself and a timer fighting your hand is the worst of both. The
   play key toggles it — "space pauses/resumes" — and that is "the next
   play". Leaving one word disarms it; coming back arms it again.

   WHY A CATCH-UP CLOCK ON A FRAME, and not `setInterval(60000/wpm)`. An
   interval re-rounds every tick and drifts by its own callback cost. So t0 is
   anchored ONCE and each frame advances until `floor((now - t0) / step)` words
   have been taken: the count is then the arithmetic one -- 10 s at 325 wpm is
   floor(10000 / 184.615) = 54 -- whatever the frame rate. It is a FRAME and
   not a short interval because the lag between the clock and the cursor is
   whatever the tick is: a 25 ms interval was tried and left a systematic
   two-word debt, which measured as 52 in the ten seconds that are 54. And the
   frame loop runs ONLY while the pace is actually moving words; at rest this
   costs four wakeups a second and nothing else. A stall longer than a second
   re-anchors rather than firing a burst of words at a reader who just came
   back to the tab. */
try{ (function(){
  const S = window.TTSTVSettings; if(!S) return;
  const WATCH_MS = 250;        // how often we ask whether the pace should be running
  const RESYNC_MS = 1000;      // a stall longer than this drops the missed words
  let armed = false, wasWord = false, t0 = 0, taken = 0, raf = 0;
  /* diagnostics, read by reader/tests/browser/pace_one_word.py and by a
     console; nothing in the page reads them. `anchors` is how a run that came
     out short says WHY it came out short. */
  let anchors = 0, worstGap = 0, lastFrame = 0;

  const step = () => {
    const w = +S.read().wpm;
    return 60000 / ((isFinite(w) && w > 0) ? w : S.DEFAULTS.wpm);
  };
  const atWord = () => { try{ return nav.level === "word"; }catch(e){ return false; } };
  const playing = () => { try{ return !!listen && !listen.isPaused(); }catch(e){ return false; } };

  function anchor(){ t0 = performance.now(); taken = 0; anchors++; }

  /* ONE WORD ON. `goTo` clamps inside a chapter, so the end of one is where
     the next begins; `goTo` answering null is the end of the book, and there
     the pace stops rather than sitting on the last word ticking. */
  function advance(){
    let c = null; try{ c = nav.cursor; }catch(e){ return false; }
    if(!c) return false;
    if(c.word + 1 < nav.wordCount) return !!nav.goTo(c.chapter, c.word + 1);
    return !!nav.goTo(c.chapter + 1, 0);
  }

  /* THE ARMING, and it is the only thing that runs at rest: four wakeups a
     second, no layout, no advance. The clock re-anchors on every one of them
     while the pace is not eligible, so the moment it IS eligible the first
     word is a whole step away and not a burst of the ones it "owed" while the
     narration had the cursor. */
  function watch(){
    const word = atWord();
    if(word && !wasWord) armed = true;                  // arriving arms it
    if(!word && wasWord) armed = false;                 // leaving disarms it
    wasWord = word;
    if(word && armed && !playing()){ start(); return; }
    stopFrames(); anchor();
  }

  /* AND THE FRAME LOOP, which runs ONLY while the pace is actually moving
     words -- one word view, armed, nothing playing. A `setInterval` was tried
     first and is wrong: at 325 wpm a word is 184.6 ms and a 25 ms interval
     leaves the cursor a systematic step or two behind the clock, which shows
     up as 52 words in the ten seconds that are arithmetically 54. On a frame
     the lag cannot exceed one frame. Nothing here reads layout. */
  function start(){ if(!raf) raf = requestAnimationFrame(frame); }
  function stopFrames(){ if(raf){ cancelAnimationFrame(raf); raf = 0; } lastFrame = 0; }

  function frame(now){
    raf = requestAnimationFrame(frame);
    if(lastFrame && now - lastFrame > worstGap) worstGap = now - lastFrame;
    lastFrame = now;
    if(!atWord() || !armed || playing()){ stopFrames(); anchor(); return; }
    const s = step();
    const due = Math.floor((performance.now() - t0) / s);
    if((due - taken) * s > RESYNC_MS){ anchor(); return; }
    let guard = 0;
    while(taken < due && guard++ < 64){
      if(!advance()){ armed = false; stopFrames(); break; }
      taken++;
    }
  }

  /* your hand beats the clock, and the play key is not your hand */
  function stop(e){
    if(e && e.type === "keydown"){
      const isPlay = S.hotkeyIs ? S.hotkeyIs(e, "play") : (e.code === "Space");
      if(isPlay) return;
    }
    armed = false; stopFrames();
  }
  ["wheel", "pointerdown", "touchstart", "keydown"].forEach(t =>
    addEventListener(t, stop, { passive: true, capture: true }));

  /* "space pauses/resumes" -- and ONLY where the pace is the thing running.
     With the audio playing, or anywhere but one word, Space is still
     `listen.toggle()`'s and this returns false so the key handler below
     takes it. */
  window.__pace = {
    toggle(){
      if(!atWord() || playing()) return false;
      armed = !armed;
      if(armed){ anchor(); start(); } else stopFrames();
      return true;
    },
    /* read-only, for a browser driver and a console: the same handle
       `window.nav` is under ?bench, and nothing in the page reads it. */
    get armed(){ return armed; }, get stepMs(){ return step(); },
    get taken(){ return taken; }, get anchors(){ return anchors; },
    get running(){ return !!raf; },
    get debt(){ return Math.floor((performance.now() - t0) / step()) - taken; },
    get worstGap(){ return worstGap; },
    resetGap(){ worstGap = 0; },
  };

  /* CHANGING THE PACE RE-STARTS THE CLOCK, and this is not tidiness. `taken`
     is counted in WORDS and `due` is derived from t0 in MILLISECONDS, so the
     two only agree while the step between them is the same number. Move the
     row from 900 to 325 and the words already taken at 66.7 ms are suddenly
     read against 184.6 ms: `due` falls BELOW `taken`, the debt goes negative,
     and the cursor stands still for as many seconds as it takes the slower
     clock to catch up -- measured, four seconds of nothing after one drag of
     the Pace slider, and 52 words in the ten seconds that are 54. Anchoring on
     the change is the whole fix: the new pace starts now. */
  let lastWpm = S.read().wpm;
  S.subscribe(st => { if(st.wpm !== lastWpm){ lastWpm = st.wpm; anchor(); } });

  const timer = setInterval(watch, WATCH_MS);
  addEventListener("pagehide", () => { clearInterval(timer); stopFrames(); });
})(); }catch(e){ console.warn("[pace] not wired:", e); }

/* ========= WHAT STUDIO IS ABOUT TO RENDER -- TTSTVHost.setTarget =========
   Lost on 6 September with the old reader (`1b1b813`) and owed back by
   `desktop/STATUS.md` §6, 7 Sep. Not cosmetics. `studio_flip` falls back to
   `chapter_in(&base, &tab.path)` -- the tab URL's `?ch=` -- so with the page
   silent the studio pane seeds on the chapter the TAB WAS OPENED AT and
   drifts on the first page turn; its go button then spends Kaggle or Modal
   minutes rendering the chapter the card names rather than the one being
   read. Silent, and wrong in the direction that costs money.

   The shape is `readercontrol.js`'s `pushHostTarget`, verbatim:
   `{slug, current, chapters}`, `chapters: []` meaning "just where the reader
   is". `[]` is the truth here and not a stub -- this reader has no pick list
   at all. The contents panes choose a BRANCH to read into, not a set to
   render, so there is no selection for studio to be told about; when a pick
   list comes back, `hostTargetModel` is the one line that changes.

   GUARDED ON THE METHOD, never on the host. `TTSTVHost` is absent in a
   browser and on the phone, and an older shell has the object without this
   door -- `context.js` already reads it as a fact about the machine, and
   this is the same fact asked a question. */
let OPEN_BOOK = null;                    // the book nav actually opened
function hostTakesTarget(){
  return !!(window.TTSTVHost && typeof window.TTSTVHost.setTarget === "function");
}
/* Pure over the page's own state, so a node test can read the target with no
   host at all. `null` before a book has arrived -- every caller runs from an
   event, but a scroll can be emitted by a relayout before the first open. */
function hostTargetModel(){
  if(!OPEN_BOOK) return null;
  return { slug: OPEN_BOOK.slug || null,
           current: nav.chapterIdNow,
           chapters: [] };
}
/* Sent on every change and ONLY on a change. One page turn emits scroll
   events by the dozen and the host would be told the identical thing every
   time. Deduped on the value, not on the caller, so no call site has to know
   about the others. */
let LAST_TARGET = null;
function pushHostTarget(force){
  if(!hostTakesTarget()) return null;
  const t = hostTargetModel();
  if(!t) return null;
  const key = JSON.stringify(t);
  if(!force && key === LAST_TARGET) return t;
  LAST_TARGET = key;
  try{ TTSTVHost.setTarget(t); }catch(e){ /* an older host, or a closed tab */ }
  return t;
}

/* `?ch=` ON OPEN -- "open this chapter" from the Library, which until now
   landed on the book's default. The desktop opens a reader tab at
   `clean/reader/reader.html?book=books/<slug>&ch=<id>` (tabs.rs `url_for`);
   this page read `book=` and dropped `ch=`.

   READ FROM THE SAME SOURCE `slugFromUrl` READ, and that pairing is the whole
   of it: coming back from library.html changes the HASH and leaves the tab's
   original query standing, so a search-first rule would drag every later book
   to the first book's chapter -- an id that means a different chapter, or
   none. The hash wins only when the hash is the thing carrying `book=`. */
function chapterFromUrl(){
  const s = /(?:^|[#&?])book=/.test(location.hash || "") ? (location.hash || "")
                                                        : (location.search || "");
  const m = /(?:^|[#&?])ch=([^&]+)/.exec(s);
  if(!m) return null;
  let v; try{ v = decodeURIComponent(m[1]); }catch(e){ v = m[1]; }
  return v || null;
}

/* ONE WRAPPER, FOR THE SAME REASON THE LISTEN BLOCK ABOVE IS ONE: this page
   opens a book from four places (the `?book=` IIFE, the file picker, the
   hashchange and openDefault) and book-nav.js may open one itself. Wrapping
   the one function catches all of them and cannot fall out of step with a
   fifth. It wraps the listen wrapper, so the mounts are up before the target
   goes out. */
(function(){
  const openBook1 = nav.openBook;
  nav.openBook = function(b){
    const r = openBook1.call(nav, b);
    OPEN_BOOK = b || null;
    try{
      const ch = chapterFromUrl();
      if(ch != null) nav.openChapter(ch);
    }catch(e){ console.warn("[shell] ?ch= not honoured:", e); }
    /* forced: a new book at the same chapter id is a different target, and
       the dedupe key cannot tell the difference from the id alone */
    try{ pushHostTarget(true); }catch(e){ console.warn("[shell] target not published:", e); }
    return r;
  };
})();

/* AND ON EVERY CHANGE -- a page turn IS a scroll on the reader pane, and a
   chapter change is a page turn that crossed a section. `syncContentsLive` is
   bound to this same element and was bound FIRST (book-nav.js mounts above),
   so `nav.chapterIdNow` is already the new chapter by the time this runs.
   Debounced rather than sent per event: a turn emits scroll events by the
   dozen and only the chapter it ends on is a target -- the dedupe would drop
   the rest anyway, this just never builds them. */
(function(){
  const pane = $("readerpane");
  if(!pane) return;
  let t = 0;
  pane.addEventListener("scroll", () => {
    clearTimeout(t);
    t = setTimeout(() => { try{ pushHostTarget(); }catch(e){} }, 120);
  }, {passive:true});
  addEventListener("pagehide", () => clearTimeout(t));
})();

/* WHICH BOOK THIS PAGE OPENS.
   library.html is its own page now and hands a book over by slug --
   shell.html#book=<slug> -- so the reader opens straight into the book you
   picked there. Failing that, book-data.js's own default opens straight away
   (bench convenience, same as every other page here: this is a workbench, not
   the product), and failing THAT, the library page. */
function slugFromUrl(){
  let m = /(?:^|[#&?])book=([^&]+)/.exec(location.hash || "");
  if(!m) m = /(?:^|[?&])book=([^&]+)/.exec(location.search || "");
  let v; try{ v = m ? decodeURIComponent(m[1]) : null; }catch(e){ v = m ? m[1] : null; }
  if(v && v.indexOf("books/") === 0) v = v.slice(6);      // the app says books/<slug>
  return v || null;
}
function openDefault(){
  if(window.BOOK && window.BOOK.chapters && window.BOOK.chapters.length) nav.openBook(window.BOOK);
  else location.href = LIBRARY_PAGE;      // nothing to read: the library is the page for that
}
(function(){
  const slug = slugFromUrl();
  if(!slug){ openDefault(); return; }
  onOpenBook(slug).then(b => {
    if(b && b.chapters && b.chapters.length) nav.openBook(b);
    else openDefault();
  }).catch(err => {
    console.warn("[shell] could not open " + slug + ":", err);
    openDefault();
  });
})();
/* picking another book in library.html and coming back through history
   should open THAT book, not leave the last one standing */
addEventListener("hashchange", () => {
  const slug = slugFromUrl();
  if(slug) onOpenBook(slug).then(b => { if(b && b.chapters && b.chapters.length) nav.openBook(b); });
});

/* THE STRIP ITSELF, built rather than written down. It used to be markup at
   the bottom of the page and it is gone from there (Osca, 6 Sep); the handlers
   that hung off it are all still here, so under ?bench they get their buttons
   back. The three plain LINKS it also carried -- the library, the reading
   page, the panes, the branch map -- do not come back: the library has a door
   of its own in the bar row now, and a link is not a handler. */
function benchStrip(){
  const el = document.createElement("div");
  el.className = "bench";
  el.innerHTML =
      '<button id="open">open book\u2026</button>'
    + '<span class="r" id="loaded"></span>'
    + '<input type="file" id="file" accept=".json,application/json" hidden>'
    + '<span class="r">\u00b7</span>'
    + '<span class="r">speed</span><span id="speeds"></span>'
    + '<span class="r">\u00b7</span>'
    + '<button id="skipoff"></button>'
    + '<span class="r">\u00b7</span>'
    + '<button id="tunebtn">tune\u2026</button>';
  document.body.appendChild(el);
}

/* SPEED -- "I need you to give me options, so I can see what's fastest."
   Four presets, switched live, no reload, remembered. book-nav.js holds the
   numbers and what each one means; this is only the row of buttons. */
function mountSpeeds(){ try{ (function(){
  const box = $("speeds");
  const mark = () => [...box.children].forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.sp === nav.speedName));
  nav.speeds.forEach(name => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = name; b.dataset.sp = name;
    b.onclick = () => { nav.speed(name); mark(); };
    box.appendChild(b);
  });
  mark();
})(); }catch(e){ console.warn("[bench] speed row failed:", e); } }

/* SET, THEN THE SETTING GONE, AND NOW THE SET IS GONE TOO. Osca: "please get
   rid of the page/leaf/ribbon etc - we don't want those any more. Just the
   block sliding over eachother." So the springs are off -- and as of 5 Sep
   they are off in wheel.js itself (Wheel.DEFAULTS.turn "none", .amp 0), not
   turned off from here one mount at a time. The two calls this line used to
   make are deleted: a wheel already comes up the way this page wanted it,
   which is what "one set of numbers" means. */

/* skip offscreen chapters -- the one that should actually matter on a book
   with 865 of them. */
function mountSkip(){ try{ (function(){
  const b = $("skipoff");
  const mark = () => { b.textContent = "skip offscreen: " + (nav.skipping ? "on" : "off");
                       b.setAttribute("aria-pressed", nav.skipping); };
  b.onclick = () => { nav.skip(!nav.skipping); mark(); };
  mark();
})(); }catch(e){ console.warn("[bench] skip toggle failed:", e); } }

/* THE NUMBERS THE PAGE IS SET TO -- not a bench thing, and so not behind the
   gate. It sat inside the tuner only because these used to be its sliders. */
try{ (function(){
  const R = document.documentElement;
  /* THE WHEEL'S OWN GEOMETRY, SET. Row spacing, the centre line, the
     perspective and the reading column's own nudge were sliders; the numbers
     they were for have been found. Written once here, sliders gone -- this one
     line is where they move again if they ever need to.
     THE CONVEXITY IS NOT IN THIS LINE ANY MORE (5 Sep). "--radius":"60" was
     this page writing over tokens.css's 2.6, so the app and every bench
     disagreed about the barrel at rest and only this file was right. 60 is
     Wheel.DEFAULTS.radius now, in wheel.js beside the rest of the wheel's own
     numbers, and this page simply gets it. */
  const SET = { "--pitch":"168px", "--axis":"46vh",
                "--persp":"6000px", "--colnudge":"0px" };
  Object.keys(SET).forEach(k => R.style.setProperty(k, SET[k]));
  if(nav.kickWheels) nav.kickWheels();

  /* THE PANES, SET. Their width and the shape of their approach were the
     last two sliders here; they are numbers in book-nav.js now. The colour
     alternation is on -- it is the design, not an option. */
  R.setAttribute("data-tint", "");
  try{ localStorage.setItem("tint2", "1"); }catch(e){}
})(); }catch(e){ console.warn("[shell] set numbers failed:", e); }

/* the tuner's own wiring: CSS custom properties for the wheel, nav.setWord
   for one word. Everything persists, nothing needs a reload. BENCH ONLY. */
function mountTuner(){
  const panel = $("tuner");
  $("tunebtn").onclick = () => { panel.hidden = !panel.hidden; };
  $("tuneclose").onclick = () => { panel.hidden = true; };

  /* COMING OUT OF ONE WORD. Osca: "I need snap stronger, coming OUT of one
     word view." Between the word and the page there is nothing worth looking
     at, so that one stretch of the axis gets its own grip. */
  try{
    const inp = $("t-outsnap"), out = $("v-outsnap");
    inp.value = nav.outSnap; out.textContent = nav.outSnap;
    inp.oninput = () => { nav.outSnap = +inp.value; out.textContent = inp.value; };
  }catch(e){ console.warn("[tuner] out-snap:", e); }

  const WK = { wordgap:"wordgap", linegap:"linegap", fill:"fill", curve:"curve" };
  function putWord(id, v){
    nav.setWord(WK[id], v);
    const el = $("v-"+id); if(el) el.textContent = v;
  }
  Object.keys(WK).forEach(id => {
    const inp = $("t-"+id);
    inp.value = nav.word[WK[id]]; putWord(id, nav.word[WK[id]]);
    inp.oninput = () => putWord(id, +inp.value);
  });

  /* WHAT THIS BROWSER ACTUALLY SUPPORTS. "why does it work on chrome but not
     safari?" -- rather than guess, the page says so. These are the three
     things the shell now leans on that differ between engines and between
     file:// and a served origin. */
  (function(){
    const tests = [
      ["skip offscreen", () => CSS.supports("content-visibility","auto")],
      ["word highlight", () => !!(window.CSS && CSS.highlights && window.Highlight)],
      ["settings saved", () => { try{ localStorage.setItem("__t","1");
                                      localStorage.removeItem("__t"); return true; }
                                catch(e){ return false; } }],
    ];
    $("diag").innerHTML = tests.map(([n,f]) => {
      let ok=false; try{ ok=!!f(); }catch(e){}
      return '<div style="color:'+(ok?"var(--ink)":"#a8402a")+'">'
           + (ok?"✓ ":"✗ ") + n + "</div>";
    }).join("") + '<div style="color:var(--dim);margin-top:3px">'
      + (location.protocol === "file:" ? "file:// — storage often blocked" : location.protocol)
      + "</div>";
  })();

  $("t-reset").onclick = () => {
    const wd = {wordgap:120, linegap:2.4, fill:0.78, curve:1};
    Object.keys(wd).forEach(id => { $("t-"+id).value = wd[id]; putWord(id, wd[id]); });
    nav.outSnap = 4.5; $("t-outsnap").value = 4.5; $("v-outsnap").textContent = "4.5";
  };
}

/* ================= THE RECORDER — press R ==================================
   Osca: "How can I share with you what I see, in the animations - it is
   causing a lot of noise and drift, that you can't see .mov files."

   A screen recording shows the drift; it cannot say how much, or of what.
   This does: press R, do the gesture, and every frame of the next four
   seconds is kept as NUMBERS — the depth, the reader's own edge and
   transform, its scroll, where each pane is, how far the spacing has opened,
   how big the zoom is, and how long the frame took. Read back afterwards from
   window.__rec, which is what makes it shareable: drift becomes a column that
   either changes when nothing was touched, or doesn't.

   Nothing is recorded unless you ask. It costs one read of values already in
   hand and no layout at all, so it cannot itself be the jitter. */
function mountRecorder(){ try{ (function(){
  let rec = null, t0 = 0;
  const flash = msg => {
    let el = document.getElementById("recflash");
    if(!el){
      el = document.createElement("div");
      el.id = "recflash";
      el.style.cssText = "position:fixed;bottom:10px;left:12px;z-index:99999;"
        + "font:11px/1.4 var(--ui);background:#a8402a;color:#fff;padding:3px 8px;"
        + "border-radius:3px;pointer-events:none;transition:opacity .2s";
      document.body.appendChild(el);
    }
    el.textContent = msg; el.style.opacity = "1";
    clearTimeout(el._t); el._t = setTimeout(()=>{ el.style.opacity = "0"; }, 1200);
  };
  function frame(now){
    if(!rec) return;
    const rb = $("readerbox"), rp = $("readerpane");
    const sec = document.querySelector("#readercol .chapter.spreading");
    rec.push([
      +(now - t0).toFixed(1),
      +nav.dx.toFixed(4),
      rb.style.left || "",
      rb.style.transform || "",
      Math.round(rp.scrollTop),
      [...document.querySelectorAll("#contentsbox,#leftmore .collpane")]
        .map(e => Math.round(parseFloat(e.style.left || 0))).join("/"),
      sec ? sec.style.getPropertyValue("--lgap") : "",
    ]);
    if(now - t0 < 4000) requestAnimationFrame(frame);
    else { flash("recorded " + rec.length + " frames — window.__rec"); window.__rec = rec; rec = null; }
  }
  addEventListener("keydown", e => {
    if(e.key !== "r" && e.key !== "R") return;
    if(e.target && /input|textarea/i.test(e.target.tagName)) return;
    rec = []; window.__rec = null;
    flash("recording 4s — go");
    requestAnimationFrame(n => { t0 = n; frame(n); });
  });
})(); }catch(e){ console.warn("[bench] recorder failed:", e); } }

/* NO LIGHT/DARK BUTTON ON THIS PAGE (Osca, 6 September: *"I do NOT want a
   button for light/dark. Settings drives it."*). The toggle that stood here
   wrote `data-dark` on <html> -- a second owner of the value, and one the
   application could not see, which is why a window opened from Settings' own
   Light/Dark row changed every surface EXCEPT this one. It is deleted, not
   hidden: tokens.css and pane.css key their dark palette on
   `[data-theme="dark"]` and, for the system default, on
   `:root:not([data-theme="light"])` inside `prefers-color-scheme: dark` --
   the two selectors settings/settings.js already uses -- so the one thing
   that switches this page is the attribute prefs/prefs.js writes out of the
   store. Nothing here writes it, and nothing here reads it either. */

/* WARMTH IS READ, NOT DRIVEN (Osca, 6 September: Settings is the one source
   for theme, warmth, font, size, line height and pace). The big slider that
   lived here -- reading-page.html's own, with its hslToHex/groundHex track --
   is deleted along with its input. THE CSS IS UNTOUCHED: tokens.css still
   mixes --ground and --ink off `--warm`, and the value now arrives the way
   every other reading setting does, as the custom property prefs/prefs.js
   writes onto <html> out of the store (`cssVars`, prefs/prefs.js:445). An
   untouched reader carries no --warm at all and tokens.css's own `--warm: 0`
   stands, which is exactly what "absent at the default" means there. */

/* ad hoc open, for a book that isn't in the library yet -- same picker
   every other page here uses. BENCH ONLY. */
function mountOpen(){
  const note = $("loaded"), fileEl = $("file");
  $("open").onclick = () => fileEl.click();
  function openFile(f){
    if(!f) return;
    note.textContent = "reading…";
    Book.open(f).then(b=>{
      if(!b.chapters.length){ note.textContent="no chapters in that file"; return; }
      nav.openBook(b);
      document.title = (b.title||"a book") + " — the shell";
      note.textContent = Book.summary(b, "chapters");
      if(b.dropped.length) console.log("front matter skipped:", b.dropped);
    }).catch(e=>{ note.textContent = "not a book.json ("+String(e.message).slice(0,40)+")"; });
  }
  fileEl.onchange = () => openFile(fileEl.files && fileEl.files[0]);
}

/* ---- AND THIS IS THE WHOLE OF THE DIFFERENCE between the picture and the
   workbench it was built on. Without ?bench nothing above is mounted and the
   tuner's markup leaves the page too -- it stays in the FILE, which is what
   was asked; it is not in the document. */
if (BENCH) {
  benchStrip();
  mountOpen(); mountSpeeds(); mountSkip(); mountTuner(); mountRecorder();
} else {
  const t = $("tuner"); if (t) t.remove();
}
</script>

<!-- ================== LISTENING, AND THE HANDS FREE LAYER ==================
     Job 15 step 3, 5 September. Three things the picture does not show and
     the product is not the product without: the audio and its highlight
     (3a), the keys the Settings page edits (3b), and voiceui (3c).
     Everything visible on this page is unchanged -- no bar, no buttons, no
     element added to the reader. -->
<script>
/* (b) THE KEYS. Two rows of prefs/prefs.js's own table, and only two: `play`
   (Space) and `word` (the arrows). The rest of that table -- find, lookup,
   note, sidebar, sync, one-word -- belongs to pages this shell does not
   mount yet, and a key that answers nothing is the one thing the table must
   not contain (prefs/prefs.js's own comment on `pace`).

   TTSTVKeys.typing() is keys.js: while the caret is in one of the tuner's
   ranges (?bench only now), Space is a slider's own key and not ours. */
addEventListener("keydown", e => {
  if(window.TTSTVKeys && TTSTVKeys.typing()) return;
  const S = window.TTSTVSettings;
  /* LIGHT / DARK, and it is the ONLY door on this page (Osca, 6 Sep: *"I do
     NOT want a button for light/dark. Settings drives it."*). The page's own
     `dark` button was deleted in 996eae3; this is the third door onto the one
     store, beside the Settings row and the bar's own icon, and library.html
     binds the same key for the same reason. It is above `if(!listen)` because
     the theme is not a book's -- it works on a reader with nothing open. */
  if(S && S.hotkeyIs(e, "theme")){ e.preventDefault(); S.toggleTheme(); return; }
  /* THE PLAY KEY HAS TWO OWNERS NOW, and the pace is asked first because it
     only answers where it is the thing running: inside one word, with nothing
     playing (Osca, 6 Sep: "space pauses/resumes"). It returns false anywhere
     else and `listen.toggle()` below takes the key exactly as it always did.
     Above `if(!listen)` deliberately -- the pace is book-nav.js's cursor and
     owes nothing to the audio having mounted. */
  const playKey = S ? S.hotkeyIs(e, "play") : (e.code === "Space");
  if(playKey && window.__pace && __pace.toggle()){ e.preventDefault(); return; }
  if(!listen) return;
  const is = (id) => S ? S.hotkeyIs(e, id) : false;
  const which = (id) => S ? S.hotkeyWhich(e, id) : -1;
  if(is("play") || (!S && e.code === "Space")){ e.preventDefault(); listen.toggle(); return; }
  const w = which("word");
  if(w >= 0){ e.preventDefault(); listen.seekWordDelta(null, w === 0 ? 1 : -1); }
});
</script>

<!-- (c) HANDS FREE. The same nine files the old reader loaded, in the same
     order, and the same one-line boot. VoiceUI.boot() calls
     reader-bridge.js's attachToWindow(window), which reads
     window.ReaderControl -- set above the moment a book opens -- and throws
     a named error listing what is missing if the shape is wrong, so a
     failure here is loud rather than silent. -->
<script src="../voiceui/grammar.js"></script>
<script src="../voiceui/detour.js"></script>
<script src="../voiceui/resolve.js"></script>
<script src="../voiceui/answers.js"></script>
<script src="../voiceui/tts.js"></script>
<script src="../voiceui/trigger.js"></script>
<script src="../voiceui/asr.js"></script>
<script src="../voiceui/reader-bridge.js"></script>
<script src="../voiceui/app.js"></script>
<script>
/* boot AFTER the first book has opened, because attachToWindow throws when
   window.ReaderControl is absent and the pill would come up permanently
   "unavailable". The book arrives asynchronously (a <script src> per book),
   so this waits for the mount rather than guessing a delay. */
(function(){
  if(!window.VoiceUI) return;
  let tries = 0;
  const go = () => {
    if(window.ReaderControl){ try{ VoiceUI.boot(); }catch(e){ console.warn("[voiceui]", e); } return; }
    if(++tries > 200) { try{ VoiceUI.boot(); }catch(e){} return; }   // say so in the pill
    setTimeout(go, 50);
  };
  go();
})();
</script>
